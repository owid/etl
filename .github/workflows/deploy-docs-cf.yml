name: Deploy docs to Cloudflare Pages

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: deploy-docs-cf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Caching is disabled in this deploy workflow to avoid cache-poisoning
          # of the published docs artifact (zizmor cache-poisoning audit).
          enable-cache: false

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Override site_url for the Cloudflare build
        run: |
          sed -i 's|^site_url = .*|site_url = "https://docs.owid.io/projects/etl/"|' zensical.toml

      - name: Build docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make docs.build

      - name: Stage build under /projects/etl/
        run: |
          mkdir -p staging/projects/etl
          cp -a site/. staging/projects/etl/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy staging
            --project-name=owid-etl-docs
            --branch=${{ github.head_ref || github.ref_name }}
        # PR preview URL is surfaced by the owidbot comment
        # (apps/owidbot/cli.py:create_comment_body), so we don't post a
        # separate sticky comment from here.
