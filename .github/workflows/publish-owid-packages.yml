name: Publish OWID packages to PyPI

on:
  push:
    branches:
      - master
    paths:
      - 'lib/catalog/pyproject.toml'
      - 'lib/datautils/pyproject.toml'
      - 'lib/repack/pyproject.toml'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (catalog, datautils, repack, or all)'
        required: true
        default: 'all'

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 2
        persist-credentials: false

    - name: Detect which packages changed
      id: filter
      env:
        EVENT_NAME: ${{ github.event_name }}
        PACKAGE: ${{ github.event.inputs.package }}
      run: |
        catalog=false
        datautils=false
        repack=false
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          if [ "$PACKAGE" = "all" ] || [ "$PACKAGE" = "catalog" ]; then catalog=true; fi
          if [ "$PACKAGE" = "all" ] || [ "$PACKAGE" = "datautils" ]; then datautils=true; fi
          if [ "$PACKAGE" = "all" ] || [ "$PACKAGE" = "repack" ]; then repack=true; fi
        else
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          if echo "$CHANGED" | grep -q 'lib/catalog/pyproject.toml'; then catalog=true; fi
          if echo "$CHANGED" | grep -q 'lib/datautils/pyproject.toml'; then datautils=true; fi
          if echo "$CHANGED" | grep -q 'lib/repack/pyproject.toml'; then repack=true; fi
        fi

        items=()
        if [ "$catalog" = "true" ]; then
          items+=('{"package":"catalog","name":"owid-catalog","path":"lib/catalog"}')
        fi
        if [ "$datautils" = "true" ]; then
          items+=('{"package":"datautils","name":"owid-datautils","path":"lib/datautils"}')
        fi
        if [ "$repack" = "true" ]; then
          items+=('{"package":"repack","name":"owid-repack","path":"lib/repack"}')
        fi

        IFS=,
        json="[${items[*]}]"
        echo "Will publish: $json"
        echo "packages=$json" >> $GITHUB_OUTPUT

  publish:
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.packages) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 2
        persist-credentials: false

    - name: Check if version needs publishing
      run: |
        CURRENT_VERSION=$(grep '^version = ' ${{ matrix.path }}/pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')

        echo "Current version in pyproject.toml: $CURRENT_VERSION"

        PYPI_RESPONSE=$(curl -s "https://pypi.org/pypi/${{ matrix.name }}/${CURRENT_VERSION}/json" -w "%{http_code}" -o /tmp/pypi_response.json)

        if [ "$PYPI_RESPONSE" = "200" ]; then
          echo "❌ Version $CURRENT_VERSION of ${{ matrix.name }} already exists on PyPI"
          echo "Please increment the version before publishing."
          exit 1
        fi

        echo "✅ Version $CURRENT_VERSION not found on PyPI, proceeding with publish"

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.x'

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        # Caching is disabled in this release pipeline to avoid cache-poisoning
        # of the published package artifact (zizmor cache-poisoning audit).
        enable-cache: false

    - name: Build ${{ matrix.name }}
      run: |
        cd ${{ matrix.path }}
        rm -rf dist
        uv build

    # Published with uv rather than pypa/gh-action-pypi-publish so the release
    # path carries no third-party action (and no twine frozen inside one).
    # Authentication is still PyPI trusted publishing over OIDC, using the
    # id-token permission and the `pypi` environment declared on this job, so
    # the existing publisher configuration on PyPI applies unchanged.
    - name: Publish ${{ matrix.name }} to PyPI
      run: |
        cd ${{ matrix.path }}
        uv publish --trusted-publishing always
