steps:
  # EM-DAT Natural disasters.
  # The following dataset has a table for yearly data and another for decadal data.
  data://garden/emdat/2026-10-21/natural_disasters:
    - data://meadow/emdat/2026-10-21/natural_disasters:
      - snapshot://emdat/2026-10-21/natural_disasters.xlsx
    - data://garden/worldbank_wdi/2026-07-27/wdi
    - data://garden/demography/2024-07-15/population
    - data://garden/regions/2023-01-01/regions
    - data://garden/wb/2026-07-01/income_groups

  # EM-DAT Natural disasters.
  # The following dataset has only global yearly data, and entity corresponds to the threshold of deaths.
  data://grapher/emdat/2026-10-21/natural_disasters_global_by_deaths:
    - data://garden/emdat/2026-10-21/natural_disasters

  # EM-DAT Natural disasters.
  # The following dataset has all (yearly and decadal) variables together.
  data://grapher/emdat/2026-10-21/natural_disasters:
    - data://garden/emdat/2026-10-21/natural_disasters

  # EM-DAT Natural disasters.
  # The following dataset has yearly and decadal count (and share) of events by impacts.
  data://grapher/emdat/2026-10-21/natural_disasters_impact:
    - data://garden/emdat/2026-10-21/natural_disasters

  # EM-DAT Natural disasters.
  # The following dataset has only global yearly data, and entity corresponds to the type of disaster.
  data://grapher/emdat/2026-10-21/natural_disasters_global_by_type:
    - data://garden/emdat/2026-10-21/natural_disasters

  # EM-DAT Natural disasters.
  # Multi-dim charts on the human and economic impact of natural disasters.
  viz://chart/natural_disasters/latest/affected:
    - data://grapher/emdat/2026-10-21/natural_disasters
  viz://chart/natural_disasters/latest/economic_damages:
    - data://grapher/emdat/2026-10-21/natural_disasters
  viz://chart/natural_disasters/latest/deaths:
    - data://grapher/emdat/2026-10-21/natural_disasters

  # EM-DAT Natural disasters.
  # Single charts on natural disasters.
  viz://chart/natural_disasters/latest/number_of_natural_disaster_events:
    - data://grapher/emdat/2026-10-21/natural_disasters_global_by_type
  viz://chart/natural_disasters/latest/natural_disasters_by_type:
    - data://grapher/emdat/2026-10-21/natural_disasters_global_by_type
  viz://chart/natural_disasters/latest/economic_damage_from_natural_disasters:
    - data://grapher/emdat/2026-10-21/natural_disasters_global_by_type
  viz://chart/natural_disasters/latest/damage_costs_from_natural_disasters:
    - data://grapher/emdat/2026-10-21/natural_disasters_global_by_type
  viz://chart/natural_disasters/latest/natural_disasters_by_yearly_impact:
    - data://grapher/emdat/2026-10-21/natural_disasters_impact
  viz://chart/natural_disasters/latest/natural_disasters_by_decadal_size:
    - data://grapher/emdat/2026-10-21/natural_disasters_impact
  viz://chart/natural_disasters/latest/natural_disasters_reported_by_deaths:
    - data://grapher/emdat/2026-10-21/natural_disasters_global_by_deaths
  viz://chart/natural_disasters/latest/death_rates_disaster_gdp:
    - data://grapher/emdat/2026-10-21/natural_disasters
    - data://grapher/worldbank_wdi/2026-07-27/wdi
    - data://grapher/regions/2023-01-01/regions
  viz://chart/natural_disasters/latest/affected_by_disasters_vs_gdp:
    - data://grapher/emdat/2026-10-21/natural_disasters
    - data://grapher/worldbank_wdi/2026-07-27/wdi
    - data://grapher/regions/2023-01-01/regions

  # NOAA/NCEI Natural Hazards Data
  data://grapher/noaa_ncei/2025-10-30/natural_hazards:
    - data://garden/noaa_ncei/2025-10-30/natural_hazards:
      - data://garden/regions/2023-01-01/regions
      - data://garden/wb/2026-07-01/income_groups
      - data://meadow/noaa_ncei/2025-10-30/natural_hazards:
        - snapshot://noaa_ncei/2025-10-30/natural_hazards_tsunamis.csv
        - snapshot://noaa_ncei/2025-10-30/natural_hazards_volcanoes.csv
        - snapshot://noaa_ncei/2025-10-30/natural_hazards_earthquakes.csv
