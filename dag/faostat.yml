steps:
  # Auxiliary FAOSTAT RL step with basic processing, used by the population dataset to generate population density.
  data://garden/faostat/2024-03-14/faostat_rl_auxiliary:
    - snapshot://faostat/2024-03-14/faostat_rl.zip

  # Global food multidim (shown as a data explorer).
  viz://chart/faostat/latest/global_food:
    - data://grapher/faostat/2026-11-23/faostat_qcl
    - data://grapher/faostat/2026-11-23/faostat_fbsc

  # Fertilizer use multidim.
  viz://chart/faostat/latest/fertilizer_use:
    - data://grapher/faostat/2026-11-23/faostat_rfn
    - data://grapher/faostat/2026-11-23/additional_variables

  # FAOSTAT meadow steps for version 2026-11-23

