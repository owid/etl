    - data://meadow/faostat/2026-11-23/faostat_qv
    - data://meadow/faostat/2026-11-23/faostat_rfn
    - data://meadow/faostat/2026-11-23/faostat_rl
    - data://meadow/faostat/2026-11-23/faostat_rp
    - data://meadow/faostat/2026-11-23/faostat_scl
    - data://meadow/faostat/2026-11-23/faostat_sdgb
  data://garden/faostat/2026-11-23/faostat_fbsc:
