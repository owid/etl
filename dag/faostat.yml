    - data://meadow/faostat/2026-11-23/faostat_fbs
    - data://meadow/faostat/2026-11-23/faostat_fbsh
    - data://meadow/faostat/2026-11-23/faostat_fs
    - data://meadow/faostat/2026-11-23/faostat_lc
    - data://meadow/faostat/2026-11-23/faostat_qcl
