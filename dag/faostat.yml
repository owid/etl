  # in the FBS meadow step). Until FAO restores them, their data is taken from the 2025-03-17 release.
  ##########

  data://meadow/faostat/2026-11-23/faostat_fbs:
    - snapshot://faostat/2026-11-23/faostat_fbs.zip
    - snapshot://faostat/2025-03-17/faostat_fbs.zip
