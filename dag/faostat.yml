    - data://garden/demography/2024-07-15/population
    - data://garden/wb/2026-07-01/income_groups
    - data://garden/regions/2023-01-01/regions
  # FAOSTAT garden step for additional variables for version 2026-11-23
  data://garden/faostat/2026-11-23/additional_variables:
    - data://garden/faostat/2026-11-23/faostat_fbsc
    - data://garden/faostat/2026-11-23/faostat_qcl
    - data://garden/faostat/2026-11-23/faostat_qi
    - data://garden/faostat/2026-11-23/faostat_rfn
    - data://garden/faostat/2026-11-23/faostat_rl
    - data://garden/faostat/2026-11-23/faostat_sdgb

  # FAOSTAT grapher steps for version 2026-11-23
  data://grapher/faostat/2026-11-23/faostat_fbsc:
    - data://garden/faostat/2026-11-23/faostat_fbsc
  data://grapher/faostat/2026-11-23/faostat_fs:
    - data://garden/faostat/2026-11-23/faostat_fs
  data://grapher/faostat/2026-11-23/faostat_lc:
    - data://garden/faostat/2026-11-23/faostat_lc
  data://grapher/faostat/2026-11-23/faostat_qcl:
    - data://garden/faostat/2026-11-23/faostat_qcl
  data://grapher/faostat/2026-11-23/faostat_qi:
    - data://garden/faostat/2026-11-23/faostat_qi
  data://grapher/faostat/2026-11-23/faostat_qv:
    - data://garden/faostat/2026-11-23/faostat_qv
  data://grapher/faostat/2026-11-23/faostat_rfn:
    - data://garden/faostat/2026-11-23/faostat_rfn
  data://grapher/faostat/2026-11-23/faostat_rl:
    - data://garden/faostat/2026-11-23/faostat_rl
  data://grapher/faostat/2026-11-23/faostat_rp:
    - data://garden/faostat/2026-11-23/faostat_rp
  data://grapher/faostat/2026-11-23/faostat_sdgb:
    - data://garden/faostat/2026-11-23/faostat_sdgb
  # FAOSTAT grapher step for additional variables for version 2026-11-23
  data://grapher/faostat/2026-11-23/additional_variables:
    - data://garden/faostat/2026-11-23/additional_variables

  # FAOSTAT Detailed Trade Matrix (faostat_tm).
  # Standalone trade-flow steps that powers a bespoke food trade visualization.
  # They are intentionally decoupled from the rest of the FAOSTAT pipeline because the matrix is huge (~8.5 GB uncompressed), and won't go to grapher in the usual way.
  data://meadow/faostat/2026-05-07/faostat_tm:
    - snapshot://faostat/2026-05-07/faostat_tm.zip
  data://garden/faostat/2026-05-07/faostat_tm:
    - data://meadow/faostat/2026-05-07/faostat_tm

  # Viz-ready slice of the trade matrix for the latest year. All the build logic lives in this
  # garden step; the dropdown definition lives next to it in food_trade.items.yaml.
  data://garden/faostat/2026-05-07/food_trade:
    - data://garden/faostat/2026-05-07/faostat_tm

  # Bespoke feed: load the garden table and write a metadata JSON plus one JSON per product,
  # synced to the environment's v1/bespoke path for the bespoke viz to fetch.
  viz://bespoke/faostat/latest/food_trade:
    - data://garden/faostat/2026-05-07/food_trade
  ######################################################################################################################
  #
  # Food supply chain per person per day (waterfall visualization).
  #
  # FAO's food balances with every element (production, trade, stock changes, seed, feed, processing, losses, food...)
  # converted to kilocalories, grams of protein and kilograms per person per day.
  # Food Balance Sheets method (1961 onward):
  data://garden/faostat/2026-11-23/food_supply_chain_fbs:
    - data://garden/faostat/2026-11-23/faostat_fbsc
    - data://garden/demography/2024-07-15/population
    - data://garden/regions/2023-01-01/regions
    - data://garden/wb/2026-07-01/income_groups
  # Supply Utilization Accounts method (2010 onward), which includes the feed by-products FBS lacks:
  data://garden/faostat/2026-11-23/food_supply_chain_scl:
    - data://garden/faostat/2026-11-23/faostat_scl
    # The meadow (not garden) metadata is needed because only it carries the item-group table that tags each SCL item
    # as crop, livestock or processed.
    - data://meadow/faostat/2026-11-23/faostat_metadata
    - data://garden/faostat/2026-11-23/faostat_fbsc
    - data://garden/demography/2024-07-15/population
    - data://garden/regions/2023-01-01/regions
    - data://garden/wb/2026-07-01/income_groups
    # The fixed densities of the items that people hardly eat (assumption 5).
    - snapshot://faostat/2026-10-14/nutrient_conversion_table.xlsx
    - snapshot://feedipedia/2026-10-14/feed_composition.csv
  # Bespoke viz step: a metadata JSON plus one JSON per entity, built with the Supply Utilization Accounts method,
  # whose chain runs from 2010; the main source of the interactive waterfall.
  viz://bespoke/faostat/latest/food_supply_chain_scl:
    - data://garden/faostat/2026-11-23/food_supply_chain_scl
  # Static viz step: the same files built with the Food Balance Sheets method, whose chain runs from 1961, for the
  # static waterfall of the world in 1968 (the year The Population Bomb was published).
  viz://static/faostat/2026-09-04/food_supply_chain_fbs:
    - data://garden/faostat/2026-11-23/food_supply_chain_fbs
  ######################################################################################################################
