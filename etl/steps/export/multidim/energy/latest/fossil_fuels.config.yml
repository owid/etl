title:
  title: "Fossil fuels"
  title_variant: ""
default_selection:
  - "World"
topic_tags:
  - "Energy"
  - "Fossil Fuels"
dimensions:
  - slug: "fuel"
    name: "Fuel"
    choices:
      - slug: "total"
        name: "Total"
        description: "All fossil fuels (coal, oil, and gas)"
        group: "Aggregates"
      - slug: "coal"
        name: "Coal"
        group: "Individual fuels"
      - slug: "oil"
        name: "Oil"
        group: "Individual fuels"
      - slug: "gas"
        name: "Gas"
        group: "Individual fuels"
  - slug: "metric"
    name: "Metric"
    choices:
      - slug: "production"
        name: "Energy production"
        description: "Production in terawatt-hours"
      - slug: "production_physical"
        name: "Amount produced"
        description: "Production in tonnes (coal and oil) or cubic meters (gas)"
      - slug: "consumption"
        name: "Amount consumed"
        description: "Consumption in tonnes (coal) or cubic meters (oil and gas)"
      - slug: "imports"
        name: "Imports"
        description: "Imports in tonnes (coal) or cubic meters (oil and gas)"
      - slug: "exports"
        name: "Exports"
        description: "Exports in tonnes (coal) or cubic meters (oil and gas)"
      - slug: "net_imports"
        name: "Net imports"
        description: "Imports minus exports; negative values mean net exports"
      - slug: "reserves"
        name: "Reserves"
        description: "Proven reserves in tonnes (coal) or cubic meters (oil and gas)"
      - slug: "by_fuel"
        name: "By fuel"
        description: "Fossil fuel production broken down by fuel, stacked"
# NOTE: Once grapher supports checkbox dimensions in multidims, rename this dimension to
# "Per capita" and add: presentation: {type: checkbox, choice_slug_true: per_capita}.
  - slug: "per_capita"
    name: "Measure"
    choices:
      # Not "Total" (already used for the all-fuels aggregate and in "total energy supply") and not
      # "Per country" (entities include World and regions, which are not countries).
      - slug: "total"
        name: "Absolute"
      - slug: "per_capita"
        name: "Per capita"
views:
  # Views are generated programmatically in the step.
  []
