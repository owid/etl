title:
  title: "Electricity mix"
  title_variant: ""
default_selection:
  - "World"
default_dimensions:
  source: "total"
  metric: "generation"
  frequency: "annual"
topic_tags:
  - "Energy"
definitions:
  common_views:
    - config:
        originUrl: "https://ourworldindata.org/electricity-mix"
dimensions:
  - slug: "source"
    name: "Source"
    choices:
      - slug: "total"
        name: "Total"
        group: "Aggregates"
      - slug: "fossil"
        name: "Fossil fuels"
        description: "Coal, oil, and gas"
        group: "Aggregates"
      - slug: "low_carbon"
        name: "Low-carbon"
        description: "Nuclear and renewables"
        group: "Aggregates"
      - slug: "renewables"
        name: "Renewables"
        description: "Hydropower, wind, solar, bioenergy, and other renewables"
        group: "Aggregates"
      - slug: "solar_and_wind"
        name: "Solar and wind"
        group: "Aggregates"
      - slug: "coal"
        name: "Coal"
        group: "Individual sources"
      - slug: "oil"
        name: "Oil"
        group: "Individual sources"
      - slug: "gas"
        name: "Gas"
        group: "Individual sources"
      - slug: "nuclear"
        name: "Nuclear"
        group: "Individual sources"
      - slug: "hydro"
        name: "Hydropower"
        group: "Individual sources"
      - slug: "wind"
        name: "Wind"
        group: "Individual sources"
      - slug: "solar"
        name: "Solar"
        group: "Individual sources"
      - slug: "bioenergy"
        name: "Bioenergy"
        group: "Individual sources"
      - slug: "other_renewables"
        name: "Other renewables"
        description: "Geothermal, wave, and tidal"
        group: "Individual sources"
  - slug: "metric"
    name: "Metric"
    choices:
      - slug: "generation"
        name: "Generation"
        description: "Electricity generation, in terawatt-hours"
      - slug: "per_capita"
        name: "Per capita generation"
        description: "Electricity generation per person, in kilowatt-hours"
      - slug: "share_of_generation"
        name: "Share of generation"
        description: "Share of total electricity generation"
      - slug: "demand"
        name: "Demand"
        description: "Total electricity demand, in terawatt-hours"
      - slug: "demand_per_capita"
        name: "Demand per capita"
        description: "Electricity demand per person, in kilowatt-hours"
      - slug: "net_imports"
        name: "Net imports"
        description: "Net electricity imports, in terawatt-hours"
      - slug: "imports_share"
        name: "Net imports as a share of demand"
        description: "Net electricity imports as a share of demand"
      - slug: "carbon_intensity"
        name: "Carbon intensity"
        description: "Carbon intensity of electricity, in grams of CO2 per kilowatt-hour"
      - slug: "by_source"
        name: "By source"
        description: "Electricity generation broken down by source, stacked"
      - slug: "by_source_per_capita"
        name: "By source, per capita"
        description: "Electricity generation per person, broken down by source, stacked"
  - slug: "frequency"
    name: "Frequency"
    choices:
      - slug: "annual"
        name: "Annual"
      - slug: "monthly"
        name: "Monthly"
        description: "Monthly data from Ember, from 1999 onwards"
views:
  # Views are generated programmatically in the step.
  []
