title:
  title: "Energy mix"
  title_variant: ""
default_selection:
  - "World"
default_dimensions:
  source: "total"
  metric: "total"
topic_tags:
  - "Energy"
definitions:
  common_views:
    - config:
        originUrl: "https://ourworldindata.org/energy"
        # Every view here is built on total energy supply, so every view changed when the
        # Energy Institute moved off the substitution method. The explainer is therefore a
        # blanket related question, unlike in the electricity and fossil-fuel multidims,
        # where the underlying values are identical under both methods.
        relatedQuestions:
          - text: "Why has our energy data changed?"
            url: "https://ourworldindata.org/how-primary-energy-is-measured-has-changed-across-our-charts"
dimensions:
  - slug: "source"
    name: "Source"
    choices:
      - slug: "total"
        name: "Total"
        group: "Aggregates"
      - slug: "fossil_fuels"
        name: "Fossil fuels"
        description: "Coal, oil, and gas"
        group: "Aggregates"
      - slug: "low_carbon_energy"
        name: "Low-carbon energy"
        description: "Nuclear and renewables"
        group: "Aggregates"
      - slug: "renewables"
        name: "Renewables"
        description: "Hydropower, wind, solar, biofuels, and other renewables"
        group: "Aggregates"
      - slug: "solar_and_wind"
        name: "Solar and wind"
        group: "Aggregates"
      - slug: "coal"
        name: "Coal"
        group: "Individual sources"
      - slug: "oil"
        name: "Oil"
        group: "Individual sources"
      - slug: "gas"
        name: "Gas"
        group: "Individual sources"
      - slug: "nuclear"
        name: "Nuclear"
        group: "Individual sources"
      - slug: "hydro"
        name: "Hydropower"
        group: "Individual sources"
      - slug: "wind"
        name: "Wind"
        group: "Individual sources"
      - slug: "solar"
        name: "Solar"
        group: "Individual sources"
      - slug: "biofuels"
        name: "Biofuels"
        group: "Individual sources"
      - slug: "other_renewables"
        name: "Other renewables"
        description: "Geothermal, biomass, waste, and other renewable sources"
        group: "Individual sources"
  - slug: "metric"
    name: "Metric"
    choices:
      - slug: "total"
        name: "Primary energy"
        description: "Total energy supply, in terawatt-hours"
      - slug: "per_capita"
        name: "Per capita primary energy"
        description: "Total energy supply per person, in kilowatt-hours"
      - slug: "share"
        name: "Share of primary energy"
        description: "Share of total energy supply, as a percentage"
      - slug: "annual_change"
        name: "Annual change in primary energy"
        description: "Year-on-year change of total energy supply, in terawatt-hours"
      - slug: "annual_change_pct"
        name: "Annual change in primary energy (%)"
        description: "Year-on-year change of total energy supply, as a percentage"
      - slug: "by_source"
        name: "Primary energy by source"
        description: "Total energy supply broken down by source"
      - slug: "by_source_per_capita"
        name: "Per capita primary energy by source"
        description: "Total energy supply per person, broken down by source"
      - slug: "carbon_intensity"
        name: "Carbon intensity of energy"
        description: "CO₂ emitted per unit of total energy supply"
views:
  # Views are generated programmatically in the step.
  []
