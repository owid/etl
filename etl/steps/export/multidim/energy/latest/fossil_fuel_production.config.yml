title:
  title: "Fossil fuel production"
  title_variant: ""
default_selection:
  - "World"
topic_tags:
  - "Energy"
  - "Fossil Fuels"
dimensions:
  - slug: "fuel"
    name: "Fuel"
    choices:
      - slug: "total"
        name: "Total"
        description: "All fossil fuels (coal, oil, and gas)"
      - slug: "coal"
        name: "Coal"
      - slug: "oil"
        name: "Oil"
      - slug: "gas"
        name: "Gas"
  - slug: "metric"
    name: "Metric"
    choices:
      - slug: "production"
        name: "Energy production"
        description: "Production measured in terawatt-hours"
      - slug: "per_capita"
        name: "Energy production per capita"
        description: "Production per person, in kilowatt-hours"
      - slug: "production_physical"
        name: "Amount produced"
        description: "How much fuel is produced (the unit depends on the fuel)"
      - slug: "per_capita_physical"
        name: "Amount produced per capita"
        description: "How much fuel is produced per person (the unit depends on the fuel)"
      - slug: "reserves"
        name: "Reserves"
        description: "Proven reserves remaining (the unit depends on the fuel; through 2020)"
      - slug: "reserves_ratio"
        name: "Reserves-to-production ratio"
        description: "Years of production left at current rates (World only)"
      - slug: "by_fuel"
        name: "By fuel"
        description: "Fossil fuel production broken down by fuel, stacked"
      - slug: "by_fuel_per_capita"
        name: "By fuel, per capita"
        description: "Fossil fuel production per person, broken down by fuel, stacked"
views:
  # Views are generated programmatically in the step.
  []
