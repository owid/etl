title:
  title: Asylum seekers and refugees
  title_variant: ""

default_selection:
  - World
  - Germany
  - Turkey
  - Syria
  - Ukraine

default_dimensions:
  metric: refugees
  direction: asylum
  unit: total

definitions:
  common_views:
    - config:
        hasMapTab: true
        tab: map
        chartTypes: ["LineChart"]

dimensions:
  - slug: metric
    name: Metric
    choices:
      - slug: refugees
        name: Refugees
        description: People who have fled their country and are recognized as refugees under UNHCR's mandate.
      - slug: asylum_seekers
        name: Asylum seekers
        description: People who have applied for asylum and are awaiting a decision on their claim.
      - slug: returned_refugees
        name: Returned refugees
        description: Former refugees who have returned to their country of origin.
      - slug: stateless
        name: Stateless persons
        description: People who are not considered a citizen of any country.
  - slug: direction
    name: Origin or country of asylum
    choices:
      - slug: origin
        name: By country of origin
        description: The country people fled from.
      - slug: asylum
        name: By country of asylum
        description: The country where people are seeking or have been granted asylum.
    presentation:
      type: radio
  - slug: unit
    name: Unit
    choices:
      - slug: total
        name: Total number
      - slug: per_capita
        name: Per capita
    presentation:
      type: radio

views:
  # Refugees
  - dimensions:
      metric: refugees
      direction: origin
      unit: total
    indicators:
      y:
        - catalogPath: refugee_data_origin#refugees
    config:
      map:
        colorScale:
          baseColorScheme: YlOrRd
          binningStrategy: manual
          customNumericValues: [0, 300, 1000, 3000, 10000, 30000, 100000, 300000, 1000000, 3000000]

  - dimensions:
      metric: refugees
      direction: origin
      unit: per_capita
    indicators:
      y:
        - catalogPath: refugee_data_origin#refugees_per_1000
    config:
      map:
        colorScale:
          baseColorScheme: YlOrRd
          binningStrategy: manual
          customNumericValues: [0, 0.1, 0.3, 1, 3, 10, 30, 100, 300]

  - dimensions:
      metric: refugees
      direction: asylum
      unit: total
    indicators:
      y:
        - catalogPath: refugee_data_asylum#refugees
    config:
      map:
        colorScale:
          baseColorScheme: YlGnBu
          binningStrategy: manual
          customNumericValues: [0, 1000, 3000, 10000, 30000, 100000, 300000, 1000000, 3000000]

  - dimensions:
      metric: refugees
      direction: asylum
      unit: per_capita
    indicators:
      y:
        - catalogPath: refugee_data_asylum#refugees_per_1000
    config:
      map:
        colorScale:
          baseColorScheme: YlGnBu
          binningStrategy: manual
          customNumericValues: [0, 0.1, 0.3, 1, 3, 10, 30, 100]

  # Asylum seekers
  - dimensions:
      metric: asylum_seekers
      direction: origin
      unit: total
    indicators:
      y:
        - catalogPath: refugee_data_origin#asylum_seekers
    config:
      map:
        colorScale:
          baseColorScheme: YlOrRd
          binningStrategy: manual
          customNumericValues: [0, 300, 1000, 3000, 10000, 30000, 100000, 300000, 1000000]

  - dimensions:
      metric: asylum_seekers
      direction: origin
      unit: per_capita
    indicators:
      y:
        - catalogPath: refugee_data_origin#asylum_seekers_per_100k
    config:
      map:
        colorScale:
          baseColorScheme: YlOrRd
          binningStrategy: manual
          customNumericValues: [0, 10, 20, 50, 100, 200, 500, 1000]

  - dimensions:
      metric: asylum_seekers
      direction: asylum
      unit: total
    indicators:
      y:
        - catalogPath: refugee_data_asylum#asylum_seekers
    config:
      map:
        colorScale:
          baseColorScheme: YlGnBu
          binningStrategy: manual
          customNumericValues: [0, 300, 1000, 3000, 10000, 30000, 100000, 300000, 1000000]

  - dimensions:
      metric: asylum_seekers
      direction: asylum
      unit: per_capita
    indicators:
      y:
        - catalogPath: refugee_data_asylum#asylum_seekers_per_100k
    config:
      map:
        colorScale:
          baseColorScheme: YlGnBu
          binningStrategy: manual
          customNumericValues: [0, 1, 3, 10, 30, 100, 300, 1000, 3000]

  # Returned refugees (per-capita not published for this metric)
  - dimensions:
      metric: returned_refugees
      direction: origin
      unit: total
    indicators:
      y:
        - catalogPath: refugee_data_origin#returned_refugees
    config:
      map:
        colorScale:
          baseColorScheme: BuGn
          binningStrategy: manual
          customNumericValues: [0, 10, 100, 1000, 10000, 100000, 1000000]

  - dimensions:
      metric: returned_refugees
      direction: asylum
      unit: total
    indicators:
      y:
        - catalogPath: refugee_data_asylum#returned_refugees
    config:
      map:
        colorScale:
          baseColorScheme: GnBu
          binningStrategy: manual
          customNumericValues: [0, 100, 300, 1000, 3000, 10000, 30000, 100000, 300000]

  # Stateless persons (only reported by country of residence, i.e. "asylum" perspective)
  - dimensions:
      metric: stateless
      direction: asylum
      unit: total
    indicators:
      y:
        - catalogPath: refugee_data_asylum#stateless
    config:
      map:
        colorScale:
          baseColorScheme: YlGnBu
          binningStrategy: manual
          customNumericValues: [0, 10, 100, 300, 1000, 3000, 10000, 30000, 100000, 300000, 1000000]

  - dimensions:
      metric: stateless
      direction: asylum
      unit: per_capita
    indicators:
      y:
        - catalogPath: refugee_data_asylum#stateless_per_100k
    config:
      map:
        colorScale:
          baseColorScheme: YlGnBu
          binningStrategy: manual
          customNumericValues: [0, 0.3, 1, 3, 10, 30, 100, 300, 1000, 3000]
