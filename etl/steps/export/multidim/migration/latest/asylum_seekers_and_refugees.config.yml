title:
  title: Asylum seekers and refugees
  title_variant: ""
topic_tags:
  - Migration
  - War and Peace

default_selection:
  - World
  - Germany
  - Turkey
  - Syria
  - Ukraine

default_dimensions:
  metric: refugees
  direction: asylum
  unit: total
  age: all_ages

definitions:
  common_views:
    - config:
        hasMapTab: true
        tab: map
        chartTypes: ["LineChart", "DiscreteBar"]
  # Description bullets for refugees/ asylum-seekers
  description_key_refugee: A refugee is a person in need of international protection. They had to flee their home country because of serious threats against which the authorities of their home country cannot or will not protect them.
  description_key_asylum: An asylum-seeker is a person who has fled their home country because of serious threats against which the authorities of their home country cannot or will not protect them. A person is considered an asylum-seeker if they have applied for asylum in another country and are waiting for a decision on their application.
  description_diff_refugee_asylum: The UNHCR only considers a person a refugee if they have been granted protection in a foreign country. If a person has fled their home country and applied for asylum in another country, but is still waiting for a decision on their application, they are considered an asylum-seeker.
  description_returned_refugees: Returned refugees are former refugees who have returned to their countries of origin, but are yet to be fully integrated.
  description_returned_statistics: The UNHCR only includes refugees who returned during this calendar year in their statistics, although in practice, operations may assist returnees for longer periods.
  description_stateless: Stateless persons are people who are not considered a citizen of any country. A person can be stateless for many reasons, including (among others) unknown parentage, discrimination or complex nationality laws. You can read more about this on the [UNHCR's website](https://www.unhcr.org/about-unhcr/who-we-protect/stateless-people).
  description_stateless_problems: Stateless persons often struggle to obtain documentation and proof of their legal identities. Because of this, they face difficulties accessing basic rights and services, such as education, healthcare, employment, and freedom of movement. They may also be at risk of detention or deportation.
  description_key_child_refugee: This only includes refugees who are children, under the age of 18.
  description_unicef_source: The data on child refugees (under 18) is published by UNICEF, and is based on UNHCR's Refugee Statistics data.


  # Footnotes
  footnote_refugees: This data includes all refugees, not just those who fled that year.
  footnote_asylum: This data includes all asylum-seekers, not just those who fled or applied for asylum that year.
  footnote_refugees_asylum: This data includes all refugees who live in this country, not just those who arrived that year.
  footnote_asylum_asylum: This data includes all asylum-seekers who live in this country, not just those who arrived or applied for asylum that year.

dimensions:
  - slug: metric
    name: Metric
    choices:
      - slug: refugees
        name: Refugees
        description: People who have fled their country and are recognized as refugees under UNHCR's mandate.
      - slug: asylum_seekers
        name: Asylum seekers
        description: People who have applied for asylum and are awaiting a decision on their claim.
      - slug: returned_refugees
        name: Returned refugees
        description: Former refugees who have returned to their country of origin.
      - slug: stateless
        name: Stateless persons
        description: People who are not considered a citizen of any country.
  - slug: direction
    name: By origin or destination
    choices:
      - slug: origin
        name: By country of origin
        description: The country people fled from.
      - slug: asylum
        name: By country of asylum
        description: The country where people are seeking or have been granted asylum.
    presentation:
      type: radio
  - slug: unit
    name: Unit
    choices:
      - slug: total
        name: Total number
      - slug: per_capita
        name: Per capita
    presentation:
      type: radio
  - slug: age
    name: Age
    choices:
      - slug: all_ages
        name: All ages
      - slug: under_18
        name: Under 18
    presentation:
      type: radio

views:
  # Refugees
  - dimensions:
      metric: refugees
      direction: origin
      unit: total
      age: all_ages
    indicators:
      y:
        - catalogPath: refugee_data_origin#refugees
    config:
      map:
        colorScale:
          baseColorScheme: YlOrRd
          binningStrategy: manual
          customNumericValues: [0, 300, 1000, 3000, 10000, 30000, 100000, 300000, 1000000, 3000000]
    metadata:
      description_key:
        - "{definitions.description_key_refugee}"
        - "{definitions.description_diff_refugee_asylum}"

  - dimensions:
      metric: refugees
      direction: origin
      unit: per_capita
      age: all_ages
    indicators:
      y:
        - catalogPath: refugee_data_origin#refugees_per_1000
          display:
            numDecimalPlaces: 1
    config:
      note: "{definitions.footnote_refugees}"
      map:
        colorScale:
          baseColorScheme: YlOrRd
          binningStrategy: manual
          customNumericValues: [0, 0.1, 0.3, 1, 3, 10, 30, 100, 300]
    metadata:
      description_key:
