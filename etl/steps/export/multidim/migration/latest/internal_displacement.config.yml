title:
  title: Internal displacement
  title_variant: ""

default_selection:
  - World
  - Sudan
  - Democratic Republic of Congo
  - Ukraine
  - Syria

default_dimensions:
  cause: total
  metric: stock
  unit: total

definitions:
  common_views:
    - config:
        hasMapTab: true
        tab: map
        chartTypes: ["LineChart"]

dimensions:
  - slug: cause
    name: Cause
    choices:
      - slug: total
        name: All causes
        description: All internal displacements, whether caused by conflict and violence or by disasters.
      - slug: conflict
        name: Conflict and violence
      - slug: disaster
        name: Disasters
  - slug: metric
    name: Metric
    choices:
      - slug: idps
        name: People living in displacement
        description: The total number of people living in internal displacement at the end of the year.
      - slug: displacements
        name: New displacements during the year
        description: The number of new displacements recorded during the year. People can get displaced multiple times in a year and get counted multiple times in this metric.
      - slug: returned
        name: People who returned after displacement
        description: The number of internally displaced persons who have returned to their area of origin during the year.
    presentation:
      type: radio
  - slug: unit
    name: Unit
    choices:
      - slug: total
        name: Total number
      - slug: per_capita
        name: Per 1,000 people
    presentation:
      type: radio

views:
  # All causes
  - dimensions:
      cause: total
      metric: idps
      unit: total
    indicators:
      y:
        - catalogPath: internal_displacement#total_displacement_rounded

  - dimensions:
      cause: total
      metric: idps
      unit: per_capita
    indicators:
      y:
        - catalogPath: internal_displacement#total_displacement_rounded_per_thousand

  - dimensions:
      cause: total
      metric: displacements
      unit: total
    indicators:
      y:
        - catalogPath: internal_displacement#total_new_displacement_rounded

  - dimensions:
      cause: total
      metric: displacements
      unit: per_capita
    indicators:
      y:
        - catalogPath: internal_displacement#total_new_displacement_rounded_per_thousand

  # Conflict and violence
  - dimensions:
      cause: conflict
      metric: idps
      unit: total
    indicators:
      y:
        - catalogPath: internal_displacement#conflict_total_displacement_rounded

  - dimensions:
      cause: conflict
      metric: idps
      unit: per_capita
    indicators:
      y:
        - catalogPath: internal_displacement#conflict_total_displacement_rounded_per_thousand

  - dimensions:
      cause: conflict
      metric: displacements
      unit: total
    indicators:
      y:
        - catalogPath: internal_displacement#conflict_new_displacement_rounded

  - dimensions:
      cause: conflict
      metric: displacements
      unit: per_capita
    indicators:
      y:
        - catalogPath: internal_displacement#conflict_new_displacement_rounded_per_thousand

  # Disasters
  - dimensions:
      cause: disaster
      metric: idps
      unit: total
    indicators:
      y:
        - catalogPath: internal_displacement#disaster_total_displacement_rounded

  - dimensions:
      cause: disaster
      metric: idps
      unit: per_capita
    indicators:
      y:
        - catalogPath: internal_displacement#disaster_total_displacement_rounded_per_thousand

  - dimensions:
      cause: disaster
      metric: displacements
      unit: total
    indicators:
      y:
        - catalogPath: internal_displacement#disaster_new_displacement_rounded

  - dimensions:
      cause: disaster
      metric: displacements
      unit: per_capita
    indicators:
      y:
        - catalogPath: internal_displacement#disaster_new_displacement_rounded_per_thousand

  # Returned IDPs (UNHCR; only reported as an annual flow)
  - dimensions:
      cause: total
      metric: returned
      unit: total
    indicators:
      y:
        - catalogPath: refugee_data_origin#returned_idps

  - dimensions:
      cause: total
      metric: returned
      unit: per_capita
    indicators:
      y:
        - catalogPath: refugee_data_origin#returned_idps_per_100k
