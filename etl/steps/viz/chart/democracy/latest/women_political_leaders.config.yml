    config:
      <<: *ever_region
      title: Share of countries that have had a woman as head of government
      subtitle: Share of current countries that have had a woman as head of government since 1789.
      note: The head of government is the chief officer of the executive branch of their country. A woman counts as democratically elected if she took office through multi-party elections while the country was an electoral or liberal democracy, as classified by V-Dem's "Regimes of the World".
