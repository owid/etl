grapher_schema: "012"
slug: women-political-leaders

title:
  title: Women political leaders
  title_variant: ""

topic_tags:
  - Women's Rights
  - Women in Politics
  - Democracy

default_selection:
  - Sri Lanka
  - India
  - United Kingdom
  - Germany
  - New Zealand
  - Liberia
  - Brazil

default_dimensions:
  leader: chief_executive
  period: by_year
  aggregation: country

definitions:
  # Colors of the old charts: purple for women, beige for men.
  color_woman: &color_woman "#863d8c"
  color_man: &color_man "#e2b99c"
  # Whether a woman held the role on December 31: a map, plus a strip per country showing each year.
  by_year_country: &by_year_country
    hasMapTab: true
    tab: map
    chartTypes:
      - Swimlane
    map:
      colorScale:
        baseColorScheme: BinaryMapPaletteE
        colorSchemeInvert: true
        customCategoryColors:
          Man: *color_man
          Woman: *color_woman
  # Whether a woman has ever held the role: the indicator is 0 or 1, so it gets labeled bins on the map.
  ever_country: &ever_country
    hasMapTab: true
    tab: map
    chartTypes: []
    map:
      colorScale:
        binningStrategy: manual
        customNumericValues: [0, 0, 1]
        customNumericColors:
          - *color_man
          - *color_woman
        customNumericColorsActive: true
        customNumericLabels:
          - "No"
          - "Yes"
      tooltipUseCustomLabels: true
  # Share of countries led by a man or a woman, stacked to 100%.
  by_year_region: &by_year_region
    chartTypes:
      - StackedArea
      - StackedDiscreteBar
    stackMode: relative
    hideRelativeToggle: false
    entityType: region
    selectedEntityNames:
      - World
  # Share of today's countries that have had a woman in the role, overall and democratically elected.
  ever_region: &ever_region
    chartTypes:
      - LineChart
    yAxis:
      min: 0
    selectedEntityNames:
      - World
  common_views:
    - config:
        originUrl: /women-rights

dimensions:
  - slug: leader
    name: Leader
    choices:
      - slug: chief_executive
        name: Chief executive
      - slug: head_of_government
        name: Head of government
      - slug: head_of_state
        name: Head of state
  - slug: period
    name: Time
    choices:
      - slug: by_year
        name: By year
      - slug: ever
        name: Ever
  - slug: aggregation
    name: Country or region
    choices:
      - slug: country
        name: By country
      - slug: region
        name: By region

views:
  #
  # Chief executive
  #
  - dimensions:
      leader: chief_executive
      period: by_year
      aggregation: country
    indicators:
      y:
        - catalogPath: vdem_uni_without_regions#wom_hoe_vdem
          display:
            name: ""
    config:
      <<: *by_year_country
      title: Gender of the chief executive
      subtitle: '"Chief executive" is defined here as the head of state or the head of government, whoever has more power over the appointment and dismissal of cabinet ministers.'
      note: This is recorded on December 31 of each year. When the head of state and head of government hold equal power, the head of government is considered the chief executive.

  - dimensions:
      leader: chief_executive
      period: ever
      aggregation: country
    indicators:
      y:
        - catalogPath: vdem_uni_without_regions#wom_hoe_ever
    config:
      <<: *ever_country
      title: Country has ever had a woman as chief executive
      subtitle: 'Denotes whether a country had a woman chief executive at least once since 1789. "Chief executive" is defined here as the head of state or the head of government, whoever has more power over the appointment and dismissal of cabinet ministers.'
      note: When the head of state and head of government hold equal power, the head of government is considered the chief executive.

  - dimensions:
      leader: chief_executive
      period: by_year
      aggregation: region
    indicators:
      y:
        - catalogPath: vdem_num_countries#num_countries_hoe__category_man
          display:
            name: Man is chief executive
            color: *color_man
            numDecimalPlaces: 0
        - catalogPath: vdem_num_countries#num_countries_hoe__category_woman
          display:
            name: Woman is chief executive
            color: *color_woman
            numDecimalPlaces: 0
    config:
      <<: *by_year_region
      title: Share of countries with a woman as chief executive
      subtitle: '"Chief executive" is defined here as the head of state or the head of government, whoever has more power over the appointment and dismissal of cabinet ministers.'
      note: This is recorded on December 31 of each year. When the head of state and head of government hold equal power, the head of government is considered the chief executive.
    metadata:
      presentation:
        title_public: Share of countries by gender of the chief executive
      description_short: Share of countries in which the chief executive in office on December 31 is a man or a woman.

  - dimensions:
      leader: chief_executive
      period: ever
      aggregation: region
    indicators:
      y:
        - catalogPath: vdem_share_countries#share_countries_wom_hoe_ever
          display:
            name: Any woman chief executive
            color: "#b13507"
            roundingMode: significantFigures
            numSignificantFigures: 2
        - catalogPath: vdem_share_countries#share_countries_wom_hoe_ever_demelect
          display:
            name: Democratically elected woman chief executive
            color: "#4c6a9c"
            roundingMode: significantFigures
            numSignificantFigures: 2
    config:
      <<: *ever_region
      title: Share of countries that have had a woman as chief executive
      subtitle: Share of current countries that have had a woman as chief executive since 1789.
      note: '"Chief executive" is defined here as the head of government (such as Germany''s Angela Merkel) or the head of state (such as Argentina''s Cristina Fernández de Kirchner), whoever has more power over the appointment and dismissal of cabinet ministers. A woman counts as democratically elected if she took office through multi-party elections while the country was an electoral or liberal democracy, as classified by V-Dem''s "Regimes of the World".'
    metadata:
      presentation:
        title_public: Share of countries that have had a woman as chief executive
      description_short: Share of today's countries that have had a woman as chief executive by the end of the given year, and the share that have had one who was elected democratically.

