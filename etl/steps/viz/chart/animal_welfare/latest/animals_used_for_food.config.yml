grapher_schema: "011"

title:
  title: Animals used for food
topic_tags:
  - Animal Welfare
default_selection:
  - World
  - United States
  - China
  - India
  - Brazil
  - United Kingdom
  - Spain
default_dimensions:
  metric: killed_in_country
  animal: land_animals
  per_capita: total

definitions:
  common_views:
    - config:
        hasMapTab: true
        tab: chart
        yAxis:
          min: 0

dimensions:
