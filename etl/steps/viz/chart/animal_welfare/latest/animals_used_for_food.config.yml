    slug: metric
    choices:
      - slug: killed_in_country
        name: Killed in the country
        description: Includes animals whose meat is exported
      - slug: killed_for_consumption
        name: Killed for consumption
        description: Adjusted for trade in meat
      - slug: alive
        name: Live animals
        description: Kept at a given moment, not counted over a year
