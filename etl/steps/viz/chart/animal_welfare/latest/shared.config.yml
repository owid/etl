# Dimensions and hand-written views shared by the animal welfare multidims (see shared.py).
# The big multidim (animal_welfare) shows every view; the others show a subset of them.
# The step fills the Animal choices and the animal-count views from the data.
grapher_schema: "012"

# Estimates only come as a range for fish and crustaceans, and only animal counts have a per-person
# version: every other view has "Not applicable" and "Total" (a multidim shows every dimension,
# disabled when one choice is available).
# Views on laws and hens have an animal of their own.
dimensions:
  - slug: metric
    name: Metric
    presentation:
      type: dropdown
    choices:
      - slug: animals_killed
        name: Animals killed in the country
        description: Includes animals whose meat is exported
      - slug: animals_killed_for_consumption
        name: Animals killed for the country's consumption
        description: Adjusted for trade in meat
      - slug: animals_alive
        name: Live animals
        description: Kept at a given moment, not counted over a year
      - slug: caged_hens
        name: Cage and cage-free hens
      - slug: fur_farming_status
        name: Bans on fur farming
      - slug: fur_trading_status
        name: Bans on fur trading
      - slug: bullfighting_status
        name: Bans on bullfighting
      - slug: chick_culling_status
        name: Bans on chick culling
  - slug: animal
    name: Animal
    presentation:
      type: dropdown-with-search
    choices: []
  - slug: estimate
    name: Estimate
    presentation:
      type: dropdown
    choices:
      - slug: midpoint
        name: Midpoint
        description: Midpoint of the estimated range.
      - slug: lower_limit
        name: Lower limit
        description: Lower end of the estimated range.
      - slug: upper_limit
        name: Upper limit
        description: Upper end of the estimated range.
      - slug: not_applicable
        name: Not applicable
        description: Only fish and crustaceans are estimated as a range.
  - slug: per_capita
    name: Per capita
    presentation:
      type: toggle-buttons
    choices:
      - slug: total
        name: Total
      - slug: per_capita
        name: Per person

views:
  - dimensions:
      metric: fur_farming_status
      animal: fur_animals
      estimate: not_applicable
      per_capita: total
    indicators:
      y:
        - catalogPath: fur_laws#fur_farming_status
    config:
      title: Which countries have banned fur farming?
      subtitle: Countries that have banned fur farming at a national level.
      chartTypes: []
      map:
        colorScale:
          baseColorScheme: OwidCategoricalC
          binningStrategy: manual
          customCategoryColors:
            Banned: "#759AC8"
            Banned but not yet in effect: "#058580"
            No active farms reported: "#99D8C9"
            Not banned: "#AE2E3F"
            Partially banned: "#A46F49"
            Phased out due to stricter regulation: "#6D3E91"
  - dimensions:
      metric: fur_trading_status
      animal: fur_animals
      estimate: not_applicable
      per_capita: total
    indicators:
      y:
        - catalogPath: fur_laws#fur_trading_status
    config:
      title: Which countries have banned fur trading?
      subtitle: Countries that have banned fur trading at a national level.
      chartTypes: []
      map:
        colorScale:
          baseColorScheme: OwidCategoricalC
          binningStrategy: manual
          customCategoryColors:
            Banned: "#759AC8"
            Not banned: "#AE2E3F"
            Partially banned: "#A46F49"
  - dimensions:
      metric: bullfighting_status
      animal: cattle
      estimate: not_applicable
      per_capita: total
    indicators:
      y:
        - catalogPath: bullfighting_laws#status
    config:
      title: Which countries have banned bullfighting?
      subtitle: Bullfighting is a physical contest that involves a bullfighter attempting to subdue, immobilize, or kill a bull.
      chartTypes: []
      map:
        colorScale:
          baseColorScheme: OwidCategoricalC
          binningStrategy: manual
          customCategoryColors:
            Banned: "#759AC8"
            Not banned: "#AE2E3F"
            Partially banned: "#A46F49"
  # The step adds this view's category colors and labels from the data (see shared.py).
  - dimensions:
      metric: chick_culling_status
      animal: chickens
      estimate: not_applicable
      per_capita: total
    indicators:
      y:
        - catalogPath: chick_culling_laws#status
    config:
      title: Which countries have banned chick culling?
      subtitle: Chick culling is the routine killing of newly hatched male chicks, which cannot lay eggs and are of no commercial value to the egg industry.
      chartTypes: []
      map:
        colorScale:
          baseColorScheme: OwidCategoricalC
          binningStrategy: manual
  - dimensions:
      metric: caged_hens
      animal: chickens
      estimate: not_applicable
      per_capita: total
    indicators:
      y:
        - catalogPath: eggs_and_hens_statistics#number_of_hens_in_cages
          display:
            name: In cages
            color: "#883039"
            tolerance: 5
        - catalogPath: eggs_and_hens_statistics#number_of_hens_cage_free
          display:
            name: Cage-free
            color: "#5D7395"
            tolerance: 5
    config:
      title: Egg-laying hens in cages and cage-free systems
      subtitle: Cage-free housing systems include barns and free-range (non-organic and organic) farms. Cages can be conventional (battery cages) or enriched.
      note: Data may refer to different years for each country, due to limited data availability.
      hasMapTab: false
      chartTypes:
        - StackedDiscreteBar
      stackMode: absolute
      hideRelativeToggle: false
