grapher_schema: "011"

title:
  title: Chickens killed to produce eggs
  title_variant: ""
topic_tags:
  - Animal Welfare

default_selection:
  - World

default_dimensions:
  metric: total

definitions:
  common_views:
    - config:
        originUrl: ourworldindata.org/animal-welfare
        subtitle: Around half of the estimated total are hens, killed when their egg production declines. The other half are male chicks, which in most countries are killed within a day of hatching.
        note: Male embryos removed via in-ovo sexing are subtracted. Estimates assume hens are killed after 65 weeks of laying, as on commercial farms. In most of Africa and parts of Asia, traditional flocks keep hens longer, but FAOSTAT's hen numbers there are themselves estimates, so our figures are upper bounds.
        hasMapTab: true
        tab: map
        chartTypes: ["LineChart", "DiscreteBar"]
        yAxis:
          min: 0

dimensions:
  - slug: metric
    name: Metric
    choices:
      - slug: total
        name: Total
      - slug: per_capita
        name: Per person

views:
  - dimensions:
      metric: total
    indicators:
      y:
        - catalogPath: chickens_killed_for_eggs#chickens_killed
    config:
      title: Chickens killed to produce eggs
      map:
        colorScale:
          baseColorScheme: OrRd
          binningStrategy: manual
          # The leading 0 closes the bottom bracket, and the trailing 1 makes the top bracket open-ended.
          customNumericValues: [0, 1000000, 3000000, 10000000, 30000000, 100000000, 300000000, 1000000000, 1]

  - dimensions:
      metric: per_capita
    indicators:
      y:
        - catalogPath: chickens_killed_for_eggs#chickens_killed_per_capita
    config:
      title: Chickens killed to produce eggs per person
      map:
        colorScale:
          baseColorScheme: OrRd
          binningStrategy: manual
          # The leading 0 closes the bottom bracket, and the trailing 1 makes the top bracket open-ended.
          customNumericValues: [0, 0.5, 1, 1.5, 2, 2.5, 3, 4, 1]
