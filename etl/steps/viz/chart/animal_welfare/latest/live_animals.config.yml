grapher_schema: "012"

title:
  title: Live animals
  title_variant: ""
topic_tags:
  - Animal Welfare
default_selection:
  - World
  - United States
  - China
  - India
  - Brazil
  - United Kingdom
  - Spain
default_dimensions:
  metric: animals_alive
  animal: chickens
  per_capita: total

definitions:
  common_views:
    - config:
        originUrl: https://ourworldindata.org/animal-welfare
        entityType: country
        hasMapTab: true
        # Views of a single animal (the view of hens in cages has its own chart type).
        chartTypes: ["LineChart", "DiscreteBar", "SlopeChart"]
        hideRelativeToggle: false

# The step creates the views of live animals from the dimensions of the indicator.
dimensions:
  - slug: metric
    name: Metric
    presentation:
      type: dropdown
    choices:
      - slug: animals_alive
        name: Live animals
        description: Kept at a given moment, not counted over a year
      - slug: caged_hens
        name: Cage and cage-free hens
  - slug: animal
    name: Animal
    presentation:
      type: dropdown-with-search
    choices:
      - slug: buffaloes
        name: Buffaloes
      - slug: camels
        name: Camels
      - slug: cattle
        name: Cattle
      - slug: milk_cattle
        name: Cattle used for milk
      - slug: chickens
        name: Chickens
      - slug: donkeys
        name: Donkeys
      - slug: ducks
        name: Ducks
      - slug: geese
        name: Geese
      - slug: goats
        name: Goats
      - slug: horses
        name: Horses
      - slug: laying_hens
        name: Laying hens
      - slug: mules
        name: Mules
      - slug: other_camelids
        name: Other camelids
      - slug: other_rodents
        name: Other rodents
      - slug: pigs
        name: Pigs
      - slug: rabbits
        name: Rabbits
      - slug: sheep
        name: Sheep
      - slug: turkeys
        name: Turkeys
  - slug: per_capita
    name: Per capita
    presentation:
      type: toggle-buttons
    choices:
      - slug: total
        name: Total
      - slug: per_capita
        name: Per person

views:
  - dimensions:
      metric: caged_hens
      animal: chickens
      per_capita: total
      estimate: not_applicable
    indicators:
      y:
        - catalogPath: eggs_and_hens_statistics#number_of_hens_in_cages
          display:
            name: In cages
            color: "#883039"
            tolerance: 5
        - catalogPath: eggs_and_hens_statistics#number_of_hens_cage_free
          display:
            name: Cage-free
            color: "#5D7395"
            tolerance: 5
    config:
      title: Egg-laying hens in cages and cage-free systems
      subtitle: Cage-free housing systems include barns and free-range (non-organic and organic) farms. Cages can be conventional (battery cages) or enriched.
      note: Data may refer to different years for each country, due to limited data availability.
      hasMapTab: false
      chartTypes:
        - StackedDiscreteBar
      stackMode: absolute
      hideRelativeToggle: false
