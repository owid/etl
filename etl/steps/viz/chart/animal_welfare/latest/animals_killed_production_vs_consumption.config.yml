grapher_schema: "011"

title:
  title: Animals killed for food
topic_tags:
  - Animal Welfare
default_selection:
  - World
  - United States
  - China
  - India
  - Brazil
  - United Kingdom
  - Spain
default_dimensions:
  animal: land_animals
  per_capita: total

definitions:
  common_views:
    - config:
        hasMapTab: false
        tab: chart
        yAxis:
          min: 0

dimensions:
  - name: Animal
    slug: animal
    choices:
      - slug: land_animals
        name: All land animals
      - slug: cattle_and_buffaloes
        name: Cattle and buffaloes
      - slug: sheep_and_goats
        name: Sheep and goats
      - slug: pigs
        name: Pigs
      - slug: poultry
        name: Poultry
  - name: Metric
    slug: per_capita
    choices:
      - slug: total
        name: Total number
        description: Total number of animals killed each year
      - slug: per_capita
        name: Per person
        description: Number of animals killed each year, divided by the population

views:
  - dimensions:
      animal: land_animals
      per_capita: total
    indicators:
      y:
        - catalogPath: "animals_killed_for_domestic_consumption#land_animals_killed_in_country"
          display:
            name: Killed in the country
            color: "#B13507"
        - catalogPath: "animals_killed_for_domestic_consumption#land_animals_killed_for_domestic_supply"
          display:
            name: Killed for consumption
            color: "#286BBB"
    config:
      title: Land animals killed for food
  - dimensions:
      animal: land_animals
      per_capita: per_capita
    indicators:
      y:
        - catalogPath: "animals_killed_for_domestic_consumption#land_animals_killed_in_country_per_capita"
