# Air pollution data explorer, ported from the explorer step (viz://explorer/emissions/latest/air_pollution).
grapher_schema: "012"
slug: air-pollution
title:
  title: Air Pollution
presentation:
  page_type: data-explorer
  explorer_subtitle: Explore historical emissions of air pollutants across the world.
default_selection:
  - China
  - India
  - United Kingdom
  - United States
  - World
topic_tags:
  - Air Pollution

dimensions:
  - slug: pollutant
    name: Pollutant
    presentation:
      type: dropdown-with-search
    choices:
      - slug: all_pollutants
        name: All pollutants
      - slug: nh3
        name: Ammonia
      - slug: bc
        name: Black carbon
      - slug: co
        name: Carbon monoxide
      - slug: ch4
        name: Methane
      - slug: nox
        name: Nitrogen oxides
      - slug: n2o
        name: Nitrous oxide
      - slug: nmvoc
        name: Non-methane volatile organic compounds
      - slug: oc
        name: Organic carbon
      - slug: so2
        name: Sulfur dioxide
  - slug: sector
    name: Sector
    presentation:
      type: dropdown-with-search
    choices:
      - slug: all_sectors
        name: All sectors (total)
      - slug: breakdown_by_sector
        name: Breakdown by sector
      - slug: agriculture
        name: Agriculture
      - slug: buildings
        name: Buildings
      - slug: domestic_aviation
        name: Domestic aviation
      - slug: energy
        name: Energy
      - slug: industry
        name: Industry
      - slug: international_aviation
        name: International aviation
      - slug: international_shipping
        name: International shipping
      - slug: solvents
        name: Solvents
      - slug: transport
        name: Transport
      - slug: waste
        name: Waste
  - slug: per_capita
    name: Per capita
    presentation:
      type: toggle-buttons
    choices:
      - slug: total
        name: Total
      - slug: per_capita
        name: Per capita

views: []
