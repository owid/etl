# CO₂ and greenhouse gas emissions data explorer, ported from the explorer step (viz://explorer/emissions/latest/co2).
# The views are generated in co2.py from the column -> dimensions map in co2.dims.yaml.
grapher_schema: "012"
slug: co2
title:
  title: CO₂ and Greenhouse Gas Emissions
presentation:
  page_type: data-explorer
  explorer_subtitle: Explore data on greenhouse gas emissions.
default_selection:
  - China
  - United States
  - India
  - United Kingdom
  - World
topic_tags:
  - CO2 & Greenhouse Gas Emissions
dimensions:
  - slug: gas
    name: Gas or warming
    presentation:
      type: dropdown
    choices:
      - slug: co2
        name: CO₂
      - slug: all_ghg
        name: All GHGs (CO₂eq)
      - slug: methane
        name: Methane
      - slug: nitrous_oxide
        name: Nitrous oxide
      - slug: warming_impact
        name: Warming impact
  - slug: accounting
    name: Accounting
    presentation:
      type: toggle-buttons
    choices:
      - slug: territorial
        name: Territorial
      - slug: consumption_based
        name: Consumption-based
  - slug: fuel
    name: Fuel or land use change
    presentation:
      type: dropdown
    choices:
      - slug: all_fossil
        name: All fossil emissions
      - slug: land_use
        name: Land use change
      - slug: fossil_plus_land_use
        name: Fossil + land use change
      - slug: na
        name: ""
      - slug: coal
        name: Coal
      - slug: oil
        name: Oil
      - slug: fossil_gas
        name: Gas
      - slug: cement
        name: Cement
      - slug: flaring
        name: Flaring
  - slug: count
    name: Count
    presentation:
      type: dropdown
    choices:
      - slug: per_capita
        name: Per capita
      - slug: per_country
        name: Per country
      - slug: cumulative
        name: Cumulative
      - slug: per_kwh
        name: Per kWh of energy
      - slug: per_gdp
        name: Per $ of GDP
      - slug: share_embedded_in_trade
        name: Share of emissions embedded in trade
  - slug: relative_to_world
    name: Relative to world total
    presentation:
      type: toggle-buttons
    choices:
      - slug: total
        name: Total
      - slug: relative
        name: Relative to world total
views: []
