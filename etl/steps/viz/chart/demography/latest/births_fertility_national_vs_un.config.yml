grapher_schema: "012"
slug: births-fertility-national-vs-un

title:
  title: "Births and fertility rates: national statistics compared with UN estimates"
  title_variant: ""
topic_tags:
  - Fertility Rate
  - Population Growth

default_selection:
  - United States
  - Japan
  - Italy
  - Brazil
  - Mexico
  - Chile
  - Colombia
  - Kazakhstan
  - Egypt

default_dimensions:
  measure: births
  comparison: relative_difference

definitions:
  common_views:
    - config:
        originUrl: /fertility-rate
        chartTypes:
          - LineChart
        hasMapTab: false
        tab: chart
    - dimensions:
        comparison: lines
      config:
        selectedFacetStrategy: entity
        yAxis:
          min: 0
          facetDomain: independent
    - dimensions:
        comparison: relative_difference
      config:
        hasMapTab: true
        tab: map
        map:
          # Diverging scale centered on 0: red where the national figure is below the UN’s, blue where it is above.
          timeTolerance: 1
          toleranceStrategy: backwards
          colorScale:
            baseColorScheme: RdBu
            binningStrategy: equalSizeBins-normal
            midpoint: 0
            midpointMode: symmetric
            minValue: -20
            maxValue: 20

dimensions:
  - slug: measure
    name: Measure
    choices:
      - slug: births
        name: Births
      - slug: fertility_rate
        name: Fertility rate
  - slug: comparison
    name: Comparison
    choices:
      - slug: lines
        name: National statistics and UN estimates
      - slug: absolute_difference
        name: Difference
      - slug: relative_difference
        name: Relative difference (%)

# Significant figures shown in this chart: 3 for numbers of births, 2 for fertility rates and percentages.
views:
  - dimensions:
      measure: births
      comparison: lines
    indicators:
      y:
        - catalogPath: births_fertility_national_vs_un#births_national
          display:
            roundingMode: significantFigures
            numSignificantFigures: 3
            numDecimalPlaces: 0
            name: National statistics
        - catalogPath: births_fertility_national_vs_un#births_un
          display:
            roundingMode: significantFigures
            numSignificantFigures: 3
            numDecimalPlaces: 0
            name: UN estimates
    config:
      title: "Births: national statistics compared with UN estimates"
      subtitle: "Number of live births in the year, as published by each country’s statistics office, civil registry, or health ministry, and as estimated by the UN."
    metadata:
      presentation:
        title_public: "Births: national statistics compared with UN estimates"
        attribution_short: National statistics and UN WPP
      description_short: Number of live births in the year, as published by each country’s statistics office, civil registry, or health ministry, and as estimated by the UN.

  - dimensions:
      measure: births
      comparison: absolute_difference
    indicators:
      y:
        - catalogPath: births_fertility_national_vs_un#births_difference
          display:
            roundingMode: significantFigures
            numSignificantFigures: 3
            numDecimalPlaces: 0
    config:
      title: "Difference in births between national statistics and UN estimates"
      subtitle: "Number of live births published by national statistics, minus the number the UN estimates. A positive number means the national figure is higher."

  - dimensions:
      measure: births
      comparison: relative_difference
    indicators:
      y:
        - catalogPath: births_fertility_national_vs_un#births_relative_difference
          display:
            roundingMode: significantFigures
            numSignificantFigures: 2
            numDecimalPlaces: 2
    config:
      title: "Relative difference in births between national statistics and UN estimates"
      subtitle: "How far the number of live births published by national statistics is from the UN’s estimate, as a percentage of the UN’s figure. A positive number means the national figure is higher."

  - dimensions:
      measure: fertility_rate
      comparison: lines
    indicators:
      y:
        - catalogPath: births_fertility_national_vs_un#fertility_rate_national
          display:
            roundingMode: significantFigures
            numSignificantFigures: 2
            numDecimalPlaces: 2
            name: National statistics
        - catalogPath: births_fertility_national_vs_un#fertility_rate_un
          display:
            roundingMode: significantFigures
            numSignificantFigures: 2
            numDecimalPlaces: 2
            name: UN estimates
    config:
      title: "Fertility rate: national statistics compared with UN estimates"
      subtitle: "[Total fertility rate](#dod:fertility-rate), as published by each country’s statistics office, civil registry, or health ministry, and as estimated by the UN."
    metadata:
      presentation:
        title_public: "Fertility rate: national statistics compared with UN estimates"
        attribution_short: National statistics and UN WPP
      description_short: Total fertility rate, as published by each country’s statistics office, civil registry, or health ministry, and as estimated by the UN.

  - dimensions:
      measure: fertility_rate
      comparison: absolute_difference
    indicators:
      y:
        - catalogPath: births_fertility_national_vs_un#fertility_rate_difference
          display:
            roundingMode: significantFigures
            numSignificantFigures: 2
            numDecimalPlaces: 2
    config:
      title: "Difference in the fertility rate between national statistics and UN estimates"
      subtitle: "[Total fertility rate](#dod:fertility-rate) published by national statistics, minus the rate the UN estimates, in live births per woman. A positive number means the national figure is higher."
      hasMapTab: true
      map:
        timeTolerance: 1
        toleranceStrategy: backwards
        colorScale:
          baseColorScheme: RdBu
          binningStrategy: equalSizeBins-normal
          midpoint: 0
          midpointMode: symmetric
          minValue: -0.4
          maxValue: 0.4

  - dimensions:
      measure: fertility_rate
      comparison: relative_difference
    indicators:
      y:
        - catalogPath: births_fertility_national_vs_un#fertility_rate_relative_difference
          display:
            roundingMode: significantFigures
            numSignificantFigures: 2
            numDecimalPlaces: 2
    config:
      title: "Relative difference in the fertility rate between national statistics and UN estimates"
      subtitle: "How far the [total fertility rate](#dod:fertility-rate) published by national statistics is from the UN’s estimate, as a percentage of the UN’s figure. A positive number means the national figure is higher."
