grapher_schema: "012"

# Multidim shown as a data explorer, replacing the incomes-across-distribution-lis explorer. It keeps the
# explorer's views; the curated incomes_lis multidim (slug incomes-across-distribution-lis) is separate.
title:
  title: Incomes Across the Distribution - Luxembourg Income Study
  title_variant: ""
slug: incomes-across-distribution-lis-explorer
presentation:
  page_type: data-explorer
  explorer_subtitle: Explore Luxembourg Income Study data on the distribution of incomes.
topic_tags:
  - Unlisted
default_selection:
  - Brazil
  - Chile
  - China
  - France
  - South Africa
  - United States
default_dimensions:
  indicator: thr
  decile: "9"
  welfare_type: dhi
  period: year
  equivalence_scale: per capita

# originUrl is set on every view in the step.

dimensions:
  - name: Indicator
    slug: indicator
    choices:
      - slug: mean
        name: Mean income
      - slug: median
        name: Median income
      - slug: avg
        name: Mean income, by decile
      - slug: thr
        name: Decile thresholds
      - slug: share
        name: Decile shares
  - name: Decile
    slug: decile
    choices:
      - slug: "1"
        name: "1 (poorest)"
      - slug: "2"
        name: "2"
      - slug: "3"
        name: "3"
      - slug: "4"
        name: "4"
      - slug: "5"
        name: "5"
      - slug: "6"
        name: "6"
      - slug: "7"
        name: "7"
      - slug: "8"
        name: "8"
      - slug: "9"
        name: "9"
      - slug: "10"
        name: "10 (richest)"
      - slug: all
        name: All deciles
      - slug: nan
        name: Not applicable
  - name: Income measure
    slug: welfare_type
    choices:
      - slug: "dhi"
        name: "After tax"
      - slug: "mi"
        name: "Before tax"
      - slug: "after_vs_before_tax"
        name: "After vs. before tax"
  - name: Period
    slug: period
    choices:
      - slug: "day"
        name: "Day"
      - slug: "month"
        name: "Month"
      - slug: "year"
        name: "Year"
      - slug: "nan"
        name: Not applicable
  - name: Household size adjustment
    slug: equivalence_scale
    choices:
      - slug: "per capita"
        name: "Per capita"
        description: Each person, including children, is attributed an equal share of the total income received by all members of their household.
      - slug: "square root"
        name: "Equivalized"
        description: Income is adjusted for household size, since people sharing a household can split costs like rent and heating. LIS divides the total household income by the square root of the number of people in the household.

views: []
