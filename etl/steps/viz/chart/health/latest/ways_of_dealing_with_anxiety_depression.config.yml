grapher_schema: '011'
slug: ways-of-dealing-with-anxiety-depression
title:
  title: How do people deal with anxiety or depression?
topic_tags:
- Mental Health
default_selection:
- United Kingdom
- Italy
- Canada
- United States
- France
- South Korea
- India
- South Africa
- Brazil
- Indonesia
- China
- Uganda
- Bangladesh
default_dimensions:
  approach: took_prescribed_medication
definitions:
  common_views:
  - config:
      chartTypes:
      - DiscreteBar
      hasMapTab: true
      tab: map
      hideAnnotationFieldsInTitle:
        time: false
      originUrl: /mental-health
      yAxis:
        min: 0
    metadata:
      description_key:
      - Respondents were first asked whether they had 'felt so anxious or depressed that they could not continue their regular
        daily activities as they normally would for two weeks or longer'. Those who replied "yes" were then asked about different
        approaches to dealing with this anxiety or depression.
      - Answers from demographic groups with fewer than 100 participants were left out of this data.
      - This data comes from the Wellcome Global Monitor 2020, a survey that Wellcome ran with Gallup. It asked about views
        and experiences of mental health in 113 countries and territories.
