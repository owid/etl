grapher_schema: "012"

title:
  title: Minerals
  title_variant: ""
slug: minerals
presentation:
  page_type: data-explorer
  explorer_subtitle: Explore the production, reserves and value of minerals.

default_selection:
  - World
  - Australia
  - Chile
  - China
  - United States

topic_tags:
  - Metals & Minerals

definitions:
  common_views:
    - config:
        originUrl: https://ourworldindata.org/metals-minerals

default_dimensions:
  mineral: copper
  metric: production
  type: mine
  measure: absolute

dimensions:
  - slug: mineral
    name: Mineral
    choices: []

  - slug: metric
    name: Metric
    choices:
      - slug: production
        name: Production
        description: Annual production of the mineral
      - slug: reserves
        name: Reserves
        description: Estimated reserves of the mineral
      - slug: unit_value
        name: Unit value
        description: Price per tonne in constant 1998 US dollars

  - slug: type
    name: Type
    choices: []

  - slug: measure
    name: Measure
    presentation:
      type: toggle-buttons
    choices:
      - slug: absolute
        name: Absolute
        description: Total quantity
      - slug: share_of_global
        name: Share of global
        description: Share of global total as a percentage

views: []
