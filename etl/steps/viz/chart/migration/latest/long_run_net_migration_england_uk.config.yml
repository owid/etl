      title: "Net migration to England and the United Kingdom as a share of the population"
      subtitle: "Number of people moving to the country each year, minus the number leaving, as a share of its population. The orange line shows figures for England up to 1854; these estimates are reconstructed from church records. The red line shows figures for the UK from 1855; these are based on passenger counts, surveys, and administrative records."
