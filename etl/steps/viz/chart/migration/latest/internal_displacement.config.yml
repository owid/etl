grapher_schema: "011"

title:
  title: Internal displacement
  title_variant: ""
topic_tags:
  - Migration
  - War & Peace

default_selection:
  - World
  - Sudan
  - Democratic Republic of Congo
  - Ukraine
  - Syria

default_dimensions:
  cause: total
  metric: idps
  unit: total
  age: all_ages

definitions:
  common_views:
    - config:
        hasMapTab: true
        tab: map
        chartTypes: ["LineChart", "DiscreteBar"]

  description_key_stock: This chart shows the total number of internally displaced people living in a region at the end of the year.
  description_key_flow: This chart shows the total number of internal displacements that occurred during the year. A displacement occurs every time a person is forced to leave their home but remains within their country's borders.
  description_key_flow_addendum: One person can be displaced multiple times within a calendar year and is then counted multiple times in the data.
  description_key_conflict: Internal displacements triggered by conflict and violence include international armed conflict, non-international armed conflict, communal violence, crime-related violence, civilian-state violence and other forms of violence.
  description_key_disaster: |-
    Natural disasters in this context include, for example, hazards such as floods, droughts, landslides, storms – including cyclones and other storms –, wildfires and extreme temperatures as well as earthquakes, volcanic eruptions and landslides.
  description_key_idmc_criteria: A displaced person is included in this statistic if their displacement was forced/ involuntary, they have left their habitual residence and they have not crossed an international border.
  description_key_idmc_rounded: IDMC provides rounded numbers to reflect the inherent uncertainty in displacement data. Figures equal or lower than 100,000 are rounded to two significant digits while figures above 100,000 are rounded to the nearest thousand.
  description_key_child_displaced: This only includes internally displaced people who are children, under the age of 18.
  description_unicef_source: The data for internally displaced children (under 18) is published by [UNICEF](https://data.unicef.org/topic/child-migration-and-displacement/displacement/). They source their data from the Internal Displacement Monitoring Centre (IDMC).
  footnote_zero_idps: A value of 0 means that IDMC is not aware of any internally displaced people (IDPs) in that region at the time of reporting. It does not mean that IDMC has confirmed that there are no IDPs.
  footnote_zero_displacements: A value of 0 means that IDMC is not aware of any internal displacements in that region at the time of reporting. It does not mean that IDMC has confirmed that there are no displacements.
  footnote_return_calendar_year: The UNHCR only includes IDPs who returned during this calendar year in their statistics.

dimensions:
  - slug: cause
    name: Cause
    choices:
      - slug: total
        name: All causes
        description: All internal displacements, whether caused by conflict and violence or by disasters.
      - slug: conflict
        name: Conflict and violence
      - slug: disaster
        name: Disasters
  - slug: metric
    name: Metric
    choices:
      - slug: idps
        name: People living in displacement
        description: The total number of people living in internal displacement at the end of the year.
      - slug: displacements
        name: New displacements during the year
        description: The number of new displacements recorded during the year. People can get displaced multiple times in a year and get counted multiple times in this metric.
      - slug: returned
        name: People who returned after displacement
        description: The number of internally displaced persons who have returned to their area of origin during the year.
    presentation:
      type: radio
  - slug: unit
    name: Unit
    choices:
      - slug: total
        name: Total number
      - slug: per_capita
        name: Per capita
    presentation:
      type: radio
  - slug: age
    name: Age
    choices:
      - slug: all_ages
        name: All ages
      - slug: under_18
        name: Under 18
    presentation:
      type: radio

