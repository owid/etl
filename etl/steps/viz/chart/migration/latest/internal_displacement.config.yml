  # All causes
  - dimensions:
      cause: total
      metric: idps
      unit: total
      age: all_ages
    indicators:
      y:
        - catalogPath: internal_displacement#total_displacement_rounded
    config:
      note: "{definitions.footnote_zero_idps}"
      map:
        colorScale:
          baseColorScheme: OrRd
          binningStrategy: manual
          customNumericValues: [0, 3000, 10000, 30000, 100000, 300000, 1000000, 3000000, 10000000]
          minValue: 1640
    metadata:
      description_key:
        - "{definitions.description_key_stock}"
        - "{definitions.description_key_idmc_criteria}"
        - "{definitions.description_key_idmc_rounded}"

  - dimensions:
