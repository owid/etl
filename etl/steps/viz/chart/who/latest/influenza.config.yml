grapher_schema: "012"

title:
  title: Influenza
  title_variant: ""
slug: influenza
presentation:
  page_type: data-explorer
  explorer_subtitle: Explore global data produced by the World Health Organization on influenza symptoms and cases.
topic_tags:
  - Influenza
default_selection:
  - Northern Hemisphere
  - Southern Hemisphere
default_dimensions:
  confirmed_cases_or_symptoms: confirmed_cases
  metric: share_of_positive_tests__pct
  interval: monthly
  surveillance_type: all_types

definitions:
  common_views:
    - config:
        chartTypes:
          - LineChart
          - DiscreteBar
        hasMapTab: true
        yAxis:
          min: 0
        timelineMinTime: -4043
    - dimensions:
        metric: share_of_positive_tests__pct
      config:
        note: |-
          The share of positive tests is calculated by dividing the number of tests that were positive to any flu strain by three possible denominators, based on data availability. If both values are available then the denominator is the sum of positive and negative tests; if not then the number specimens processed is used; if neither of those are available then the number of specimens received by the testing facility is used.
        map:
          colorScale:
            baseColorScheme: YlOrRd
            binningStrategy: manual
            customNumericValues:
              - 0
              - 5
              - 10
              - 15
              - 20
              - 25
              - 30
              - 35
              - 40
              - 45
              - 50
    # Breakdowns by strain: stacked areas, one facet per country, no map.
    - dimensions:
        metric: confirmed_cases__by_strain
      config:
        chartTypes:
          - StackedArea
        hasMapTab: false
        selectedFacetStrategy: entity
        yAxis:
          min: 0
          facetDomain: independent
    # Side-by-side comparisons: one facet per indicator, no map.
    - dimensions:
        surveillance_type: compare_types
      config:
        hasMapTab: false
        selectedFacetStrategy: metric
        yAxis:
          min: 0
          facetDomain: independent
    - dimensions:
        metric: comparison_of_data_on_respiratory_infections
      config:
        hasMapTab: false
        selectedFacetStrategy: metric
        yAxis:
          min: 0
          facetDomain: independent

# The explorer's "Confirmed cases (by surveillance type)" metric had a blank surveillance type; it is
# the "Compare surveillance types" choice of "All influenza strains" here. Data on symptoms (FluID)
# is not split by surveillance type, so those views sit under "All types". No choice is blank.
dimensions:
  - slug: confirmed_cases_or_symptoms
    name: Confirmed cases or symptoms
    presentation:
      type: toggle-buttons
    choices:
      - slug: confirmed_cases
        name: Confirmed cases
        description: Cases confirmed by laboratory tests, from the WHO's FluNet database.
      - slug: symptoms
        name: Symptoms
        description: Reported cases of respiratory illnesses, from the WHO's FluID database.
  - slug: metric
    name: Metric
    presentation:
      type: dropdown
    choices:
      - slug: share_of_positive_tests__pct
        name: Share of positive tests (%)
      - slug: confirmed_cases__by_strain
        name: Confirmed cases (by strain)
      - slug: all_influenza_strains
        name: All influenza strains
      - slug: comparison_of_data_on_respiratory_infections
        name: Comparison of data on respiratory infections
      - slug: influenza_like_illnesses
        name: Influenza-like illnesses
        description: Acute respiratory infections with a fever of 38°C or more and a cough, with onset within the last 10 days.
      - slug: acute_respiratory_infections
        name: Acute respiratory infections
        description: Sudden onset of a cough, sore throat, shortness of breath or runny nose, judged by a clinician to be due to an infection.
      - slug: severe_acute_respiratory_infections
        name: Severe acute respiratory infections
        description: Acute respiratory infections with a fever of 38°C or more and a cough, with onset within the last 10 days, that require hospitalization.
      - slug: all_influenza_a
        name: All influenza A
      - slug: influenza_a_h1n12009
        name: Influenza A H1N1 (2009 pandemic strain)
      - slug: influenza_a_h1
        name: Influenza A H1
      - slug: influenza_a_h3
        name: Influenza A H3
      - slug: influenza_a_h5
        name: Influenza A H5
      - slug: influenza_a_h7n9
        name: Influenza A H7N9
      - slug: influenza_a__unknown_subtype
        name: Influenza A (unknown subtype)
      - slug: all_influenza_b
        name: All influenza B
      - slug: influenza_b_victoria
        name: Influenza B Victoria
      - slug: influenza_b_yamagata
        name: Influenza B Yamagata
      - slug: influenza_b__unknown_lineage
        name: Influenza B (unknown lineage)
  - slug: interval
    name: Interval
    presentation:
      type: toggle-buttons
    choices:
      - slug: weekly
        name: Weekly
      - slug: monthly
        name: Monthly
  - slug: surveillance_type
    name: Surveillance type
    presentation:
      type: dropdown
    choices:
      - slug: all_types
        name: All types
        description: Sentinel, non-sentinel and unclassified surveillance together.
      - slug: sentinel_surveillance
        name: Sentinel surveillance
        description: Routine testing at health centers selected to represent the country's population.
      - slug: non_sentinel_surveillance
        name: Non-sentinel surveillance
        description: Other testing, such as outbreak investigations, universal testing and testing at the point of care.
      - slug: compare_types
        name: Compare surveillance types
        description: All types, sentinel and non-sentinel surveillance shown side by side.

