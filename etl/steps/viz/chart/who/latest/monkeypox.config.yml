# Mpox data explorer, ported from the explorer step (viz://explorer/who/latest/monkeypox).
grapher_schema: "012"
slug: monkeypox
title:
  title: Mpox
presentation:
  page_type: data-explorer
  explorer_subtitle: Explore the data produced by the World Health Organization and Africa CDC on mpox (monkeypox).
default_selection:
  - Democratic Republic of Congo
  - Burundi
  - Uganda
  - Central African Republic
topic_tags:
  - Mpox (monkeypox)
definitions:
  common_views:
    - config:
        hasMapTab: true
        yAxis:
          min: 0
          canChangeScaleType: true
    - dimensions:
        metric: confirmed_deaths
      config:
        subtitle: Laboratory testing for mpox is limited in many countries and figures shown here only include deaths where mpox has been laboratory-confirmed.
        note: |-
          The WHO defines an mpox death as any death of a person with probable or confirmed mpox unless the death is attributed to trauma.
    - dimensions:
        metric: confirmed_cases
      config:
        subtitle: Laboratory testing for mpox is limited in many countries and figures shown here only include laboratory-confirmed cases.
dimensions:
  - slug: metric
    name: Metric
    choices:
      - slug: confirmed_cases
        name: Confirmed cases
      - slug: confirmed_and_suspected_cases
        name: Confirmed and suspected cases
      - slug: confirmed_deaths
        name: Confirmed deaths
    presentation:
      type: dropdown
  - slug: frequency
    name: Frequency
    choices:
      - slug: _7_day_average
        name: 7-day average
      - slug: cumulative
        name: Cumulative
      - slug: daily
        name: Daily
    presentation:
      type: dropdown
  - slug: scale
    name: Relative to population
    choices:
      - slug: absolute
        name: Total population
      - slug: relative_to_population
        name: Relative to population
    presentation:
      type: toggle-buttons
views:
- dimensions:
    metric: confirmed_cases
    frequency: _7_day_average
    scale: absolute
  indicators:
    y:
    - catalogPath: monkeypox#new_cases_smoothed
      display:
        name: Daily cases
        tolerance: 7
  config:
    title: 'Mpox: Daily confirmed cases'
    subtitle: |-
      7-day rolling average. Laboratory testing for mpox is limited in many countries and figures shown here only include laboratory-confirmed cases.
    chartTypes:
    - LineChart
    - DiscreteBar
    tab: map
    map:
      colorScale:
        baseColorScheme: OrRd
        binningStrategy: manual
        customNumericValues:
        - 0
        - 1
        - 2
        - 5
        - 10
        - 20
        - 50
        - 100
        - 200
        - 500
        - 1000
- dimensions:
    metric: confirmed_cases
    frequency: cumulative
    scale: absolute
  indicators:
    y:
    - catalogPath: monkeypox#total_cases
      display:
        name: Total confirmed cases
        tolerance: 30
  config:
    title: 'Mpox: Cumulative confirmed cases'
    note: |-
      2,985 cases for the Democratic Republic of the Congo were reported without a date and are not included in this chart.
    chartTypes:
    - LineChart
    - DiscreteBar
    map:
      colorScale:
        baseColorScheme: OrRd
        binningStrategy: manual
        customNumericValues:
        - 0
        - 100
        - 200
        - 500
        - 1000
        - 2000
        - 5000
        - 10000
        - 20000
        - 50000
- dimensions:
    metric: confirmed_cases
    frequency: daily
    scale: absolute
  indicators:
    y:
    - catalogPath: monkeypox#new_cases
      display:
        name: Daily cases
  config:
    title: 'Mpox: Daily confirmed cases'
    chartTypes:
    - StackedBar
    map:
      colorScale:
        baseColorScheme: OrRd
        binningStrategy: manual
        customNumericValues:
        - 0
        - 1
        - 2
        - 5
        - 10
        - 20
        - 50
        - 100
        - 200
        - 500
        - 1000
- dimensions:
    metric: confirmed_cases
    frequency: cumulative
    scale: relative_to_population
  indicators:
