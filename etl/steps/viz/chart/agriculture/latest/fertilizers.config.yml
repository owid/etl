grapher_schema: "012"

title:
  title: Fertilizers
  title_variant: ""
slug: fertilizers
presentation:
  page_type: data-explorer
  explorer_subtitle: Explore the use and impact of fertilizers across the world.
topic_tags:
  - Fertilizers
default_selection:
  - United States
  - China
  - Egypt
  - India
  - France
  - Brazil

definitions:
  common_views:
    - config:
        originUrl: https://ourworldindata.org/fertilizers

# Chart text (titles, subtitles, notes, map colors) comes from each indicator's garden metadata.
# The explorer's "Share of world total" checkbox only applied to excess totals, so it is a Metric
# choice here and no choice is blank.
dimensions:
  - slug: input
    name: Input
    presentation:
      type: toggle-buttons
    choices:
      - slug: synthetic
        name: Synthetic fertilizer
      - slug: total
        name: Total nutrients
  - slug: nutrient
    name: Nutrient
    presentation:
      type: toggle-buttons
    choices:
      - slug: nitrogen
        name: Nitrogen
      - slug: phosphorous
        name: Phosphorous
      - slug: potassium
        name: Potassium
      - slug: all_nutrients
        name: All nutrients
  - slug: metric
    name: Metric
    presentation:
      type: dropdown
    choices:
      - slug: applied_per_ha
        name: Applied (per hectare)
      - slug: applied_total
        name: Applied (total)
      - slug: excess_total
        name: Excess (total)
      - slug: excess_share
        name: Excess (share of world total)
      - slug: excess_per_ha
        name: Excess (per hectare)
      - slug: nue
        name: Nutrient use efficiency
        description: The share of nitrogen inputs that ends up in harvested crops.

views:
  - dimensions:
      input: synthetic
      nutrient: nitrogen
      metric: applied_per_ha
    indicators:
      y:
        - catalogPath: faostat_rfn_flat#nutrient_nitrogen_n__total__00003102__use_per_area_of_cropland__005159__kilograms_per_hectare
  - dimensions:
      input: synthetic
      nutrient: phosphorous
      metric: applied_per_ha
    indicators:
      y:
        - catalogPath: faostat_rfn_flat#nutrient_phosphate_p2o5__total__00003103__use_per_area_of_cropland__005159__kilograms_per_hectare
  - dimensions:
      input: synthetic
      nutrient: potassium
      metric: applied_per_ha
    indicators:
      y:
        - catalogPath: faostat_rfn_flat#nutrient_potash_k2o__total__00003104__use_per_area_of_cropland__005159__kilograms_per_hectare
  - dimensions:
      input: synthetic
      nutrient: all_nutrients
      metric: applied_per_ha
    indicators:
      y:
        - catalogPath: fertilizers#all_fertilizers_per_cropland
  - dimensions:
