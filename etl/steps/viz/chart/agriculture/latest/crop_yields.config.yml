# Ported from the crop-yields explorer (viz://explorer/agriculture/latest/crop_yields).
# The explorer set map bins on each indicator's display; a multidim's display follows the grapher
# schema, so each view carries them as map.colorScale instead.
grapher_schema: "012"
title:
  title: Crop Yields
  title_variant: ""
slug: crop-yields
presentation:
  page_type: data-explorer
  explorer_subtitle: Explore crop yields across the world.
topic_tags:
  - Crop Yields
default_selection:
  - Austria
  - Brazil
  - Bulgaria
  - Hungary
  - Italy
  - Netherlands
  - Romania
  - Russia
  - United Kingdom
  - United States
default_dimensions:
  crop: wheat
  metric: actual_yield
definitions:
  common_views:
    - config:
        originUrl: https://ourworldindata.org/crop-yields
        hasMapTab: true
        # The explorer hid the time span and entity from its titles.
        hideAnnotationFieldsInTitle:
          entity: true
          time: true
          changeInPrefix: true
        yAxis:
          min: 0
    - dimensions:
        metric: attainable_yield
      config:
        chartTypes:
          - DiscreteBar
        note: Attainable yields are based on assessments for the year 2000. Real attainable yield pre-2000 may be lower; and post-2000 may be higher than these values.
    - dimensions:
        metric: yield_gap
      config:
        chartTypes:
          - LineChart
          - DiscreteBar
        note: Attainable yields are based on assessments for the year 2000. Real attainable yield pre-2000 may be lower; and post-2000 may be higher than these values.
