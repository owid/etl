grapher_schema: "012"
title:
  title: Water, Sanitation and Hygiene (WASH)
  title_variant: ''
slug: water-and-sanitation
presentation:
  page_type: data-explorer
  explorer_subtitle: Explore global data on water, sanitation and hygiene access.
topic_tags:
  - Clean Water & Sanitation
default_selection:
  - India
  - United States
  - Kenya
  - World
  - Bangladesh
  - South Africa
  - China
definitions:
  common_views:
    - config:
        tab: map
        chartTypes:
          - LineChart
          - DiscreteBar
        hasMapTab: true
        timeTolerance: 10
        yAxis:
          min: 0
# Titles and subtitles come from each indicator's garden metadata, and the map bins of
# percentage views are set in water_and_sanitation.py, as the explorer did.
dimensions:
  - slug: resource
    name: Resource
    choices:
      - slug: drinking_water
        name: Drinking water
      - slug: sanitation
        name: Sanitation
      - slug: handwashing_facilities
        name: Handwashing facilities
    presentation:
      type: toggle-buttons
  - slug: level_of_use_access
    name: Level of Use/Access
    choices:
      - slug: safely_managed
        name: Safely managed
        description: The highest level of service. Drinking water from an improved source on premises, available when needed and free from contamination; or improved sanitation not shared with other households, with excreta safely disposed of.
      - slug: basic
        name: Basic
        description: Drinking water from an improved source within a 30-minute round trip; improved sanitation not shared with other households; or a handwashing facility at home with soap and water.
      - slug: limited
        name: Limited
        description: Drinking water from an improved source more than a 30-minute round trip away; improved sanitation shared with other households; or a handwashing facility at home without soap or water.
      - slug: unimproved
        name: Unimproved
        description: Drinking water from an unprotected dug well or spring; or pit latrines without a slab, hanging latrines or bucket latrines.
      - slug: no_facilities
        name: No facilities
        description: Drinking water taken directly from rivers, lakes, ponds or other surface water; open defecation; or no handwashing facility at home.
      - slug: improved
        name: Improved
        description: Sources and facilities that can deliver safe water or that separate excreta from human contact, whatever the collection time and whether or not they are shared.
    presentation:
      type: dropdown
  - slug: residence
    name: Residence
    choices:
      - slug: total
        name: Total
      - slug: urban
        name: Urban
      - slug: rural
        name: Rural
    presentation:
      type: toggle-buttons
  - slug: relative_to_population
    name: Relative to population
    choices:
      - slug: share_of_population
        name: Share of population
      - slug: number_of_people
        name: Number of people
    presentation:
      type: toggle-buttons
views:
  - dimensions:
      resource: drinking_water
      residence: total
      level_of_use_access: safely_managed
      relative_to_population: share_of_population
    indicators:
      y:
        - catalogPath: household#wat_sm__residence_total
          display:
            name: Usage of safely managed drinking water services
            type: Numeric
            unit: '%'
            shortUnit: '%'
            additionalInfo: |-
              Safely managed drinking water is water from an improved water source which is located on premises, available when needed and free from contamination.\nImproved drinking water sources are those that have the potential to deliver safe water. They include piped water, boreholes or tubewells, protected dug wells, protected springs, rainwater, and packaged or delivered water.
            colorScaleScheme: YlGnBu
            colorScaleNumericBins: 20,,;40,,;60,,;80,,;100
  - dimensions:
      resource: drinking_water
      residence: total
      level_of_use_access: basic
      relative_to_population: share_of_population
    indicators:
