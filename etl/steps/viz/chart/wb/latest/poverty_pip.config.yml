grapher_schema: "011"

title:
  title: Poverty indicators
  title_variant: World Bank
slug: poverty-wb
topic_tags:
  - Poverty

default_selection:
  - Mozambique
  - Zambia
  - Kenya
  - Nigeria
  - Bangladesh
  - Bolivia
  - Romania
  - Indonesia

default_dimensions:
  indicator: headcount_ratio
  poverty_line: "300"
  survey_comparability: No spells

definitions:
  common_views:
    - config:
        originUrl: ourworldindata.org/poverty

  # Colors of the bands between poverty lines, from the poorest to the richest:
  color_0_to_300: &color_0_to_300 "#D7191C"
  color_300_to_420: &color_300_to_420 "#FDAE61"
  color_420_to_830: &color_420_to_830 "#FFFFBF"
  color_830_to_1000: &color_830_to_1000 "#ABD9E9"
  color_1000_to_inf: &color_1000_to_inf "#2C7BB6"

  ppp_adjustment_subtitle: This data is adjusted for inflation and differences in living costs between countries.

  # Copied from `note_ppp` in the garden metadata of world_bank_pip (the note of the consolidated series).
  # Keep in sync: when that text changes, update this copy too.
  note: Expressed in [international-$](#dod:int_dollar_abbreviation) at 2021 prices. Depending on the country and year, it relates to income (after taxes and benefits) or to consumption, [per capita](#dod:per-capita). Country series contain breaks in comparability.

dimensions:
  - name: Indicator
    slug: indicator
    choices:
      - slug: headcount_ratio
        name: Share in poverty
        description: The share of the population living below the selected poverty line
      - slug: headcount
        name: Number in poverty
        description: The number of people living below the selected poverty line
  - name: Poverty line
    slug: poverty_line
    description: In international dollars, adjusted for inflation and differences in living costs between countries.
    choices:
      - slug: "100"
        name: $1 a day
        group: Individual poverty lines
      - slug: "300"
        name: $3 a day
        description: The International Poverty Line set by the World Bank to measure extreme poverty
        group: Individual poverty lines
      - slug: "420"
        name: $4.20 a day
        description: Set by the World Bank to reflect national definitions in lower-middle-income countries
        group: Individual poverty lines
      - slug: "830"
        name: $8.30 a day
        description: Set by the World Bank to reflect national definitions in upper-middle-income countries
        group: Individual poverty lines
      - slug: "1000"
        name: $10 a day
        description: Around $300 per month
        group: Individual poverty lines
      - slug: "2000"
        name: $20 a day
        description: Around $600 per month
        group: Individual poverty lines
      - slug: "3000"
        name: $30 a day
        description: Around $900 per month
        group: Individual poverty lines
      - slug: "4000"
        name: $40 a day
        description: Around $1,200 per month
        group: Individual poverty lines

      - slug: multiple_lines
        name: Several poverty lines
        description: See how poverty has changed over time using four different poverty lines
        group: Compare poverty lines
      - slug: distribution
        name: Distribution between poverty lines
        description: See how the distribution of incomes has changed over time, or compare it between countries
        group: Compare poverty lines
  - name: Breaks in data
    slug: survey_comparability
    description: The data provider reports where trends in countries are affected by changes in methodology. These breaks can be shown in the chart.
    choices:
      - slug: No spells
        name: Don't show
        description: Better for making broad comparisons across several countries
      - slug: Spells
        name: Show
        description: Better for understanding trends within individual countries

# The views of the individual poverty lines are generated from the table in the .py.
# The views below combine several indicators, so each sets the text of its data page in `metadata`: the page would
# otherwise show only the text of the first indicator. Their `description_key` is built in the .py from the
# indicators' own key information.
# NOTE: Update the catalog paths when the poverty lines or the PPP version change.
views:
  # SHARE IN POVERTY - SEVERAL POVERTY LINES
  - dimensions:
      indicator: headcount_ratio
      poverty_line: multiple_lines
      table: Income or consumption consolidated
      survey_comparability: No spells
    indicators:
      y:
        - catalogPath: poverty#headcount_ratio__ppp_version_2021__poverty_line_300__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
          display:
            name: "Below $3 a day"
        - catalogPath: poverty#headcount_ratio__ppp_version_2021__poverty_line_420__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
          display:
            name: "Below $4.20 a day"
        - catalogPath: poverty#headcount_ratio__ppp_version_2021__poverty_line_830__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
          display:
            name: "Below $8.30 a day"
        - catalogPath: poverty#headcount_ratio__ppp_version_2021__poverty_line_3000__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
          display:
            name: "Below $30 a day"
    config:
      title: Share of population living below a range of poverty lines
      subtitle: "{definitions.ppp_adjustment_subtitle}"
      note: "{definitions.note}"
      hasMapTab: false
      tab: chart
      chartTypes: ["LineChart"]
      selectedFacetStrategy: entity
      yAxis:
        max: 100
    metadata:
      presentation:
        title_public: Share of population living below a range of poverty lines
      description_short: "Percentage of population living in households with an income or consumption below each of four poverty lines: $3, $4.20, $8.30, and $30 per day."

  # SHARE IN POVERTY - DISTRIBUTION BETWEEN POVERTY LINES
  - dimensions:
      indicator: headcount_ratio
      poverty_line: distribution
      table: Income or consumption consolidated
      survey_comparability: No spells
    indicators:
      y:
        - catalogPath: poverty#headcount_ratio_above__ppp_version_2021__poverty_line_1000__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
          display:
            name: "Above $10 a day"
            color: *color_1000_to_inf
        - catalogPath: poverty#headcount_ratio_between__ppp_version_2021__poverty_line_830_and_1000__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
          display:
            name: "$8.30–$10 a day"
            color: *color_830_to_1000
        - catalogPath: poverty#headcount_ratio_between__ppp_version_2021__poverty_line_420_and_830__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
          display:
            name: "$4.20–$8.30 a day"
            color: *color_420_to_830
        - catalogPath: poverty#headcount_ratio_between__ppp_version_2021__poverty_line_300_and_420__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
          display:
            name: "$3–$4.20 a day"
            color: *color_300_to_420
        - catalogPath: poverty#headcount_ratio__ppp_version_2021__poverty_line_300__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
          display:
            name: "Below $3 a day"
            color: *color_0_to_300
    config:
      title: Distribution of population between different poverty lines
      subtitle: "{definitions.ppp_adjustment_subtitle}"
      note: "{definitions.note}"
      hasMapTab: false
      tab: chart
      chartTypes: ["StackedArea", "StackedDiscreteBar"]
      selectedFacetStrategy: entity
      baseColorScheme: RdYlBu
      hideRelativeToggle: true
      stackMode: absolute
      hideTotalValueLabel: true
      sortBy: column
      sortColumnSlug: poverty#headcount_ratio__ppp_version_2021__poverty_line_300__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
      yAxis:
        facetDomain: independent
    metadata:
      presentation:
        title_public: Distribution of population between different poverty lines
      description_short: "Percentage of population living in households with an income or consumption in each of five bands: below $3, $3–$4.20, $4.20–$8.30, $8.30–$10, and above $10 per day."

  # NUMBER IN POVERTY - SEVERAL POVERTY LINES
  - dimensions:
      indicator: headcount
      poverty_line: multiple_lines
      table: Income or consumption consolidated
      survey_comparability: No spells
    indicators:
      y:
        - catalogPath: poverty#headcount__ppp_version_2021__poverty_line_300__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
          display:
            name: "Below $3 a day"
        - catalogPath: poverty#headcount__ppp_version_2021__poverty_line_420__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
          display:
            name: "Below $4.20 a day"
        - catalogPath: poverty#headcount__ppp_version_2021__poverty_line_830__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
          display:
            name: "Below $8.30 a day"
        - catalogPath: poverty#headcount__ppp_version_2021__poverty_line_3000__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
          display:
            name: "Below $30 a day"
    config:
      title: Number of people living below a range of poverty lines
      subtitle: "{definitions.ppp_adjustment_subtitle}"
      note: "{definitions.note}"
      hasMapTab: false
      tab: chart
      chartTypes: ["LineChart"]
      selectedFacetStrategy: entity
    metadata:
      presentation:
        title_public: Number of people living below a range of poverty lines
      description_short: "Number of people living in households with an income or consumption below each of four poverty lines: $3, $4.20, $8.30, and $30 per day."

  # NUMBER IN POVERTY - DISTRIBUTION BETWEEN POVERTY LINES
  - dimensions:
      indicator: headcount
      poverty_line: distribution
      table: Income or consumption consolidated
      survey_comparability: No spells
    indicators:
      y:
        - catalogPath: poverty#headcount_above__ppp_version_2021__poverty_line_1000__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
          display:
            name: "Above $10 a day"
            color: *color_1000_to_inf
        - catalogPath: poverty#headcount_between__ppp_version_2021__poverty_line_830_and_1000__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
          display:
            name: "$8.30–$10 a day"
            color: *color_830_to_1000
        - catalogPath: poverty#headcount_between__ppp_version_2021__poverty_line_420_and_830__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
          display:
            name: "$4.20–$8.30 a day"
            color: *color_420_to_830
        - catalogPath: poverty#headcount_between__ppp_version_2021__poverty_line_300_and_420__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
          display:
            name: "$3–$4.20 a day"
            color: *color_300_to_420
        - catalogPath: poverty#headcount__ppp_version_2021__poverty_line_300__welfare_type_income_or_consumption__table_income_or_consumption_consolidated__survey_comparability_no_spells
          display:
            name: "Below $3 a day"
            color: *color_0_to_300
    config:
      title: Number of people between different poverty lines
      subtitle: "{definitions.ppp_adjustment_subtitle}"
      note: "{definitions.note}"
      hasMapTab: false
      tab: chart
      chartTypes: ["StackedArea", "StackedDiscreteBar"]
      selectedFacetStrategy: entity
      baseColorScheme: RdYlBu
      hideRelativeToggle: false
      stackMode: absolute
      hideTotalValueLabel: false
      sortBy: total
      yAxis:
        facetDomain: independent
    metadata:
      presentation:
        title_public: Number of people between different poverty lines
      description_short: "Number of people living in households with an income or consumption in each of five bands: below $3, $3–$4.20, $4.20–$8.30, $8.30–$10, and above $10 per day."
