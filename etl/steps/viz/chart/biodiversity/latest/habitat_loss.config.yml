# Species habitat availability, shown as a data explorer (replaces the habitat-loss explorer).
grapher_schema: "012"

title:
  title: Species Habitat Availability
  title_variant: ''
slug: habitat-loss
presentation:
  page_type: data-explorer
  explorer_subtitle: Explore future projections of species' habitats under different agricultural interventions.
topic_tags:
  - Environmental Impacts of Food Production
default_selection:
  - World
  - Sub-Saharan Africa
  - South and East Asia
  - Europe
  - North America
  - Latin America
  - North Africa
  - Oceania
definitions:
  common_views:
    - config:
        chartTypes:
          - DiscreteBar
        hasMapTab: true
        tab: map
        baseColorScheme: owid-distinct
        # The explorer hides the time span and entity in its titles.
        hideAnnotationFieldsInTitle:
          entity: true
          time: true
          changeInPrefix: true
    # Map color scales, from the explorer's colorScaleScheme and colorScaleNumericBins
    # (the first value is the minimum of the first bin).
    - dimensions:
        projected_change_by_2050: species_habitat_loss
      config:
        map:
          colorScale:
            baseColorScheme: YlOrRd
            colorSchemeInvert: true
            binningStrategy: manual
            customNumericValues:
              - -20
              - -15
              - -10
              - -5
              - 0
              - 5
    - dimensions:
        projected_change_by_2050: cropland_area
      config:
        map:
          colorScale:
            baseColorScheme: RdYlBu
            colorSchemeInvert: true
            binningStrategy: manual
            customNumericValues:
              - -250
              - -100
              - -75
              - -50
              - -25
              - 0
              - 25
              - 50
              - 75
              - 100
              - 250
dimensions:
  - slug: scenario
    name: Scenario
    choices:
      - slug: business_as_usual
        name: Business-as-usual
      - slug: combined_interventions
        name: Combined interventions
      - slug: adoption_of_healthy_diets
        name: Adoption of healthy diets
      - slug: halve_food_waste
        name: Halve food waste
      - slug: close_yield_gaps
        name: Close yield gaps
      - slug: optimise_trade
        name: Optimise trade
    presentation:
      type: dropdown
  - slug: species_group
    name: Species Group
    choices:
      - slug: all_vertebrates
        name: All vertebrates
      - slug: mammals
        name: Mammals
      - slug: birds
        name: Birds
      - slug: amphibians
        name: Amphibians
      - slug: na
        name: ''
    presentation:
      type: toggle-buttons
  - slug: projected_change_by_2050
    name: Projected change by 2050
    choices:
      - slug: species_habitat_loss
        name: Species habitat loss
      - slug: cropland_area
        name: Cropland area
    presentation:
      type: toggle-buttons
views:
  - dimensions:
      scenario: business_as_usual
      species_group: all_vertebrates
      projected_change_by_2050: species_habitat_loss
    indicators:
      y:
        - catalogPath: habitat_loss#bau_habitat_loss_all
          display:
            name: Business-as-usual (All)
            unit: '%'
            shortUnit: '%'
    config:
      title: 'Projected habitat loss for all species in 2050: Business-as-usual'
      subtitle: Projected habitat loss for mammal, bird and amphibian species by 2050 under a business-as-usual scenario. This assumes population growth from UN medium projections; crop yield increases in line with historical rates of improvement; and dietary changes in line with projected rises in income.
  - dimensions:
      scenario: combined_interventions
      species_group: all_vertebrates
      projected_change_by_2050: species_habitat_loss
    indicators:
      y:
        - catalogPath: habitat_loss#combined_habitat_loss_all
          display:
            name: Combined (All)
            unit: '%'
            shortUnit: '%'
    config:
      title: 'Projected habitat loss for all species in 2050: Combined interventions'
      subtitle: 'Projected habitat loss for mammal, bird and amphibian species by 2050 if all approaches are combined: (1) closing yield gaps; (2) halving food waste; (3) global adoption of healthy diets in line with nutritional requirements; and (4) the optimization of agricultural production to avoid the most at-risk locations for habitat loss.'
  - dimensions:
      scenario: adoption_of_healthy_diets
      species_group: all_vertebrates
      projected_change_by_2050: species_habitat_loss
    indicators:
      y:
        - catalogPath: habitat_loss#diets_habitat_loss_all
          display:
            name: Diets (All)
            unit: '%'
            shortUnit: '%'
    config:
      title: 'Projected habitat loss for all species in 2050: Adoption of healthy diets'
      subtitle: Projected habitat loss for mammal, bird and amphibian species by 2050 under a scenario of global adoption of healthier diets. Diets transition to the EAT-Lancet diet which is in line with healthy calorie and nutritional requirements. For richer countries this would mean a reduction (but not elimination) of meat consumption. For poorer countries, this would mean an increase.
  - dimensions:
      scenario: halve_food_waste
      species_group: all_vertebrates
      projected_change_by_2050: species_habitat_loss
    indicators:
      y:
        - catalogPath: habitat_loss#waste_habitat_loss_all
          display:
            name: Waste (All)
            unit: '%'
            shortUnit: '%'
    config:
      title: 'Projected habitat loss for all species in 2050: Halve food waste'
      subtitle: Projected habitat loss for mammal, bird and amphibian species by 2050 under a scenario where consumer food waste and food losses in supply chains are reduced by 25% by 2030 and 50% by 2050.
  - dimensions:
      scenario: close_yield_gaps
      species_group: all_vertebrates
      projected_change_by_2050: species_habitat_loss
    indicators:
      y:
        - catalogPath: habitat_loss#yields_habitat_loss_all
          display:
            name: Yields (All)
            unit: '%'
            shortUnit: '%'
    config:
      title: 'Projected habitat loss for all species in 2050: Close yield gaps'
      subtitle: Projected habitat loss for mammal, bird and amphibian species by 2050 under a scenario where crop yield gaps are closed. Yields increase linearly from current yields to 80% of the estimated maximum potential by 2050. Increasing yields above 80% is rarely achieved over large areas.
  - dimensions:
      scenario: optimise_trade
      species_group: all_vertebrates
      projected_change_by_2050: species_habitat_loss
    indicators:
      y:
        - catalogPath: habitat_loss#trade_habitat_loss_all
          display:
            name: Trade (All)
            unit: '%'
            shortUnit: '%'
    config:
      note: The goal of this scenario is to estimate the impact on biodiversity of land-use planning across international borders, avoiding expansion in the most at-risk countries. This scenario would be in conflict with food security and sovereignty, especially in countries where agriculture is a large source of income.
      title: 'Projected habitat loss for all species in 2050: Optimize trade'
      subtitle: Projected habitat loss for mammal, bird and amphibian species by 2050 under a scenario where agricultural production and trade is optimized to produce food in the locations with the least risk of habitat loss. Agricultural production shifts from the 25 countries projected to have the greatest mean losses of suitable habitat across all species to countries where less than 10% of species are threatened with extinction.
