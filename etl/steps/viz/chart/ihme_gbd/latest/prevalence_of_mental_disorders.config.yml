grapher_schema: "011"
slug: prevalence-of-mental-disorders

title:
  title: Prevalence of mental disorders
  title_variant: by disorder, sex and age

topic_tags:
  - Mental Health

default_selection:
  - World
  - Low-income countries
  - Lower-middle-income countries
  - Upper-middle-income countries
  - High-income countries

default_dimensions:
  disorder: mental_disorders
  sex: both
  age: all_ages
  metric: share_age_standardized

definitions:
  common_views:
    - config:
        originUrl: /mental-health
        hasMapTab: true
        tab: map
        chartTypes:
          - LineChart
          - DiscreteBar
        yAxis:
          min: 0
      metadata:
        description_key:
          - These estimates come from the Institute for Health Metrics and Evaluation's (IHME) Global Burden of Disease study. They are based on representative surveys, medical data and statistical modelling, and include people who have not been diagnosed.
          - Age-standardized figures adjust for differences in the age structure of populations, so they can be compared between countries and over time. Crude figures show the actual share of the population with the disorder.
          - In this data, mental disorders do not include alcohol and drug use disorders, which IHME counts separately.

dimensions:
  - slug: disorder
    name: Disorder
    choices:
      - slug: mental_disorders
        name: Any mental disorder
        description: Excludes alcohol and drug use disorders
      - slug: depressive_disorders
        name: Depressive disorders
      - slug: anxiety_disorders
        name: Anxiety disorders
      - slug: bipolar_disorder
        name: Bipolar disorder
      - slug: schizophrenia
        name: Schizophrenia
      - slug: eating_disorders
        name: Eating disorders
      - slug: attention_deficit_hyperactivity_disorder
        name: ADHD
      - slug: autism_spectrum_disorders
        name: Autism spectrum disorders
      - slug: conduct_disorder
        name: Conduct disorder
      - slug: idiopathic_developmental_intellectual_disability
        name: Intellectual disability
      - slug: other_mental_disorders
        name: Other mental disorders
  - slug: sex
    name: Sex
    choices:
      - slug: both
        name: Both sexes
      - slug: female
        name: Female
      - slug: male
        name: Male
  - slug: age
    name: Age
    choices:
      - slug: all_ages
        name: All ages
      - slug: under_5
        name: Under 5
      - slug: 5_14
        name: 5–14 years
      - slug: 15_49
        name: 15–49 years
      - slug: 50_69
        name: 50–69 years
      - slug: 70_plus
        name: 70+ years
  - slug: metric
    name: Metric
    choices:
      - slug: share_age_standardized
        name: Share, age-standardized
        description: Comparable between countries and over time (all ages only)
      - slug: share_crude
        name: Share, crude
        description: The actual share of the population
      - slug: number
        name: Number of people

# Views (one per disorder, sex, age and metric) are added in the step's Python file.
views: []
