grapher_schema: "011"
slug: spending-on-older-people-and-survivors-by-benefit

title:
  title: Spending on older people and survivors as share of GDP, by type of benefit
  title_variant: ""
topic_tags:
  - Government Spending

default_selection:
  - OECD countries
  - Italy
  - France
  - Germany
  - Japan
  - United Kingdom
  - United States
  - Switzerland
  - Iceland
  - Australia
  - Denmark
  - Chile

default_dimensions:
  source: public
  group: old_age_and_survivors
  benefit_type: cash_and_in_kind

definitions:
  common_views:
    - config:
        hasMapTab: false
        tab: chart
        chartTypes: ["StackedDiscreteBar"]
        stackMode: absolute
        hideRelativeToggle: false

dimensions:
  - slug: source
    name: Source
    choices:
      - slug: public
        name: Public
        description: Spending by governments and social security funds
      - slug: mandatory_private
        name: Mandatory private
        description: Spending by private schemes that people are required to join
      - slug: public_and_mandatory_private
        name: Public and mandatory private
        description: Both together
  - slug: group
    name: Group
    choices:
      - slug: old_age
        name: Older people
      - slug: survivors
        name: Survivors
      - slug: old_age_and_survivors
        name: Older people and survivors
  - slug: benefit_type
    name: Benefit type
    choices:
      - slug: cash
        name: Cash
      - slug: in_kind
        name: In kind
      - slug: cash_and_in_kind
        name: Cash and in kind

views:
  - dimensions:
      source: public
      group: old_age
      benefit_type: cash
    indicators:
      y:
        - catalogPath: social_expenditure#share_gdp__expenditure_source_public__spending_type_in_cash_spending__programme_type_category_old_age__programme_type_pension
          display:
            name: Old-age pensions
            color: "#3E6CA8"
            tolerance: 2
        - catalogPath: social_expenditure#share_gdp__expenditure_source_public__spending_type_in_cash_spending__programme_type_category_old_age__programme_type_early_retirement_pension
          display:
            name: Early retirement pensions
            color: "#6D87B5"
            tolerance: 2
        - catalogPath: social_expenditure#share_gdp__expenditure_source_public__spending_type_in_cash_spending__programme_type_category_old_age__programme_type_other_cash_benefits
          display:
            name: Other cash benefits for older people
            color: "#9BB0D3"
            tolerance: 2
    config:
      title: Public spending on cash benefits for older people as share of GDP, by type of benefit
      subtitle: Public spending on cash benefits for older people, divided by [gross domestic product](#dod:gdp), expressed as a percentage. Cash benefits are mostly pensions.
