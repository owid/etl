grapher_schema: "011"
slug: normal-retirement-age

title:
  title: Normal retirement age
  title_variant: ""
topic_tags:
  - Work & Employment
  - Government Spending

default_selection:
  - OECD countries
  - United States
  - United Kingdom
  - France
  - Germany
  - Japan
  - Italy
  - Denmark

default_dimensions:
  timing: current
  sex: men

definitions:
  common_views:
    - config:
        hasMapTab: true
        tab: map
        chartTypes: ["DiscreteBar"]
        map:
          hideTimeline: true
          colorScale:
            baseColorScheme: Purples

dimensions:
  - slug: timing
    name: Retirement
    choices:
      - slug: current
        name: Today
        description: For people retiring in 2024
      - slug: future
        name: In the future
        description: For people who start working in 2024, under the rules already legislated
      - slug: today_vs_future
        name: Today vs. in the future
        description: Compare today's normal retirement age with the one already legislated for the future
  - slug: sex
    name: Sex
    choices:
      - slug: men
        name: Men
      - slug: women
        name: Women
      - slug: men_vs_women
        name: Men vs. women
        description: Compare the normal retirement age of men and women

views:
  - dimensions:
      timing: current
      sex: men
    indicators:
      y:
        - catalogPath: retirement#current_normal_retirement_age__sex_men

  - dimensions:
      timing: current
      sex: women
    indicators:
      y:
        - catalogPath: retirement#current_normal_retirement_age__sex_women

  - dimensions:
      timing: future
      sex: men
    indicators:
      y:
        - catalogPath: retirement#future_normal_retirement_age__sex_men

  - dimensions:
      timing: future
      sex: women
    indicators:
      y:
        - catalogPath: retirement#future_normal_retirement_age__sex_women

  # Comparison views: one dot per series, joined by a line for each country.
  - dimensions:
      timing: today_vs_future
      sex: men
    indicators:
      y:
        - catalogPath: retirement#current_normal_retirement_age__sex_men
          display:
            name: Today
        - catalogPath: retirement#future_normal_retirement_age__sex_men
          display:
            name: In the future
    config: &dumbbell
      hasMapTab: false
      tab: chart
      chartTypes: ["Dumbbell"]
      # Sort countries by the first indicator (today; men), highest first.
      sortBy: startValue
      sortOrder: desc
      title: Normal retirement age for men, today and in the future
      subtitle: Age at which men can start receiving a full pension, without penalty, after a career that started at age 22. Today's age is for people retiring in 2024; the future age is for people who start working in 2024, under the rules already legislated.

  - dimensions:
      timing: today_vs_future
      sex: women
    indicators:
      y:
        - catalogPath: retirement#current_normal_retirement_age__sex_women
          display:
            name: Today
        - catalogPath: retirement#future_normal_retirement_age__sex_women
          display:
            name: In the future
    config:
      <<: *dumbbell
      title: Normal retirement age for women, today and in the future
      subtitle: Age at which women can start receiving a full pension, without penalty, after a career that started at age 22. Today's age is for people retiring in 2024; the future age is for people who start working in 2024, under the rules already legislated.

  - dimensions:
      timing: current
      sex: men_vs_women
    indicators:
      y:
        - catalogPath: retirement#current_normal_retirement_age__sex_men
          display:
            name: Men
        - catalogPath: retirement#current_normal_retirement_age__sex_women
          display:
            name: Women
    config:
      <<: *dumbbell
      dumbbell:
        connectorStyle: line
      title: Normal retirement age for men and women today
      subtitle: Age at which men and women can start receiving a full pension, without penalty, in 2024, after a career that started at age 22.

  - dimensions:
      timing: future
      sex: men_vs_women
    indicators:
      y:
        - catalogPath: retirement#future_normal_retirement_age__sex_men
          display:
            name: Men
        - catalogPath: retirement#future_normal_retirement_age__sex_women
          display:
            name: Women
    config:
      <<: *dumbbell
      dumbbell:
        connectorStyle: line
      title: Future normal retirement age for men and women
      subtitle: Age at which men and women who start working at age 22 in 2024 will be able to receive a full pension, without penalty, under the rules already legislated.
