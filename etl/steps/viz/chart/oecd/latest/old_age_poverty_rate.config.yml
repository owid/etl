grapher_schema: "011"
slug: old-age-poverty-rate

title:
  title: Relative poverty among older people
  title_variant: ""
topic_tags:
  - Poverty
  - Economic Inequality

default_selection:
  - OECD countries
  - United States
  - United Kingdom
  - France
  - Germany
  - Japan
  - Netherlands
  - Denmark

default_dimensions:
  age: aged_66_and_older
  sex: both

definitions:
  common_views:
    - config:
        hasMapTab: true
        tab: chart
        chartTypes: ["LineChart", "DiscreteBar", "Marimekko"]
        # Marimekkos only show entities with a region, which leaves out aggregates like OECD countries.
        matchingEntitiesOnly: true
        map:
          colorScale:
            baseColorScheme: OrRd
    - dimensions:
        age: by_age
      config:
        hasMapTab: false
        chartTypes: ["LineChart", "DiscreteBar"]
        selectedFacetStrategy: entity
    - dimensions:
        sex: men_vs_women
      config:
        hasMapTab: false
        chartTypes: ["LineChart", "Dumbbell"]
        selectedFacetStrategy: entity
        dumbbell:
          connectorStyle: line
        # Sort countries by men's value (the first indicator), highest first.
        sortBy: startValue
        sortOrder: desc

dimensions:
  - slug: age
    name: Age
    choices:
      - slug: aged_66_and_older
        name: 66 and older
      - slug: aged_66_to_75
        name: 66 to 75
      - slug: aged_76_and_older
        name: 76 and older
      - slug: by_age
        name: Older age groups vs. total population
        description: Compare older people of different ages with the whole population
  - slug: sex
    name: Sex
    choices:
      - slug: both
        name: Both sexes
      - slug: men
        name: Men
        description: Only available for people aged 66 and older
      - slug: women
        name: Women
        description: Only available for people aged 66 and older
      - slug: men_vs_women
        name: Men vs. women
        description: Compare older men and women; only available for people aged 66 and older

views:
  - dimensions:
      age: aged_66_and_older
      sex: both
    indicators:
      y:
        - catalogPath: incomes_of_older_people#poverty_rate__sex_both_sexes__age_66_years_and_older
      color: regions#owid_region

  - dimensions:
      age: aged_66_and_older
      sex: men
    indicators:
      y:
        - catalogPath: incomes_of_older_people#poverty_rate__sex_men__age_66_years_and_older
      color: regions#owid_region

  - dimensions:
      age: aged_66_and_older
      sex: women
    indicators:
      y:
        - catalogPath: incomes_of_older_people#poverty_rate__sex_women__age_66_years_and_older
      color: regions#owid_region

  - dimensions:
      age: aged_66_to_75
      sex: both
    indicators:
      y:
        - catalogPath: incomes_of_older_people#poverty_rate__sex_both_sexes__age_66_75_years
      color: regions#owid_region

  - dimensions:
      age: aged_76_and_older
      sex: both
    indicators:
      y:
        - catalogPath: incomes_of_older_people#poverty_rate__sex_both_sexes__age_76_years_and_older
      color: regions#owid_region

  # Comparison views.
  - dimensions:
      age: by_age
      sex: both
    indicators:
      y:
        - catalogPath: incomes_of_older_people#poverty_rate__sex_both_sexes__age_66_75_years
          display:
            name: 66 to 75
        - catalogPath: incomes_of_older_people#poverty_rate__sex_both_sexes__age_76_years_and_older
          display:
            name: 76 and older
        - catalogPath: incomes_of_older_people#poverty_rate__sex_both_sexes__age_total_population
          display:
            name: Total population
    config:
      title: Share of older people and of the whole population living in relative poverty
      subtitle: Share of people aged 66 to 75 and 76 and older, and of the whole population, living in households with an income below half of the national median income.

  - dimensions:
      age: aged_66_and_older
      sex: men_vs_women
    indicators:
      y:
        - catalogPath: incomes_of_older_people#poverty_rate__sex_men__age_66_years_and_older
          display:
            name: Men
        - catalogPath: incomes_of_older_people#poverty_rate__sex_women__age_66_years_and_older
          display:
            name: Women
    config:
      title: Share of men and women aged 66 and older living in relative poverty
      subtitle: Share of men and women aged 66 and older living in households with an income below half of the national median income.
