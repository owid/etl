grapher_schema: "011"
slug: labor-market-exit-age

title:
  title: Average age of leaving the labor market
  title_variant: ""
topic_tags:
  - Work & Employment
  - Age Structure

default_selection:
  - OECD countries
  - United States
  - Japan
  - France
  - Germany
  - Mexico

default_dimensions:
  metric: exit_age
  sex: men

definitions:
  common_views:
    - config:
        originUrl: ourworldindata.org/working-hours
        hasMapTab: true
        tab: chart
        chartTypes: ["LineChart", "DiscreteBar"]
        yAxis:
          min: auto
    - dimensions:
        metric: exit_age
      config:
        map:
          colorScale:
            baseColorScheme: BuPu
    - dimensions:
        metric: years_after_exit
      config:
        map:
          colorScale:
            baseColorScheme: YlGnBu
    - dimensions:
        sex: both
      config:
        hasMapTab: false
        selectedFacetStrategy: entity
        chartTypes: ["LineChart"]

dimensions:
  - slug: metric
    name: Indicator
    choices:
      - slug: exit_age
        name: Age of leaving the labor market
        description: Average age at which people aged 40 and older stop working or looking for work
      - slug: years_after_exit
        name: Years of life after leaving the labor market
        description: Remaining life expectancy at the age of leaving the labor market
  - slug: sex
    name: Sex
    choices:
      - slug: men
        name: Men
      - slug: women
        name: Women
      - slug: both
        name: Men and women

views:
  - dimensions:
      metric: exit_age
      sex: men
    indicators:
      y:
        - catalogPath: retirement#effective_labor_market_exit_age__sex_men

  - dimensions:
      metric: exit_age
      sex: women
    indicators:
      y:
        - catalogPath: retirement#effective_labor_market_exit_age__sex_women

  - dimensions:
      metric: exit_age
      sex: both
    indicators:
      y:
        - catalogPath: retirement#effective_labor_market_exit_age__sex_men
        - catalogPath: retirement#effective_labor_market_exit_age__sex_women
    config:
      title: Average age at which men and women leave the labor market
      subtitle: Estimated average age at which people aged 40 and older stop working or looking for work. This includes people who leave for reasons other than retirement, such as disability.
      note: The value for each year is based on changes over the five years leading up to it.

  - dimensions:
      metric: years_after_exit
      sex: men
    indicators:
      y:
        - catalogPath: retirement#expected_years_after_labor_market_exit__sex_men

  - dimensions:
      metric: years_after_exit
      sex: women
    indicators:
      y:
        - catalogPath: retirement#expected_years_after_labor_market_exit__sex_women

  - dimensions:
      metric: years_after_exit
      sex: both
    indicators:
      y:
        - catalogPath: retirement#expected_years_after_labor_market_exit__sex_men
        - catalogPath: retirement#expected_years_after_labor_market_exit__sex_women
    config:
      title: Years that men and women can expect to live after leaving the labor market
      subtitle: Remaining life expectancy at the average age at which people aged 40 and older stop working or looking for work. This includes people who leave for reasons other than retirement, such as disability.
      note: The age of leaving the labor market for each year is based on changes over the five years leading up to it.
