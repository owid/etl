    config:
      title: Where older people’s income comes from
      subtitle: Share of the gross income of people aged over 65 that comes from public pensions and other government benefits, from pensions provided through employers, from personal pensions and savings, and from work.
      note: Incomes are measured for the whole household, so income from work can come from younger people living with older people. Only 14 countries report pensions provided through employers separately; in the others, they show as 0%.
      tab: chart
      hasMapTab: false
      chartTypes:
        - StackedArea
        - StackedDiscreteBar
      stackMode: absolute
      hideRelativeToggle: true
      # The sources add up to about 100%, so the total is left out of the bars.
      hideTotalValueLabel: true
      # Bars are sorted by the share from public pensions and benefits, highest first.
      sortBy: column
      sortColumnSlug: income_sources_of_older_people#share_of_income_from_public_transfers
      sortOrder: desc
      yAxis:
