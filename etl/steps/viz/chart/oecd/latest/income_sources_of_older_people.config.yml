    config:
      title: Where older people’s income comes from
      subtitle: "Share of the gross income of people aged over 65 that comes from public transfers (public pensions and other government benefits), occupational pensions and transfers (pensions and other payments through employers), capital income (personal pensions and income from savings), and work (earnings and self-employment)."
      note: Incomes are measured for the whole household, so income from work can come from younger people living with older people. Only 14 countries report occupational pensions and transfers separately; in the others, they show as 0%.
      tab: chart
      hasMapTab: false
      chartTypes:
        - StackedDiscreteBar
      stackMode: absolute
      hideRelativeToggle: true
      # The sources add up to 100%, so the total is left out of the bars.
      hideTotalValueLabel: true
      # Bars are sorted by the share from public transfers, highest first.
      sortBy: column
      sortColumnSlug: income_sources_of_older_people#share_of_income_from_public_transfers
      sortOrder: desc
      # The OECD average, large economies, and the countries that rely most on each source.
      selectedEntityNames:
