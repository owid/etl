slug: income-sources-of-older-people
grapher_schema: "011"
topic_tags:
  - Poverty
  - Economic Inequality
dimensions: []
views:
  - dimensions: {}
    indicators:
      # Legend labels come from the indicators' display names in the garden metadata.
      # Colors are the first four of OWID categorical E (OwidDistinctColors in owid-grapher). The two private sources,
      # workplace pensions and capital income, take its adjacent dark copper and peach, so they share a hue.
      y:
        - catalogPath: income_sources_of_older_people#share_of_income_from_public_transfers
          display:
            color: "#286bbb"
        - catalogPath: income_sources_of_older_people#share_of_income_from_occupational_transfers
          display:
            color: "#9a5129"
        - catalogPath: income_sources_of_older_people#share_of_income_from_capital
          display:
            color: "#e56e5a"
        - catalogPath: income_sources_of_older_people#share_of_income_from_work
          display:
            color: "#18470f"
    config:
      title: Where older people’s income comes from
      subtitle: "Share of the income of people aged over 65 that comes from each source: public transfers (public pensions and other benefits), workplace pensions (and other payments through employers), capital income (personal pensions and income from savings), and work."
      note: Incomes are measured before taxes. They are counted for the whole household, so income from work can come from younger people living with older people. Only 14 countries report workplace pensions separately; in the others, they are counted under other sources.
      tab: chart
      hasMapTab: false
      chartTypes:
        - StackedDiscreteBar
      stackMode: absolute
      hideRelativeToggle: true
      # The sources add up to 100%, so the total is left out of the bars.
      hideTotalValueLabel: true
      # Bars are sorted by the share from public transfers, highest first.
      sortBy: column
      sortColumnSlug: income_sources_of_older_people#share_of_income_from_public_transfers
      sortOrder: desc
      # The OECD average, large economies, and the countries that rely most on each source.
      selectedEntityNames:
        - OECD countries
        - France
        - Italy
        - Germany
        - Japan
        - United Kingdom
        - Netherlands
        - United States
        - Canada
        - South Korea
        - Mexico
      addCountryMode: add-country
