grapher_schema: "011"
slug: pension-replacement-rates

title:
  title: Pension replacement rate
  title_variant: ""
topic_tags:
  - Government Spending
  - Work & Employment

default_selection:
  - OECD countries
  - United States
  - United Kingdom
  - France
  - Germany
  - Japan
  - Netherlands
  - Denmark

default_dimensions:
  measure: net
  earnings: average
  schemes: mandatory
  sex: men

definitions:
  common_views:
    - config:
        hasMapTab: true
        tab: map
        chartTypes: ["DiscreteBar"]
        map:
          hideTimeline: true
          colorScale:
            baseColorScheme: Blues

dimensions:
  - slug: measure
    name: Measure
    choices:
      - slug: gross
        name: Gross (before taxes)
        description: Pension and earnings before income taxes and social security contributions
      - slug: net
        name: Net (after taxes)
        description: Pension and earnings after income taxes and social security contributions
      - slug: gross_vs_net
        name: Gross vs. net
        description: Compare the rates before and after income taxes and social security contributions
  - slug: earnings
    name: Earnings
    choices:
      - slug: half
        name: Half the average wage
      - slug: average
        name: Average wage
      - slug: twice
        name: Twice the average wage
      - slug: all_earnings
        name: Half vs. average vs. twice
        description: Compare workers earning half the average wage, the average wage, and twice the average wage
  - slug: schemes
    name: Pension schemes
    choices:
      - slug: mandatory
        name: Mandatory
        description: Mandatory schemes, and schemes that cover nearly all workers
      - slug: mandatory_and_voluntary
        name: Mandatory and voluntary
        description: Also includes voluntary private schemes where many workers have them; only available for net rates for men
      - slug: mandatory_vs_voluntary
        name: Mandatory vs. mandatory and voluntary
        description: Compare mandatory schemes alone with mandatory and voluntary schemes; only available for net rates for men
  - slug: sex
    name: Sex
    choices:
      - slug: men
        name: Men
      - slug: women
        name: Women
      - slug: men_vs_women
        name: Men vs. women
        description: Compare the rates of men and women

views:
