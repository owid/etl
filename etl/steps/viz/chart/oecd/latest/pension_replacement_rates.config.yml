grapher_schema: "011"
slug: pension-replacement-rates

title:
  title: Pensions as a share of previous earnings
  title_variant: ""
topic_tags:
  - Government Spending
  - Work & Employment

default_selection:
  - OECD countries
  - United States
  - United Kingdom
  - France
  - Germany
  - Japan
  - Netherlands
  - Denmark

default_dimensions:
  measure: net
  earnings: average
  schemes: mandatory

definitions:
  common_views:
    - config:
        hasMapTab: true
        tab: marimekko
        chartTypes: ["Marimekko", "DiscreteBar"]
        # Marimekkos only show entities with a region, which leaves out aggregates like OECD countries.
        matchingEntitiesOnly: true
        map:
          hideTimeline: true
          colorScale:
            baseColorScheme: Blues

# Men only: the OECD models women with the same career and earnings, so their rates only differ where pension rules
# differ by sex (the indicators' description says so).
dimensions:
  - slug: measure
    name: Measure
    choices:
      - slug: net
        name: Net (after taxes)
        description: Pension and earnings after income taxes and social security contributions
      - slug: gross
        name: Gross (before taxes)
        description: Pension and earnings before income taxes and social security contributions
  - slug: earnings
    name: Earnings
    choices:
      - slug: average
        name: Average wage
      - slug: half
        name: Half the average wage
  - slug: schemes
    name: Pension schemes
    choices:
      - slug: mandatory
        name: Mandatory
        description: Mandatory schemes, and schemes that cover nearly all workers
      - slug: mandatory_and_voluntary
        name: Mandatory and voluntary
        description: Also includes voluntary private schemes where many workers have them
      - slug: mandatory_vs_voluntary
        name: Mandatory vs. mandatory and voluntary
        description: Compare mandatory schemes alone with mandatory and voluntary schemes
      - slug: public
        name: Public
        description: Only pensions paid by the government or social security; only available for gross rates
      - slug: public_and_quasi_mandatory
        name: Public and quasi-mandatory private
        description: Public pensions, and private pensions that cover nearly all workers without being required by law; only available for gross rates
      - slug: mandatory_by_scheme
        name: Mandatory, by type of scheme
        description: Public, quasi-mandatory private, and other mandatory private pensions; only available for gross rates

views:
  - dimensions:
      measure: net
      earnings: average
      schemes: mandatory
    indicators:
      y:
        - catalogPath: replacement_rates#net_replacement_rate__sex_men__earnings_average_wage__pension_schemes_mandatory

  - dimensions:
      measure: net
      earnings: half
      schemes: mandatory
    indicators:
      y:
        - catalogPath: replacement_rates#net_replacement_rate__sex_men__earnings_50pct_of_average_wage__pension_schemes_mandatory

  - dimensions:
      measure: gross
      earnings: average
      schemes: mandatory
    indicators:
      y:
        - catalogPath: replacement_rates#gross_replacement_rate__sex_men__earnings_average_wage__pension_schemes_mandatory

  - dimensions:
      measure: gross
      earnings: half
      schemes: mandatory
    indicators:
      y:
        - catalogPath: replacement_rates#gross_replacement_rate__sex_men__earnings_50pct_of_average_wage__pension_schemes_mandatory

  - dimensions:
      measure: net
      earnings: average
