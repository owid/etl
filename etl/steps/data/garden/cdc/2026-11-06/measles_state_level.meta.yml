# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    presentation:
      topic_tags:
        - Vaccination

# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/
dataset:
  update_period_days: 365
  owners:
    - Fiona Spooner

tables:
  state_measles:
    variables:
      case_count:
        title: Reported measles cases at the state level
        unit: cases
        description_processing: |-
          Finalized counts come from CDC WONDER. For the complete years after the last finalized one, we use the preliminary counts from the CDC's Measles Cases and Outbreaks page, which assigns cases to years by when the rash began and gives only total cases. For those years, the national count is the sum of the states, DC and New York City, so it excludes international visitors.
      source:
        title: Source of the data
        unit: ""
  national_measles:
    variables:
      case_count:
        title: Reported measles cases at the national level
        unit: cases
        description_processing: |-
          Finalized counts come from CDC WONDER. For the complete years after the last finalized one, we use the preliminary counts from the CDC's Measles Cases and Outbreaks page, which assigns cases to years by when the rash began and gives only total cases. For those years, the national count is the sum of the states, DC and New York City, so it excludes international visitors.
      source:
        title: Source of the data
        unit: ""
