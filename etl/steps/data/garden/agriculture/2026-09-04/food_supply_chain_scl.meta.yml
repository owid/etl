definitions:
  common:
    processing_level: major
    presentation:
      topic_tags:
        - Food Supply
    description_processing: |-
      - FAO's Supply Utilization Accounts report every element of the balance of each commodity in tonnes, and food available for consumption also in kilocalories and grams of protein. We convert each element of each commodity with a density (kilocalories, or grams of protein, per 100 grams) and sum the commodities into the stages of the chain; the mass table keeps the tonnes, expressed in kilograms per person per day.
      - The energy density of each commodity, country and year is derived from the Supply Utilization Accounts themselves, as food supply in kilocalories (or grams of protein) divided by food supply in tonnes. Densities above the energy of pure fat (920 kilocalories per 100 grams) or above 100 grams of protein per 100 grams are treated as data errors and replaced by the country's median for the commodity, or failing that by the commodity's median across all countries and years.
      - Commodities that nobody eats (oilseed cakes, brans, gluten feed, ethanol, refining residues) are valued as the human food they would be if eaten, using USDA food composition tables: defatted oilseed flours for the cakes (330 kilocalories and 47 grams of protein per 100 grams), the corresponding brans, pure ethanol (700 kilocalories, no protein), pure oil (884 kilocalories, no protein). Commodities that are never food (castor, tung, kapok, jojoba, wool grease) are given zero energy.
      - Paddy rice, sugar cane and beet, oil palm fruit, rapeseed and cotton seed are not eaten as harvested, so their food-based density is unrepresentative. Their density is derived from the products made from them (milled rice and rice bran, sugar and molasses, palm oil and kernels, rapeseed oil and cake, cottonseed oil and cake): calories of those products over tonnes of crop processed, for the world each year.
      - Production is split by FAO's own classification of commodities: primary crops start the chain, primary livestock products are added after feed, and processed commodities are netted against processing, so that no calorie is counted twice. Cotton seed is treated as a primary crop because the seed cotton it comes from is not in the accounts.
      - Fish and seafood are not in the Supply Utilization Accounts and are taken from the Food Balance Sheets.
      - FAOSTAT rounds tonnages, so its balances do not close exactly; the gap is folded into residuals so that the chain lands exactly on food available for consumption.
      - All stages are divided by the same population series, from Our World in Data's population dataset, and by 365 days.

dataset:
  update_period_days: 365
  owners:
    - Pablo Rosado

tables:
  energy:
    title: Food supply chain in kilocalories (Supply Utilization Accounts method)
    common:
      unit: kilocalories per person per day
      short_unit: kcal
    variables: &variables
      crop_production:
        title: Crop production
        description_short: Domestic production of primary crops.
        description_key:
          - Primary crops are the harvested commodities: cereals, roots and tubers, sugar crops, pulses, nuts, oil crops (including oil palm fruit), vegetables, fruit, stimulants and spices, plus cotton seed.
          - Products made from them (flour, oils, sugar, alcoholic beverages) are not included here; their production is netted against processing.
      imports:
        title: Imports
        description_short: Imports of all commodities.
      exports:
        title: Exports
        description_short: Exports of all commodities.
      stock_variation:
        title: Stock variation
        description_short: The net change in stocks of all commodities. Positive values mean that stocks grew, taking from the supply.
      seed:
        title: Seed
        description_short: Crops set aside as seed for the next harvest.
      losses:
        title: Losses
        description_short: Commodities lost in the supply chain, between the farm and the retailer.
        description_key:
          - FAO's losses cover storage, transport and processing. They do not include waste at retail or in households.
      other_uses:
        title: Other uses
        description_short: Commodities used for non-food purposes, such as biofuels, soap and other industrial uses.
      processing_net:
        title: Processing, net
        description_short: Commodities entering processing, minus the the processed products that come out of it. Positive values are a net loss along the chain.
        description_key:
          - Oilseed cakes, brans and other by-products of processing are commodities in their own right here, so what animals eat of them appears under feed, and this bar shows only what is lost in transformation.
      feed:
        title: Feed
        description_short: Commodities fed to animals, including oilseed cakes, brans and other by-products of processing.
        description_key:
          - Animals also eat grass, forage and crop residues, which are not commodities in FAO's accounts. Dividing animal products by feed therefore overstates the efficiency of livestock.
      animal_products:
        title: Animal products
        description_short: Domestic production of meat, offal, animal fats, milk, eggs, honey, fish and seafood.
      tourist_consumption:
        title: Tourist consumption
        description_short: Food consumed by visitors from other countries.
      residuals:
        title: Residuals
        description_short: The statistical discrepancies in the balance, including the rounding of FAO's tonnages. Can be negative.
      food:
        title: Food available for consumption
        description_short: Food available for human consumption, before waste at retail and in households.
      balancing_difference:
        title: Balancing difference
        description_short: The gap by which FAO's rounded balances fail to close, in the unit of the table. It is included in residuals; this column only records its size.
  protein:
    title: Food supply chain in grams of protein (Supply Utilization Accounts method)
    common:
      unit: grams of protein per person per day
      short_unit: g
    variables: *variables
  mass:
    title: Food supply chain in kilograms (Supply Utilization Accounts method)
    common:
      unit: kilograms per person per day
      short_unit: kg
    variables: *variables
