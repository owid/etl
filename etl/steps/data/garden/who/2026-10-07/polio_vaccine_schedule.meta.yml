tables:
  polio_vaccine_schedule:
    variables:
      vaccine_schedule:
        title: Polio vaccine schedule
        description_short: "Type of polio vaccines used in the national immunization schedule in each country: only inactivated poliovirus vaccines (IPV), oral poliovirus vaccines (OPV), or both."
        description_key:
          - Polio vaccines are given either as an [oral polio vaccine](#dod:oral-polio-vaccine) (OPV), using a weakened live virus, or as an [inactivated polio vaccine](#dod:inactivated-polio-vaccine) (IPV), using a killed virus given by injection.
          - The oral polio vaccine protects against poliovirus and interrupts its transmission, but it carries a very small risk of vaccine-derived poliovirus (about 3 cases per million doses).
          - The inactivated polio vaccine protects against all types of poliovirus (types 1, 2, and 3) and does not carry the risk of vaccine-derived poliovirus associated with OPV.
          - Where the risk of polio is high, the OPV is often given alongside the IPV, since it provides additional protection against poliovirus transmission. Where the risk of polio is low, countries only recommend the IPV, as the risk of vaccine-derived poliovirus from OPV outweighs the benefits of immunity.
          - Many countries have moved from OPV-only schedules to using IPV alongside or instead of OPV, following the global phased withdrawal of oral polio vaccines as part of the polio eradication endgame.
          - Data is based on the most recent national immunization schedule reported by each country through the WHO/UNICEF Joint Reporting Form on Immunization.
        unit: ""
        processing_level: minor
        display:
          numDecimalPlaces: 0
        presentation:
          topic_tags:
            - Vaccination
            - Eradication of Diseases
