tables:
  vaccination_introductions:
    variables:
      intro:
        title: Which countries include the {definitions.vaccine_name} in their national vaccination programs?
        description_short: Countries including {definitions.vaccine_name} in their national vaccination program.
        unit: ""
        description_key:
          - "{definitions.vaccine_description_key}"
          - *description_key_common
  vaccination_introductions_sum:
    variables:
      countries:
        title: Number of countries that are administering {definitions.vaccine_name}
        description_short: Number of countries that are administering {definitions.vaccine_name} as part of their national vaccination program.
        unit: "countries"
        description_key:
          - "{definitions.vaccine_description_key}"
          - *description_key_common
        presentation:
          title_public: Number of countries administering {definitions.vaccine_name}
        display:
          name: "{definitions.vaccine_display_name}"
          numDecimalPlaces: 0
