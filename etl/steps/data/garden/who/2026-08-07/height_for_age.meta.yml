# See the accompanying height_for_age.py for how the two WHO products are combined.

definitions:
  common:
    unit: centimeters
    short_unit: cm
    processing_level: minor
    presentation:
      topic_tags:
        - Human Height
        - Hunger & Undernourishment
      attribution_short: WHO
    description_processing: |-
      WHO publishes height-for-age in two products covering different ages: the Child Growth Standards (2006) for children under 5, tabulated by day of age, and the Growth Reference (2007) for ages 5 to 19, tabulated by month of age. We combine them into a single series, converting months to days using WHO's factor of 30.4375 days per month. The two grids meet without overlapping: the standards end at day 1,856 and the reference picks up at day 1,857.

      We keep each product at its original resolution rather than interpolating both onto a common grid.

      Two small steps in the curves come from the source data and are not errors. At age 2 the measurement changes from length measured lying down to height measured standing up, which lowers every curve by about 0.7 cm. At age 5, where the two WHO products meet, the curves shift by up to about 0.5 cm. This second step is not a uniform shift like the first: it comes from a small jump in the spread of heights, so the median moves by 0.2 to 0.3 cm while the outermost curves move further, and boys' lowest curve moves slightly upwards.
    description_key:
      - These curves are a yardstick for comparing children's height against, not a description of how children in any particular country actually grow.
      - The two halves of the age range rest on different foundations. Up to age 5 they are standards, showing how children grow when their health and nutrition are not holding them back. From age 5 to 19 they are a reference, showing how a particular sample of children did grow.
      - The standards for children under 5 come from the WHO Multicentre Growth Reference Study, which followed 8,440 healthy, breastfed children in Brazil, Ghana, India, Norway, Oman, and the United States between 1997 and 2003. Children at all six sites grew very similarly, which is why WHO treats the standards as applying to children everywhere.
      - The reference for ages 5 to 19 was rebuilt from the 1977 United States growth reference, whose measurements came from national surveys of American children carried out between 1963 and 1975. WHO combined it with the under-fives sample and smoothed the result so that the curves join up at age 5.
      - The older sample was not selected for good health and nutrition the way the under-fives sample was; WHO describes it as a sample of children who were not obese. So for ages 5 to 19 the curves describe how children grew rather than how they could grow.
      - A percentile is the share of children who are shorter than a given height. If a 10-year-old boy is at the 25th percentile, then 25% of boys his age in WHO's reference population would be shorter than him and 75% would be taller.
      - Being far from the median is not by itself a sign of poor health. In the reference population, 3 in every 100 children fall below the 3rd percentile and 3 in every 100 rise above the 97th.
      - WHO fitted these curves to data spanning 3 standard deviations either side of the median, which covers all but about 1 child in 370. The most extreme cut-offs published here — the 0.1st and 99.9th percentiles, and 4 or 5 standard deviations from the median — are calculated by extending that fit rather than observed directly.
      - A child whose height falls more than 2 standard deviations below the median for their age is defined as stunted. Stunting is a sign of sustained undernutrition or repeated infection rather than of being naturally short.

dataset:
  update_period_days: 0
  owners:
    - Pablo Arriagada

tables:
  height_for_age:
    variables:
      age_years:
        title: Age in years
        description_short: |-
          Age of the child in years, derived from age in days using WHO's factor of 365.25 days per year.
        unit: years
        short_unit: ""
        display:
          name: Age
          numDecimalPlaces: 1
      height_percentile_0_1:
        title: Height at the 0.1st percentile
        description_short: |-
          Height that 0.1% of children of this age fall below, in the population WHO uses as its growth reference. This cut-off lies beyond the range WHO's data cover, so it is calculated by extending WHO's fitted distribution.
        unit: centimeters
        short_unit: cm
        display:
          name: 0.1st percentile
          numDecimalPlaces: 1
      height_percentile_1:
        title: Height at the 1st percentile
        description_short: |-
          Height that 1% of children of this age fall below, in the population WHO uses as its growth reference.
        unit: centimeters
        short_unit: cm
        display:
          name: 1st percentile
          numDecimalPlaces: 1
      height_percentile_3:
        title: Height at the 3rd percentile
        description_short: |-
          Height that 3% of children of this age fall below, in the population WHO uses as its growth reference.
        unit: centimeters
        short_unit: cm
        display:
          name: 3rd percentile
          numDecimalPlaces: 1
      height_percentile_5:
