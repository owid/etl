# See the accompanying height_for_age.py for how the two WHO products are combined.

definitions:
  common:
    unit: centimeters
    short_unit: cm
    processing_level: minor
    presentation:
      topic_tags:
        - Human Height
        - Hunger & Undernourishment
      attribution_short: WHO
    description_processing: |-
      WHO publishes height-for-age in two products covering different ages: the Child Growth Standards (2006) for children under 5, tabulated by day of age, and the Growth Reference (2007) for ages 5 to 19, tabulated by month of age. We combine them into a single series, converting months to days using WHO's factor of 30.4375 days per month. The two grids meet without overlapping: the standards end at day 1,856 and the reference picks up at day 1,857.

      We keep each product at its original resolution rather than interpolating both onto a common grid.

      Two small steps down in the curves come from the source data and are not errors. At age 2 the measurement changes from length measured lying down to height measured standing up, which lowers the curves by about 0.7 cm. At age 5, where the two WHO products meet, the curves drop by a further 0.2 to 0.3 cm.
    description_key:
      - These curves are a yardstick for comparing children's height against, not a description of how children in any particular country actually grow.
      - The two halves of the age range rest on different foundations. Up to age 5 they are standards, showing how children grow when their health and nutrition are not holding them back. From age 5 to 19 they are a reference, showing how a particular sample of children did grow.
      - The standards for children under 5 come from the WHO Multicentre Growth Reference Study, which followed 8,440 healthy, breastfed children in Brazil, Ghana, India, Norway, Oman, and the United States between 1997 and 2003. Children at all six sites grew very similarly, which is why WHO treats the standards as applying to children everywhere.
      - The reference for ages 5 to 19 was rebuilt from a 1977 sample of children in the United States, combined with the under-fives sample and smoothed so that the curves join up at age 5. That sample was not screened for good health or nutrition, so for these older ages the curves describe how children grew rather than how they could grow.
      - A percentile is the share of children who are shorter than a given height. If a 10-year-old boy is at the 25th percentile, then 25% of boys his age in WHO's reference population would be shorter than him and 75% would be taller.
      - Being far from the median is not by itself a sign of poor health. In the reference population, 3 in every 100 children fall below the 3rd percentile and 3 in every 100 rise above the 97th.
      - A child whose height falls more than 2 standard deviations below the median for their age is defined as stunted. Stunting is a sign of sustained undernutrition or repeated infection rather than of being naturally short.

