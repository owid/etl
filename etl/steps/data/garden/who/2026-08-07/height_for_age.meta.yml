tables:
  height_for_age:
    variables:
      age_years:
        title: Age in years
        description_short: |-
          Age of the child in years, derived from age in days using WHO's factor of 365.25 days per year.
        unit: years
        short_unit: ""
        display:
          name: Age
          numDecimalPlaces: 1
      height_percentile_0_1:
        title: Height at the 0.1st percentile
        description_short: |-
          The height that 0.1% of children of this age fall below, in the population WHO uses as its growth reference.
        unit: centimeters
        short_unit: cm
        display:
          name: 0.1st percentile
          numDecimalPlaces: 1
      height_percentile_1:
        title: Height at the 1st percentile
