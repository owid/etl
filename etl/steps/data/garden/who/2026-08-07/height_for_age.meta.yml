          name: 97th percentile
          numDecimalPlaces: 1
      height_percentile_99:
        title: Height at the 99th percentile
        description_short: |-
          Height that 99% of children of this age fall below, in the population WHO uses as its growth reference.
        unit: centimeters
        short_unit: cm
        display:
          name: 99th percentile
          numDecimalPlaces: 1
      height_percentile_99_9:
        title: Height at the 99.9th percentile
        description_short: |-
          Height that 99.9% of children of this age fall below, in the population WHO uses as its growth reference. This cut-off lies beyond the range WHO's data cover, so it is calculated by extending WHO's fitted distribution.
        unit: centimeters
        short_unit: cm
        display:
          name: 99.9th percentile
          numDecimalPlaces: 1
      height_sd_minus_5:
        title: Height at 5 standard deviations below the median
        description_short: |-
          Height 5 standard deviations below the median for this age, in the population WHO uses as its growth reference. WHO publishes this cut-off only from age 5, to assess very short stature. It lies far beyond the range WHO's data cover, so it is calculated by extending WHO's fitted distribution.
        unit: centimeters
        short_unit: cm
        display:
          name: -5 SD
          numDecimalPlaces: 1
      height_sd_minus_4:
        title: Height at 4 standard deviations below the median
        description_short: |-
          Height 4 standard deviations below the median for this age, in the population WHO uses as its growth reference. This cut-off lies beyond the range WHO's data cover, so it is calculated by extending WHO's fitted distribution.
        unit: centimeters
        short_unit: cm
        display:
          name: -4 SD
          numDecimalPlaces: 1
      height_sd_minus_3:
        title: Height at 3 standard deviations below the median
        description_short: |-
          Height 3 standard deviations below the median for this age, in the population WHO uses as its growth reference.
        unit: centimeters
        short_unit: cm
        display:
          name: -3 SD
          numDecimalPlaces: 1
      height_sd_minus_2:
        title: Height at 2 standard deviations below the median
        description_short: |-
          Height 2 standard deviations below the median for this age, in the population WHO uses as its growth reference. Children shorter than this are defined as stunted.
        unit: centimeters
        short_unit: cm
        display:
          name: -2 SD
          numDecimalPlaces: 1
      height_sd_minus_1:
        title: Height at 1 standard deviation below the median
        description_short: |-
          Height 1 standard deviation below the median for this age, in the population WHO uses as its growth reference.
        unit: centimeters
        short_unit: cm
        display:
          name: -1 SD
          numDecimalPlaces: 1
      height_sd_0:
        title: Median height
        description_short: |-
          Median height for this age in the population WHO uses as its growth reference. Half of children are taller than this and half are shorter.
        unit: centimeters
        short_unit: cm
        display:
          name: Median
          numDecimalPlaces: 1
      height_sd_plus_1:
        title: Height at 1 standard deviation above the median
        description_short: |-
          Height 1 standard deviation above the median for this age, in the population WHO uses as its growth reference.
        unit: centimeters
        short_unit: cm
        display:
          name: +1 SD
          numDecimalPlaces: 1
      height_sd_plus_2:
        title: Height at 2 standard deviations above the median
        description_short: |-
          Height 2 standard deviations above the median for this age, in the population WHO uses as its growth reference.
        unit: centimeters
        short_unit: cm
        display:
          name: +2 SD
          numDecimalPlaces: 1
      height_sd_plus_3:
        title: Height at 3 standard deviations above the median
        description_short: |-
          Height 3 standard deviations above the median for this age, in the population WHO uses as its growth reference.
        unit: centimeters
        short_unit: cm
        display:
          name: +3 SD
          numDecimalPlaces: 1
      height_sd_plus_4:
        title: Height at 4 standard deviations above the median
        description_short: |-
          Height 4 standard deviations above the median for this age, in the population WHO uses as its growth reference. This cut-off lies beyond the range WHO's data cover, so it is calculated by extending WHO's fitted distribution.
        unit: centimeters
        short_unit: cm
        display:
          name: +4 SD
          numDecimalPlaces: 1
      lms_m_median:
        title: LMS parameter M (median)
        description_short: |-
          M parameter of the LMS distribution WHO fits at each age, equal to the median height. Published so that any percentile or z-score can be calculated.
        unit: centimeters
        short_unit: cm
        display:
          name: M (median)
          numDecimalPlaces: 1
      lms_s_coefficient_of_variation:
        title: LMS parameter S (coefficient of variation)
        description_short: |-
          S parameter of the LMS distribution WHO fits at each age, equal to the standard deviation divided by the median. Published so that any percentile or z-score can be calculated.
        unit: ratio
        short_unit: ""
        display:
          name: S (coefficient of variation)
          # S runs from 0.031 to 0.048, so anything less than five decimals renders as 0.0.
          numDecimalPlaces: 5
      lms_l_skewness:
        title: LMS parameter L (skewness)
        description_short: |-
          L parameter of the LMS distribution WHO fits at each age. For height-for-age it equals 1 at every age, meaning heights are normally distributed, so percentiles and z-scores carry the same information.
        unit: ratio
        short_unit: ""
        display:
          name: L (skewness)
          numDecimalPlaces: 1
      standard_deviation:
        title: Standard deviation of height
        description_short: |-
          Spread of heights at this age in the population WHO uses as its growth reference, calculated as the median multiplied by the coefficient of variation.
        unit: centimeters
        short_unit: cm
        display:
          name: Standard deviation
          numDecimalPlaces: 1
