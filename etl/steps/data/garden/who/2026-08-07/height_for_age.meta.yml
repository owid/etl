      lms_m_median:
        title: LMS parameter M (median)
        description_short: |-
          The M parameter of the LMS distribution WHO fits at each age, equal to the median height. Published so that any percentile or z-score can be calculated.
        unit: centimeters
        short_unit: cm
        display:
          name: M (median)
          numDecimalPlaces: 1
      lms_s_coefficient_of_variation:
        title: LMS parameter S (coefficient of variation)
        description_short: |-
          The S parameter of the LMS distribution WHO fits at each age, equal to the standard deviation divided by the median. Published so that any percentile or z-score can be calculated.
        unit: ratio
        short_unit: ""
        display:
          name: S (coefficient of variation)
          numDecimalPlaces: 1
      lms_l_skewness:
        title: LMS parameter L (skewness)
        description_short: |-
          The L parameter of the LMS distribution WHO fits at each age. For height-for-age it equals 1 at every age, meaning heights are normally distributed, so percentiles and z-scores carry the same information.
        unit: ratio
        short_unit: ""
        display:
          name: L (skewness)
          numDecimalPlaces: 1
      standard_deviation:
        title: Standard deviation of height
        description_short: |-
          The spread of heights at this age in the population WHO uses as its growth reference, calculated as the median multiplied by the coefficient of variation.
        unit: centimeters
        short_unit: cm
        display:
          name: Standard deviation
          numDecimalPlaces: 1
