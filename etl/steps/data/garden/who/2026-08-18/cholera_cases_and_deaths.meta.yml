# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    processing_level: major
    presentation:
      attribution_short: WHO
      topic_tags:
        - Global Health
        - Diarrheal Diseases
        - Neglected Tropical Diseases
    description_processing: |-
      - This dataset is compiled from two sources published by the World Health Organization (WHO):
        - Data from 1949-1999 comes from the WHO Global Health Observatory (GHO).
        - Between 2000-2016 data from the GHO is supplemented with data from the WHO Cholera Dashboard.
        - Data from 2017-2024 comes from the (WHO Cholera Dashboard)[https://worldhealthorg.shinyapps.io/Cholera/]

# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/
dataset:
  update_period_days: 365
  owners:
    - Tuna Acisu


tables:
  cholera_cases_and_deaths:
    variables:
      cholera_case_fatality_rate:
        title: Cholera case fatality rate
        description_short: Percentage of reported cholera cases that result in death.
        description_key:
          - WHO calculates case fatality rates based on the numbers of cases and deaths as reported by national authorities.
          - The case fatality rate is the number of reported deaths, divided by the number of reported cases, shown as a percentage.
        unit: "%"
        short_unit: "%"
        display:
          numDecimalPlaces: 2
      cholera_reported_cases:
        title: Reported cholera cases
        description_short: Number of cholera cases which have been reported to the WHO by local authorities. As not every case is reported to the WHO, these numbers are likely to be an underestimate of the true number of cholera cases.
        description_key:
          - These statistics include Cholera cases confirmed clinically, epidemiologically, or by laboratory investigation.
          - As not every case of Cholera is confirmed and reported to the WHO, these numbers are likely to be an underestimate of the true number of cholera cases.
          - In outbreak situations, cases of acute watery diarrhea caused by other pathogens may be reported as cholera cases when laboratory confirmation is not available or feasible for all suspected cases.
        unit: reported cases
        display:
          numDecimalPlaces: 0
      cholera_deaths:
        title: Reported cholera deaths
        description_short: Number of deaths from cholera reported to WHO. As not every death is reported or attributed to cholera, these numbers are likely an underestimate of the true number of deaths from cholera.
        unit: reported deaths
        display:
          numDecimalPlaces: 0

