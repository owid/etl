# WHO's population for Malta aged 85+ is far too small in 1973-1981: 500-800 people, against 1,500 in 1972 and
# 2,900 in 1982 (recovered as All Causes deaths / death rate). Every rate WHO divides by it is inflated: the
# age-standardized rates of every cause (cardiovascular diseases peak at 945 per 100,000 in 1981, then 481 in
# 1982), and the 85+ death rates (All Causes 1981: 438 deaths in 500 people, 87,600 per 100,000). Death counts,
# shares of deaths and the death rates of the other age bands are unaffected and kept.

# Guard: fails once WHO fixes its population (the rate would fall to about 580), so this file is then revisited
# rather than silently re-applied. Keep it first: the next entry blanks this cell, and `expect` would then fail.
- indicator: death_rate_age_standardized
  entity: Malta
  years: [1981]
  match: {sex: Both sexes, age_group: all ages, cause: Cardiovascular diseases}
  action: override
  value: null
  expect: {gt: 800}
  reason: &reason >-
    WHO's population aged 85+ for Malta in 1973-1981 (500-800 people, against 1,500 in 1972 and 2,900 in 1982)
    is impossibly small, which inflates the age-standardized rates and the 85+ death rates of every cause.
  producer: WHO Mortality Database
  status: open

- indicator: death_rate_age_standardized
  entity: Malta
  years: {from: 1973, to: 1981}
  action: override
  value: null
  reason: *reason
  producer: WHO Mortality Database
  status: open

- indicator: death_rate
  entity: Malta
  years: {from: 1973, to: 1981}
  match: {age_group: over 85 years}
  action: override
  value: null
  reason: *reason
  producer: WHO Mortality Database
  status: open

# WHO reports no injury deaths for Albania in 2005, 2006 and 2009 (Unintentional injuries: 0, 3 and 0, against
# 582-900 in the neighbouring years), yet All Causes exceeds the sum of its cause groups by 1,214, 970 and 891
# deaths, about Albania's usual injury total: the deaths were registered but not coded to an injury group. The
# zeros would read as years without homicides or suicides, so the four injury causes are blanked there.

# Guard: fails once WHO assigns these deaths to the injury groups. Keep it first, as for Malta above.
- indicator: deaths
  entity: Albania
  years: [2005, 2006, 2009]
  match: {sex: Both sexes, age_group: all ages, cause: Intentional injuries}
  action: override
  value: null
  expect: {eq: 0}
  reason: &reason_albania >-
    WHO reports no injury deaths for Albania in 2005, 2006 and 2009, yet All Causes exceeds the sum of its
    cause groups by 891-1,214 deaths, close to Albania's usual injury total: the deaths were not coded to
    an injury group.
  producer: WHO Mortality Database
  status: open

- indicator: &injury_indicators [deaths, share_of_deaths, death_rate, death_rate_age_standardized]
  entity: Albania
  years: [2005, 2006, 2009]
  match: {cause: Intentional injuries}
  action: override
  value: null
  reason: *reason_albania
  producer: WHO Mortality Database
  status: open

- indicator: *injury_indicators
  entity: Albania
  years: [2005, 2006, 2009]
  match: {cause: Self-inflicted injuries}
  action: override
  value: null
  reason: *reason_albania
  producer: WHO Mortality Database
  status: open

- indicator: *injury_indicators
  entity: Albania
  years: [2005, 2006, 2009]
  match: {cause: Violence}
  action: override
  value: null
  reason: *reason_albania
  producer: WHO Mortality Database
  status: open

- indicator: *injury_indicators
  entity: Albania
  years: [2005, 2006, 2009]
  match: {cause: Unintentional injuries}
  action: override
  value: null
  reason: *reason_albania
  producer: WHO Mortality Database
  status: open
