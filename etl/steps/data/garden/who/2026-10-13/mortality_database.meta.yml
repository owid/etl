# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    presentation:
      topic_tags:
        - Causes of Death
      attribution_short: WHO
    processing_level: minor

  # The cause as it reads inside a sentence: lower case, except for names that keep their capitals. WHO's "Violence"
  # (assault, X85-Y09) reads as homicide, the word the retired homicide dataset and its charts use.
  cause_in_text: |-
    <% if cause in ["Hepatitis B", "Japanese encephalitis"] %><< cause >><% elif cause == "Violence" %>homicide<% else %><< cause.lower() >><% endif %>

  # The age band as it reads inside a sentence. The data carries the family's band labels, but the bands derived for
  # Violence keep the phrases the retired homicide dataset used in its sentences ("0-19", "70+"), so those read as before.
  age_in_text: |-
    <% if cause == "Violence" and age_group == "<20 years" %>0-19<% elif cause == "Violence" and age_group == "<5 years" %>0-4<% elif cause == "Violence" and age_group == "5-14 years" %>5-14<% elif cause == "Violence" and age_group == "15-49 years" %>15-49<% elif cause == "Violence" and age_group == "50-69 years" %>50-69<% elif cause == "Violence" and age_group == "over 70 years" %>70+<% else %><< age_group.lower() >><% endif %>
  # The same, for the retired homicide titles, which wrote "in age 0-19" for the bands they derived and "in all ages" otherwise.
  violence_age_in_title: |-
    <% if age_group in ["<20 years", "<5 years", "5-14 years", "15-49 years", "50-69 years", "over 70 years"] %>age {definitions.age_in_text}<% else %><< age_group.lower() >><% endif %>

  # NOTE: Drill-down causes carry the label of the table they are published in at the front of the internal
  # title, so the admin's flat list tells the layers apart; top-tier groups have no prefix. Mirrors
  # DRILL_DOWN_TABLES in the garden step, which fails the build if a drill-down is missing here.
  cause_layer: |-
    <% set layers = [
      ("Pertussis", "Vaccine-preventable diseases"),
      ("Poliomyelitis", "Vaccine-preventable diseases"),
      ("Diphtheria", "Vaccine-preventable diseases"),
      ("Measles", "Vaccine-preventable diseases"),
      ("Tetanus", "Vaccine-preventable diseases"),
      ("Hepatitis B", "Vaccine-preventable diseases"),
      ("Japanese encephalitis", "Vaccine-preventable diseases"),
      ("Self-inflicted injuries", "Intentional injuries"),
      ("Violence", "Intentional injuries"),
      ("Mouth and oropharynx cancers", "Cancers"),
      ("Oesophagus cancer", "Cancers"),
      ("Stomach cancer", "Cancers"),
      ("Colon and rectum cancers", "Cancers"),
      ("Liver cancer", "Cancers"),
      ("Pancreas cancer", "Cancers"),
      ("Trachea, bronchus, lung cancers", "Cancers"),
      ("Melanoma and other skin cancers", "Cancers"),
      ("Breast cancer", "Cancers"),
      ("Cervix uteri cancer", "Cancers"),
      ("Corpus uteri cancer", "Cancers"),
      ("Ovary cancer", "Cancers"),
      ("Prostate cancer", "Cancers"),
      ("Testicular cancer", "Cancers"),
      ("Kidney cancer", "Cancers"),
      ("Bladder cancer", "Cancers"),
      ("Brain and nervous system cancers", "Cancers"),
      ("Gallbladder and biliary tract cancer", "Cancers"),
      ("Larynx cancer", "Cancers"),
      ("Thyroid cancer", "Cancers"),
      ("Mesothelioma", "Cancers"),
      ("Lymphomas, multiple myeloma", "Cancers"),
      ("Leukaemia", "Cancers"),
      ("Ill-defined malignant neoplasms", "Cancers"),
      ("Other malignant neoplasms", "Cancers"),
    ] %><% for c, label in layers %><% if c == cause %><< label >> › <% endif %><% endfor %>

  # NOTE: Display names and short descriptions, per metric. The display name is the sentence readers see as the
  # indicator's title (data page, the chart's "learn more" panel when the chart sets no label of its own, table
  # headers); it goes in `display.name`, not `presentation.title_public`, because grapher lets a public title
  # override the chart's own labels in that panel, while a display name yields to them. Self-inflicted injuries
  # keep the wording its former dataset carried (an editorial choice made there), including the dimension suffix
  # readers see today, and so does Violence (the retired homicide dataset's titles, which say homicide); every other
  # cause uses the family's sentence.
  display_name_number: |-
    <% if cause == "Self-inflicted injuries" %>Number of deaths from self-inflicted injuries - Sex: << sex >> - Age group: << age_group >><% elif cause == "Violence" %>Deaths from homicide in << sex.lower() >> in {definitions.violence_age_in_title}<% else %>Deaths from {definitions.cause_in_text} in << sex.lower() >> aged << age_group.lower() >><% endif %>
  description_short_number: |-
    <% if cause == "Self-inflicted injuries" %>Number of deaths from self-inflicted injuries in the total population, based on the [underlying cause](#dod:underlying-cause-of-death) listed on death certificates.<% else %>Reported total deaths from {definitions.cause_in_text} in << sex.lower() >> aged {definitions.age_in_text}.<% endif %>
  display_name_death_rate: |-
    <% if cause == "Self-inflicted injuries" %>Death rate from self-inflicted injuries per 100,000 population - Sex: << sex >> - Age group: << age_group >><% elif cause == "Violence" %>Homicide rate in << sex.lower() >> in {definitions.violence_age_in_title} per 100,000 population<% else %>Deaths from {definitions.cause_in_text} per 100,000 people in << sex.lower() >> aged << age_group.lower() >><% endif %>
  description_short_death_rate: |-
    <% if cause == "Self-inflicted injuries" %>Reported annual death rate from self-inflicted injuries per 100,000 people, based on the [underlying cause](#dod:underlying-cause-of-death) listed on death certificates.<% else %>Reported deaths from {definitions.cause_in_text} per 100,000 people in << sex.lower() >> aged {definitions.age_in_text}.<% endif %>
  display_name_share: |-
    <% if cause == "Self-inflicted injuries" %>Percentage of deaths from self-inflicted injuries out of total deaths - Sex: << sex >> - Age group: << age_group >><% elif cause == "Violence" %>Share of total deaths from homicide in << sex.lower() >> in {definitions.violence_age_in_title}<% else %>Share of total deaths in << sex.lower() >> in those aged << age_group.lower() >> that are from {definitions.cause_in_text}<% endif %>
  description_short_share: |-
    <% if cause == "Self-inflicted injuries" %>Percentage of deaths from self-inflicted injuries out of all deaths in the population, based on the [underlying cause](#dod:underlying-cause-of-death) listed on death certificates.<% else %>Share of total reported deaths in << sex.lower() >> in those aged {definitions.age_in_text} that are from {definitions.cause_in_text}.<% endif %>
  display_name_asr: |-
    <% if cause == "Self-inflicted injuries" %>Age-standardized death rate from self-inflicted injuries per 100,000 population - Sex: << sex >> - Age group: << age_group >><% elif cause == "Violence" %>Age-standardized homicide rate in << sex.lower() >> in {definitions.violence_age_in_title}<% else %>Age-standardized deaths from {definitions.cause_in_text} in << sex.lower() >> in those aged << age_group.lower() >> per 100,000 people<% endif %>
  description_short_asr: |-
    <% if cause == "Self-inflicted injuries" %>Reported annual death rate from self-inflicted injuries per 100,000 people, based on the [underlying cause](#dod:underlying-cause-of-death) listed on death certificates. To allow for comparisons between countries and over time, this metric is [age-standardized](#dod:age_standardized).<% else %>Reported deaths from {definitions.cause_in_text} in << sex.lower() >> in those aged {definitions.age_in_text} per 100,000 people.<% endif %>

  # NOTE: The ICD-10 codes below must match the `causes` table this step builds from WHO's own export
  # headers (`icd10_codes` column). They are repeated here because indicator text is rendered per
  # cause and the codes are no longer a dimension of the data. When a cause group is added or WHO
  # changes a definition, update both.
  icd10_codes: |-
    <% if cause == "All Causes" %>
    A00-Y89
    <%- elif cause == "Cardiovascular diseases" %>
    I00-I99
    <%- elif cause == "Congenital anomalies" %>
    Q00-Q99
    <%- elif cause == "Diabetes mellitus, blood and endocrine disorders" %>
    E10-E14, D55-D64 (minus D64.9), D65-D89, E03-E07, E15-E16, E20-E34, E65-E88
    <%- elif cause == "Digestive diseases" %>
    K20-K92
    <%- elif cause == "Genitourinary diseases" %>
    N00-N64, N75-N98
    <%- elif cause == "Ill-defined injuries" %>
    Y10-Y34, Y872
    <%- elif cause == "Infectious and parasitic diseases" %>
    A00-B99, G00-G04, G14, N70-N73, P37.3, P37.4
    <%- elif cause == "Intentional injuries" %>
    X60-Y09, Y35-Y36, Y870, Y871
    <%- elif cause == "Malignant neoplasms" %>
    C00-C97
    <%- elif cause == "Maternal conditions" %>
    O00-O99
    <%- elif cause == "Musculoskeletal diseases" %>
    M00-M99
    <%- elif cause == "Neuropsychiatric conditions" %>
    F01-F99, G06-G98 (minus G14), U07.0, X41, X42, X44, X45
    <%- elif cause == "Nutritional deficiencies" %>
    E00-E02, E40-E46, E50, D50-D53, D64.9, E51-E64
    <%- elif cause == "Oral conditions" %>
    K00-K14
    <%- elif cause == "Other neoplasms" %>
    D00-D48
    <%- elif cause == "Perinatal conditions" %>
    P00-P96 (minus P23, P37.3, P37.4)
    <%- elif cause == "Respiratory diseases" %>
    J30-J98
    <%- elif cause == "Respiratory infections" %>
    H65-H66, J00-J22, P23, U04, U07.1, U07.2, U09.9, U10.9
    <%- elif cause == "Sense organ diseases" %>
    H00-H61, H68-H93
    <%- elif cause == "Skin diseases" %>
    L00-L98
    <%- elif cause == "Sudden infant death syndrome" %>
    R95
    <%- elif cause == "Unintentional injuries" %>
    V01-X59, Y40-Y86, Y88, Y89 (minus X41-X42, X44-X45), U12.9
    <%- elif cause == "Ill-defined diseases" %>
    R00-R94, R96-R99
    <%- elif cause == "Pertussis" %>
    A37
    <%- elif cause == "Poliomyelitis" %>
    A80, B91, G14
    <%- elif cause == "Diphtheria" %>
    A36
    <%- elif cause == "Measles" %>
    B05
    <%- elif cause == "Tetanus" %>
    A33-A35
    <%- elif cause == "Hepatitis B" %>
    B16-B19 (minus B17.1, B18.2)
    <%- elif cause == "Japanese encephalitis" %>
    A83.0
    <%- elif cause == "Self-inflicted injuries" %>
    X60-X84, Y870
    <%- elif cause == "Violence" %>
    X85-Y09, Y871
    <%- elif cause == "Mouth and oropharynx cancers" %>
    C00-C14
    <%- elif cause == "Oesophagus cancer" %>
    C15
    <%- elif cause == "Stomach cancer" %>
    C16
    <%- elif cause == "Colon and rectum cancers" %>
    C18-C21
    <%- elif cause == "Liver cancer" %>
    C22
    <%- elif cause == "Pancreas cancer" %>
    C25
    <%- elif cause == "Trachea, bronchus, lung cancers" %>
    C33-C34
    <%- elif cause == "Melanoma and other skin cancers" %>
    C43-C44
    <%- elif cause == "Breast cancer" %>
    C50
    <%- elif cause == "Cervix uteri cancer" %>
    C53
    <%- elif cause == "Corpus uteri cancer" %>
    C54-C55
    <%- elif cause == "Ovary cancer" %>
    C56
    <%- elif cause == "Prostate cancer" %>
    C61
    <%- elif cause == "Testicular cancer" %>
    C62
    <%- elif cause == "Kidney cancer" %>
    C64-C66
    <%- elif cause == "Bladder cancer" %>
    C67
    <%- elif cause == "Brain and nervous system cancers" %>
    C70-C72
    <%- elif cause == "Gallbladder and biliary tract cancer" %>
    C23-C24
    <%- elif cause == "Larynx cancer" %>
    C32
    <%- elif cause == "Thyroid cancer" %>
    C73
    <%- elif cause == "Mesothelioma" %>
    C45
    <%- elif cause == "Lymphomas, multiple myeloma" %>
    C81-C90, C96
    <%- elif cause == "Leukaemia" %>
    C91-C95
    <%- elif cause == "Ill-defined malignant neoplasms" %>
    C76, C80, C97
    <%- elif cause == "Other malignant neoplasms" %>
    C17, C26-C31, C37-C41, C46-C49, C51, C52, C57-C60, C63, C68, C69, C74-C75, C77-C79
    <%- endif -%>

  description_disease_producer: |-
    <% if cause == "All Causes" %>
    <% elif cause == "Cardiovascular diseases" %>
    More deaths are caused by cardiovascular diseases than any other category. Cardiovascular deaths increase sharply with age, and most cardiovascular deaths occur in older adults. The two most common causes of cardiovascular deaths are ischemic heart disease and stroke. These, in turn, are caused by behavioral and metabolic risk factors such as tobacco use, physical inactivity, high blood pressure, and high blood glucose.
    <% elif cause == "Congenital anomalies" %>
    Congenital anomalies, including spina bifida, congenital heart anomalies, and down syndrome are included in this category. Although these deaths can occur at any age, the majority of congenital deaths occur in newborns.
    <% elif cause == "Diabetes mellitus, blood and endocrine disorders" %>
    Direct diabetes deaths, for example associated with a diabetic coma, are included in this category. Diabetes also raises the risk of other causes of death, including ischemic heart disease and kidney failure; many of these deaths are included in other categories. Endocrine disorders include anemia and sickle-cell disorders.
    <% elif cause == "Digestive diseases" %>
    The leading cause of death in this category is liver cirrhosis. Other disease in this category include peptic ulcer diseases, pancreatitis and appendicitis.
    <% elif cause == "Genitourinary diseases" %>
    Genitourinary diseases include kidney failure, which may be caused by diabetes or high blood pressure.
    <% elif cause == "Ill-defined injuries" %>
    Ill-defined injuries/accidents comprise events of undetermined intent. The proportion of deaths assigned to this category is an indicator of data quality.
    <% elif cause == "Infectious and parasitic diseases" %>
    This category includes a wide range of communicable diseases, including sexually transmitted diseases including HIV/AIDS, tuberculosis, diarrheal diseases, some vaccine-preventable diseases such as measles, and diseases caused by tropical parasites such as malaria and hookworm.
    <% elif cause == "Intentional injuries" %>
    Intentional injury deaths comprise suicide, homicide, conflicts, and legal executions. Countries may include conflict deaths occurring abroad.
    <% elif cause == "Malignant neoplasms" %>
    Cancers are a diverse group of causes of death. Risk factors vary from one cancer to another, and because of diverse and changing risk exposures, trends in cancer mortality varies by cancer type, sex, and country. For example, in many European countries, lung cancer death rates are declining in men and increasing in women, due to gender differences in trends in tobacco smoking.
    <% elif cause == "Maternal conditions" %>
    Maternal deaths comprise deaths of women who are pregnant or within 42 days of the termination of the pregnancy, from any cause related to or aggravated by the pregnancy or its management (other than unintentional injuries or incidental causes). Thus, under ICD rules, a death caused by an existing cardiac disease that was aggravated by a pregnancy is be included here. In practice, maternal deaths are often undercounted in death certificate data. Late maternal deaths, which occur between 42 days and 1 year after the termination of the pregnancy, are included here as well.
    <% elif cause == "Musculoskeletal diseases" %>
    Musculoskeletal diseases, including arthritis, gout and back pain, are not common causes of death.
    <% elif cause == "Neuropsychiatric conditions" %>
    For the most part, neuropsychiatric conditions rarely lead to death. However, many deaths are caused by the use of psychoactive substances, namely drugs or alcohol. Deaths from drug/alcohol dependence are currently included in this category. Starting in 2006, following an ICD-10 update, acute drug and/or alcohol intoxication is classified as an unintentional poisoning. This change in classification may lead to odd trends in death rates.
    <% elif cause == "Nutritional deficiencies" %>
    Insufficient intake of macronutrients or micronutrients may lead to death. Such deaths would be included in this category. More commonly, nutritional deficiencies increase the risk of other diseases such as pneumonia, and most deaths associated with undernutrition appear in those other disease categories.
    <% elif cause == "Oral conditions" %>
    Oral conditions, such as dental caries and periodontal disease, are not common causes of death.
    <% elif cause == "Other neoplasms" %>
    Other neoplasms include in-situ tumors, tumors that are benign, and tumors for which there is uncertainty whether they are malignant or benign.
    <% elif cause == "Perinatal conditions" %>
    Perinatal conditions arise during the perinatal period, which spans from 22 completed weeks of gestation and ends 7 completed days after birth. Leading perinatal conditions include birth trauma and consequences of preterm birth. Although most deaths in this category occur during the perinatal period, a few deaths that are caused by perinatal conditions occur later in life.
    <% elif cause == "Respiratory diseases" %>
    Chronic obstructive pulmonary disease and asthma are the two leading causes of death in this category. Deaths from respiratory diseases occur mainly in older adults.
    <% elif cause == "Respiratory infections" %>
    The great majority of deaths from respiratory infections are caused by lower respiratory infections -- predominantly pneumonia. When they occur, upper respiratory infection and otitis media deaths are included in this category as well.
    <% elif cause == "Sense organ diseases" %>
    These diseases, which rarely cause death, include diseases that cause vision and hearing loss.
    <% elif cause == "Skin diseases" %>
    Skin diseases include dermatitis and eczema. Many deaths in this category are deaths of older, bed-ridden adults. These deaths are assigned to decubitus ulcer, also known as pressure ulcer or bedsores.
    <% elif cause == "Sudden infant death syndrome" %>
    Unexplained deaths of seemingly healthy infants, usually during sleep, are included in this category. Most sudden infant death syndrome deaths occur in infants younger than 6 months.
    <% elif cause == "Unintentional injuries" %>
    Leading unintentional injury causes of death include road traffic collisions, falls and drownings. Deaths from natural disasters are also included in this category.
    <% elif cause == "Ill-defined diseases" %>
    Ill-defined diseases include symptoms, signs, abnormal results of clinical or other investigative procedures, and ill-defined conditions regarding which no diagnosis classifiable elsewhere is recorded. The proportion of deaths assigned to this category is an indicator of data quality.
    <%- endif -%>

  annotation: |-
    <% if cause == 'Maternal conditions' %>United States: Values from 2003–2017 affected by measurement change<%- endif -%>

  # Rendered only for the age bands we derive; see add_derived_age_groups in the garden step. The death-rate text is
  # the retired cancer dataset's, kept as it was; the count one is new (the count is derived too).
  description_processing_derived_age_group_count: |-
    <% if age_group in ["<5 years", "<10 years"] %>
    WHO does not publish this combined age group. We add up the deaths it reports for each of the underlying age groups.
    <%- endif -%>
  description_processing_derived_age_group_rate: |-
    <% if age_group in ["<5 years", "<10 years"] %>
    WHO does not publish a death rate for this combined age group. We add up the deaths it reports for each of the underlying age groups, and divide by the population WHO itself used as the denominator, which we recover from its reported death counts and rates for all causes combined. Where that population cannot be recovered for every underlying age group, we leave the rate missing rather than reporting it as zero.
    <%- endif -%>

  # Rendered only for Unintentional injuries; see correct_unintentional_injuries in the garden step.
  description_processing_unintentional_injuries: |-
    <% if cause == "Unintentional injuries" %>
    In WHO's February 2026 release, this group counts the accidental drug and alcohol poisonings (ICD-10 codes X41, X42, X44 and X45) that WHO's own definition excludes, and that WHO already counts under neuropsychiatric conditions. For the country-years where this makes the cause groups add up to more than all deaths, we set deaths from unintentional injuries to all-cause deaths minus the other cause groups, and recompute the share of deaths and the death rate from that. The age-standardized death rate is left missing for those country-years.
    <%- endif -%>
# http://docs.owid.io/projects/etl/architecture/metadata/reference/
dataset:
  # WHO refreshes the database each February. The data page computes "next expected update" as this
  # step's version date plus this period, so 150 days from 2026-10-13 lands in March 2027.
  update_period_days: 150
  changelog:
    - date: 2026-10-15
      changes:
        - Added violence (homicides) as a drill-down cause inside "Intentional injuries", in the table `intentional_injuries`, with the age bands the homicide charts use (<5, 5-14, 15-49, 50-69, over 70 and <20 years) derived on WHO's own population; previously the separate "WHO Mortality Database - Homicides" dataset, which derived them on UN population and dropped WHO's own age bands.
    - date: 2026-10-14
      changes:
        - Added seven vaccine-preventable diseases (pertussis, poliomyelitis, diphtheria, measles, tetanus, hepatitis B and Japanese encephalitis) as drill-down causes inside "Infectious and parasitic diseases"; they were previously the separate "WHO Mortality Database – Vaccine Preventable" dataset.
        - Added the 25 cancer types as drill-down causes inside "Malignant neoplasms", in the table `cancers`, with the under-5 and under-10 age bands we derive, and the leading cancer type per country, year and sex as the table `most_common_cancer`; previously the separate "WHO Mortality Database - Cancer Deaths" and "Leading cancer types causing death" datasets.
        - Added self-inflicted injuries (suicides) as a drill-down cause inside "Intentional injuries", in the table `intentional_injuries`; previously the separate "WHO Mortality Database - Self-inflicted injuries" dataset.
    - date: 2026-10-13
      changes:
        - Data updated to WHO's February 2026 release; it now runs to 2024.
        - The snapshot is read from the platform's export API instead of manual downloads.
        - icd10_codes is no longer a dimension of the data; the ICD-10 codes, each cause group's depth in WHO's cause tree and its parent group now live in a separate `causes` table.
        - Fixed the producer description for "Diabetes mellitus, blood and endocrine disorders", which had not been rendering.
        - For 45 country-years in WHO's February 2026 release, Unintentional injuries double-counted accidental poisonings (ICD-10 X41, X42, X44, X45); we derive it from the other cause groups there and leave its age-standardized death rate missing.

  owners:
    - Fiona Spooner
    - Lucas Rodés-Guirao
tables:
  mortality_database:
    variables: &fact_variables
      number:
        title: "{definitions.cause_layer}<< cause >> — Deaths — << sex >>, << age_group >>"
        description_short: "{definitions.description_short_number}"
        description_key:
          - "The International Classification of Diseases (Version 10) codes that define {definitions.cause_in_text} are {definitions.icd10_codes}."
        description_from_producer: |-
          {definitions.description_disease_producer}
        description_processing: |-
          {definitions.description_processing_unintentional_injuries}{definitions.description_processing_derived_age_group_count}
        unit: deaths
        display:
          name: "{definitions.display_name_number}"
          numDecimalPlaces: 0
          entityAnnotationsMap: |-
            {definitions.annotation}
        presentation:
          grapher_config:
            note: |-
              All deaths in a country may not have been registered with a [cause of death](#dod:underlying-cause-of-death).
      percentage_of_cause_specific_deaths_out_of_total_deaths:
        title: "{definitions.cause_layer}<< cause >> — Share of total deaths — << sex >>, << age_group >>"
        description_short: "{definitions.description_short_share}"
        description_key:
          - "The International Classification of Diseases (Version 10) codes that define {definitions.cause_in_text} are {definitions.icd10_codes}."
        description_from_producer: |-
          {definitions.description_disease_producer}
        description_processing: |-
          {definitions.description_processing_unintentional_injuries}
        unit: "%"
        short_unit: "%"
        display:
          name: "{definitions.display_name_share}"
          numDecimalPlaces: 1
        presentation:
          grapher_config:
            note: |-
              All deaths in a country may not have been registered with a [cause of death](#dod:underlying-cause-of-death).
      age_standardized_death_rate_per_100_000_standard_population:
        title: "{definitions.cause_layer}<< cause >> — Age-standardized death rate per 100,000 people — << sex >>, << age_group >>"
        description_short: "{definitions.description_short_asr}"
        description_key:
          - "The International Classification of Diseases (Version 10) codes that define {definitions.cause_in_text} are {definitions.icd10_codes}."
        description_from_producer: |-
          {definitions.description_disease_producer}
        description_processing: |-
          {definitions.description_processing_unintentional_injuries}
        unit: deaths per 100,000 people
        display:
          name: "{definitions.display_name_asr}"
          numDecimalPlaces: 1
          entityAnnotationsMap: |-
            {definitions.annotation}
        presentation:
          grapher_config:
            note: |-
              To allow for comparisons between countries and over time, this metric is [age-standardized](#dod:age_standardized). All deaths in a country may not have been registered with a [cause of death](#dod:underlying-cause-of-death).
      death_rate_per_100_000_population:
        title: "{definitions.cause_layer}<< cause >> — Death rate per 100,000 people — << sex >>, << age_group >>"
        description_short: "{definitions.description_short_death_rate}"
        description_key:
          - "The International Classification of Diseases (Version 10) codes that define {definitions.cause_in_text} are {definitions.icd10_codes}."
        description_from_producer: |-
          {definitions.description_disease_producer}
        description_processing: |-
          {definitions.description_processing_unintentional_injuries}{definitions.description_processing_derived_age_group_rate}
        unit: deaths per 100,000 people
        display:
          name: "{definitions.display_name_death_rate}"
          numDecimalPlaces: 1
          entityAnnotationsMap: |-
            {definitions.annotation}
        presentation:
          grapher_config:
            note: |-
              All deaths in a country may not have been registered with a [cause of death](#dod:underlying-cause-of-death).

  # A lookup table, kept in the catalog and not published to Grapher. It records where each cause group sits in
  # WHO's cause tree, so the groups that partition all deaths can be told apart from drill-downs inside them.
  vaccine_preventable_diseases:
    # The retired vaccine_preventable dataset was tagged Vaccination; its successors keep that tag next to the common one.
    common:
      presentation:
        topic_tags:
          - Causes of Death
          - Vaccination
    variables: *fact_variables
  intentional_injuries:
    # The retired self_inflicted_injuries dataset was tagged Mental Health only and the retired homicide dataset Global
    # Health only; each cause keeps its own. The table carries the first; the grapher step sets Global Health on Violence
    # (TOPIC_TAGS_BY_CAUSE), because a tag list cannot vary by dimension here and the schema allows no template in it.
    common:
      presentation:
        topic_tags:
          - Mental Health
    variables: *fact_variables
  cancers:
    # The retired mortality_database_cancer dataset was tagged Causes of Death and Cancer; its successors keep both.
    common:
      presentation:
        topic_tags:
          - Causes of Death
          - Cancer
