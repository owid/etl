dataset:
  update_period_days: 0

  owners:
    - Pablo Arriagada
definitions:
  common:
    presentation:
      topic_tags:
        - State Capacity

  processing_last_date: |-
    COLDAT gives each start and end date of colonial rule in two versions: the latest date given by any of its sources that record that colony, and the average of their dates. We use the latest dates, to be conservative: they mark the years by which all the sources that record the colony agree colonial rule had started or ended.

  processing_years: |-
    COLDAT only lists the years in which each country was a colony. We fill in every year from 1462, the earliest start date in the data, to 2022, so that each country also has values before, between and after its colonial periods.

  processing_europe: |-
    COLDAT only covers overseas colonies, so we leave European countries that were neither colonized nor colonizers without data.

  processing_labels: |-
    For each country and year, we show the name of its colonizer. The eight colonial powers show "Colonizer" in every year. Countries show "Not colonized" before they were first colonized, or if they never were, and "No longer colonized" after their colonial rule ended, including the years between two colonial periods.

  processing_multiple_names: |-
    When a country had more than one colonizer in the same year, we show all their names, separated by a dash.

  processing_multiple_grouped: |-
    When a country had more than one colonizer in the same year, we show "Multiple colonizers".

  processing_last_colonizer: |-
    In years without a colonizer, we show the most recent one, so a country keeps showing its last colonizer after its colonial rule ended. The eight colonial powers show "Colonizer" in every year. Countries show "Never colonized" if they never were, and in the years before they were first colonized.

  processing_years_colonized: |-
    For each country and year, we count how many years it had been a colony up to that year, so the count stays the same after its colonial rule ended. The eight colonial powers and countries that were never colonized show 0.

  processing_total_colonies: |-
    For each of the eight colonial powers, we count how many of today’s countries it colonized in each year. "World" shows the total across all powers, so a country with two colonizers in the same year counts twice. Other countries have no data.

  processing_total_colonies_pop: |-
    For each of the eight colonial powers, we add up the population of the countries it colonized in each year, using our long-run population estimates for each country within its current borders. Other countries have no data.

  processing_colony_number: |-
    For each region and income group, we count how many countries were colonies in each year.

  processing_colony_pop: |-
    For each region and income group, we add up the population of the countries that were colonies in each year, using our long-run population estimates.

  processing_not_colonized_number: |-
    For each region and income group, we count how many countries were neither colonies nor colonial powers in each year. This includes countries whose colonial rule had already ended.

  processing_not_colonized_pop: |-
    For each region and income group, we add up the population of the countries that were neither colonies nor colonial powers in each year, using our long-run population estimates. This includes countries whose colonial rule had already ended, and any population in the region that COLDAT doesn’t cover.

  processing_colonizer_number: |-
    For each region and income group, we count how many of the eight colonial powers had at least one colony in each year.

  processing_colonizer_pop: |-
    For each region and income group, we add up the population of the colonial powers that had at least one colony in each year, using our long-run population estimates.

  processing_regions: |-
    Regions follow Our World in Data’s definitions, and income groups follow the World Bank’s classification. Europe is included because we count Cyprus as a European country, while COLDAT treats it as a European overseas colony.

  description_key_coldat: |-
    This data comes from the Colonial Dates Dataset (COLDAT), compiled by Bastian Becker at the University of Bremen. COLDAT doesn’t collect new historical evidence. Instead, it combines the start and end dates of colonial rule recorded in four existing datasets: the Correlates of War project, and datasets by Lange and coauthors (2006), Wimmer and Min (2006), and Olsson (2009).

  description_key_last_date: |-
    COLDAT gives each start and end date of colonial rule in two versions: the latest date given by any of the datasets that record that colony, and the average of their dates. Not every colony appears in all four datasets. We use the latest dates. This is a conservative choice: a country only counts as a colony from the year all the datasets that record it agree colonial rule had started, and until the year they all agree it had ended. As a result, colonial rule can start later in this data than in some of the datasets COLDAT draws on.

  description_key_missing_colonies: |-
    COLDAT doesn’t include every colony. For example, it doesn’t record Dutch rule in today’s Malaysia (Malacca) or Sri Lanka (Ceylon), and its author notes that colonies none of the four datasets mentions are missing. In such cases, the data can miss years in which a country was colonized, or show the wrong colonizer for them. It also leaves out colonies of European countries other than the eight it covers, such as Denmark and Sweden.

