# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    presentation:
      topic_tags:
        - Global Health
      attribution_short: IHME
    processing_level: major

  description_key_malaria_repeatable: |-
    <% if cause == "Malaria" and metric == "Share" and (age == "<5 years" or age == "5-14 years") %>
    In high-burden areas, some people get malaria more than once a year, so this metric can read higher than the true share of the population infected.
    <%- endif -%>

  # Unlike gbd_prevalence (a point-in-time stock - someone either currently has the condition or
  # doesn't, so it can't double-count), gbd_incidence's Share metric counts new-case events over a
  # year, and the same person can contribute more than one event for repeatable-infection causes
  # (malaria, STIs). So only this table drops the "%" short_unit the shared default gives Share.
  short_unit_incidence: |-
    <%- if metric == "Percent" -%>
    %
    <%- elif metric == "Share" or metric == "Rate" or metric == "Number" -%>
    <%- endif %>

macros: |-
  <% macro title(metric, age, cause, unit) %>
    <% if metric == "Number" %>
        <% if age != 'Age-standardized' and age != 'All ages' %>
            << unit | capitalize >> of << cause >>, among individuals aged << age >>
        <% elif age == 'Age-standardized' %>
            Age-standardized << unit >> of << cause >>
        <% elif age == 'All ages' %>
            Total number of << unit >> of << cause >>
        <% endif %>
    <% elif metric == "Rate" %>
        <% if age != 'Age-standardized' and age != 'All ages' %>
            << unit | capitalize >> of << cause >>, among individuals aged << age >> per 100,000 << age_noun(age) >>
        <% elif age == 'Age-standardized' %>
            Age-standardized << unit >> of << cause >> per 100,000 << age_noun(age) >>
        <% elif age == 'All ages' %>
            << unit | capitalize >> of << cause >> per 100,000 << age_noun(age) >>
        <% endif %>
    <% elif metric == "Share" %>
        <% if age != 'Age-standardized' and age != 'All ages' %>
            << unit | capitalize >> of << cause >>, among individuals aged << age >> per 100 people
        <% elif age == 'Age-standardized' %>
            Age-standardized << unit >> of << cause >> per 100 people
        <% elif age == 'All ages' %>
            << unit | capitalize >> of << cause >> per 100 people
        <% endif %>
    <% endif %>
  <% endmacro %>

  <% macro description_short(metric, age, cause, unit) %>
    <% if metric == "Number" %>
        <% if age != 'Age-standardized' and age != 'All ages' %>
            Estimated number of << unit >> of << cause >> in those aged << age >>.
        <% elif age == 'Age-standardized' %>
            Estimated number of age-standardized << unit >> of << cause >>.
        <% elif age == 'All ages' %>
            Estimated number of << unit >> of << cause >>.
        <% endif %>
    <% elif metric == "Rate" %>
        <% if age != 'Age-standardized' and age != 'All ages' %>
            Estimated number of << unit >> of << cause >> in those aged << age >>, per 100,000 << age_noun(age) >>.
        <% elif age == 'Age-standardized' %>
            Estimated number of age-standardized << unit >> of << cause >>, per 100,000 << age_noun(age) >>.
        <% elif age == 'All ages' %>
            Estimated number of << unit >> of << cause >>, per 100,000 << age_noun(age) >>.
        <% endif %>
    <% elif metric == "Share" %>
        <% if age != 'Age-standardized' and age != 'All ages' %>
            Estimated number of << unit >> of << cause >> in those aged << age >>, per 100 people.
        <% elif age == 'Age-standardized' %>
            Estimated number of age-standardized << unit >> of << cause >>, per 100 people.
        <% elif age == 'All ages' %>
            Estimated number of << unit >> of << cause >>, per 100 people.
        <% endif %>
    <% endif %>
  <% endmacro %>

# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/
dataset:
  update_period_days: 1460
  non_redistributable: true
  owners:
    - Fiona Spooner
tables:
  gbd_prevalence:
    variables:
      value:
        title: |-
          {macros}
          << title(metric, age, format_cause(cause), 'current cases') >>
        unit: |-
          {macros}
          << format_unit(metric, 'cases') >>
        short_unit: |-
          {definitions.short_unit}
        description_short: |-
          {macros}
          << description_short(metric, age, format_cause(cause), 'current cases') >>
        presentation:
          grapher_config:
            note: |-
              {definitions.footnote}
        display:
          numDecimalPlaces: |-
            <% if metric == 'Number' %>0<% else %>1<%- endif -%>
  gbd_incidence:
    variables:
      value:
        title: |-
          {macros}
          << title(metric, age, format_cause(cause), 'new cases') >>
        unit: |-
          {macros}
          << format_unit(metric, 'new cases') >>
        short_unit: |-
          {definitions.short_unit_incidence}
        description_short: |-
          {macros}
          << description_short(metric, age, format_cause(cause), 'new cases') >>
        description_key:
          - |-
            {definitions.description_key_malaria_repeatable}
        presentation:
          grapher_config:
            note: |-
              {definitions.footnote}
        display:
          numDecimalPlaces: |-
            <% if metric == 'Number' %>0<% else %>1<%- endif -%>
