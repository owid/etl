definitions:
  common:
    processing_level: major
    presentation:
      topic_tags:
        - Energy
    description_processing: |-
      - Energy is measured as Total Energy Supply (TES), following the physical energy content method used by the Energy Institute's Statistical Review of World Energy since its 2025 release. Fossil fuels are counted by their gross calorific value; wind, solar and hydropower are counted as the electricity they generate; and nuclear is counted as the heat input to its reactors (using an assumed thermal efficiency of around 33%).
      - The total energy supply is extended to countries not covered by the Statistical Review using the U.S. Energy Information Administration's (EIA) total energy consumption. The Statistical Review is prioritized where both sources are available.
      - The World series is extended back to 1800 using Vaclav Smil's historical estimates (2017), for years before the Statistical Review begins (1965). Only commercially-traded energy sources are included (traditional biomass, which Smil reports but the Statistical Review does not, is excluded so the series stays on a single basis with no step at the splice).

dataset:
  title: Energy mix
  update_period_days: 365
  owners:
    - Pablo Rosado
tables:
  energy_mix:
    variables:
      traditional_biomass_twh:
        title: Traditional biomass
        unit: terawatt-hours
        short_unit: TWh
        description_short: Energy from traditional biomass (fuelwood, charcoal, crop residues, and dung), measured in [terawatt-hours](#dod:watt-hours). This is not part of total energy supply and is shown separately.
        description_processing: |-
          - Traditional biomass (fuelwood, charcoal, crop residues, and dung) is estimated by Vaclav Smil (2017) from per-capita consumption and population, and is available for the World only. The level is highly uncertain, with estimates across the literature spanning roughly a factor of two.
          - Smil's series ends in 2015; for later years we hold the last available value constant, because there is no reliable recent measurement of traditional biomass use. It is kept separate from total energy supply, which follows the Statistical Review's commercially-traded scope.
        display:
          name: Traditional biomass
        presentation:
          title_public: '{tables.energy_mix.variables.traditional_biomass_twh.title}'
      biofuels_annual_change_pct:
        title: Annual change in biofuels (%)
        unit: '%'
        short_unit: '%'
        description_short: Percentage change in [total energy supply](#dod:total-energy-supply) relative to the previous year.
        display:
          name: Biofuels
        presentation:
          title_public: '{tables.energy_mix.variables.biofuels_annual_change_pct.title}'
      biofuels_annual_change_twh:
        title: Annual change in biofuels
        unit: terawatt-hours
        short_unit: TWh
        description_short: Change in [total energy supply](#dod:total-energy-supply) relative to the previous year, measured in [terawatt-hours](#dod:watt-hours).
        display:
