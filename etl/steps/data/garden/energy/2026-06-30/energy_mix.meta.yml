definitions:
  # The long-run World series, which applies to every indicator in this dataset.
  description_processing_smil_world: |-
    - For the World, data before 1965 (going back to 1800) comes from Vaclav Smil's historical estimates (2017).
  # Traditional biomass is not part of total energy supply, so it is left out of every indicator except
  # the ones reported against a biomass-inclusive total (see below).
  description_processing_biomass_excluded: |-
    - Smil also estimates traditional biomass, which the Statistical Review does not cover. We exclude it from this indicator, and report it separately.
  # The traditional biomass series itself, which is only reported for the World.
  description_processing_traditional_biomass: |-
    - Traditional biomass comes from Vaclav Smil's historical estimates (2017), which cover the World only.
    - Smil's estimates end in 2015. For later years, we assume that traditional biomass stays at its 2015 value.
  # Denominator of the shares of primary energy including traditional biomass.
  description_processing_biomass_included: |-
    - The Statistical Review of World Energy does not include data on traditional biomass. We add Vaclav Smil's estimates of traditional biomass to total energy supply.
    - Smil's estimates end in 2015. For later years, we assume that traditional biomass stays at its 2015 value.
  # Total energy supply and the indicators derived from it. This does not apply to the by-source
  # indicators: the EIA is only used to extend the total, and adds no breakdown by source.
  description_processing_eia: |-
    - Total energy supply is extended with total energy consumption from the U.S. Energy Information Administration (EIA), to cover countries and years for which the Statistical Review does not report a total. Where both sources report a value, we use the Statistical Review.
  common:
    processing_level: major
    presentation:
      topic_tags:
        - Energy
    description_processing: |-
      {definitions.description_processing_smil_world}
      {definitions.description_processing_biomass_excluded}

dataset:
  title: Energy mix
  update_period_days: 365
  owners:
    - Pablo Rosado
tables:
  energy_mix:
    variables:
      traditional_biomass_twh:
        title: Traditional biomass
        unit: terawatt-hours
        short_unit: TWh
        description_short: Energy from traditional biomass (fuelwood, charcoal, crop residues, and dung), measured in [terawatt-hours](#dod:watt-hours). This is not part of total energy supply and is shown separately.
        # Not total energy supply, so the shared key points about how it is measured do not apply here.
        description_key:
          - Traditional biomass is fuelwood, charcoal, crop residues and dung. It is not part of total energy supply, which covers only fuels that are traded commercially.
          - Traditional biomass is only available at the global level.
        description_processing: |-
          {definitions.description_processing_traditional_biomass}
        display:
          name: Traditional biomass
        presentation:
          title_public: '{tables.energy_mix.variables.traditional_biomass_twh.title}'
