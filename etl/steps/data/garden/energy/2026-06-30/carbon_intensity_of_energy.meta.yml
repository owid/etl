definitions:
  common:
    processing_level: major
    presentation:
      topic_tags:
        - Energy
        - CO2 & Greenhouse Gas Emissions
    unit: grams of CO₂ per kilowatt-hour
    short_unit: gCO₂/kWh
    description_processing: |-
      - Carbon intensity of energy is calculated by dividing fossil CO₂ emissions (from the Global Carbon Budget) by total energy supply (from our energy mix dataset), expressed in grams of CO₂ per kilowatt-hour.
      - Total energy supply follows the physical energy content method used by the Energy Institute's Statistical Review of World Energy since its 2025 release. This replaces the older substitution method, under which renewables and nuclear were scaled up to a fossil-fuel-equivalent; because that scaling raised the denominator, the substitution-method intensity was lower than the value shown here.

dataset:
  title: Carbon intensity of energy
  update_period_days: 365
  owners:
    - Pablo Rosado
