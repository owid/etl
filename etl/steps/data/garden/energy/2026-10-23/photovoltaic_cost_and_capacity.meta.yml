tables:
  # NOTE: Some metadata fields are filled out programmatically in the garden step.
  photovoltaic_cost_and_capacity:
    title: Solar photovoltaic cost and capacity
    variables:
      cost:
        title: Solar photovoltaic module price
        description_short: |-
          This data is expressed in US dollars per watt, adjusted for inflation.
        unit: "constant {LATEST_YEAR} US$ per watt"
        short_unit: "$/W"
        description_key:
          - "Solar photovoltaic module prices refer to the cost of the solar panel itself, and do not include installation or other system components."
          - "Prices are compiled from four sources: Nemet (2009) for 1975–2003, Farmer & Lafond (2016) for 2004–2009, IRENA's Renewable Power Generation Costs in 2024 report for 2010–2019, and IRENA's Renewable Power Generation Costs in 2025 report for 2020 onward."
          - "Due to limited data availability, from 2010 onward we use benchmark prices for modules sold in Europe, which IRENA reports based on data from the trading platform pvXchange. Up to 2019, we use IRENA's global module price index. IRENA has stopped publishing this index, so from 2020 we use its price for mainstream modules, which are standard crystalline silicon modules."
          - "Historical prices have been adjusted for inflation using the [World Bank's US GDP deflator (linked series)](https://data.worldbank.org/indicator/NY.GDP.DEFL.ZS.AD?locations=US)."
        display:
          name: Solar PV module cost
          shortUnit: "$"
        presentation:
          title_public: Solar photovoltaic module price
          grapher_config:
            note: "Costs are expressed in constant {LATEST_YEAR} US$ per watt. Global estimates are used before 2010; European market benchmarks thereafter due to limited data availability."
        description_processing: |-
          - Historical photovoltaic cost data between 1975 and 2003 has been taken from Nemet (2009), and between 2004 and 2009 from Farmer & Lafond (2016).
          - From 2010 to 2019, prices come from the global module price index in IRENA's Renewable Power Generation Costs in 2024 report (the 'Thin film a-Si/u-Si or Global Price Index (from Q4 2013)' series), based on pvXchange benchmarks for modules sold in Europe. IRENA dropped this index from its later reports.
          - From 2020 onward, prices come from the 'Mainstream' module series in IRENA's Renewable Power Generation Costs in 2025 report, also based on pvXchange benchmarks for modules sold in Europe. Between 2020 and 2023, the two series differ by less than 20%, so we join them without rescaling either one.
          - Prices from Nemet (2009), Farmer & Lafond (2016), and IRENA's global price index have been converted to {LATEST_YEAR} US$ using the US GDP deflator (linked series), to account for the effects of inflation. The deflator data is available from the [World Bank World Development Indicators](https://data.worldbank.org/indicator/NY.GDP.DEFL.ZS.AD?locations=US).
      cost_source:
        title: Source for each value of cost data
        unit: ''
      cumulative_capacity:
        title: Solar photovoltaic cumulative capacity
        display:
          name: Cumulative installed solar PV capacity
        presentation:
          title_public: Solar photovoltaic cumulative capacity
      cumulative_capacity_source:
        title: Source for each value of cumulative capacity data
        unit: ''
