# Known upstream data errors in the UN WPP demographic indicators, corrected locally until fixed at
# the source. See etl/data_corrections.py for the format.
#
# Central African Republic: WPP 2024 injects an implausible mortality shock into six single years.
# The Demographic Indicators file gives CAR a life expectancy at birth of 14.7 years (2009), 40.3
# (2014), 45.2 (2017), 31.5 (2019), 40.3 (2021) and 18.8 (2022), against a smooth 46-57 in every
# neighbouring year, with the matching death series: 281,000 deaths in 2022 in a population of 5.1
# million (a crude death rate of 55 per 1,000) and 328,000 in 2009 (72 per 1,000). Nothing of that
# kind happened in CAR in any of those years.
#
# This is the same defect, in the same years, as the one corrected in
# un/2024-12-02/un_wpp_lt.corrections.yml (WPP's life tables) -- see that file for the full evidence
# trail -- and in un/2026-06-09/igme.corrections.yml (UN IGME's child-mortality estimates, which
# share an input with WPP rather than being an independent confirmation).
# It is corrected here as well because this dataset, not the life tables, is what 12 published life
# expectancy charts and the death/mortality charts read from; fixing only one of the two would leave
# the site showing 18.8 years on some charts and a gap on others.
#
# One entry, applied to three tables. `action: drop` with `entity` + `years` removes whole rows and
# never reads the `indicator` column, so this single entry is applied to the life-expectancy, deaths
# and mortality-rate tables in turn (see un_wpp.py); the `indicator` field below is documentation.
# Population and births are deliberately left alone: their values stay within a plausible range, and
# population is a denominator across the whole pipeline.
#
# Not corrected, and worth revisiting: `growth_rate` and `natural_change_rate` for the same
# country-years inherit the inflated deaths (CAR's population change goes negative in 2022). They
# look merely unusual rather than impossible, so they are left as published.
#
# No `expect` guard is set because the snapshot version is pinned and cannot change under us --
# revisit this file when the step is bumped to a new WPP revision.
- indicator: life_expectancy
  entity: Central African Republic
  years: [2009, 2014, 2017, 2019, 2021, 2022]
  action: drop
  reason: >-
    WPP 2024 gives the Central African Republic an impossible mortality shock in these six years
    (life expectancy at birth of 14.7 in 2009 and 18.8 in 2022, against 46-57 in every neighbouring
    year, with matching death counts). Dropped rather than replaced, since no corrected figure is
    published.
  provider: United Nations
  status: open
