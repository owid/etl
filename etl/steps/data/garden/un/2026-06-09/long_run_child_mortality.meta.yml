definitions:
  common:
    presentation:
      topic_tags:
        - Child & Infant Mortality
      attribution: Gapminder (2015); UN Inter-agency Group for Child Mortality Estimation (2025)
  regions:
    description_processing: |-
      We calculate regional averages from our long-run child mortality data for each country, which combines Gapminder and UN IGME estimates. Each country's rate counts in proportion to its weight. We use three different weights, each from the UN World Population Prospects: total population, the population under age five, and the number of live births in the same year.

      We only calculate an average for a region and year if the countries with data are home to at least 80% of the region's population. We only show years from 1950 onwards, the first year with UN World Population Prospects data.
    attribution: Gapminder (2015); UN Inter-agency Group for Child Mortality Estimation (2025); UN, World Population Prospects (2024)

dataset:
  update_period_days: 365
  title: Long-run data – Gapminder & UN IGME
  owners:
    - Fiona Spooner
    - Edouard Mathieu
tables:
  long_run_child_mortality:
    variables:
      child_mortality_rate_full:
        title: Child mortality rate (full)
        description_short: Estimated share of newborns who die before reaching the age of five.
        unit: deaths per 100 live births
        short_unit: "%"
        display:
          numDecimalPlaces: 1
        description_key: []
      share_dying_first_five_years:
        title: Share dying in first five years
        description_short: Share of children who die before reaching the age of five.
        unit: "%"
        short_unit: "%"
        description_key: []
      share_surviving_first_five_years:
        title: Share surviving first five years
        description_short: Share of children who survive to reach the age of five.
        short_unit: "%"
        unit: "%"
        description_key: []
  long_run_child_mortality_selected:
    variables:
      source:
        title: Source used
        description_short: This variable is a combination of data from Gapminder and UN IGME, this shows the source used for each data point.
        unit: ""
      source_url:
        title: Source URL
        unit: ""
      child_mortality_rate:
        title: Child mortality rate
        unit: deaths per 100 live births
        short_unit: "%"
        display:
          numDecimalPlaces: 1
          name: Child mortality rate
        description_short: Long-run estimated share of newborns who die before reaching the age of five.
        description_key:
          - "Child mortality, the death of children under the age of five, is still extremely common in our world today. The historical data makes clear that it doesn’t have to be this way: societies can protect their children and reduce child mortality to very low rates. For child mortality to reach low levels, many things have to go right at the same time: good healthcare, good nutrition, clean water and sanitation, maternal health, and high living standards. We can, therefore, think of child mortality as a proxy indicator of a country’s living conditions."
          - "The chart shows our long-run data on child mortality, which allows you to see how child mortality has changed in countries around the world. It combines data from two sources: Gapminder and the UN Inter-agency Group for Child Mortality Estimation (UN IGME)."
          - "[Gapminder](https://www.gapminder.org/data/documentation/gd005/) provides estimates of child mortality rates from 1800 to 2015. The full list of sources used can be found in [their documentation](https://www.gapminder.org/data/documentation/gd005/)."
          - "[UN IGME](https://childmortality.org/all-cause-mortality/data) provides estimates of child mortality rates for some countries from 1932 onward."
          - For years where data from both sources is available, we prioritize the UN IGME data. See [this page](https://docs.google.com/spreadsheets/d/1SaeXxXXeBAATXH3HTmonyPiBd7j0laE6GBUlcboTgYk/edit) for more details on which source is used for each data point.
          - This indicator is calculated as the number of children under the age of five who died in a given year, divided by the number of newborns in that year.

        description_processing: >-
          This indicator is a combination of data from two sources:
            - Gapminder, which provides estimates of child mortality rates for the years 1800 to 2015.
            - The UN Inter-agency Group for Child Mortality Estimation (UN IGME) provides estimates of child mortality rates, for some countries from 1932 onward.

          For years where data from both sources is available, we prioritize the UN IGME data. See [this page](https://docs.google.com/spreadsheets/d/1SaeXxXXeBAATXH3HTmonyPiBd7j0laE6GBUlcboTgYk/edit) for more details on which source is used for each data point.


          In the Gapminder dataset we remove rows where the source is labeled as "Guesstimate" or "Model based on Life Expectancy" to try and ensure we use the best available data.


          We remove data for Austria before 1830 from the Gapminder dataset, as there is a jump in 1830 that is likely an error.
        presentation:
          title_public: Child mortality rate
          title_variant: Long-run data
          attribution_short: Gapminder; UN IGME
          grapher_config:
            title: Child mortality rate
            subtitle: Estimated share of newborns who die before reaching the age of five.
            variantName: Long-run data – Gapminder & UN IGME
            sourceDesc: Gapminder (2015); UN IGME (2025)
            originUrl: https://ourworldindata.org/child-mortality
            hasMapTab: true
            yAxis:
              max: 0
              min: 0
            minTime: 1800
            map:
              time: latest
              colorScale:
                baseColorScheme: YlOrRd
                binningStrategy: manual
                customNumericColors:
                  -
                  -
                  -
                customNumericValues:
                  - 0
                  - 0.3
                  - 0.5
                  - 1
                  - 3
                  - 5
                  - 10
                  - 30
                  - 50
              timeTolerance: 0
            selectedEntityNames:
              - United States
              - United Kingdom
              - Sweden
              - France
              - Brazil
              - India
              - Ghana
              - Nigeria
  long_run_child_mortality_regions:
    title: Long-run child mortality – regional averages
    variables:
      child_mortality_rate_weighted_population:
        title: Child mortality rate (regional average, weighted by total population)
        unit: deaths per 100 live births
        short_unit: "%"
        description_short: Estimated share of newborns who die before reaching the age of five. Regional averages are weighted by each country's total population.
        description_processing: "{definitions.regions.description_processing}"
        display:
          name: Weighted by total population
          numDecimalPlaces: 1
        presentation:
          attribution: "{definitions.regions.attribution}"
      child_mortality_rate_weighted_population_0_4:
        title: Child mortality rate (regional average, weighted by population under age five)
        unit: deaths per 100 live births
        short_unit: "%"
        description_short: Estimated share of newborns who die before reaching the age of five. Regional averages are weighted by each country's population under age five.
        description_processing: "{definitions.regions.description_processing}"
        display:
          name: Weighted by population under age five
          numDecimalPlaces: 1
        presentation:
          attribution: "{definitions.regions.attribution}"
      child_mortality_rate_weighted_births:
        title: Child mortality rate (regional average, weighted by births)
        unit: deaths per 100 live births
        short_unit: "%"
        description_short: Estimated share of newborns who die before reaching the age of five. Regional averages are weighted by each country's number of live births.
        description_processing: "{definitions.regions.description_processing}"
        display:
          name: Weighted by births
          numDecimalPlaces: 1
        presentation:
          attribution: "{definitions.regions.attribution}"
  un_wpp_child_mortality:
    title: Child mortality rate – UN World Population Prospects
    variables:
      child_mortality_rate:
        title: Child mortality rate (UN World Population Prospects)
        unit: deaths per 100 live births
        short_unit: "%"
        description_short: Estimated share of newborns who die before reaching the age of five.
        description_processing: |-
          The UN World Population Prospects publishes figures for World and for income groups, which we show as they are. We add averages for continents and the European Union, weighting each country's rate by its number of live births. We also recalculate the UN's own regions in the same way, shown as, for example, "Africa (UN, births-weighted)", next to the UN's published figure, "Africa (UN)". We only calculate an average for a region and year if the countries with data are home to at least 80% of the region's population.
        display:
          name: Child mortality rate (UN WPP)
          numDecimalPlaces: 1
        presentation:
          attribution: UN, World Population Prospects (2024)
          attribution_short: UN WPP
