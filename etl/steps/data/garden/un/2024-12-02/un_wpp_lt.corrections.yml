# Known upstream data errors in the UN WPP life tables, corrected locally until fixed at the source.
# See etl/data_corrections.py for the format.
#
# Central African Republic: WPP 2024 injects an implausible mortality shock into six single years.
# Life expectancy at birth for CAR reads 14.7 years (2009), 40.3 (2014), 45.2 (2017), 31.5 (2019),
# 40.3 (2021) and 18.8 (2022), against a smooth 46-57 in every neighbouring year. The 2022 value is
# the lowest anywhere in the dataset after 2010 apart from CAR's own 2019, and the whole life table
# for those years is scaled with it (the 2022 table implies 281,000 deaths in a population of 5.1
# million, a crude death rate of 55 per 1,000). Nothing of that kind happened in CAR in any of those
# years, and the UN's own regional aggregate for Middle Africa shows no corresponding dip.
#
# Established before correcting:
#   - It is not our processing. The values are identical in the raw snapshot CSV
#     (un/2024-12-02/un_wpp_lt_all.csv), in WPP's separate Demographic Indicators file
#     (un/2024-07-12/un_wpp_demographic_indicators.xlsx), and in the World Bank's WDI republication
#     of WPP (SP.DYN.LE00.IN, retrieved 2026-09-02).
#   - The same six years spike in UN IGME 2025's independent CAR estimates: under-five mortality of
#     489 per 1,000 (2009) and 425 (2022) against a 113-155 baseline; see the sibling correction in
#     un/2026-06-09/igme.corrections.yml. Only post-neonatal ages are affected in both sources --
#     CAR's neonatal mortality and stillbirth rates stay flat across the same years, which is what
#     identifies this as a misapplied crisis-mortality shock rather than a real event.
#   - There is no upstream fix to wait for: WPP 2024 is still the current revision, and the UN's
#     interim-update bundle (WPP2024_CSV_files_update.zip) still contains only the 2026-01-19 Togo
#     revision.
#
# The whole row is dropped rather than just the life-expectancy cell: every column of the life table
# (mx, qx, lx, dx, ex, ...) carries the same inflated mortality, so blanking one and publishing the
# rest would be inconsistent. No `expect` guard is set because the snapshot version is pinned and
# cannot change under us -- revisit this file when the step is bumped to a new WPP revision.
- indicator: life_expectancy
  entity: Central African Republic
  years: [2009, 2014, 2017, 2019, 2021, 2022]
  action: drop
  reason: >-
    WPP 2024 gives the Central African Republic an impossible mortality shock in these six years
    (life expectancy at birth of 14.7 in 2009 and 18.8 in 2022, against 46-57 in every neighbouring
    year). Dropped rather than replaced, since no corrected figure is published.
  provider: United Nations
  status: open
