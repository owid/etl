# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    processing_level: minor
    presentation:
      attribution_short: ILO and UNICEF
      topic_tags:
        - Child Labor
    display: &common_display
      tolerance: 0

  sex: |-
    <% if sex == "total" %>
    children
    <%- else %>
    <<sex>>
    <%- endif %>

  description_key_child_labor_household_chores: |-
    <% if age == "5-11" %>
    Child labor for children aged 5-11 is defined as those who did at least one hour of economic activity and/or at least 21 hours of unpaid household services during the reference week.
    <%- elif age == "12-14" %>
    Child labor for children aged 12-14 is defined as those who did at least 14 hours of economic activity and/or at least 21 hours of unpaid household services during the reference week.
    <%- elif age == "15-17" %>
    Child labor for children aged 15-17 is defined as those who did at least 43 hours of economic activity during the reference week.
    <%- elif age == "5-14" %>
    Child labor is defined differently depending on the age group: for children aged 5-11, it includes those who did at least one hour of economic activity and/or at least 21 hours of unpaid household services; for children aged 12-14, it includes those who did at least 14 hours of economic activity and/or at least 21 hours of unpaid household services.
    <%- elif age == "5-17" %>
    Child labor is defined differently depending on the age group: for children aged 5-11, it includes those who did at least one hour of economic activity and/or at least 21 hours of unpaid household services; for children aged 12-14, it includes those who did at least 14 hours of economic activity and/or at least 21 hours of unpaid household services; and for children aged 15-17, it includes those who did at least 43 hours of economic activity during the reference week.
    <%- endif %>
  description_key_child_labor_economic_activity: |-
    <% if age == "5-11" %>
    Child labor for children aged 5-11 is defined as those who did at least one hour of economic activity during the reference week.
    <%- elif age == "12-14" %>
    Child labor for children aged 12-14 is defined as those who did at least 14 hours of economic activity during the reference week.
    <%- elif age == "15-17" %>
    Child labor for children aged 15-17 is defined as those who did at least 43 hours of economic activity during the reference week.
    <%- elif age == "5-14" %>
    Child labor is defined differently depending on the age group: for children aged 5-11, it includes those who did at least one hour of economic activity; for children aged 12-14, it includes those who did at least 14 hours of economic activity.
    <%- elif age == "5-17" %>
    Child labor is defined differently depending on the age group: for children aged 5-11, it includes those who did at least one hour of economic activity; for children aged 12-14, it includes those who did at least 14 hours of economic activity; and for children aged 15-17, it includes those who did at least 43 hours of economic activity during the reference week.
    <%- endif %>

  description_key_child_labor_hazardous_work: |-
    The definition of child labor also includes children who are doing hazardous work, those who work in hazardous occupations, hazardous industries (mining, quarrying and construction) or working long hours (at least 43 hours per week). The full list of hazardous occupations can be found in the [Methodology of the ILO-UNICEF Global Estimates of Child Labour documentation](https://www.ilo.org/publications/methodology-2024-ilo-unicef-global-estimates-child-labour).

  description_key_hazardous_work: |-
    Children in hazardous work are those in child labor who work in hazardous occupations, hazardous industries (mining, quarrying and construction) or working long hours (at least 43 hours per week). The full list of hazardous occupations can be found in the [Methodology of the ILO-UNICEF Global Estimates of Child Labour documentation](https://www.ilo.org/publications/methodology-2024-ilo-unicef-global-estimates-child-labour).

  description_key_modelled_data: |-
    This data comes from nationally representative household surveys, covering around 60% of the global population of children. To construct a global series with complete coverage, the [International Labour Organization (ILO)](#dod:ilo) and UNICEF use a statistical model to estimate child labor prevalence in countries with missing data. You can read more about how these estimates are produced in the [Methodology of the ILO-UNICEF Global Estimates of Child Labour documentation](https://www.ilo.org/publications/methodology-2024-ilo-unicef-global-estimates-child-labour).

  description_key_household_chores_definition: |-
    Unpaid household chores refer to activities such as cooking, cleaning, and childcare performed within a child's own home.

  description_key_household_chores_not_included: |-
    Unpaid household chores — such as cooking, cleaning, and childcare performed within a child's own home — are not counted as child labor under this definition.

  description_key_worst_forms_not_included: |-
    The data does not include the worst forms of child labor that cannot be measured through surveys (trafficking, forced labor, etc.).

  description_key_sector: |-
    <% if sector == "Agriculture" %>
    The agriculture sector includes crop and animal production, hunting, forestry, logging, and fishing and aquaculture activities, as defined by the [International Standard Industrial Classification of All Economic Activities (ISIC)](https://ilostat.ilo.org/methods/concepts-and-definitions/classification-economic-activities/).
    <%- elif sector == "Industry" %>
    The industry sector includes mining and quarrying, manufacturing, construction, and public utilities (electricity, gas, and water), as defined by the [International Standard Industrial Classification of All Economic Activities (ISIC)](https://ilostat.ilo.org/methods/concepts-and-definitions/classification-economic-activities/).
    <%- elif sector == "Services" %>
    The services sector includes wholesale and retail trade; restaurants and hotels; transport, storage, and communications; financing, insurance, real estate, and business and administrative services; and public administration, community, social, and personal services, as defined by the International Standard Industrial Classification of All Economic Activities (ISIC).
    <%- endif %>

  note_excluding_household_chores: |-
    Work here refers to economic activities (employment and production of goods). Household chores such as cooking, cleaning, and childcare are not included. Does not include the worst forms of child labor that cannot be measured through surveys (trafficking, forced labor, etc.).
  note_including_household_chores: |-
    Work here refers to economic activities (employment and production of goods). Does not include the worst forms of child labor that cannot be measured through surveys (trafficking, forced labor, etc.).

  # Age clause spliced into chart titles: empty for the full 5-17 range (matching the standalone charts), " aged <<age>>" otherwise.
  title_age_suffix: |-
    <% if age == "5-17" %><%- else %> aged <<age>><%- endif %>

  description_key_non_hazardous_child_labor: |-
    Non-hazardous child labor counts children whose work isn't hazardous, but who are still in child labor because they are too young to work, or work too many hours for their age. Work by children aged 15 to 17 only counts as child labor if it's hazardous, so at those ages non-hazardous child labor is zero.

  description_key_hazardous_work_definition_changes: |-
    To keep the estimates comparable over time, the ILO and UNICEF still measure child labor with the framework of earlier rounds. Some details have changed, though: the 2008, 2012 and 2016 estimates also counted children in other hazardous conditions, such as night work, where surveys asked about them, and the 2024 estimates use an updated list of hazardous occupations. They don't say how much this affects the trend.

  # The 2024 report has World estimates by age from 2008 (child labor) and 2016 (hazardous work); earlier years come from the 2013 report.
  text_age_2013_report: |-
    The 2024 report breaks the world estimates down by age only from 2008 for child labor, and from 2016 for hazardous work. For the world, we fill the earlier years with the estimates by age in Table 5 of the ILO's 2013 report, "Marking progress against child labour", where it has them. That report's world totals for 2000 to 2012 match those in the 2024 report.

  description_processing_age_2013_report: |-
    <% if sex == "total" and age in ["5-11", "12-14", "5-14", "15-17"] %>
    {definitions.text_age_2013_report}
    <%- endif %>

  description_processing_non_hazardous_child_labor: |-
    We calculate non-hazardous child labor by subtracting the children in hazardous work from the children in child labor.
    <%- if sex == "total" and age in ["5-11", "12-14", "5-14", "15-17"] %> {definitions.text_age_2013_report}
    <%- endif %>


# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/
dataset:
  # Set explicitly because the dataset now combines two ILO reports, so no single origin title is inherited.
  title: ILO-UNICEF Global Estimates of Child Labour
  update_period_days: 429


  owners:
    - Pablo Arriagada
tables:
  child_labor:
    variables:
      share_child_labor:
        title: Share of children in child labor (<<sex>>, <<age>>)
        unit: "%"
        short_unit: "%"
        description_short: Percentage of {definitions.sex} aged <<age>> who are either working at an age that is too young for them to be employed, or doing work that — by its nature or conditions — is likely to harm their health, safety, or morals.
        description_key:
          - "{definitions.description_key_child_labor_economic_activity}"
          - "{definitions.description_key_child_labor_hazardous_work}"
          - "{definitions.description_key_household_chores_not_included}"
          - "{definitions.description_key_worst_forms_not_included}"
          - "{definitions.description_key_modelled_data}"
        description_processing: "{definitions.description_processing_age_2013_report}"
        presentation:
          grapher_config:
            title: Share of {definitions.sex}{definitions.title_age_suffix} in child labor
            subtitle: Percentage of {definitions.sex} aged <<age>> who are either working at an age that is too young for them to be employed, or doing work that — by its nature or conditions — is likely to harm their health, safety, or morals.
            note: "{definitions.note_excluding_household_chores}"
        display:
          name: Share of {definitions.sex} in child labor (<<age>>)
          numDecimalPlaces: 1
          <<: *common_display

      number_child_labor:
        title: Number of children in child labor (<<sex>>, <<age>>)
        unit: "children"
        short_unit: ""
        description_short: Number of {definitions.sex} aged <<age>> who are either working at an age that is too young for them to be employed, or doing work that — by its nature or conditions — is likely to harm their health, safety, or morals.
        description_key:
          - "{definitions.description_key_child_labor_economic_activity}"
          - "{definitions.description_key_child_labor_hazardous_work}"
          - "{definitions.description_key_household_chores_not_included}"
          - "{definitions.description_key_worst_forms_not_included}"
          - "{definitions.description_key_modelled_data}"
        description_processing: "{definitions.description_processing_age_2013_report}"
        presentation:
          grapher_config:
            title: Number of {definitions.sex}{definitions.title_age_suffix} in child labor
            subtitle: Number of {definitions.sex} aged <<age>> who are either working at an age that is too young for them to be employed, or doing work that — by its nature or conditions — is likely to harm their health, safety, or morals.
            note: "{definitions.note_excluding_household_chores}"
        display:
          name: Number of {definitions.sex} in child labor (<<age>>)
          numDecimalPlaces: 0
          <<: *common_display

      share_hazardous_work:
        title: Share of children in hazardous work (<<sex>>, <<age>>)
        unit: "%"
        short_unit: "%"
        description_short: Percentage of {definitions.sex} aged <<age>> in [child labor](#dod:child-labor) who are doing work that — by its nature or conditions — is likely to harm their health, safety, or morals.
        description_key:
          - "{definitions.description_key_hazardous_work}"
          - "{definitions.description_key_household_chores_not_included}"
          - "{definitions.description_key_worst_forms_not_included}"
          - "{definitions.description_key_modelled_data}"
        description_processing: "{definitions.description_processing_age_2013_report}"
        presentation:
          grapher_config:
            title: Share of {definitions.sex}{definitions.title_age_suffix} in hazardous work
            subtitle: Percentage of {definitions.sex} aged <<age>> in [child labor](#dod:child-labor) who are doing work that — by its nature or conditions — is likely to harm their health, safety, or morals.
            note: "{definitions.note_excluding_household_chores}"
        display:
          name: Share of {definitions.sex} in hazardous work (<<age>>)
          numDecimalPlaces: 1
          <<: *common_display

      number_hazardous_work:
        title: Number of children in hazardous work (<<sex>>, <<age>>)
        unit: "children"
        short_unit: ""
        description_short: Number of {definitions.sex} aged <<age>> in [child labor](#dod:child-labor) who are doing work that — by its nature or conditions — is likely to harm their health, safety, or morals.
        description_key:
          - "{definitions.description_key_hazardous_work}"
          - "{definitions.description_key_household_chores_not_included}"
          - "{definitions.description_key_worst_forms_not_included}"
          - "{definitions.description_key_modelled_data}"
        description_processing: "{definitions.description_processing_age_2013_report}"
        presentation:
          grapher_config:
            title: Number of {definitions.sex}{definitions.title_age_suffix} in hazardous work
            subtitle: Number of {definitions.sex} aged <<age>> in [child labor](#dod:child-labor) who are doing work that — by its nature or conditions — is likely to harm their health, safety, or morals.
            note: "{definitions.note_excluding_household_chores}"
        display:
          name: Number of {definitions.sex} in hazardous work (<<age>>)
          numDecimalPlaces: 0
          <<: *common_display

      share_non_hazardous_child_labor:
        title: Share of children in non-hazardous child labor (<<sex>>, <<age>>)
        unit: "%"
        short_unit: "%"
        description_short: Percentage of {definitions.sex} aged <<age>> who are in [child labor](#dod:child-labor) but not doing hazardous work.
        description_key:
          - "{definitions.description_key_non_hazardous_child_labor}"
          - "{definitions.description_key_child_labor_economic_activity}"
          - "{definitions.description_key_hazardous_work}"
          - "{definitions.description_key_hazardous_work_definition_changes}"
          - "{definitions.description_key_household_chores_not_included}"
          - "{definitions.description_key_worst_forms_not_included}"
          - "{definitions.description_key_modelled_data}"
        description_processing: "{definitions.description_processing_non_hazardous_child_labor}"
        presentation:
          grapher_config:
            note: "{definitions.note_excluding_household_chores}"
        display:
          name: Share of {definitions.sex} in non-hazardous child labor (<<age>>)
          numDecimalPlaces: 1
          <<: *common_display

      number_non_hazardous_child_labor:
        title: Number of children in non-hazardous child labor (<<sex>>, <<age>>)
        unit: "children"
        short_unit: ""
        description_short: Number of {definitions.sex} aged <<age>> who are in [child labor](#dod:child-labor) but not doing hazardous work.
        description_key:
          - "{definitions.description_key_non_hazardous_child_labor}"
          - "{definitions.description_key_child_labor_economic_activity}"
          - "{definitions.description_key_hazardous_work}"
          - "{definitions.description_key_hazardous_work_definition_changes}"
          - "{definitions.description_key_household_chores_not_included}"
          - "{definitions.description_key_worst_forms_not_included}"
          - "{definitions.description_key_modelled_data}"
        description_processing: "{definitions.description_processing_non_hazardous_child_labor}"
        presentation:
          grapher_config:
            note: "{definitions.note_excluding_household_chores}"
        display:
          name: Number of {definitions.sex} in non-hazardous child labor (<<age>>)
          numDecimalPlaces: 0
          <<: *common_display

      share_child_labor_not_in_school:
        title: Share of children in child labor who are not attending school (<<sex>>, <<age>>)
        unit: "%"
        short_unit: "%"
        description_short: Percentage of {definitions.sex} aged <<age>> in [child labor](#dod:child-labor) who are not attending school.
        description_key:
          - "{definitions.description_key_child_labor_economic_activity}"
          - "{definitions.description_key_child_labor_hazardous_work}"
          - "{definitions.description_key_household_chores_not_included}"
          - "{definitions.description_key_worst_forms_not_included}"
          - "{definitions.description_key_modelled_data}"
        presentation:
          grapher_config:
            note: "{definitions.note_excluding_household_chores}"
        display:
          name: Share of {definitions.sex} in child labor who are not attending school (<<age>>)
          numDecimalPlaces: 0
          <<: *common_display

      number_child_labor_not_in_school:
        title: Number of children in child labor who are not attending school (<<sex>>, <<age>>)
        unit: "children"
        short_unit: ""
        description_short: Number of {definitions.sex} aged <<age>> in [child labor](#dod:child-labor) who are not attending school.
        description_key:
