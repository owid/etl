  pension_expenditure:
    common:
      presentation:
        topic_tags:
          - Government Spending
      display:
        numDecimalPlaces: 1
        tolerance: 0
    variables:
      public_pension_expenditure:
        title: Public spending on pensions
        unit: "% of GDP"
        short_unit: "%"
        description_short: |-
          Government spending on old-age and survivors’ pensions paid in cash, as a share of [GDP](#dod:gdp).
        description_key: |-
          This includes public pensions paid to older people and to the surviving partners of people who have died. It doesn’t include benefits in kind, such as care services, and it is measured before taxes.

          The OECD takes this data from its Social Expenditure Database (SOCX).
        description_processing: |-
          The OECD labels its latest values as 2021, but notes that they refer to 2022 in Australia, Canada, France, Japan, New Zealand, South Korea, and the United Kingdom, and to 2023 in Chile, Colombia, Costa Rica, Israel, Mexico, and the United States. We assign them to those years.
        display:
          name: Past spending
          numDecimalPlaces: 1
          tolerance: 0
        presentation:
          title_public: Public spending on pensions

      public_pension_expenditure_projected:
        title: Public spending on pensions (projections)
        unit: "% of GDP"
        short_unit: "%"
        description_short: |-
          Projected government spending on pensions, as a share of [GDP](#dod:gdp).
        description_key: |-
          {definitions.description_key_projections_sources}

          The first year in this data, 2023, refers to 2023 or 2024, depending on the country.
        display:
          name: Projections
          numDecimalPlaces: 1
          tolerance: 0
          isProjection: true
        presentation:
          title_public: Public spending on pensions (projections)
