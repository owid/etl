# Croatia: an effective age of labor market exit of 0 for women in 1990 and 1992 (the series for men starts in 1995).
- indicator: value
  entity: Croatia
  years: [1990, 1992]
  match: {measure: ELMEA, sex: F}
  action: drop
  expect: {eq: 0}
  reason: Missing value published as 0 (an exit age of 0 is impossible).
  producer: OECD
  status: open
