# OECD's values for South Korea from 2022 onwards are each the previous year's figure from Statistics Korea:
# OECD 2022 = 2.95 (KOSTAT 2021: 2.9%), OECD 2023 = 3.92 (KOSTAT 2022: 3.9%), OECD 2024 = 4.72 (KOSTAT 2023: 4.7%).
# OECD 2020 (2.52) still matches KOSTAT 2020 (2.52%), so the shift starts in 2022.
# Sources:
# - https://www.koreatimes.co.kr/business/banking-finance/20240828/almost-5-of-births-in-korea-are-outside-marriage-hitting-record-high-stats-agency (2021: 2.9%, 2022: 3.9%, 2023: 4.7%)
# - https://www.koreajoongangdaily.com/korea/births-outside-marriage-in-korea-hit-record-high-as-family-norms-shift-1/12851164 (2020: 2.52%, 2024: 5.80%)
- indicator: births_outside_marriage
  entity: South Korea
  years: [2022]
  action: override
  value: 3.9
  expect: {lt: 3.5}
  reason: OECD's 2022 value is Statistics Korea's 2021 figure; the series is shifted by one year. We use Statistics Korea's 2022 figure.
  producer: OECD
  status: open
- indicator: births_outside_marriage
  entity: South Korea
  years: [2023]
  action: override
  value: 4.7
  expect: {lt: 4.3}
  reason: OECD's 2023 value is Statistics Korea's 2022 figure; the series is shifted by one year. We use Statistics Korea's 2023 figure.
  producer: OECD
  status: open
- indicator: births_outside_marriage
  entity: South Korea
  years: [2024]
  action: override
  value: 5.8
  expect: {lt: 5.3}
  reason: OECD's 2024 value is Statistics Korea's 2023 figure; the series is shifted by one year. We use Statistics Korea's 2024 figure.
  producer: OECD
  status: open
