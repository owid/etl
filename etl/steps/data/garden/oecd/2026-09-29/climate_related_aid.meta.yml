    - "Hannah Ritchie"

tables:
  climate_related_aid_given:
    title: Climate-related aid given
    variables:
      climate_mitigation_only_dollars:
        title: "Climate-related aid given: climate mitigation only"
        unit: "constant 2024 US$"
        short_unit: "$"
        description_short: "Bilateral aid that targets climate change mitigation, but not adaptation, given by each donor. This data is adjusted for inflation and expressed in constant 2024 US dollars."
        description_key:
          - "Includes aid activities marked as targeting climate change mitigation (reducing or avoiding greenhouse gas emissions), as either a principal or a significant objective, and not marked as targeting adaptation."
          - *key_rio_markers
          - *key_bilateral
          - *key_splits
          - *key_commitments
          - *key_world
        description_processing: *processing_dollars
        presentation:
          title_public: "Climate-related aid given: climate mitigation only"
        display:
          name: "Aid given: mitigation only"
          numDecimalPlaces: 0
          tolerance: 1
      climate_mitigation_only_pct:
        title: "Climate-related aid given: climate mitigation only (% of total aid given)"
        unit: "%"
        short_unit: "%"
        description_short: "Bilateral aid that targets climate change mitigation, but not adaptation, as a share of the total bilateral allocable aid given by each donor."
