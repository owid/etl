# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    processing_level: minor
    presentation:
      topic_tags:
        - "Foreign Aid"
        - "Climate Change"
      # NOTE: attribution_short does not inherit from the origin, so it has to be set here.
      attribution_short: OECD

  key_rio_markers: &key_rio_markers |-
    This data is based on the OECD's "Rio markers". When donors report an aid activity, they mark whether it targets climate change mitigation and climate change adaptation as a principal objective, a significant objective, or not at all. The markers are applied by the donors themselves, so practices can differ between donors.
  key_bilateral: &key_bilateral |-
    Only bilateral aid that can be allocated to recipients is included — it excludes general budget support, debt relief, administrative costs, and refugee costs in donor countries. Contributions to multilateral institutions, such as the World Bank, UN agencies, and climate funds, are not included.
  key_splits: &key_splits |-
    Each activity is counted once. There are two ways to split the same total: by objective (mitigation only, adaptation only, or both), and by importance (climate as a main or a secondary objective). Adding indicators from both splits would double-count aid. Either split plus aid not targeting climate change adds up to total aid.
  key_commitments: &key_commitments |-
    Amounts are commitments — the money donors have pledged in a given year — not the money actually spent that year.
  key_world: &key_world |-
    The World total includes all climate-related aid, including amounts that donors did not allocate to a specific country.
  processing_dollars: &processing_dollars |-
    Our World in Data compiled this data from the OECD's activity-level Rio markers data. Activities marked for both mitigation and adaptation are counted once. The World total is the sum of all donors (or, equivalently, all recipients, including aid that was not allocated to a specific country).
  processing_pct: &processing_pct |-
    Our World in Data compiled this data from the OECD's activity-level Rio markers data. Activities marked for both mitigation and adaptation are counted once. Shares are calculated relative to the total bilateral allocable aid of each donor or recipient in that year.

