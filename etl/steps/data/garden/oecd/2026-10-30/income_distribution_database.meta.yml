# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    processing_level: minor
    display: &common-display
      tolerance: 5
    presentation:
      attribution_short: OECD
      topic_tags:
        - Economic Inequality
        - Poverty

  gini: |-
    The [Gini coefficient](#dod:gini) measures inequality on a scale from 0 to 1. Higher values indicate higher inequality.
  # Income type, for the short descriptions (harmonized FAUST, "Inequality and incomes across the distribution").
  inequality_disposable: |-
    Inequality is measured here in terms of income after taxes and benefits.
  inequality_gross: |-
    Inequality is measured here in terms of income before taxes and after benefits.
  inequality_market: |-
    Inequality is measured here in terms of income before taxes and benefits.
  income_disposable: |-
    Income here is measured after taxes and benefits.
  market_income_exceptions: |-
    For China, Mexico, and Turkey, the OECD measures market income after taxes and before benefits.
  equivalization: |-
    The income data has been [equivalized](#dod:equivalization), that is, adjusted for household size. This makes living standards more comparable across households of different sizes, since people sharing a household can split costs like rent and heating. To make the adjustment, the OECD uses the square root equivalence scale: it divides the total household income by the square root of the number of people in the household.

  # People covered by each age group, for the poverty indicators' text.
  age_people: |-
    <% if age == "Total" %>
    people
    <%- elif age == "Working population" %>
    people aged 18 to 65
    <%- elif age == "Over 65 years" %>
    people aged 66 and older
    <%- elif age == "Under 18 years" %>
    people under 18
    <%- elif age == "18 to 25 years" %>
    people aged 18 to 25
    <%- elif age == "26 to 40 years" %>
    people aged 26 to 40
    <%- elif age == "41 to 50 years" %>
    people aged 41 to 50
    <%- elif age == "51 to 65 years" %>
    people aged 51 to 65
    <%- elif age == "66 to 75 years" %>
    people aged 66 to 75
    <%- elif age == "76 years and older" %>
    people aged 76 and older
    <%- endif %>
  poverty_50_definition: |-
    This indicator shows the share of {definitions.age_people} whose income is less than half of the [median](#dod:median) income in their country.
  poverty_relative: |-
    This is a measure of relative poverty — it captures the share of people whose income is low by the standards typical in their own country.
  poverty_only_income: |-
    Only income counts, including interest, dividends and rent. The value of what people own, such as savings or their home, does not, so income alone can understate the living standards of people with wealth.
  poverty_source: |-
    The data comes from the OECD Income Distribution Database, which draws on national household surveys and tax records.

  source_gini: |-
    The Gini coefficient is based on the comparison of cumulative proportions of the population against cumulative proportions of income they receive, and it ranges between 0 in the case of perfect equality and 1 in the case of perfect inequality.
  source_gini_market: |-
    The Gini coefficient for market income refers to income before taxes and transfers. However, data for China, Hungary, Mexico and Turkey as well as data for Greece from the Household Budget Survey refer to the income post taxes and before transfers.
  source_palma_ratio: |-
    The Palma ratio is the share of all income received by the 10% people with highest disposable income divided by the share of all income received by the 40% people with the lowest disposable income.
  source_p90_p10_ratio: |-
    The P90/P10 ratio is the ratio of the upper bound value of the ninth decile (i.e. the 10% of people with highest income) to that of the upper bound value of the first decile.
  source_p90_p50_ratio: |-
    The P90/P50 ratio is the ratio of the upper bound value of the ninth decile to the median income.
  source_p50_p10_ratio: |-
    The P50/P10 ratio is the ratio of median income to the upper bound value of the first decile.
  source_s80_s20_ratio: |-
    The S80/S20 ratio is the share of all income received by the top quintile divided by the share of the first, or the ratio of the average income of the top quintile to that of the first.
  source_headcount_ratio_market: |-
    Data for Hungary, Mexico and Turkey as well as data for Greece from the Household Budget Survey refer to the income post taxes and before transfers.
  source_recommended_uses_and_limitations: |-
    The OECD Income Distribution database (IDD) has been developed to benchmark and monitor countries’ performance in the field of income inequality and poverty. It contains a number of standardized indicators based on the central concept of “equivalised household disposable income”, i.e. the total income received by the households less the current taxes and transfers they pay, adjusted for household size with an equivalence scale. While household income is only one of the factors shaping people’s economic well-being, it is also the one for which comparable data for all OECD countries are most common. Income distribution has a long-standing tradition among household-level statistics, with regular data collections going back to the 1980s (and sometimes earlier) in many OECD countries.

    Achieving comparability in this field is a challenge, as national practices differ widely in terms of concepts, measures, and statistical sources. In order to maximize international comparability as well as inter-temporal consistency of data, the IDD data collection and compilation process is based on a common set of statistical conventions (e.g. on income concepts and components). The information obtained by the OECD through a network of national data providers, via a standardized questionnaire, is based on national sources that are deemed to be most representative for each country.

    Small changes in estimates between years should be treated with caution as they may not be statistically significant.


# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/
dataset:
  update_period_days: 365
  changelog:
    - date: 2026-10-30
      changes:
        - Added seven narrower age groups (under 18, 18 to 25, 26 to 40, 41 to 50, 51 to 65, 66 to 75, and 76 and older) for the share of people below 50% of the median income, after taxes and benefits.
        - Added the average income of each age group as a share of the average income of the whole population.
        - Updated to the OECD's June 2026 release. It adds a new latest year for 10 countries, removes Israel's data for 2011–2022 and Hungary's for 2018–2022, and revises past values, mostly for Bulgaria, Iceland, Romania, and South Korea.
  owners:
    - Pablo Arriagada
tables:
  income_distribution_database:
    variables:
      gini_disposable:
        title: Gini coefficient (disposable income) - <<age>>
        unit: ""
        short_unit: ""
        description_short: "{definitions.gini} {definitions.inequality_disposable}"
        description_key:
          - "{definitions.equivalization}"
        description_from_producer: |-
          {definitions.source_gini}

          {definitions.source_recommended_uses_and_limitations}
        display:
          name: Gini coefficient (disposable income)
          numDecimalPlaces: 2
          <<: *common-display

      gini_gross:
        title: Gini coefficient (gross income) - <<age>>
        unit: ""
        short_unit: ""
        description_short: "{definitions.gini} {definitions.inequality_gross}"
        description_key:
          - "{definitions.equivalization}"
        description_from_producer: |-
          {definitions.source_gini}

          {definitions.source_recommended_uses_and_limitations}
        display:
          name: Gini coefficient (gross income)
          numDecimalPlaces: 2
          <<: *common-display

      gini_market:
        title: Gini coefficient (market income) - <<age>>
        unit: ""
        short_unit: ""
        description_short: "{definitions.gini} {definitions.inequality_market}"
        description_key:
          - "{definitions.market_income_exceptions}"
          - "{definitions.equivalization}"
        description_from_producer: |-
          {definitions.source_gini}

          {definitions.source_gini_market}

          {definitions.source_recommended_uses_and_limitations}
        display:
          name: Gini coefficient (market income)
          numDecimalPlaces: 2
          <<: *common-display

      p50_p10_ratio_disposable:
        title: P50/P10 ratio (disposable income) - <<age>>
        unit: ""
        short_unit: ""
        description_short: The P50/P10 ratio measures the degree of inequality within the poorest half of the population. A ratio of 2 means that the median income is two times higher than that of someone just falling in the poorest tenth of the population. {definitions.inequality_disposable}
        description_key:
          - "{definitions.equivalization}"
        description_from_producer: |-
          {definitions.source_p50_p10_ratio}

          {definitions.source_recommended_uses_and_limitations}
        display:
          name: P50/P10 ratio (disposable income)
          numDecimalPlaces: 1
          <<: *common-display

      p90_p10_ratio_disposable:
        title: P90/P10 ratio (disposable income) - <<age>>
        unit: ""
        short_unit: ""
        description_short: P90 and P10 are the levels of income below which 90% and 10% of the population live, respectively. This variable gives the ratio of the two. It is a measure of inequality that indicates the gap between the richest and poorest tenth of the population. {definitions.inequality_disposable}
        description_key:
          - "{definitions.equivalization}"
        description_from_producer: |-
          {definitions.source_p90_p10_ratio}

          {definitions.source_recommended_uses_and_limitations}
        display:
          name: P90/P10 ratio (disposable income)
          numDecimalPlaces: 1
          <<: *common-display

      p90_p50_ratio_disposable:
        title: P90/P50 ratio (disposable income) - <<age>>
        unit: ""
        short_unit: ""
        description_short: The P90/P50 ratio measures the degree of inequality within the richest half of the population. A ratio of 2 means that someone just falling in the richest tenth of the population has twice the median income. {definitions.inequality_disposable}
        description_key:
          - "{definitions.equivalization}"
        description_from_producer: |-
          {definitions.source_p90_p50_ratio}

          {definitions.source_recommended_uses_and_limitations}
        display:
          name: P90/P50 ratio (disposable income)
          numDecimalPlaces: 1
          <<: *common-display

      palma_ratio_disposable:
        title: Palma ratio (disposable income) - <<age>>
        unit: ""
        short_unit: ""
        description_short: The Palma ratio is a measure of inequality that divides the share received by the richest 10% by the share of the poorest 40%. Higher values indicate higher inequality. {definitions.inequality_disposable}
        description_key:
          - "{definitions.equivalization}"
        description_from_producer: |-
          {definitions.source_palma_ratio}

          {definitions.source_recommended_uses_and_limitations}
        display:
          name: Palma ratio (disposable income)
          numDecimalPlaces: 1
          <<: *common-display

      s80_s20_ratio_disposable:
        title: S80/S20 ratio (disposable income) - <<age>>
        unit: ""
        short_unit: ""
        description_short: Share of income of the richest 20% divided by the share of the poorest 20%. {definitions.inequality_disposable}
        description_key:
          - "{definitions.equivalization}"
        description_from_producer: |-
          {definitions.source_s80_s20_ratio}

          {definitions.source_recommended_uses_and_limitations}
        display:
          name: S80/S20 ratio (disposable income)
          numDecimalPlaces: 1
          <<: *common-display

      headcount_ratio_disposable_50_median:
        title: 50% of median - Share of population in poverty (disposable income) - <<age>>
        unit: "%"
        short_unit: "%"
        description_short: Share of {definitions.age_people} living in households with an income below 50% of their country’s median income. {definitions.income_disposable}
        description_key:
          - "{definitions.poverty_50_definition}"
          - "{definitions.poverty_relative}"
          - "{definitions.equivalization}"
          - "{definitions.poverty_only_income}"
          - "{definitions.poverty_source}"
        description_from_producer: |-
          {definitions.source_recommended_uses_and_limitations}
        display:
          name: 50% of median - Share of population in poverty (disposable income)
          numDecimalPlaces: 1
          <<: *common-display

      relative_disposable_income:
        title: Average income relative to the whole population (disposable income) - <<age>>
        unit: "% of the population’s average income"
        short_unit: "%"
        description_short: Average income of people in this age group, as a share of the average income of the whole population. {definitions.income_disposable}
        description_key:
          - A value of 90% means that the incomes of people in this age group are 10% lower than the average for the whole population.
          - "{definitions.equivalization}"
        description_processing: |-
          The OECD publishes the average disposable income of each age group in national currency. We divide it by the average disposable income of the whole population of the same country and year.
        description_from_producer: |-
          {definitions.source_recommended_uses_and_limitations}
        display:
          name: Average income relative to the whole population (disposable income)
          numDecimalPlaces: 1
          <<: *common-display

      headcount_ratio_disposable_60_median:
        title: 60% of median - Share of population in poverty (disposable income) - <<age>>
        unit: "%"
        short_unit: "%"
        description_short: Share of {definitions.age_people} living in households with an income below 60% of their country’s median income. {definitions.income_disposable}
        description_key:
          - "{definitions.equivalization}"
        description_from_producer: |-
          {definitions.source_recommended_uses_and_limitations}
        display:
          name: 60% of median - Share of population in poverty (disposable income)
          numDecimalPlaces: 1
          <<: *common-display

      headcount_ratio_market_50_median:
        title: 50% of median - Share of population in poverty (market income) - <<age>>
        unit: "%"
        short_unit: "%"
        description_short: Share of {definitions.age_people} living in households with an income below 50% of their country’s median income. Income here is measured before taxes and benefits, while the poverty line is set on the median income after taxes and benefits.
        description_key:
          - "{definitions.market_income_exceptions}"
          - "{definitions.equivalization}"
        description_from_producer: |-
          {definitions.source_headcount_ratio_market}

          {definitions.source_recommended_uses_and_limitations}
        display:
          name: 50% of median - Share of population in poverty (market income)
          numDecimalPlaces: 1
          <<: *common-display

      headcount_ratio_market_60_median:
        title: 60% of median - Share of population in poverty (market income) - <<age>>
        unit: "%"
        short_unit: "%"
        description_short: Share of {definitions.age_people} living in households with an income below 60% of their country’s median income. Income here is measured before taxes and benefits, while the poverty line is set on the median income after taxes and benefits.
        description_key:
          - "{definitions.market_income_exceptions}"
          - "{definitions.equivalization}"
        description_from_producer: |-
          {definitions.source_headcount_ratio_market}

          {definitions.source_recommended_uses_and_limitations}
        display:
          name: 60% of median - Share of population in poverty (market income)
          numDecimalPlaces: 1
          <<: *common-display

      gini_reduction:
        title: Percentage reduction in Gini coefficient (before vs. after tax) - <<age>>
        unit: "%"
        short_unit: "%"
        description_short: "This is the percentage difference between the Gini coefficient before taxes and benefits and the Gini coefficient after taxes and benefits."
        description_processing: |-
          We calculate this as the difference between the Gini coefficient of income before taxes and benefits and that of income after taxes and benefits, as a percentage of the Gini coefficient before taxes and benefits.
        description_key:
          - "{definitions.equivalization}"
        description_from_producer: |-
          {definitions.source_recommended_uses_and_limitations}
        display:
          name: Percentage reduction in Gini coefficient
          numDecimalPlaces: 1
          <<: *common-display


