# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    processing_level: minor
    description_key:
      - The Programme for International Student Assessment (PISA) is an international survey that assesses the skills and knowledge of 15-year-old students. It tries to measure how well education systems around the world are preparing young people for adult life.
      - PISA is run every three to four years and tests students in reading, mathematics, and science. It assesses both what students know and how well they can use this knowledge to solve problems in the real world. For example, can they interpret a bus timetable, reason through a scientific scenario, compare prices or make a budget?
      - Each student sits a two-hour exam. Results are summarized as average scores for each country, and are designed to be comparable over time.
      - "The scores are set by PISA itself and do not correspond to points on a traditional grading scale: across OECD countries, the average score was set to 500, based on the scores in the first year each subject was assessed (reading in 2000, mathematics in 2003, science in 2006). The [standard deviation](#dod:standard-deviation) was set to 100. Most countries score somewhere between 300 and 600, although scores outside this range are possible."
      - Higher scores indicate better performance. Many factors affect student performance, including income, teacher quality, classroom time, and parental education. Cultural differences can also play a role in how students approach the test.
      - PISA gives policymakers, researchers, and educators a way to evaluate their education systems and learn from others.
      - For PISA 2025, some countries do not meet one or more of the OECD's sampling standards. For Albania, Canada, the Netherlands, New Zealand, Norway and the United States the OECD advises caution with the results.
    description_processing: |-
      - We combine two sets of OECD data. Scores from 2000 to 2025 come from the tables of the [PISA 2025 Results (Volume I) report](https://www.oecd.org/en/publications/pisa-2025-results-volume-i_73451bc5-en/full-report). These tables only include the countries and economies that took part in PISA 2025 and the scores of girls and boys only from 2015. For older results, we use the OECD's [PISA Data Explorer](https://pisadataexplorer.oecd.org/ide/idepisa/dataset.aspx).
      - The OECD leaves some earlier results out of its own comparisons over time, because it no longer considers them comparable. We leave them out too. This affects Argentina, Kazakhstan and Malaysia in 2015, Austria in 2009, the United Kingdom in 2000 and 2003, Spain in 2018, Jordan's reading and science results before 2022 and Viet Nam's results before 2025, and Ukraine in 2018.
      - For Cambodia, Ecuador, Guatemala, Paraguay and Zambia, the OECD reports the results of the PISA for Development assessment, which took place in 2017, under PISA 2018. We show them as 2017.
    presentation:
      attribution: OECD (2026)
      attribution_short: OECD
      topic_tags:
        - Global Education
      grapher_config:
        hasMapTab: true
        map:
          timeTolerance: 3


  # ============================================================================
  # COMMON CONFIGURATION TEMPLATES
  # ============================================================================

  # Base grapher configuration templates
  common_grapher_config: &common_grapher_config
    hasMapTab: true

  common_grapher_map_config: &common_grapher_map_config
    timeTolerance: 3

  # ============================================================================
  # VALUE RANGES (BINS) FOR PISA SCORES
  # ============================================================================

  pisa_score_bins: &pisa_score_bins [340, 380, 420, 460, 500, 500]

  # ============================================================================
  # PISA SCORE CONFIGURATIONS
  # ============================================================================

  grapher_config_pisa_math: &grapher_config_pisa_math
    <<: *common_grapher_config
    map:
      <<: *common_grapher_map_config
      colorScale:
        binningStrategy: manual
        customNumericValues: *pisa_score_bins
        baseColorScheme: Blues

  grapher_config_pisa_science: &grapher_config_pisa_science
    <<: *common_grapher_config
    map:
      <<: *common_grapher_map_config
      colorScale:
        binningStrategy: manual
        customNumericValues: *pisa_score_bins
        baseColorScheme: Greens

  grapher_config_pisa_reading: &grapher_config_pisa_reading
    <<: *common_grapher_config
    map:
      <<: *common_grapher_map_config
      colorScale:
        binningStrategy: manual
        customNumericValues: *pisa_score_bins
        baseColorScheme: Purples



