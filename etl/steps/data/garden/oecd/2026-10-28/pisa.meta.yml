# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    processing_level: minor
    description_key:
      - The Programme for International Student Assessment (PISA) is an international survey that assesses the skills and knowledge of 15-year-old students. It provides a snapshot of how well education systems around the world are preparing young people for adult life.
      - PISA is run every three or four years (the latest round was in 2025, and the next is in 2029) and tests students in reading, mathematics, and science. It doesn't just assess what students know — it focuses on how well they can use this knowledge to solve problems they might encounter in the real world. For example, can they interpret a bus timetable, reason through a scientific scenario, or compare prices to make a budget?
      - Each student sits a two-hour computer-based test. Results are summarized as average scores for each country, and are designed to be comparable over time.
      - "The scores are standardized to make comparisons easier: across OECD countries, the average score was set to 500 in the first year each subject was assessed (reading in 2000, mathematics in 2003, science in 2006). Most countries score somewhere between 300 and 600, although scores outside this range are possible."
      - Higher scores indicate better performance — but comparing countries should be done carefully. Many factors affect student performance, including income, teacher quality, classroom time, and parental education. Cultural differences can also play a role in how students approach the test.
      - PISA gives policymakers, researchers, and educators a way to evaluate their education systems and learn from others. But as with all such comparisons, it's important to consider the wider context behind the numbers.
      - For PISA 2025, the OECD advises caution with the results for Albania, Canada, the Netherlands, New Zealand, Norway and the United States, because they didn't meet one or more of PISA's sampling standards, such as the share of schools or students taking part. The OECD's analysis suggests the results for Canada, New Zealand and Norway may be somewhat too high.
    description_processing: |-
      - We combine two sets of OECD data. Scores from 2000 to 2025 come from the tables of the PISA 2025 Results (Volume I) report. These tables only include the countries and economies that took part in PISA 2025, and give the scores of girls and boys only from 2015. For other countries, and for girls and boys before 2015, we use the OECD's PISA Data Explorer, which has results up to 2022. Where both have a value, they agree, except for the Palestinian Authority in 2022, which the OECD recalculated to match the narrower coverage of 2025; we use the recalculated value. For Ukraine, the results for 2022 and 2025 cover 17 of its 27 regions, while the result for 2018 covers the whole country.
      - The PISA 2025 report leaves out some earlier results that the Data Explorer still has, mostly because the OECD no longer considers them comparable over time (for example, Austria in 2009 and Viet Nam before 2025). We keep these values from the Data Explorer.
    presentation:
      attribution_short: OECD
      topic_tags:
        - Global Education
      grapher_config:
        hasMapTab: true
        map:
          timeTolerance: 3


  # ============================================================================
  # COMMON CONFIGURATION TEMPLATES
  # ============================================================================

  # Base grapher configuration templates
  common_grapher_config: &common_grapher_config
    hasMapTab: true

  common_grapher_map_config: &common_grapher_map_config
    timeTolerance: 3

  # ============================================================================
  # VALUE RANGES (BINS) FOR PISA SCORES
  # ============================================================================

  pisa_score_bins: &pisa_score_bins [340, 380, 420, 460, 500, 500]

  # ============================================================================
  # PISA SCORE CONFIGURATIONS
  # ============================================================================

  grapher_config_pisa_math: &grapher_config_pisa_math
    <<: *common_grapher_config
    map:
      <<: *common_grapher_map_config
      colorScale:
        binningStrategy: manual
        customNumericValues: *pisa_score_bins
        baseColorScheme: Blues

  grapher_config_pisa_science: &grapher_config_pisa_science
    <<: *common_grapher_config
    map:
      <<: *common_grapher_map_config
      colorScale:
        binningStrategy: manual
        customNumericValues: *pisa_score_bins
        baseColorScheme: Greens

  grapher_config_pisa_reading: &grapher_config_pisa_reading
    <<: *common_grapher_config
    map:
      <<: *common_grapher_map_config
      colorScale:
        binningStrategy: manual
        customNumericValues: *pisa_score_bins
        baseColorScheme: Purples



