        description_short: |-
          Average time spent eating and drinking. {definitions.averaged}
      tv_and_radio:
        title: Time spent watching TV or listening to the radio
        description_short: |-
          Average time spent watching TV or listening to the radio at home. {definitions.averaged}
        description_key:
          - *comparability
          - *mexico_instrument
          - *survey_vintage
          - *japan_reading
      seeing_friends:
        title: Time spent seeing friends
        description_short: |-
          Average time spent visiting or entertaining friends. {definitions.averaged}
      other_leisure:
        title: Time spent on other leisure activities
        description_short: |-
          Average time spent on sports, participating in or attending events, and other leisure activities. {definitions.averaged}
      total_leisure:
        title: Total time spent on leisure
        description_short: |-
          Average time spent on all leisure activities, such as sports, events, seeing friends, TV or radio, and other leisure. {definitions.averaged}
