        description_short: |-
          Average time spent sleeping. {definitions.averaged}
      housework_and_shopping:
        title: Time spent on housework and shopping
        description_short: |-
          Average time spent on routine housework and shopping. {definitions.averaged}
      other_unpaid_work:
        title: Time spent on other unpaid work
        description_short: |-
          Average time spent on care work, volunteering, travel related to household activities, and other unpaid or uncategorized activities. {definitions.averaged}
        description_key:
          - *comparability
          - *mexico_instrument
          - *survey_vintage
          - *japan_travel
          - *unallocated_minutes
      personal_care:
        title: Time spent on personal care other than sleeping, eating, and drinking
        description_short: |-
