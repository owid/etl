        description_short: |-
          Average time spent searching for a job. {definitions.averaged}
      other_paid_work_or_study_related:
        title: Time spent on other paid work or study-related activities
        description_short: |-
          Average time spent on other activities related to paid work or study. {definitions.averaged}
      unpaid_work:
