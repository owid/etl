definitions:
  survey_dating: &survey_dating |-
    Countries run their time-use surveys in different years, and some run them across two: we date each
    country by the year its fieldwork ended, so a survey labeled 2009/10 is shown as 2010.
  # The caveats every indicator carries. The first is the OECD's own, from the database's landing page;
  # the rest name the countries it flags, and what each flag means for a reader comparing bars.
  comparability: &comparability |-
    Time-use surveys are run differently in different countries. The OECD notes that differences in how the surveys are designed, in how many diary days each one samples, and in how each one groups activities all limit how comparable the results are between countries.
  mexico_instrument: &mexico_instrument |-
    The OECD flags Mexico's estimates as not fully comparable. Mexico measures time use with a questionnaire that asks how long people spent on a set list of activities over the previous week, rather than with a diary of a single day, and recall over a week tends to raise the time reported for frequent activities such as housework and care.
  survey_vintage: &survey_vintage |-
    Each country's estimates come from a single survey, and the survey years differ widely. They are the most recent surveys in the OECD's database, which is not always updated when a country runs a new one.
  # Indicator-specific caveats, all from the per-country footnotes in the source's own workbook.
  japan_reading: &japan_reading |-
    In Japan, this also covers time spent reading newspapers or magazines. The Japanese survey records watching television, listening to the radio and reading print as a single activity, so they cannot be separated.
  japan_travel: &japan_travel |-
    In Japan, this also covers all travel except commuting to work. The Japanese survey records travel as one activity instead of splitting it by purpose, so time that other countries count under leisure or personal care is counted here.
  volunteering_unreported: &volunteering_unreported |-
    Latvia and Lithuania report zero minutes here. Their surveys do not identify this activity separately; it is not a finding that nobody does it.
  unallocated_minutes: &unallocated_minutes |-
    This group also holds any minutes a country does not assign to a specific activity, so that its day still adds up to 24 hours. That is 37 minutes a day for Poland and 22 minutes for Japan; for every other country it is under a minute.
  common:
    unit: minutes per day
    short_unit: min
    display:
      numDecimalPlaces: 0
    description_processing: *survey_dating
    description_key:
      - *comparability
      - *mexico_instrument
      - *survey_vintage
    presentation:
      topic_tags:
        - Time Use
      attribution_short: OECD
  averaged: &averaged |-
    Minutes are a daily average over the whole week, including both weekdays and weekends.
  groups_processing: &groups_processing |-
    Countries run their time-use surveys in different years, and some run them across two: we date each
    country by the year its fieldwork ended, so a survey labeled 2009/10 is shown as 2010.

    We group the OECD's detailed activities into the categories shown in our chart "How do people spend their time?":

    - Paid work: paid work in all jobs, travel to and from work or study, job search, and other paid work or study-related activities.
    - Education: time in school or classes, plus research and homework.
    - Sleep: sleeping.
    - Housework & shopping: routine housework, plus shopping.
    - Other unpaid work: the rest of unpaid work (care for household and non-household members, volunteering, travel related to household activities, and other unpaid work), plus the OECD's small "other" category (religious and spiritual activities, civic obligations, and uncategorized time).
    - Personal care: personal, household and medical services, and travel related to personal care (personal care other than sleeping, eating and drinking).
    - Eating & drinking: eating and drinking.
    - TV & radio: watching TV or listening to the radio at home.
    - Seeing friends: visiting or entertaining friends.
    - Other leisure: sports, participating in or attending events, and other leisure activities.

    Groups that cover "the rest" of one of the OECD's top-level categories are computed as remainders from that category's total, so minutes that a country does not allocate to any detailed sub-activity remain included.

    China, Ireland, Japan, and Sweden do not report time spent on research and homework separately. Because paid work is computed as the rest of the OECD's "paid work or study" category, those countries' homework minutes are counted in paid work rather than in education.

