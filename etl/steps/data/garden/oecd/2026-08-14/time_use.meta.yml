tables:
  time_use:
    title: Time use across activities
    variables:
      paid_work_or_study:
        title: Time spent on paid work or study
        description_short: |-
          Average time spent on paid work or study, including travel to and from work or study and job search. {definitions.averaged}
      paid_work_all_jobs:
        title: Time spent on paid work (all jobs)
        description_short: |-
          Average time spent on paid work, across all jobs. {definitions.averaged}
      travel_to_and_from_work_or_study:
        title: Time spent traveling to and from work or study
        description_short: |-
          Average time spent traveling to and from work or study. {definitions.averaged}
      time_in_school_or_classes:
        title: Time spent in school or classes
        description_short: |-
          Average time spent in school or classes. {definitions.averaged}
      research_and_homework:
        title: Time spent on research and homework
        description_short: |-
          Average time spent on research and homework. {definitions.averaged}
      job_search:
        title: Time spent on job search
        description_short: |-
          Average time spent searching for a job. {definitions.averaged}
      other_paid_work_or_study_related:
        title: Time spent on other paid work or study-related activities
        description_short: |-
          Average time spent on other activities related to paid work or study. {definitions.averaged}
      unpaid_work:
        title: Time spent on unpaid work
        description_short: |-
          Average time spent on unpaid work, such as housework, shopping, care work, and volunteering. {definitions.averaged}
      routine_housework:
        title: Time spent on routine housework
        description_short: |-
          Average time spent on routine housework. {definitions.averaged}
      shopping:
        title: Time spent shopping
        description_short: |-
          Average time spent shopping. {definitions.averaged}
      care_for_household_members:
        title: Time spent caring for household members
        description_short: |-
          Average time spent caring for household members, including children and adults. {definitions.averaged}
      child_care:
        title: Time spent on child care
        description_short: |-
          Average time spent caring for children in the household. {definitions.averaged}
      adult_care:
        title: Time spent on adult care
        description_short: |-
          Average time spent caring for adults in the household. {definitions.averaged}
      care_for_non_household_members:
        title: Time spent caring for non-household members
        description_short: |-
          Average time spent caring for people outside the household. {definitions.averaged}
      volunteering:
