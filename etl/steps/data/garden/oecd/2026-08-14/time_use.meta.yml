        description_short: |-
          Average time spent volunteering. {definitions.averaged}
        description_key:
          - *comparability
          - *mexico_instrument
          - *survey_vintage
          - *volunteering_unreported
      travel_related_to_household_activities:
        title: Time spent traveling for household activities
        description_short: |-
          Average time spent traveling in relation to household activities. {definitions.averaged}
        description_key:
          - *comparability
          - *mexico_instrument
          - *survey_vintage
          - *japan_travel
      other_unpaid_work_activities:
        title: Time spent on other unpaid work
        description_short: |-
          Average time spent on other unpaid work. {definitions.averaged}
      personal_care:
        title: Time spent on personal care
        description_short: |-
          Average time spent on personal care, including sleeping, eating and drinking. {definitions.averaged}
      sleeping:
        title: Time spent sleeping
        description_short: |-
          Average time spent sleeping. {definitions.averaged}
      eating_and_drinking:
        title: Time spent eating and drinking
        description_short: |-
          Average time spent eating and drinking. {definitions.averaged}
      other_personal_care_services:
        title: Time spent on other personal care
        description_short: |-
          Average time spent on personal, household, and medical services, and travel related to personal care. {definitions.averaged}
      leisure:
        title: Time spent on leisure
        description_short: |-
          Average time spent on leisure activities, such as sports, events, seeing friends, TV or radio, and other leisure. {definitions.averaged}
      sports:
        title: Time spent on sports
        description_short: |-
          Average time spent on sports. {definitions.averaged}
      participating_in_or_attending_events:
        title: Time spent participating in or attending events
        description_short: |-
          Average time spent participating in or attending events. {definitions.averaged}
      visiting_or_entertaining_friends:
        title: Time spent visiting or entertaining friends
        description_short: |-
          Average time spent visiting or entertaining friends. {definitions.averaged}
      tv_or_radio_at_home:
        title: Time spent watching TV or listening to the radio at home
        description_short: |-
          Average time spent watching TV or listening to the radio at home. {definitions.averaged}
        description_key:
          - *comparability
          - *mexico_instrument
          - *survey_vintage
          - *japan_reading
      other_leisure_activities:
