# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    presentation:
      topic_tags:
        - Foreign Aid
        - Climate Change
      # NOTE: attribution_short does not inherit from the origin, so it has to be set here.
      attribution_short: OECD
    display:
      tolerance: 0
      entityAnnotationsMap: |-
        DAC members: DAC countries and EU institutions
        DAC countries: Major aid donors in the OECD
        G7 countries: Canada, France, Germany, Italy, Japan, UK and US

  # NOTE: Base year of the OECD's constant-price series. The OECD rebases it at each release, so this must be bumped on
  # every update, together with CONSTANT_PRICE_BASE_YEAR in the meadow step (whose assertion fails loudly if the two
  # drift apart from the source).
  inflation_year: 2024

  # Short descriptions, following those of our main ODA dataset.
  short_oda: "[Official development assistance (ODA)](#dod:oda) is defined as government aid designed to promote the economic development and welfare of developing countries."
  short_bilateral_allocable: "Bilateral allocable [ODA](#dod:oda) is aid from DAC members that is directly assigned to a recipient country or region and to a sector."
  short_climate_related: "Climate-related [ODA](#dod:oda) is aid that targets climate change mitigation, adaptation, or both."
  short_commitments: Monetary aid is estimated as commitments.
  short_constant_usd: This data is expressed in US dollars. It is adjusted for inflation.

  # Key information, following that of our main ODA dataset.
  key_oda: |-
    Official development assistance (ODA) is aid given to countries and territories on the OECD Development Assistance Committee (DAC) list of recipients and multilateral development institutions. To qualify as ODA, the aid has to serve the economic development and welfare of recipient countries and be either a grant or a loan with favorable terms.
  key_oda_list_of_countries_recipients: DAC country recipients are all low- and middle-income countries as defined by the World Bank, or least-developed countries as defined by the United Nations. All recipients are listed on [the OECD website](https://www.oecd.org/en/topics/sub-issues/oda-eligibility-and-conditions/dac-list-of-oda-recipients.html).
  key_bilateral_allocable: |-
    This data only covers bilateral allocable ODA from [DAC members](https://www.oecd.org/en/about/committees/development-assistance-committee.html): the major donor countries in the OECD and EU institutions. Bilateral allocable ODA is aid assigned to a recipient and a sector. It excludes donors' core contributions to multilateral organizations (such as the World Bank or the Green Climate Fund), as well as general budget support, debt relief, administrative costs, scholarships and student costs in donor countries, development awareness, and the costs of hosting refugees in donor countries. It also excludes aid from donors outside the DAC.
  key_rio_markers: |-
    Donors mark each aid project against the "Rio markers", which track aid that supports the goals of the three UN conventions agreed at the 1992 Earth Summit in Rio de Janeiro: on climate change (with separate markers for mitigation and adaptation), biological diversity, and desertification. A project is marked as targeting a goal as a "principal" objective (the project would not have been funded without it), as a "significant" objective (an explicit but secondary objective), or as "not targeted".
  key_climate_markers: |-
    Climate change mitigation projects aim to reduce greenhouse gas emissions or increase their removal by carbon sinks. Climate change adaptation projects aim to reduce the vulnerability of people and ecosystems to the impacts of climate change.
  key_overlap: |-
    Many projects target both mitigation and adaptation. To avoid counting them twice, we classify each project only once: as targeting mitigation only, adaptation only, or both. Similarly, a project has climate as its principal objective if it is marked as principal for mitigation or adaptation, and as a significant objective otherwise.
  key_upper_bound: |-
    Projects are counted at their full value, even when the objective is only significant. The OECD considers this an upper bound of the aid that targets each objective. When reporting their climate finance to the UN, many donors count only a share of these projects.
  key_commitments: |-
    The data is reported as commitments. This refers to aid that has been pledged, and is different from disbursements, which is aid ultimately given. The Rio markers describe the objectives of projects when they are designed, so the OECD applies them to commitments. A multi-year project is counted in full in the year it is committed, so values can change a lot from one year to the next.
  key_adaptation_marker: |-
    The marker for climate change adaptation was introduced in 2009 and applies to aid from 2010 onwards. Before then, the climate marker also covered some adaptation projects, so climate-related aid can only be split into mitigation and adaptation from 2010.
  key_not_screened: |-
    Projects that donors did not assess against a marker ("not screened") are not counted as targeting it. A large share of aid was not screened before the markers became a permanent part of the reporting in 2008, and especially before 2011.
  key_constant_usd: The OECD adjusts this data for inflation and expresses it in constant {definitions.inflation_year} US$. It makes this adjustment using annual average market exchange rates and GDP deflators for each donor country. For more information on the methodology, visit [the OECD's documentation](https://www.oecd.org/content/oecd/en/data/insights/data-explainers/2024/10/resources-for-reporting-development-finance-statistics.html) on DAC deflators.
  key_marker: |-
    <% if marker == "Biodiversity" %>
    Biodiversity-related projects contribute to the objectives of the Convention on Biological Diversity: conserving biodiversity, using its components sustainably, and sharing fairly the benefits of using genetic resources.
    <% elif marker == "Climate change mitigation" %>
    Climate change mitigation projects contribute to stabilizing greenhouse gas concentrations in the atmosphere, by reducing or limiting emissions or by increasing their removal by carbon sinks.
    <% elif marker == "Climate change adaptation" %>
    Climate change adaptation projects aim to reduce the vulnerability of people and ecosystems to the current and expected impacts of climate change, by making them more resilient. This marker applies to aid from 2010 onwards.
    <% elif marker == "Desertification" %>
    Desertification-related projects aim to combat desertification or reduce the effects of drought in arid, semi-arid and dry sub-humid areas, by preventing or reducing land degradation, or by rehabilitating or reclaiming degraded land.
    <% elif marker == "Environment" %>
    Environment-related projects aim to improve the physical or biological environment of the recipient, or to integrate environmental concerns into development objectives. The environment marker is a broader policy marker: it is always marked whenever a project targets biodiversity, climate change mitigation, or desertification.
    <%- endif -%>
  key_one_marker: |-
    The same project can target several objectives, so values for different markers should not be added up.
  key_sector: |-
    The sector refers to the area of the recipient's economy or society that the project intends to support, according to the OECD's classification. Climate-related projects can be in any sector: for example, a project to build roads that withstand floods is in "Transport and storage".

  # Processing descriptions.
  processing_climate: |-
    We combined the mitigation and adaptation markers of each project to count it only once. Projects marked as targeting both objectives (as a principal or significant objective) are counted as "mitigation and adaptation", and the others as "mitigation only" or "adaptation only". Projects with climate as the principal objective are those marked as principal for mitigation or adaptation; the remaining climate-related projects have climate as a significant objective.
  processing_non_climate: |-
    We calculated non-climate-related ODA as bilateral allocable ODA minus climate-related ODA.
  processing_share: |-
    We calculated this indicator by dividing by bilateral allocable ODA, expressed as a percentage.
  processing_share_sector: |-
    We calculated this indicator by dividing by bilateral allocable ODA in the same sector, expressed as a percentage.
  processing_share_of_all_sectors: |-
    We calculated this indicator by dividing by climate-related ODA in all sectors, expressed as a percentage.
  processing_per_capita: |-
    We calculated this indicator by dividing by the population of each country. We use a long-run population dataset [maintained by Our World in Data](https://ourworldindata.org/population-sources).
  processing_donor_groups: |-
    We calculated aggregates for groups of donors (such as DAC countries or G7 countries) by summing the indicator across the donors that the OECD includes in each group.
  processing_recipient_groups: |-
    We calculated aggregates for groups of recipients (such as regions or income groups) by summing the indicator across the recipients that the OECD includes in each group. The OECD classifies countries by income with the most recent classification, and applies it to all years.

