          name: "Climate-related ODA by donor (% of bilateral allocable ODA)"
          numDecimalPlaces: 1
          tolerance: 0
          entityAnnotationsMap: "{definitions.entity_annotations_donors}"
      climate_related_share_of_bilateral_total:
