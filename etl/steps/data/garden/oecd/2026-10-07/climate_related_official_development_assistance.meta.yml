        short_unit: "$"
        description_short: "Bilateral [ODA](#dod:oda) from members of the OECD Development Assistance Committee (DAC), including aid that the climate markers do not apply to, such as general budget support and the costs of hosting refugees in donor countries. {definitions.short_commitments} {definitions.short_constant_usd}"
        description_key:
          - "{definitions.key_oda}"
          - "{definitions.key_oda_list_of_countries_recipients}"
          - "{definitions.key_rio_markers}"
          - "{definitions.key_bilateral_total}"
          - "{definitions.key_commitments}"
          - "{definitions.key_constant_usd}"
        processing_level: major
        description_processing: "{definitions.processing_start_year}\n\n{definitions.processing_donor_groups}"
        display:
          name: "Total bilateral ODA by donor"
          numDecimalPlaces: 0
          tolerance: 0
          entityAnnotationsMap: "{definitions.entity_annotations_donors}"
