# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    presentation:
      topic_tags:
        - Foreign Aid
        - Climate Change
      # NOTE: attribution_short does not inherit from the origin, so it has to be set here.
      attribution_short: OECD
      grapher_config:
        originUrl: "/foreign-aid"

  # NOTE: Base year of the OECD's constant-price series. The OECD rebases it at each release, so this must be bumped on
  # every update, together with CONSTANT_PRICE_BASE_YEAR in the meadow step (whose assertion fails loudly if the two
  # drift apart from the source).
  inflation_year: 2024

  # Annotations shown next to entity names in charts. Recipients get theirs from the garden step (the regional entities
  # in the data).
  # NOTE: Each variable's `display` replaces any common one, so these are set in every variable's `display`.
  entity_annotations_donors: |-
    DAC members: DAC countries and EU institutions
    DAC countries: Major aid donors in the OECD
    G7 countries: Canada, France, Germany, Italy, Japan, UK and US

  # Short descriptions, following those of our main ODA dataset.
  short_bilateral_allocable: "Bilateral allocable [ODA](#dod:oda) is the aid from members of the OECD Development Assistance Committee (DAC) that donors track for climate objectives. It excludes general budget support, debt relief and some costs in donor countries, such as hosting refugees."
  short_commitments: Monetary aid is estimated as commitments.
  short_constant_usd: This data is expressed in US dollars. It is adjusted for inflation.

  # Key information, following that of our main ODA dataset.
  key_oda: |-
    Official development assistance (ODA) is aid given to countries and territories on the OECD Development Assistance Committee (DAC) list of recipients and multilateral development institutions. To qualify as ODA, the aid has to serve the economic development and welfare of recipient countries and be either a grant or a loan with favorable terms.
  key_oda_list_of_countries_recipients: DAC country recipients are all low- and middle-income countries as defined by the World Bank, or least-developed countries as defined by the United Nations. All recipients are listed on [the OECD website](https://www.oecd.org/en/topics/sub-issues/oda-eligibility-and-conditions/dac-list-of-oda-recipients.html).
  key_bilateral_allocable: |-
    This data covers bilateral allocable ODA from [DAC members](https://www.oecd.org/en/about/committees/development-assistance-committee.html), the major donor countries in the OECD and EU institutions. This is the bilateral aid that the Rio markers apply to. It excludes general budget support, debt relief (other than debt swaps), administrative costs, development awareness, and the costs of hosting refugees and students from developing countries in donor countries. It also excludes core contributions to multilateral organizations, such as the World Bank, and aid from donors outside the DAC.
  key_bilateral_total: |-
    Total bilateral ODA adds to bilateral allocable ODA the aid that the Rio markers don't apply to, such as general budget support, debt relief and the costs of hosting refugees in donor countries. It excludes core contributions to multilateral organizations and aid from donors outside the DAC.
  key_bilateral_total_denominator: |-
    This share divides climate-related aid by total bilateral ODA, which also includes the aid that the Rio markers do not apply to, such as general budget support and the costs of hosting refugees in donor countries.
  key_outside_negative: |-
    Donors can only record cancellations of commitments made in earlier years as a single negative amount, which usually falls in this category. So this aid can be negative in some years.
  key_rio_markers: |-
    Donors mark their bilateral aid projects with the "Rio markers", which track support for the three UN conventions from the 1992 Rio Earth Summit: on climate change (with separate markers for mitigation and adaptation), biodiversity, and desertification. For each marker, a goal is a "principal" objective (the project wouldn't have been funded without it), a "significant" objective (an explicit but secondary one), or not targeted.
  key_climate_markers: |-
    Climate change mitigation projects aim to reduce greenhouse gas emissions or increase their removal by carbon sinks. Climate change adaptation projects aim to reduce the vulnerability of people and ecosystems to the impacts of climate change.
  key_overlap: |-
    Many projects target both mitigation and adaptation, so we count each project once: as mitigation only, adaptation only, or both. Climate is a project's principal objective if either marker is principal, and a significant objective otherwise.
  key_upper_bound: |-
    Projects count at their full value even when climate is only a significant objective, so the OECD calls this data descriptive rather than strictly quantitative. Donors mark their own projects, so for some it's hard to tell whether climate change was the reason for the aid, or just a label on a project that would have gone ahead anyway.
  key_commitments: |-
    The data shows commitments: aid pledged, rather than aid disbursed. The OECD applies the Rio markers to commitments because they describe projects as designed. A multi-year project counts in full in the year it is committed, so values can change a lot from year to year.
  key_adaptation_marker: |-
    The adaptation marker was introduced in 2009 and applies to aid from 2010, when this data starts. Before then, the climate marker also covered some adaptation projects, so climate-related aid can't be split into mitigation and adaptation.
  key_sector: |-
    The sector is the part of the recipient's economy or society that a project supports, following the OECD's classification. Climate-related projects can be in any sector: for example, roads built to withstand floods are in transport and storage.
  key_regional: |-
    Entities named "regional (OECD)" or "unspecified (OECD)", such as "Africa, regional (OECD)", show aid that donors did not assign to a single country, for example programs covering several countries. This aid is included in the totals of the corresponding regions, such as Africa (OECD).
  key_not_screened: |-
    Projects that donors did not assess against the climate markers ("not screened") count as non-climate aid. This was common in the early 2010s and still is for some donors. Donors that leave only their non-climate projects unscreened are unaffected; donors that leave almost all their projects unscreened can show little or no climate-related aid even if they gave some.
  key_constant_usd: The OECD adjusts this data for inflation and expresses it in constant {definitions.inflation_year} US$. It makes this adjustment using annual average market exchange rates and GDP deflators for each donor country. For more information on the methodology, visit [the OECD's documentation](https://www.oecd.org/content/oecd/en/data/insights/data-explainers/2024/10/resources-for-reporting-development-finance-statistics.html) on DAC deflators.

  # Processing descriptions.
  processing_climate: |-
    We combined the mitigation and adaptation markers of each project to count it only once. Projects marked as targeting both objectives (as a principal or significant objective) are counted as "mitigation and adaptation", and the others as "mitigation only" or "adaptation only". Projects with climate as the principal objective are those marked as principal for mitigation or adaptation; the remaining climate-related projects have climate as a significant objective.
  processing_non_climate: |-
    We calculated non-climate-related ODA as bilateral allocable ODA minus climate-related ODA.
  processing_outside_rio_markers: |-
    We calculated this indicator as total bilateral ODA, from the OECD Creditor Reporting System, minus bilateral allocable ODA, from the OECD RioMarkers dataset. Donors can only record cancellations of commitments made in earlier years as a single negative amount, which usually falls in this category, so it can be negative (for example, for Australia in 2010 and Denmark in 2019).
  processing_share: |-
    We calculated this indicator by dividing climate-related ODA by bilateral allocable ODA, expressed as a percentage.
  processing_share_bilateral_total: |-
    We calculated this indicator by dividing climate-related ODA by total bilateral ODA, from the OECD Creditor Reporting System, expressed as a percentage.
  processing_donor_groups: |-
    We calculated aggregates for groups of donors (such as DAC countries or G7 countries) by summing the indicator across the donors that the OECD includes in each group.
  processing_recipient_groups: |-
    We calculated aggregates for groups of recipients (such as regions or income groups) by summing the indicator across the recipients that the OECD currently includes in each group. For income groups, this applies the most recent classification to all years.
  processing_start_year: |-
    We show this data from 2010, when the OECD started applying the marker for climate change adaptation, so that it covers the same years as climate-related aid.
  processing_sector: |-
    We assigned each project to its sector from its purpose code, following the OECD's sector classification.
  processing_share_sector: |-
    We calculated this indicator by dividing climate-related ODA in the sector by bilateral allocable ODA in the same sector, expressed as a percentage.
  processing_share_of_all_sectors: |-
    We calculated this indicator by dividing climate-related ODA in the sector by climate-related ODA in all sectors, expressed as a percentage.
  processing_per_capita: |-
    We calculated this indicator by dividing climate-related ODA received by the population of the recipient. We only calculated it for countries, not for groups of recipients.

