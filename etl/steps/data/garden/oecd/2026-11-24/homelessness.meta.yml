      share:
        title: Share of people experiencing homelessness
        unit: "%"
        short_unit: "%"
        description_short: Due to different definitions and data collection methods, the share of people experiencing homelessness is not directly comparable across countries.
        description_key:
          - "{definitions.harmonization}"
          - The share uses each country’s headline estimate of homelessness, following its own statistical definition, as a percentage of its total population. The OECD reports it rounded, so very small shares are approximate.
          - This share differs from the rate of homelessness per 100,000 people in our other charts. The rate only counts people living rough or staying in emergency or temporary accommodation (ETHOS Light 1, 2, and 3), so that countries can be compared on a similar basis. The share counts everyone in the national estimate, which in some countries also includes people living in institutions or non-conventional dwellings, or staying temporarily with family or friends because they lack housing (ETHOS Light 4, 5, and 6).
          - Most countries count people at a single point in time (point-in-time count). Austria, Chile, Cyprus, Israel, Latvia, Lithuania, Romania, Slovenia, and Turkey instead count everyone who experienced homelessness over a period of time, such as a year (flow count).
          - "{definitions.belgium}"
          - "{definitions.methodology_issues}"
          - "{definitions.country_notes}"
        description_processing: |-
          The OECD reports the share as a fraction of the population. We convert it to a percentage.

          {definitions.description_processing_years}

          We don’t include the United Kingdom, as its data counts households instead of individuals.
        processing_level: minor
        presentation:
          title_public: Share of people experiencing homelessness
        display:
          name: Share of people experiencing homelessness
          numDecimalPlaces: 3
          <<: *display_common

      number:
        title: Number of people experiencing homelessness
        unit: people
        short_unit: ""
        description_short: Due to different definitions and data collection methods, the estimated number of people experiencing homelessness is not directly comparable across countries.
        description_key:
          - "{definitions.harmonization}"
          - "{definitions.belgium}"
          - "{definitions.methodology_issues}"
          - "{definitions.country_notes}"
        description_processing: |-
          {definitions.description_processing_years}

          As the data for the United Kingdom includes a count of households experiencing homelessness (instead of individuals), we have removed it to facilitate cross-country comparison.

          The OECD presents the data for three periods: around 2018, around 2023, and 2026 or the latest year available. Changes in definitions, data collection methods, or geographic coverage mean that the values of a country are not always comparable over time. Due to visualization limitations, we have connected the values of each country. For more detail, you can check Table HC3.1.A2 on the [OECD Affordable Housing Database website](https://www.oecd.org/en/data/datasets/oecd-affordable-housing-database.html) (HC3.1 People experiencing homelessness and housing exclusion).
        presentation:
          title_public: Number of people experiencing homelessness
        display:
          name: Number of people experiencing homelessness
          numDecimalPlaces: 0
          <<: *display_common

