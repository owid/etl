# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    display: &display_common
      tolerance: 10
    processing_level: major
    description_from_producer: >-
      _Definitions and methodology_


      This indicator presents available data at national level on the number of people experiencing
      homelessness and housing exclusion, as reported by public authorities in OECD and EU countries.
      Data are drawn from the OECD Questionnaire on Affordable and Social Housing (QuASH) and other
      available sources. Data are available for 42 countries, including all OECD countries and the following
      non-member countries: Croatia, Cyprus, Romania and South Africa (Table HC 3.1.A1).


      Comparing national-level estimates of homelessness and housing exclusion across countries is difficult,
      due to a range of methodological challenges.


      National definitions vary widely across countries, limiting international comparability. This indicator
      presents a collection of available statistics in line with the national statistical definition of homelessness
      in OECD, EU and key partner countries, drawing on the ETHOS Light Typology of Homelessness and
      Housing Exclusion to the extent feasible (see Box HC3.1.2).


      The type of count can be differentiated between point-in-time counts and flow counts, which are not
      comparable and thus presented separately in this indicator:


      - Point-in-time count: Data are collected at a single point-in-time, generally through a coordinated
      street count and/or an enumeration of people staying in shelters for people experiencing
      homelessness on a given night. Point-in-time counts thus present a “snapshot” of homelessness
      at a single time and place.


      - Flow count: Data are collected over a given period of time, such as the enumeration of all people
      who have stayed in a shelter over the course of the year.


      _Data and comparability issues_


      _Definitional differences_


      As discussed above, differences in statistical definitions drive some of the variation in the reported
      incidence of homelessness across countries. These differences hamper international comparison and
      an understanding of the differences in homelessness rates and risks across countries. For instance,
      several countries that adopt a broader definition of homelessness report a higher incidence of
      homelessness, like Australia and New Zealand, relative to countries with a narrower definition, such as
      Chile, Portugal or Japan. Different definitions of homelessness can also co-exist within the same
      country, depending on the purpose and the collecting authority, producing considerable differences in
      homelessness estimates for the same territory.


      However, definitional differences do not fully explain the variation in homelessness rates across
      countries: several countries with a broad definition of homelessness report among the lowest incidences
      of homelessness, such as Norway, Poland, Finland and Denmark. Figure HC3.1 (above) accounts for
      these definitional differences by presenting cross-country data on homelessness for ETHOS Light
      categories 1, 2 and 3 only.


      _Limitations of data collection approaches_


      Beyond definitional differences, there are several challenges in the scope and methods of data
      collection that might affect measuring the full extent of homelessness (see the OECD Monitoring
      Framework on Homelessness (OECD, 2025)). Data on homelessness are typically based on the
      following collection methods, each with its strengths and limitations in terms of how well it captures
      different types of living situations:


      - Street counts: an estimate of the number of people sleeping rough at a point-in-time;


      - Service-based methods: information obtained from a broad range of service providers that
      support people experiencing homelessness;


      - Population censuses and Household surveys: a count or a sample of a given population at a
      point in time (e.g. Population Census; special module on homelessness in household survey);


      - Administrative data: records collected by different institutions/organizations (e.g., health data,
      criminal justice records, social services data, etc.) and used to extrapolate the number of people
      experiencing homelessness;


      - Advanced sampling methods: a statistical method, such as “capture-recapture,” comparing
      independent samples from two or more sources of data to estimate the total number of people
      experiencing homelessness;


      - By-name lists and Information management systems on homeless individuals: the collection of
      comprehensive demographic and identifying information on people experiencing
      homelessness, which may be collected via registry weeks.


      Further, the scope, design and implementation of each data collection approach vary widely, which can
      significantly affect the quality and coverage of the data. For instance, with respect to street counts, the
      geographic perimeter is not systematic across (or even within) countries. In addition to enumerating
      people sleeping on public streets, the coverage of street counts may (or may not) include parks, public
      transport, emergency rooms, parking garages or other places that, depending on the country context,
      may be used by rough sleepers.


      Moreover, in the case of service-based methods, there is no systematic approach to determining which
      types of services and emergency or temporary accommodation are included in data collection efforts,
      and which are left out. The selection of services to be surveyed may be narrowly defined (e.g., restricted
      to overnight shelters and temporary accommodation), or may be quite broad (e.g., to also include food
      banks, social service centers, health clinics, etc.). As a result, homelessness data resulting from
      service-based methods (often captured by ETHOS Light 2 and 3) are not fully comparable across
      countries. Table HC3.1.1 provides an overview of cross-country differences in the inclusion of children
      and temporary accommodation for specific groups in the national headline estimate of homelessness.


      Across 42 OECD and EU countries:


      - Over half (27 countries) include children under the age of 18 years;


      - Half (21 countries) include temporary accommodation for victims of domestic violence;


      - Around a quarter (11 countries) include temporary accommodation for asylum seeker; and


      - One third (14 countries) include temporary accommodation for refugees.
    presentation:
      topic_tags:
        - Homelessness
        - Poverty
      attribution_short: OECD

  ethos_1: This data has been categorized within the European Typology of Homelessness and Housing Exclusion (ETHOS) typology as _ETHOS Light 1_. ETHOS Light 1 is defined as people living rough, living in the streets or public spaces without a shelter that can be defined as living quarters.
  ethos_2_3: This data has been categorized within the European Typology of Homelessness and Housing Exclusion (ETHOS) typology as _ETHOS Light 2 and 3_. ETHOS Light 2 is defined as people living in emergency accommodation, people with no place of usual residence who move frequently between various types of accommodation. ETHOS Light 3 is defined as people living in accommodation for the homeless, including hostels, temporary and transitional accommodation, and women’s shelters or refuge accommodation.
  ethos_1_2_3: This data has been categorized within the European Typology of Homelessness and Housing Exclusion (ETHOS) typology as _ETHOS Light 1, 2, and 3_. It includes people living in the streets or public spaces, in emergency accommodation, and in accommodation for the homeless, but it has not been disaggregated.
  ethos_total: This data adds up people living rough (ETHOS Light 1) and people in emergency accommodation or accommodation for the homeless (ETHOS Light 2 and 3), including countries that report only the combined number.
  ethos_broad_women: This data covers countries whose definition of homelessness goes beyond people living rough (ETHOS Light 1) or beyond people staying in emergency accommodation and accommodation for the homeless (ETHOS Light 2 and 3). Depending on the country, it can also include people living in institutions, in non-conventional dwellings, or temporarily with family or friends due to a lack of housing (ETHOS Light 4, 5, and 6).

  point_in_time_count: This data is collected with a _point-in-time count_, in which data is collected at a single point in time, generally through a coordinated street count or an enumeration of people staying in shelters for people experiencing homelessness on a given night. Point-in-time counts thus present a “snapshot” of homelessness at a single time and place.
  flow_count: This data is collected with a _flow count_, in which data is collected over a given period of time, such as the enumeration of all people who have stayed in a shelter over the course of the year.

  gender_breakdown: The gender breakdown refers to the headline estimate of homelessness in each country, along the statistical definition of each country.
  women_undercount: The OECD notes that these statistics likely undercount women. Women are less likely to sleep rough or use homeless shelters, and more likely to stay with family or friends. In 20 countries, shelters for victims of domestic violence aren’t counted.

  harmonization: Countries use different definitions and data collection methods. The OECD presents each country’s statistics following its national definition, and classifies them by the ETHOS Light typology where possible.
  methodology_issues: More details about definitions, methodology, and comparability issues can be found in the [OECD documentation, People experiencing homelessness and housing exclusion](https://webfs.oecd.org/Els-com/Affordable_Housing_Database/HC3-1-Population-experiencing-homelessness.pdf).
  country_notes: For more information on the statistical definitions for each country, please check the [OECD’s Country Notes on Homelessness data](https://www.oecd.org/en/topics/sub-issues/affordable-housing/homelessness.html).
  unconventional_dwellings: Data for Australia, Canada, Germany, Italy, South Korea, Norway, and the United States includes people living in unconventional dwellings (e.g. tents).
  united_kingdom_rates: Data for the United Kingdom only considers England. For ETHOS Light 2 and 3, it refers to the number of households experiencing homelessness per 100,000 households.
  belgium: The OECD reports data for Belgium only for each of its three regions (Brussels, Flanders, and Wallonia), because they can’t be combined into a national estimate. We don’t include them.

  description_short_ethos_1: Includes people living in the streets or public spaces without a shelter that can be defined as living quarters.
  description_short_ethos_2_3: Includes people living in emergency accommodation, people with no place of usual residence who move frequently between various types of accommodation, and people living in accommodation for the homeless.
  description_short_ethos_1_2_3: Includes people living in the streets or public spaces, in emergency accommodation, and in accommodation for the homeless.
  description_short_broad_women: Includes countries whose definition of homelessness covers more than people living rough or more than people in emergency accommodation and accommodation for the homeless.

  description_short_point_in_time: This data is collected at a single point in time, generally through a street count or a count of people staying in shelters on a given night.
  description_short_flow: This data is collected over a given period of time, such as the enumeration of all people who have stayed in a shelter over the course of the year.

  description_processing_years: The OECD reports the latest data available for each country, and the year of that data differs between countries. We assign each value to the year the OECD gives for that country in its notes and in Table HC3.1.A1. Whenever the data was captured over several years, we use the latest year.

  description_processing_men: We have estimated the share of people experiencing homelessness who are men by subtracting the share of people experiencing homelessness who are women from 100%.

  description_processing_10000_to_100000: We have transformed the data from homelessness per 10,000 population to homeless per 100,000 population.

  description_processing_ethos_breakdown: |-
    The OECD reports the number of people in each ETHOS Light category only for countries that count that category separately. When a category is counted together with another one, or included in the total without a separate number, we leave it empty.

    {definitions.description_processing_years}

    We don’t include the United Kingdom, as its data counts households instead of individuals.

    For Mexico, whose estimate counts only people living rough, we leave out the other categories. The OECD takes them from the census, and Mexico doesn’t count them as homelessness.

    Values for France are approximate.
  description_key_ethos_breakdown: These numbers break down each country’s headline estimate of homelessness by ETHOS Light category, following its own statistical definition. They may not add up to the headline estimate, which can include living situations outside the ETHOS Light categories. Not every country counts every category, so the categories of different countries can’t be added up or compared directly.

# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/
dataset:
  # The data product covers all of affordable housing, while this dataset only covers homelessness.
  title: OECD Affordable Housing Database – Homelessness
  update_period_days: 365
  owners:
    - Pablo Arriagada
  changelog:
    - date: 2026-11-24
      changes:
        - Updated to the September 2026 release of the OECD Affordable Housing Database.
        - The share of people experiencing homelessness now shows only each country’s latest data point, because the OECD no longer publishes its 2010–2023 series.
        - The number of people experiencing homelessness now covers around 2018, around 2023, and the latest year.
        - Added the number of people in each type of living situation (ETHOS Light 1 to 6).
        - Belgium is no longer included, because the OECD now reports it only by region.

