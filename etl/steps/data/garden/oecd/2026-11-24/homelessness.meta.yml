      type_of_strategy:
        title: Type of strategy to address homelessness
        unit: ""
        short_unit: ""
        description_short: Whether the country has a national Housing First or housing-led approach to homelessness, another national homelessness strategy, or no national strategy.
        description_key:
          - Housing First models aim to provide tailored, intensive support for people experiencing homelessness who have high and complex needs by providing them with long-term, immediate housing and enabling them to exercise control over their support services.
          - Housing-led solutions are based on access to immediate, long-term housing solutions for people experiencing homelessness.
        processing_level: major
        description_processing: |-
          The data is originally presented as two different classifications: whether countries have an active national strategy to combat homelessness, and whether Housing First or housing-led policies are in place at the national level. We combine them: a country has a “Housing First/housing-led strategy” when it has a Housing First or housing-led approach at the national level. When it doesn’t, but it has an active national homelessness strategy, we classify it as “Other strategy”. Countries with neither are classified as “No national strategy”, even if they have regional or local strategies, or address homelessness in other national strategies.

          The data reflects the strategies reported to the OECD Questionnaire on Affordable and Social Housing (most recently in 2025) and OECD desk research, as published in September 2026. For more information about these two classifications, please refer to the OECD report [National strategies for combating homelessness](https://webfs.oecd.org/Els-com/Affordable_Housing_Database/HC3-2-Homeless-strategies.pdf).
        presentation:
          title_public: Type of strategy to address homelessness
        display:
          name: Type of strategy to address homelessness
          numDecimalPlaces: 0
          <<: *display_common
        type: ordinal
        sort:
          - Housing First/housing-led strategy
          - Other strategy
          - No national strategy
