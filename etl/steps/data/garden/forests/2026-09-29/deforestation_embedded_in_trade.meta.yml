definitions:
  common:
    processing_level: major
    description_processing: |-
      The source reports flows for 161 individual commodities. We sum them into the source's 9 commodity groups.

dataset:
  update_period_days: 365
  owners:
    - Pablo Rosado

tables:
  deforestation_embedded_in_trade:
    variables:
      deforestation_risk:
        title: Deforestation risk embedded in trade
        unit: hectares
        short_unit: ha
        description_short: |-
          Deforestation in the producer country attributed to the commodities consumed in the consumer country, amortized over five years.
      deforestation_emissions:
        title: Deforestation emissions embedded in trade
        unit: tonnes of CO₂
        short_unit: t CO₂
        description_short: |-
          Net emissions from the deforestation in the producer country attributed to the commodities consumed in the consumer country, amortized over five years. Includes losses of above-ground, below-ground and soil carbon, and peat drainage.
