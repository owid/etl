# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    presentation:
      attribution: Freedom House (2026)
      topic_tags:
        - Democracy

# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/
dataset:
  update_period_days: 365
  owners:
    - Pablo Arriagada
    - Lucas Rodés-Guirao

tables:
  fh:
    variables:
      total_score:
        title: Total democracy score
        unit: ""
        description_short: |-
          Freedom House’s freedom score captures the extent of free and fair elections, political pluralism and participation, a functioning government, freedom of expression and association, the rule of law, and personal autonomy. Higher scores indicate more freedom.

        description_key:
          - This score, produced by Freedom House, is useful if you are interested in big and small differences in freedom, want scores for almost all countries, and prefer a definition of democracy that especially focuses on political and civil freedoms. For data that focuses on big differences in political systems or has a narrower or broader understanding of democracy, other sources will be more useful. You can explore these alternatives in our [Key Democracy Charts](https://ourworldindata.org/democracy#all-charts) and [Democracy Data Explorer](https://ourworldindata.org/explorers/democracy?Dataset=Varieties+of+Democracy&Metric=Electoral+democracy&Sub-metric=Main+index&country=ARG~AUS~BWA~CHN~OWID_WRL).
          - The score is based mainly on assessments by Freedom House’s country and regional experts, and its own researchers.
          - It is made up of 10 indicators of political rights (up to 40 points) and 15 indicators of civil liberties (up to 60 points).
          - The score is used by Freedom House to classify countries as [not free, partly free, or free](https://ourworldindata.org/grapher/political-regime-fh).
        presentation:
          grapher_config:
            title: Freedom Score
            subtitle: |-
              Data by [Freedom House](#dod:freedom-house). The score captures the extent of free and fair elections, political pluralism and participation, a functioning government, freedom of expression and association, the rule of law, and personal autonomy. Higher scores indicate more freedom.

      civlibs:
        title: Civil liberties rating
        unit: ""
        description_short: |-
          Identifies the extent of freedom of expression and association, the rule of law, and personal autonomy. Lower ratings indicate more liberties.
        description_key:
          - It is measured on a one-to-seven scale, with one representing the highest degree of Freedom and seven the lowest.

        presentation:
          grapher_config:
            title: Civil Liberties Rating
            subtitle: Data by [Freedom House](#dod:freedom-house). It captures the extent of freedom of expression and association, the rule of law, and personal autonomy. Lower ratings indicate more liberties.
            chartTypes:
              - LineChart
              - SlopeChart
              - DiscreteBar
            hasMapTab: true
            tab: map
            yAxis:
              max: 7
              min: 1
            map:
              colorScale:
                baseColorScheme: Greens
                binningStrategy: manual
                colorSchemeInvert: true
                customNumericLabels:
                  - "1"
                  - "2"
                  - "3"
                  - "4"
                  - "5"
                  - "6"
                  - "7"
                customNumericValues:
                  - 1
                  - 1
                  - 2
                  - 3
                  - 4
                  - 5
                  - 6
                  - 7
        display:
          numDecimalPlaces: 0
      polrights:
        title: Political rights rating
        unit: ""
        description_short: |-
          Identifies the extent of free and fair elections, political pluralism and participation, and a functioning government. Lower ratings indicate more rights.
        description_key:
          - It is measured on a one-to-seven scale, with one representing the highest degree of Freedom and seven the lowest.

        presentation:
          grapher_config:
            title: Political Rights Rating
            subtitle: Data by [Freedom House](#dod:freedom-house). It captures the extent of free and fair elections, political pluralism and participation, and a functioning government. Lower ratings indicate more rights.
            chartTypes:
              - LineChart
              - SlopeChart
              - DiscreteBar
            hasMapTab: true
            tab: map
            yAxis:
              max: 7
              min: 1
            map:
              colorScale:
                baseColorScheme: Blues
                binningStrategy: manual
                colorSchemeInvert: true
                customNumericColors:
                  - 
                customNumericLabels:
                  - "1"
                  - "2"
                  - "3"
                  - "4"
                  - "5"
                  - "6"
                  - "7"
                customNumericValues:
                  - 1
                  - 1
                  - 2
                  - 3
                  - 4
                  - 5
                  - 6
                  - 7
        display:
          numDecimalPlaces: 0

      regime:
        title: Political regime
        unit: ""
        description_short: |-
          The variable identifies the political regime of a country. It distinguishes between free countries, partly free countries, and not free countries.
        description_key: &regime_key
          - Free countries are understood as countries in which citizens have many political rights (free and fair elections, political pluralism and participation, functioning government) and civil liberties (freedoms of expression and association, rule of law, personal autonomy).
          - Partly free country are countries in which citizens have some political rights and civil liberties.
          - Not free country are countries in which citizens have few political rights and civil liberties.
        presentation:
          grapher_config:
            title: Free country
            subtitle: "[Data](#dod:regimes-fh) by [Freedom House](#dod:freedom-house). Free countries are those in which citizens have many political rights (free and fair elections, political pluralism and participation, functioning government) and civil liberties (freedoms of expression and association, rule of law, personal autonomy)."
            chartTypes:
              - Swimlane
            hasMapTab: true
            tab: map
            colorScale: &color_regime
              customCategoryColors:
                Not free: "#a588c3"
                Partly free: "#e8b864"
                Free: "#58ac8c"
            map:
              colorScale: *color_regime
        display:
          numDecimalPlaces: 0

      regime_score:
        title: Political regime (score)
        unit: ""
        description_short: |-
          The variable identifies the political regime of a country. It distinguishes between free countries (2), partly free countries (1), and not free countries (0).
        description_key: *regime_key
        presentation:
          title_public: Political regime
          title_variant: score
        display:
          numDecimalPlaces: 0

      country_flag:
        title: Entity considered a country by Freedom House
        unit: ""
        description_short: |-
          Identifies whether Freedom House consider the entity a country or territory.

      electprocess:
        title: Democratic electoral institutions
        unit: ""
        description_short: |-
          The variable identifies the extent to which the chief executive and legislature are chosen in free and fair elections under universal suffrage. Higher scores indicate a freer electoral process.

        presentation:
          grapher_config:
            title: Democratic Electoral Institutions Score
            subtitle: Data by [Freedom House](#dod:freedom-house). The score captures the extent to which the chief executive and legislature are chosen in free and fair elections under universal suffrage. It ranges from 0 to 12 (most democratic).
            chartTypes:
              - LineChart
              - SlopeChart
              - DiscreteBar
            hasMapTab: true
            tab: map
            yAxis:
              max: 12
              min: 0
            map:
              colorScale:
                baseColorScheme: YlGn
                binningStrategy: manual
                customNumericValues:
                  - 0
                  - 1
                  - 3
                  - 5
                  - 7
                  - 9
                  - 11
                  - 12
        display:
          numDecimalPlaces: 0

      polrights_score:
        title: Political rights score
        unit: ""
        description_short: |-
          Identifies the fine-grained extent of free and fair elections, political pluralism and participation, and a functioning government. Higher scores indicate more rights.

        presentation:
          grapher_config:
            title: Political Rights Score
            subtitle: Data by [Freedom House](#dod:freedom-house). The score captures the extent of free and fair elections, political pluralism and participation, and a functioning government. Higher scores indicate more rights.
            chartTypes:
              - LineChart
              - SlopeChart
              - DiscreteBar
              - Marimekko
            hasMapTab: true
            tab: map
            yAxis:
              max: 40
              min: -3
            map:
              colorScale:
                baseColorScheme: Blues
                binningStrategy: manual
                customNumericValues:
                  - 0
                  - 0
                  - 5
                  - 10
                  - 15
                  - 20
                  - 25
                  - 30
                  - 35
                  - 40
        display:
          numDecimalPlaces: 0
      civlibs_score:
        title: Civil liberties score
        unit: ""
        description_short: |-
          The variable identifies the fine-grained extent of freedom of expression and association, the rule of law, and personal autonomy. Higher scores indicate more liberties.

        presentation:
          grapher_config:
            title: Civil Liberties Score
            subtitle: Data by [Freedom House](#dod:freedom-house). The score captures the extent of freedom of expression and association, the rule of law, and personal autonomy. Higher scores indicate more liberties.
            chartTypes:
              - LineChart
              - SlopeChart
              - DiscreteBar
              - Marimekko
            hasMapTab: true
            tab: map
            yAxis:
              max: 60
              min: 0
            map:
              colorScale:
                baseColorScheme: Greens
                binningStrategy: manual
                customNumericValues:
                  - 0
                  - 10
                  - 20
                  - 30
                  - 40
                  - 50
                  - 60
        display:
          numDecimalPlaces: 0
      electdem:
        title: Electoral democracy
        unit: ""
        description_short: |-
          Identifies if the political regime of a country is an electoral democracy. It identifies whether a country is an electoral democracy ("Yes") or not ("No").
        description_key:
          - Electoral democracies are understood as political systems in which citizens have the right to choose chief executive and legislature in broadly free and fair elections and have substantial other political rights and civil liberties.
        description_processing: |-
          This is a binary indicator which we define as follows:

          * "Yes": If `electprocess >= 7`, `polrights_score >= 20` and `civlibs_score >= 30`.
          * Missing: If `electprocess`, `polrights_score` and `civlibs_score` values are all missing.
          * "No": Otherwise.

        presentation:
          grapher_config:
            title: Democracy
            subtitle: "[Data](#dod:democracy-fh) by [Freedom House](#dod:freedom-house). Democracies are political systems in which citizens have the right to choose the chief executive and legislature in broadly free and fair elections and have substantial other political rights and civil liberties."
            chartTypes:
              - Swimlane
            hasMapTab: true
            tab: map
            colorScale: &color_electdem
              customCategoryColors:
                "No": "#ef8a62"
                "Yes": "#2c7bb6"
            map:
              colorScale: *color_electdem
  fh_regions:
    variables:
      num_regime:
        title: |-
          <% if category == '-1' %>
          Number of countries with unknown regime
          <%- elif category == 'Not free' %>
          Number of not-free countries
          <%- elif category == 'Partly free' %>
          Number of partly-free countries
          <%- elif category == 'Free' %>
          Number of free countries
          <%- endif %>
        unit: "countries"
      num_electdem:
        title: |-
          <% if category == '-1' %>
          Number of countries with unknown regime (electoral democracies)
          <%- elif category == 'Non-electoral democracy' %>
          Number of not-electoral democracies
          <%- elif category == 'Electoral democracy' %>
          Number of electoral democracies
          <%- endif %>
        unit: "countries"

      pop_regime:
        title: |-
          <% if category == '-1' %>
          People living in countries without regime data
          <%- elif category == 'Not free' %>
          People living in not-free countries
          <%- elif category == 'Partly free' %>
          People living in partly-free countries
          <%- elif category == 'Free' %>
          People living in free countries
          <%- endif %>
        unit: "countries"
        description_processing: &description_population |-
          We calculate the number of people living under each type of regime using our [long-term population estimates](https://ourworldindata.org/population-sources). Population estimates from 2024 onwards are projections released by the UN.
      pop_electdem:
        title: |-
          <% if category == '-1' %>
          People living in countries without democracy data
          <%- elif category == 'Non-electoral democracy' %>
          People living in not-electoral democracies
          <%- elif category == 'Electoral democracy' %>
          People living in electoral democracies
          <%- endif %>
        unit: "countries"
        description_processing: *description_population
