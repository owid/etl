# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    presentation:
      topic_tags:
        - Cancer
      grapher_config:
        note: To allow for comparisons between countries and over time, this metric is [age-standardized](#dod:age_standardized).
    processing_level: minor
  # The source labels the site "Oesophagus"; we use American spelling in user-facing text.
  cancer_lower: << cancer.lower().replace("oesophageal", "esophageal") >>
  cancer_title: << cancer.replace("Oesophageal", "Esophageal") >>
  patients: <% if gender == "All" %>patients<% else %><< gender.lower() >><% endif %>
  people: <% if gender == "All" %>people<% else %><< gender.lower() >><% endif %>
  amongst_gender: <% if gender != "All" %> amongst << gender.lower() >><% endif %>
  among_gender: <% if gender != "All" %> among << gender.lower() >><% endif %>
  description_prod_incidence_mortality: &description_prod_incidence_mortality |-
    Age-standardized cancer incidence and mortality rates (ASR) were computed for ages 25 years and older using the age-truncated World Standard Population and expressed as rates per 100 000 person-years (Segi, 1960).
  description_prod_survival: &description_prod_survival |-
    Net survival (patients’ survival as if cancer was the only cause of death) was calculated to estimate population-based cancer survival.

    Age-standardization was carried out using international cancer survival standard weights (Corazziari et al., 2004). The cohort approach was used for 1995–1999, 2000–2004, and 2005–2009, and the period approach was used for 2010–2014 (Brenner and Gefeller, 1996).

# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/
dataset:
  # The SURVMARK-2 project is complete (patients diagnosed 1995-2014); the producer does not publish new data.
  update_period_days: 0
  owners:
    - Lucas Rodés-Guirao

tables:
  gco_cancer_survival:
    variables:
      net_survival:
        title: Net survival rates of {definitions.patients} with {definitions.cancer_lower} cancer after five years
        unit: "%"
        short_unit: "%"
        description_short: Percentage of patients still alive five years after the diagnosis, assuming cancer is the only cause of death.
        description_key:
          - The percentage of patients still alive at a certain time after diagnosis, assuming cancer is the only cause of death.
          - Net survival estimates survival by removing the effect of other causes of death.
          - It represents the theoretical survival of cancer patients if they could only die from cancer-related causes.
          - This measure allows fair comparisons between groups with different probabilities of non-cancer death.
          - Net survival rates are age-standardized using the International Cancer Survival Standard (ICSS) weights.
        description_from_producer: *description_prod_survival
        presentation:
          title_public: Net survival rates of {definitions.patients} with {definitions.cancer_lower} cancer after five years
        display:
          numDecimalPlaces: 0
          name: "{definitions.cancer_title} cancer{definitions.among_gender}"

      incidence__asr:
        title: Age-standardized incidence rates of {definitions.cancer_lower} cancer{definitions.amongst_gender}
        unit: cases per 100,000 {definitions.people}
        short_unit: ""
        description_short: Number of new cases of {definitions.cancer_lower} cancer per 100,000 {definitions.people} aged 25 and older in a given year, age-standardized to the World Standard Population.
        description_key:
          - Cancer incidence is the number of new cancer cases arising in a specified population over a given period of time (typically 1 year).
          - It can be expressed as an absolute number of cases within the entire population per year or as a rate per 100,000 persons per year.
          - Incidence information is collected routinely by cancer registries.
          - Rates are computed for ages 25 years and older and age-standardized using the World Standard Population.
        description_from_producer: *description_prod_incidence_mortality
        presentation:
          title_public: Incidence rates of {definitions.cancer_lower} cancer{definitions.amongst_gender}
        display:
          numDecimalPlaces: 1
          name: "{definitions.cancer_title} cancer{definitions.among_gender}"

      mortality__asr:
        title: Age-standardized mortality rates of {definitions.cancer_lower} cancer{definitions.amongst_gender}
        unit: deaths per 100,000 {definitions.people}
        short_unit: ""
        description_short: Number of deaths from {definitions.cancer_lower} cancer per 100,000 {definitions.people} aged 25 and older in a given year, age-standardized to the World Standard Population.
        description_key:
          - Cancer mortality is the number of deaths due to cancer occurring in a specified population in a given year.
          - It can be expressed as an absolute number of deaths within the entire population per year or as a rate per 100,000 persons per year.
          - Mortality data are provided by national statistical offices.
          - Rates are computed for ages 25 years and older and age-standardized using the World Standard Population.
        description_from_producer: *description_prod_incidence_mortality
        presentation:
          title_public: Mortality rates of {definitions.cancer_lower} cancer{definitions.amongst_gender}
        display:
          numDecimalPlaces: 1
          name: "{definitions.cancer_title} cancer{definitions.among_gender}"
