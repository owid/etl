# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    presentation:
      topic_tags:
        - Marriages & Divorces
      attribution_short: UK ONS


# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/
dataset:
  update_period_days: 365
  changelog:
    - date: 2026-10-23
      changes:
        - Added 2023 marriages. ONS now publishes unrounded values, so past figures shift by up to 0.07 percentage points.


  owners:
    - Tuna Acisu
    - Edouard Mathieu
tables:
  marriages:
    variables:
      cumulative_percentage_per_100:
        title: Proportions of men or women who had ever married by a certain age for << birth_cohort >> birth cohort
        unit: "%"
        short_unit: "%"
        description_short: |-
          Percentage of men or women born in a given year who had married in England and Wales by a given age.
        description_key:
          - The data covers marriages registered in England and Wales. It doesn’t include marriages of residents that take place abroad, so the true share of people who have ever married could be higher.
          - From 2014, people who married a same-sex partner also count as ever married. The first same-sex weddings in England and Wales took place on March 29, 2014.
          - Same-sex couples who converted their civil partnership into a marriage count as ever married. The ONS doesn’t know whether they had been married before their civil partnership, so it assumes they hadn’t.
          - A new law raised the minimum age of marriage to 18 in February 2023. Before that, people aged 16 and 17 could marry with their parents’ consent, and those marriages are included in this data.
        description_from_producer: |-
          Marriage statistics are derived from information recorded when marriages are legally registered as part of civil registration.

          Figures represent civil and religious marriages that take place in England and Wales only. Marriages to residents of England and Wales that take place outside of England and Wales are not included while marriages that take place in England and Wales to non-residents are included.

          Ages are presented in 'exact years', so the figures should be interpreted as the proportion per 1,000 men or women that have married up to that actual birthday. So 'by age 30' represents marriages up to the last day a person is 29 (the day before their 30th birthday).

          For tables 14a, 14b, 15a and 15b, from 2014 marriage statistics onwards, ever married will include people entering into a marriage with either an opposite sex or a same sex partner. Same-sex couples converting their civil partnership into a marriage will be included with ever married because previous marital status is unknown; therefore within this table we are assuming a previous marital status (before civil partnership) of never married or civil partnered.
        processing_level: minor
        presentation:
          title_public: Share of people born in << birth_cohort >> who had ever married, by age
        display:
          roundingMode: significantFigures
          numSignificantFigures: 2
          name: << birth_cohort >>
