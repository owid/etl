definitions:
  common:
    processing_level: major
    description_processing: First, we organized countries into groups based on geographical regions and income levels, aligning with World Bank classifications. To quantify data completeness, we identified entries with missing information in the indicator. For each grouping, we calculated the percentage of countries with missing data, thus mapping out the distribution of data gaps across different regions and income levels.
    description_key:
      - This data is based on the World Health Organization (WHO) mortality database. The WHO mortality database compiles cause-of-death statistics reported by member states, based on the [underlying cause](#dod:underlying-cause-of-death) listed on death certificates.
      - Causes of death are not always available in countries with poorly functioning [vital registries](#dod:crvs).
      - Additionally, suicide deaths are underreported in many countries due to social stigma and cultural or legal concerns.
      - This dataset helps to identify gaps in suicide mortality data across different countries, regions, and income groups.
  presentation:
    topic_tags:
      - Mental Health

dataset:
  title: Missing data - Deaths from Suicides
  update_period_days: 365

  owners:
    - Lucas Rodés-Guirao

tables:
  who_md_suicides:
    variables:
      missing_countries:
        title: Number of countries with missing data on deaths from suicides
        short_unit: ''
        unit: ''

      fraction_missing_countries:
        title: Share of countries with missing data on deaths from suicides
        short_unit: '%'
        unit: '%'

      fraction_available_countries:
        title: Share of countries with available data on deaths from suicides
        description_short: Causes of death are unreported in countries with poorly functioning [vital registries](#dod:crvs). Suicide deaths are underreported in many countries due to social stigma and cultural or legal concerns. This share is based on data availability in the WHO mortality database.
