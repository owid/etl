tables:
  levelized_cost_of_energy:
    variables:
      lcoe:
        title: Levelized cost of energy
        description_short: |-
          Electricity prices expressed as levelized cost of energy (LCOE), which includes the cost of building, maintaining, and operating a power plant, as well as ongoing fuel and operational expenses over its lifetime. This data is expressed in US dollars per [megawatt-hour](#dod:watt-hours), adjusted for inflation.
        unit: 'constant {BASE_DOLLAR_YEAR} US$ per megawatt-hour'
        short_unit: $/MWh
        processing_level: major
        description_processing: |-
          - Prices have been adjusted for inflation using the U.S. GDP deflator (linked series) from the World Bank (World Development Indicators, [NY.GDP.DEFL.ZS.AD](https://data.worldbank.org/indicator/NY.GDP.DEFL.ZS.AD?locations=US)). To convert the original prices in current US$ to constant {BASE_DOLLAR_YEAR} US$, they were divided by the deflator value of their own year and multiplied by the deflator value for {BASE_DOLLAR_YEAR}. For the latest year, not yet covered by the World Bank series, the deflator was extended using the growth of the [GDP implicit price deflator](https://www.bea.gov/data/prices-inflation/gdp-price-deflator) from the U.S. Bureau of Economic Analysis (average of the quarters published so far).
        presentation:
          title_public: |-
            How did the price of electricity from new power plants change over the last {YEAR_LAPSE} years?
          grapher_config:
            note: |-
              Data reflects unsubsidized costs, expressed in constant {BASE_DOLLAR_YEAR} US$.
      lcoe_unadjusted:
        title: Levelized cost of energy, not adjusted for inflation
        description_short: |-
          Electricity prices expressed as levelized cost of energy (LCOE), which includes the cost of building, maintaining, and operating a power plant, as well as ongoing fuel and operational expenses over its lifetime. This data is expressed in US dollars per [megawatt-hour](#dod:watt-hours), not adjusted for inflation.
        unit: 'current US$ per megawatt-hour'
        short_unit: $/MWh
        processing_level: minor
        presentation:
          grapher_config:
            note: |-
              Data reflects unsubsidized costs.
