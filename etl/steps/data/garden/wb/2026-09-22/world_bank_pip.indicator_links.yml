# Grapher indicators that hold the same data as the columns of the PIP dataset. The dataset page shows the charts
# that use these indicators. The grapher step is built from these six tables, and it makes one indicator for each
# combination of their dimension columns: a link to a grapher column covers all the indicators made from it.
cpi:
  cpi:
    - grapher/wb/*/world_bank_pip/cpi#cpi
incomes:
  thr:
    - grapher/wb/*/world_bank_pip/incomes#thr
  avg:
    - grapher/wb/*/world_bank_pip/incomes#avg
  mean:
    - grapher/wb/*/world_bank_pip/incomes#mean
  median:
    - grapher/wb/*/world_bank_pip/incomes#median
  top1_avg:
    - grapher/wb/*/world_bank_pip/incomes#top1_avg
  top1_thr:
    - grapher/wb/*/world_bank_pip/incomes#top1_thr
  share:
    - grapher/wb/*/world_bank_pip/incomes#share
inequality:
  gini:
