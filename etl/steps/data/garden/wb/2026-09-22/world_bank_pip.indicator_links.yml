  palma_ratio:
    - grapher/wb/*/world_bank_pip/inequality#palma_ratio
  s80_s20_ratio:
    - grapher/wb/*/world_bank_pip/inequality#s80_s20_ratio
  p90_p10_ratio:
    - grapher/wb/*/world_bank_pip/inequality#p90_p10_ratio
  p90_p50_ratio:
    - grapher/wb/*/world_bank_pip/inequality#p90_p50_ratio
  p50_p10_ratio:
    - grapher/wb/*/world_bank_pip/inequality#p50_p10_ratio
  bottom50_share:
    - grapher/wb/*/world_bank_pip/inequality#bottom50_share
  middle40_share:
    - grapher/wb/*/world_bank_pip/inequality#middle40_share
  top90_99_share:
    - grapher/wb/*/world_bank_pip/inequality#top90_99_share
  top1_share:
    - grapher/wb/*/world_bank_pip/inequality#top1_share
  mld:
    - grapher/wb/*/world_bank_pip/inequality#mld
  polarization:
    - grapher/wb/*/world_bank_pip/inequality#polarization
other_indicators:
