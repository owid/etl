tables:
  gender_statistics:
    # Learn more about the available fields:
    # http://docs.owid.io/projects/etl/architecture/metadata/reference/indicator/
    variables:

      total_maternity_leave_to:
        description_from_producer: |-
          **This indicator is a sum of 2 different leave indicators provided by the World Bank:**

          The indicator 'Length of paid maternity leave (calendar days)' is described by the World Bank as: The indicator refers to leave available only to the mother for the birth of a child to be taken just before, during and immediately after childbirth.

          The indicator 'Length of paid parental leave for mother (calendar days)' is described by the World Bank as: The indicator refers to days of parental leave reserved specifically for mothers—through “use-it-or-lose-it” policies or mothers’ quotas; or days of parental leave that employees are individually entitled to.

          {definitions.wbl_limitations}
        title: Total days of leave available to the mother
        unit: days
        short_unit: ''
        description_processing: This indicator was created by Our World in Data by combining maternity leave and parental leave mother quota indicators. For more details on each indicator see the section on **How producer describes this data**.
        description_key:
          - This indicator is created by combining two specific types of parental leave. These components, together, provide a detailed understanding of the total leave available to mothers in relation to childbirth and early childcare.
          - The first component, the length of paid maternity leave, focuses on the leave specifically designated for mothers around the time of childbirth. This includes the days taken just before, during, and immediately after giving birth. The primary focus of this leave is on the mother's recovery and the essential bonding time with the newborn. It's a critical period that supports the mother's health and wellbeing, as well as the initial development of the child.
          - The second component, the length of paid parental leave for mother, includes days of parental leave that are specifically reserved for mothers. These are often defined by "use-it-or-lose-it" policies or mothers’ quotas. This part of the indicator represents additional support provided to mothers, extending beyond the traditional maternity leave period. It ensures that mothers have dedicated time for child-rearing and recovery, which cannot be transferred to fathers. This acknowledges the unique needs of mothers in the postnatal period and supports their role in early childcare.
          - The sum of these components reflects the total days of leave available specifically for the mother, emphasizing the support for maternal health and well-being.
          - *desc_standardized_assumptions
        processing_level: major
        display:
          numDecimalPlaces: 0

      total_paternity_leave_to:
        description_from_producer: |-
          **This indicator is a sum of 2 different leave indicators provided by the World Bank:**

          The indicator 'Length of paid parental leave for father (calendar days)' is described by the World Bank as: The indicator refers to days of parental leave reserved specifically for fathers—that is, through “use-it-or-lose-it” policies or fathers’ quotas; or days of parental leave that employees are individually entitled to.

          The indicator 'Length of paid paternity leave (calendar days)' is described by the World Bank as: The indicator refers to leave available only to the father for the birth of a child.

          {definitions.wbl_limitations}
        title: Total days of leave available to the father
        unit: days
        short_unit: ''
        description_processing: This indicator was created by Our World in Data by combining paternity leave and parental leave father quota indicators. For more details on each indicator see **How producer describes this data**."
        description_key:
          - This indicator is created by combining two specific types of parental leave. These components, together, provide a detailed understanding of the total leave available to fathers in relation to childbirth and early childcare.
          - The first component, the length of paid paternity leave, focuses on the leave specifically designated for fathers at the time of childbirth. This includes the days available exclusively to fathers to support them in bonding with the newborn and assisting in early childcare. This leave plays a crucial role in supporting the father's engagement during the early stages of a child's life.
          - The second component, the length of paid parental leave for father, includes days of parental leave that are specifically reserved for fathers. These are often defined by "use-it-or-lose-it" policies or fathers’ quotas. This part of the indicator represents additional support provided to fathers, extending beyond the traditional paternity leave period. It ensures that fathers have dedicated time for child-rearing, promoting their active involvement in early childcare and supporting gender equality in parental responsibilities.
          - The sum of these components reflects the total days of leave available specifically for the father, highlighting the support for paternal involvement and gender equality in parenting.
          - *desc_standardized_assumptions
        processing_level: major
        display:
          numDecimalPlaces: 0

      total_maternity_leave_for:
        description_from_producer: |-
          **This indicator is a sum of 3 different leave indicators provided by the World Bank:**

          The indicator 'Length of paid maternity leave (calendar days)' is described by the World Bank as: The indicator refers to leave available only to the mother for the birth of a child to be taken just before, during and immediately after childbirth.

          The indicator 'Length of paid parental leave for mother (calendar days)' is described by the World Bank as: The indicator refers to days of parental leave reserved specifically for mothers—through “use-it-or-lose-it” policies or mothers’ quotas; or days of parental leave that employees are individually entitled to.

          The indicator 'Length of paid shared parental leave (calendar days)' is described by the World Bank as: The indicator refers to parental leave that can be shared amongst the parents as they choose. Parental leave refers to leave available equally to parents—regardless of gender—for the purpose of childcare immediately following maternity and paternity leave OR instead of maternity and paternity leave.

          {definitions.wbl_limitations}
        title: Total days of leave available for the mother
        unit: days
        short_unit: ''
        description_processing: This indicator was created by Our World in Data by combining maternity leave, parental leave mother quota and shared parental leave indicators. For more details on each indicator see **How producer describes this data**.
        description_key:
          - This indicator is created by combining three specific types of parental leave. These components, together, provide a detailed understanding of the total leave available to mothers in relation to childbirth and early childcare.
          - The first component, the length of paid maternity leave, focuses on the leave specifically designated for mothers at the time of childbirth. This includes the days available exclusively to mothers to support them in bonding with the newborn and assisting in early childcare. This leave plays a crucial role in supporting the mother's engagement during the early stages of a child's life.
          - The second component, the length of paid parental leave for mother, includes days of parental leave that are specifically reserved for mothers. These are often defined by policies that support gender equality in parental responsibilities. This part of the indicator represents additional support provided to mothers, extending beyond the traditional maternity leave period.
          - The third component, the length of shared parental leave, represents the portion of leave that can be shared between parents. This flexibility allows for a more equitable distribution of childcare responsibilities and supports gender equality.
          - By integrating these components, the indicator provides a total count of the calendar days of leave available to mothers.
          - *desc_standardized_assumptions
        processing_level: major
        display:
          numDecimalPlaces: 0

      total_paternity_leave_for:
        description_from_producer: |-
          **This indicator is a sum of 3 different leave indicators provided by the World Bank:**

          The indicator 'Length of paid parental leave for father (calendar days)' is described by the World Bank as: The indicator refers to days of parental leave reserved specifically for fathers—that is, through “use-it-or-lose-it” policies or fathers’ quotas; or days of parental leave that employees are individually entitled to.

          The indicator 'Length of paid paternity leave (calendar days)' is described by the World Bank as: The indicator refers to leave available only to the father for the birth of a child.

          The indicator 'Length of paid shared parental leave (calendar days)' is described by the World Bank as: The indicator refers to parental leave that can be shared amongst the parents as they choose. Parental leave refers to leave available equally to parents—regardless of gender—for the purpose of childcare immediately following maternity and paternity leave OR instead of maternity and paternity leave.

          {definitions.wbl_limitations}
        title: Total days of leave available for the father
        unit: days
        short_unit: ''
        description_processing: This indicator was created by Our World in Data by combining paternity leave, parental leave father quota and shared parental leave indicators. For more details on each indicator see **How producer describes this data**.
        description_key:
          - This indicator is created by combining three specific types of parental leave. These components, together, provide a detailed understanding of the total leave available for the fathers in relation to childbirth and early childcare.
          - The first component, the length of paid paternity leave, focuses on the leave specifically designated for fathers at the time of childbirth. This includes the days available exclusively to fathers to support them in bonding with the newborn and assisting in early childcare.
          - The second component, the length of paid parental leave for father, includes days of parental leave that are specifically reserved for fathers. These are often defined by "use-it-or-lose-it" policies or fathers’ quotas.
          - The third component, the length of shared parental leave, represents the portion of leave that can be shared between parents. This flexibility allows for a more equitable distribution of childcare responsibilities and supports gender equality.
          - By integrating these components, the indicator provides a total count of the calendar days of leave available for fathers.
          - *desc_standardized_assumptions
        processing_level: major
        display:
          numDecimalPlaces: 0

      sl_agr_empl_zs:
        title: Share of people employed in agricultural sector
        description_short: The share of people employed in agriculture includes working-age people with a job in farming, forestry, fishing, and related activities, including those temporarily absent.
        description_key:
          - This measures the percentage of all workers who are employed in agriculture.
          - Agriculture includes farming, forestry, fishing, and related activities.
          - People are counted even if they are temporarily absent from work due to sickness, leave, or seasonal factors.
        unit: "%"
        short_unit: "%"
        display:
          numDecimalPlaces: 1
          tolerance: 5

      sg_own_ldal_ma_zs:
        title: Share of men who own land alone
        description_short: Share of men aged 15–49 with land registered in their name or requiring their signature to sell.
        description_key:
          - This measures the proportion of men aged 15–49 who are the sole owners of land.
          - Sole ownership means the land is legally registered in their name or cannot be sold without their approval.
          - Land ownership gives men economic security and influence within households and communities.
          - The indicator does not include land held jointly with others.
        unit: "%"
        short_unit: "%"
        display:
          numDecimalPlaces: 1
          tolerance: 10

      sg_own_ldal_fe_zs:
        title: Share of women who own land alone
        description_short: Share of women aged 15–49 with land registered in their name or requiring their signature to sell.
        description_key:
          - This measures the proportion of women aged 15–49 who are the sole owners of land.
          - Sole ownership means the land is legally registered in their name or cannot be sold without their approval.
          - Land ownership gives women economic security and a stronger role in decision-making.
          - Women often face barriers to ownership due to inheritance laws, marital rules, or social customs.
        unit: "%"
        short_unit: "%"
        display:
          numDecimalPlaces: 1
          tolerance: 10

      sg_leg_dvaw:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether there is legislation addressing domestic violence that includes criminal sanctions or provides for protection orders for domestic violence, or the legislation addresses "harassment" that clearly leads to physical or mental harm in the context of domestic violence.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: There is legislation specifically addressing domestic violence
        description_short: The law on domestic violence may punish offenders, provide protection orders for victims, or address harassment that causes physical or mental harm.
        description_key:
          - Domestic violence includes physical, sexual, psychological, and economic abuse in families or intimate relationships.
          - The indicator measures whether legislation specifically addresses domestic violence.
          - The answer is "yes" if the law explicitly covers all forms of domestic violence, includes criminal sanctions or protection orders, and criminalizes marital rape or allows a wife to file a complaint.
          - The answer is "no" if there is no such legislation, if the law omits one or more forms of domestic violence, lacks sanctions or protection orders, protects only certain women or family members, does not criminalize marital rape, or only increases penalties for general crimes when committed within families.
          - In the absence of such laws, survivors usually have only limited protection under general criminal law.
          - *desc_law_enforcement
          - *desc_standardized_assumptions
        unit: "(1=yes; 0=no)"
        display:
          numDecimalPlaces: 0
          tolerance: 5

      ic_frm_femm_zs:
        title: Share of firms with a female top manager
        description_short: Top manager refers to the highest ranking manager or CEO of the establishment. This may be the owner if she works as the manager of the firm.
        description_key:
          - This measures the percentage of firms where the top manager is a woman.
          - The top manager is usually the CEO or highest-ranking executive, but may also be the owner if she manages the firm.
          - Female leadership is important for gender equality in business and decision-making.
        unit: "% of firms"
        short_unit: "%"
        display:
          numDecimalPlaces: 1
          tolerance: 5

      sg_law_obhb_mr_no:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether a married woman is legally required to obey her husband.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: Married women are not required by law to obey their husbands
        description_short: This indicator captures whether family law includes any provision requiring a married woman to obey her husband or penalizing her for disobedience, such as loss of maintenance rights.
        description_key:
          - Family law in some countries includes provisions requiring married women to obey their husbands, often rooted in traditional or religious legal frameworks.
          - This indicator measures whether national family law includes any legal obligation for married women to obey their husbands.
          - The answer is "yes" (women are not required to obey) if family law treats spouses as equals without requiring obedience from either party.
          - The answer is "no" (women are required to obey) if family law explicitly requires wives to obey husbands or imposes legal penalties for disobedience, such as loss of maintenance rights or other consequences.
          - Such provisions restrict women's autonomy, reinforce unequal treatment within marriage, and can limit women's ability to make independent decisions.
          - If such provisions exist, they restrict women’s autonomy and reinforce unequal treatment within marriage.
          - Disobedience can carry legal consequences, such as loss of the right to maintenance.
          - *desc_law_enforcement
          - *desc_standardized_assumptions
        unit: "(1=yes; 0=no)"
        display:
          numDecimalPlaces: 0
          tolerance: 5

      sg_gen_mnst_zs:
        title: Share of women in ministerial positions
        description_short: Deputy prime ministers and prime ministers or heads of government that hold ministerial portfolios are included, vice-presidents and heads of governmental or public agencies are excluded.
        description_key:
          - This measures the percentage of ministerial positions held by women.
          - It includes deputy prime ministers and prime ministers if they also hold a ministerial role.
          - It excludes vice-presidents and leaders of public agencies that are not part of the cabinet.
          - A higher share indicates greater representation of women in senior government positions.
        unit: "%"
        short_unit: "%"
        display:
          numDecimalPlaces: 1
          tolerance: 5

      sg_law_nodc_hr:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether the law generally prevents or penalizes gender-based discrimination in employment. Laws that mandate equal treatment or equality between women and men in employment are also counted for this question. It is not considered whether the laws only prohibit discrimination in one aspect of employment, such as pay or dismissal.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: Employment discrimination based on gender prohibited
        description_short: The law prohibits employers from discriminating based on sex or gender, or mandates equal treatment of women and men in employment.
        description_key:
          - This indicator records whether national laws prohibit gender-based discrimination in employment.
          - Such laws may cover hiring, pay, promotion, and conditions of work.
          - A “yes” means the law requires equal treatment of women and men at work.
          - Without such protections, women and men may face unequal opportunities in the labor market.
          - *desc_law_enforcement
          - *desc_standardized_assumptions
        unit: "(1=yes; 0=no)"
        display:
          numDecimalPlaces: 0
          tolerance: 5

      sg_get_jobs_eq:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether there are restrictions on a woman's legal capacity and ability to work.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: Women can get a job in the same way as men
        description_short: Husbands cannot prevent their wives from working, women don't need more permissions or additional documentation to work relative to men, and their work is not considered a form of disobedience with legal consequences.
        description_key:
          - This indicator records whether women face legal barriers to entering employment.
          - In some countries, women need permission from a husband or guardian to work.
          - A “yes” means women can take a job without needing more approvals or documents than men.
          - Equal rights to employment allow women to participate more fully in the labor market.
          - *desc_law_enforcement
          - *desc_standardized_assumptions
        unit: "(1=yes; 0=no)"
        display:
          numDecimalPlaces: 0
          tolerance: 5

      sg_leg_sxhr_em:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether there is a legal provision or legislation that specifically protects women against sexual harassment in employment, including unwelcome verbal or physical conduct of a sexual nature.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: Legislation on sexual harassment in employment
        description_short: Legal provisions specifically protect against sexual harassment in employment, including unwelcome verbal or physical conduct of a sexual nature.
        description_key:
          - This indicator records whether a country has laws against sexual harassment in employment.
          - Sexual harassment includes unwelcome physical, verbal, or non-verbal conduct of a sexual nature at work.
          - Laws may define harassment and set penalties or remedies for victims.
          - A “yes” means that workers are legally protected, though enforcement may vary.
          - The absence of such laws leaves employees without legal protection from harassment.
          - *desc_law_enforcement
          - *desc_standardized_assumptions
        unit: "(1=yes; 0=no)"
        display:
          numDecimalPlaces: 0
          tolerance: 5

      sl_tlf_cact_fm_zs:
        title: Female-to-male labor force participation ratio
        description_short: The female-to-male labor force participation ratio compares the share of women and men aged 15+ who are working or actively looking for work.
        description_key:
          - This measures the ratio of women’s to men’s labor force participation rates.
          - Labor force participation includes people who are working or actively seeking work.
          - A value of 100% means equal participation between women and men.
          - A lower value means fewer women are in the labor force relative to men.
          - This indicator highlights gender gaps in access to and participation in employment.
        unit: "%"
        short_unit: "%"
        display:
          numDecimalPlaces: 1
          tolerance: 5

      sg_own_prrt_im:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether no legal restriction related to property is applied to women or men based on gender (i.e. if legal restrictions on property ownership are applied based on gender, or if there are gender differences in the legal treatment of spousal property, such as granting the husband administrative control of marital property. This includes instances in which legal systems are supported by custom and judicial precedent).

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: Women and men have the same rights to own property
        description_short: The law gives women and men the same rights to own and manage property, without granting husbands special control over marital property.
        description_key:
          - This indicator records whether women and men have equal legal rights to own property.
          - Equal rights mean both spouses can own, buy, or sell property in their own name.
          - Husbands do not have special control over marital property if equality is guaranteed.
          - Property rights are a foundation of economic independence and security.
          - *desc_law_enforcement
          - *desc_standardized_assumptions
        unit: "(1=yes; 0=no)"
        display:
          numDecimalPlaces: 0
          tolerance: 5

      sl_uem_neet_fe_zs:
        title: Share of young women not in education, employment or training
        description_short: Share of women aged 15–24 who are not in education, employment, or vocational training.
        description_key:
          - This measures the percentage of young women aged 15–24 who are not studying, working, or in training.
          - It shows how many are outside both the education system and the labor market.
          - High rates can reflect limited opportunities, social barriers, or economic challenges.
          - Being out of education or work can affect future earnings and independence.
          - Reducing NEET rates is important for supporting youth development and gender equality.
        unit: "%"
        short_unit: "%"
        display:
          numDecimalPlaces: 1
          tolerance: 10

      sl_uem_neet_ma_zs:
        title: Share of young men not in education, employment or training
        description_short: Share of men aged 15–24 who are not in education, employment, or vocational training.
        description_key:
          - This measures the percentage of young men aged 15–24 who are not studying, working, or in training.
          - It captures how many are excluded from both education and the labor market.
          - High NEET rates suggest barriers to learning or employment that affect young men.
          - Being outside education and work can lead to long-term disadvantages.
          - Monitoring NEET rates helps track youth inclusion and economic opportunities.
        unit: "%"
        short_unit: "%"
        display:
          numDecimalPlaces: 1
          tolerance: 10

      sg_pen_sxhr_em:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether the law establishes criminal sanctions, such as fines or imprisonment, for sexual harassment in employment; if the provision in the criminal code provides for reparation of damages for offenses covered by the code; or if the law provides for civil remedies or compensation for victims of sexual harassment in employment or the workplace, even after dismissal of the victims.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: Criminal sanctions or compensation for sexual harassment in employment
        description_short: The law punishes sexual harassment at work with fines or prison, requires offenders to compensate victims, or allows victims to seek civil remedies even after losing their job.
        description_key:
          - This indicator records whether laws provide penalties or remedies for workplace sexual harassment.
          - Penalties may include fines, prison sentences, or disciplinary measures.
          - Victims may also have the right to compensation or civil remedies.
          - A “yes” means legal systems recognize harassment as a punishable offense.
          - Strong sanctions can deter harassment and support safer workplaces.
          - *desc_law_enforcement
          - *desc_standardized_assumptions
        unit: "(1=yes; 0=no)"
        display:
          numDecimalPlaces: 0
          tolerance: 5

      sg_iht_asst_pt_eq:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether there are gender-based differences in the rules of intestate succession for transfer of property from parents to children.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: Equal rights of inheritance for sons and daughters when no will is left
        description_short: When parents die without a will, sons and daughters have the same rights to inherit.
        description_key:
          - This indicator records whether sons and daughters inherit equally when parents die without a will.
          - Equal inheritance means children are treated the same regardless of gender.
          - A “no” indicates daughters receive less or different inheritance rights than sons.
          - Inheritance laws shape the distribution of wealth and economic opportunities.
          - *desc_law_enforcement
          - *desc_standardized_assumptions
        unit: "(1=yes; 0=no)"
        display:
          numDecimalPlaces: 0
          tolerance: 5

      sg_opn_bank_eq:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether there are restrictions on a woman opening a bank account (i.e. a woman has limited legal capacity or is required to provide any additional permission or documentation that is not required of a man; or legal provisions limit the ability of a woman to open a bank account, such as stating that a married woman who is separately employed from her husband may open a bank account in her own name).

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: Women can open a bank account on the same terms as men
        description_short: The law does not limit women’s ability to open a bank account, whether they are married or unmarried, and they do not need approval beyond what is required of men.
        description_key:
          - This indicator records whether women face restrictions on opening a bank account.
          - A “yes” means women can open accounts independently, without extra approvals.
          - Equal access to banking is crucial for financial independence and participation in the economy.
          - Restrictions can limit women’s ability to save, borrow, or build credit.
          - *desc_law_enforcement
          - *desc_standardized_assumptions
        unit: "(1=yes; 0=no)"
        display:
          numDecimalPlaces: 0
          tolerance: 5

      sg_apl_pspt_eq:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether there are differences in passport application procedures between men and women.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: Women can apply for a passport in the same way as men
        description_short: Women can apply for a passport without needing permission, a signature, or details from their husband, father, or another relative.
        description_key:
          - This indicator records whether women can apply for a passport on the same terms as men.
          - A “yes” means women do not need a husband’s or guardian’s approval to obtain a passport.
          - Equal rights to passports are essential for freedom of movement and travel.
          - Restrictions can prevent women from working, studying, or traveling abroad.
          - *desc_law_enforcement
          - *desc_standardized_assumptions
        unit: "(1=yes; 0=no)"
        display:
          numDecimalPlaces: 0
          tolerance: 5

      sg_law_crdd_gr:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether the law prohibits discrimination by creditors based on gender or prescribes equal access for both men and women when conducting financial transactions, entrepreneurial activities or receiving financial assistance, or if the law prohibits gender discrimination when accessing goods and services (and services are defined to include financial services).

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: Equal access to financial services for women and men
        description_short: The law prohibits gender discrimination by banks or other financial institutions, and requires equal treatment of women and men in financial transactions, business activities, financial assistance, and access to goods and services.
        description_key:
          - This indicator records whether women and men have equal legal access to financial services.
          - Equal access means banks and lenders cannot discriminate by gender.
          - It covers services like loans, credit, business financing, and other transactions.
          - A “yes” shows the law supports fairness in financial opportunities.
          - Equal financial rights allow women to invest, grow businesses, and build assets.
          - *desc_law_enforcement
          - *desc_standardized_assumptions
        unit: "(1=yes; 0=no)"
        display:
          numDecimalPlaces: 0
          tolerance: 5

      sg_bus_regt_eq:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether there are restrictions on a woman registering a business (i.e. if a woman needs her husband’s or guardian’s permission, signature or consent to register a business; or the registration process at any stage requires a woman to provide additional information or documentation that is not required of a man).

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: Women can register a business on the same terms as men
        description_short: Women face no legal restrictions when registering a business, such as needing a husband’s consent or providing extra documents not required of men.
        description_key:
          - This indicator records whether women can legally register a business without extra restrictions.
          - A “yes” means women follow the same process as men, with no need for consent from a husband or guardian.
          - Equal rights to register a business support women’s participation in entrepreneurship and the economy.
          - Restrictions can discourage women from starting companies and reduce economic opportunities.
          - Legal equality in business registration is an important step toward gender equality in economic life.
          - *desc_law_enforcement
          - *desc_standardized_assumptions
        unit: "(1=yes; 0=no)"
        display:
          numDecimalPlaces: 0
          tolerance: 5

      sg_obt_dvrc_eq:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether the divorce process is equal for women and men or includes additional protections for women, such as prohibiting a husband from initiating divorce proceedings while his wife is pregnant.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: Women can get a divorce on the same terms as men
        description_short: The divorce process is equal for women and men, unless the law provides women with added safeguards, such as during pregnancy. It is unequal if women face extra barriers, only men can initiate, or divorce is prohibited.
        description_key:
          - This indicator records whether women and men have equal legal rights to divorce.
          - A “yes” means either spouse can start divorce proceedings under the same conditions.
          - A “no” means women face additional barriers, such as requiring a husband’s consent or being prohibited from divorcing.
          - Equal rights to divorce are central to women’s autonomy and freedom of choice in marriage.
          - Safeguards for women, such as during pregnancy, do not make the law unequal if men and women otherwise have the same rights.
          - *desc_law_enforcement
          - *desc_standardized_assumptions
        unit: "(1=yes; 0=no)"
        display:
          numDecimalPlaces: 0
          tolerance: 5

      sg_rem_rigt_eq:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether women and men have an equal right to remarry.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: Women have the same rights to remarry as men
        description_short: Women and men have the same right to remarry. Unequal rights exist if women face restrictions—such as waiting periods not applied to men—or if divorce is not legally allowed.
        description_key:
          - This indicator records whether women and men have equal rights to remarry.
          - A “yes” means both men and women can remarry under the same conditions.
          - A “no” means women face restrictions, such as longer waiting periods or bans after divorce or widowhood.
          - Equal rights to remarry reflect fairness in family law and personal freedom.
          - Restrictions on remarriage often reflect discriminatory cultural or legal norms.
          - *desc_law_enforcement
          - *desc_standardized_assumptions
        unit: "(1=yes; 0=no)"
        display:
          numDecimalPlaces: 0
          tolerance: 5

      sg_dmk_prch_fn_zs:
        title: Share of women involved in major household purchases
        description_short: Share of currently married women aged 15-49 who say that they alone or jointly have a say in major household purchase decisions.
        description_key:
          - This measures the percentage of married women aged 15–49 involved in making major household purchases.
          - Women are counted if they decide alone or together with their spouse.
          - Participation in spending decisions reflects women’s influence within the household.
          - Greater involvement suggests stronger bargaining power and autonomy.
          - Low involvement highlights gender gaps in family decision-making.
        unit: "%"
        short_unit: "%"
        display:
          numDecimalPlaces: 1
          tolerance: 10

      sg_cnt_sign_eq:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether a woman obtains full legal capacity upon reaching the age of majority and there are no restrictions on her signing legally binding contracts.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: Women can sign a contract on the same terms as men
        description_short: Women can sign contracts on their own, without permission or signatures from a husband or guardian.
        description_key:
          - This indicator records whether women can legally sign contracts without extra conditions.
          - A “yes” means women can enter agreements independently, just like men.
          - Restrictions may require the approval of a husband, guardian, or relative.
          - Equal rights to sign contracts are key to economic independence.
          - Without this right, women may be excluded from business, property, or employment opportunities.
          - *desc_law_enforcement
          - *desc_standardized_assumptions
        unit: "(1=yes; 0=no)"
        display:
          numDecimalPlaces: 0
          tolerance: 5

      sg_loc_live_eq:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether there are restrictions on a woman choosing where to live.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: Women have full legal rights to decide where to live
        description_short: The law does not restrict women’s choice of residence or give husbands more power in deciding where the family lives.
        description_key:
          - This indicator records whether women have the same legal rights as men to decide where to live.
          - A “yes” means women can freely choose their residence, either alone or with their family.
          - A “no” means the law gives husbands greater authority over the family’s place of residence.
          - Equal rights to residence reflect personal freedom and equality within marriage.
          - Restrictions reduce women’s independence and control over their lives.
          - *desc_law_enforcement
          - *desc_standardized_assumptions
        unit: "(1=yes; 0=no)"
        display:
          numDecimalPlaces: 0
          tolerance: 5

      sg_law_asst_ar:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether spouses retain administrative power over those assets each brought to the marriage or acquired during marriage, and their accrued value, without the need for spousal consent; or spouses administer their separate property, but for major transactions, such as selling or pledging the property as collateral, spousal consent is required, or if both spouses have equal rights in the administration and transaction of joint property.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: Spouses have equal rights to manage their own and joint assets
        description_short: In marriage, women and men keep control over the property they bring in or acquire, and both have equal rights to manage joint assets, with consent required only for major transactions like selling or pledging property.
        description_key:
          - This indicator records whether women and men have equal legal rights to manage assets in marriage.
          - Equal rights mean both spouses control their own property and share equal authority over joint assets.
          - Major transactions, like selling or pledging property, may require the consent of both spouses.
          - A “no” means the law gives husbands greater control over family property.
          - Equal management of assets supports fairness and independence within marriage.
          - *desc_law_enforcement
          - *desc_standardized_assumptions
        unit: "(1=yes; 0=no)"
        display:
          numDecimalPlaces: 0
          tolerance: 5

      sg_dmk_hlth_wf_zs:
        title: Share of married women making their own health care decisions
        description_short: Share of married women aged 15–49 reporting that they themselves are the main decision-makers for their health care.
        description_key:
          - This measures the percentage of married women aged 15–49 who decide on their own health care.
          - Women are counted if they report being the main decision-maker.
          - Health care autonomy is important for women’s well-being and reproductive rights.
          - Greater decision-making power suggests stronger independence and bargaining power.
          - Limited autonomy may reflect cultural or household barriers to women’s control over health.
        unit: "%"
        short_unit: "%"
        display:
          numDecimalPlaces: 1
          tolerance: 10

      sg_law_eqrm_wk:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether there is a law that obligates employers to pay equal remuneration to male and female employees who do work of equal value. “Remuneration” refers to the ordinary, basic or minimum wage or salary and any additional emoluments payable directly or indirectly, whether in cash or in kind, by the employer to the worker and arising out of the worker’s employment. “Work of equal value” refers not only to the same or similar jobs but also to different jobs of the same value.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: Law mandates equal pay for work of equal value for women and men
        description_short: '"Work of equal value" means not just the same job, but also different jobs that are similar in skills, responsibilities, and working conditions.'
        description_key:
          - Equal pay for work of equal value means men and women should receive the same pay for jobs that require similar skills, effort, and responsibility.
          - This is also known as pay equity, which goes further than equal pay for equal work.
          - Equal pay for equal work ensures men and women in the same job receive the same wage.
          - Pay equity covers different jobs if they are judged to have the same overall value.
          - The value of jobs is assessed by comparing skills, responsibilities, effort, and working conditions.
          - Proving jobs are of equal value can be difficult, as different roles may be valued unequally in practice.
          - Equal pay laws are designed to reduce gender wage gaps and ensure fairness in the labor market.
          - *desc_law_enforcement
          - *desc_standardized_assumptions
        unit: "(1=yes; 0=no)"
        display:
          numDecimalPlaces: 0
          tolerance: 5


      sg_law_indx:
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The index measures how laws and regulations affect women's economic opportunity. Overall scores are calculated by taking the average score of each index (Mobility, Workplace, Pay, Marriage, Parenthood, Entrepreneurship, Assets and Pension), with 100 representing the highest possible score.

          {definitions.wbl_limitations}
        presentation:
          attribution: Women, Business and the Law; World Bank
        title: Women, Business and the Law Index
        description_short: "The index measures how laws and regulations affect women’s economic opportunity on a scale from 0 to 100, where 100 means equal legal rights for men and women. It is the average score of eight categories: mobility, workplace, pay, marriage, parenthood, entrepreneurship, assets, and pension."
        description_key:
          - The Women, Business and the Law Index measures legal gender equality in the areas that shape women’s economic participation.
          - "It scores economies on eight categories: mobility, workplace, pay, marriage, parenthood, entrepreneurship, assets, and pension."
          - Each category score is based on legal provisions that affect women’s rights and opportunities in that domain.
          - The index ranges from 0 to 100, where 100 indicates equal legal rights for men and women.
          - The overall score is calculated as the simple average of the eight category scores.
          - The index captures laws and regulations as written (de jure), not how effectively they are implemented (de facto).
          - *desc_standardized_assumptions
        unit: "index (0–100)"
        display:
          numDecimalPlaces: 1
          tolerance: 5

      # Women, Business and the Law (WBL 1.0) indicators that have no curated text yet.
      # They are no longer in Gender Statistics, so we take them from the WBL website (see the meadow step).
      sg_law_indx_mo:
        title: "Women, Business and the Law: Mobility Indicator Score (scale 1-100)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The Mobility indicator measures constraints on a woman’s agency and freedom of movement, both of which are likely to influence her decision to enter the labor force and engage in entrepreneurial activity. Mobility indicator score is obtained by calculating the unweighted average of the following: 1. SG.APL.PSPT.EQ; 2. SG.CTR.TRVL.EQ; 3. SG.HME.TRVL.EQ; 4. SG.LOC.LIVE.EQ (= 25 points each) and scaling the result to 100.

          {definitions.wbl_limitations}
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_hme_trvl_eq:
        title: "A woman can travel outside her home in the same way as a man (1=yes; 0=no)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether there are restrictions on a woman traveling alone domestically.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_ctr_trvl_eq:
        title: "A woman can travel outside the country in the same way as a man (1=yes; 0=no)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether there are restrictions on a woman traveling alone internationally.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_law_indx_wp:
        title: "Women, Business and the Law: Workplace Indicator Score (scale 1-100)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The Workplace indicator analyzes laws affecting women’s decisions to enter the labor market, including women’s legal capacity and ability to work, as well as protections in the workplace against discrimination and sexual harassment. The Workplace indicator score is obtained by calculating the unweighted average of the following: 1. SG.GET.JOBS.EQ; 2. SG.LAW.NODC.HR; 3. SG.LEG.SXHR.EM; 4. SG.PEN.SXHR.EM (= 25 points each) and scaling the result to 100.

          {definitions.wbl_limitations}
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_law_indx_py:
        title: "Women, Business and the Law: Pay Indicator Score (scale 1-100)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The Pay indicator measures laws affecting occupational segregation and the gender wage gap.  The Pay indicator score is obtained by calculating the unweighted average of the following: 1. SG.LAW.EQRM.WK; 2. SG.NGT.WORK.EQ; 3. SG.DNG.WORK.DN.EQ; 4. SG.IND.WORK.EQ (= 25 points each) and scaling the result to 100.

          {definitions.wbl_limitations}
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_ngt_work_eq:
        title: "A woman can work at night in the same way as a man (1=yes; 0=no)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether nonpregnant and nonnursing women are prohibited from working at night or cannot work the same night hours as men. If various sectors of the economy are regulated separately (i.e., no central labor law), it is assumed that the woman is employed as a cashier in a grocery store or supermarket. It is analyzed whether restrictions on women's ability to work at night do not apply to the food retail sector; if women's consent to work at night is required; if an employer needs to comply with safety measures (such as providing transportation).

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_dng_work_dn_eq:
        title: "A woman can work in a job deemed dangerous in the same way as a man (1=yes; 0=no)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether there are laws that prohibit or restrict nonpregnant and non-nursing women from working in a broad and subjective category of jobs deemed “hazardous,” “arduous” or “morally inappropriate.”

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_ind_work_eq:
        title: "A woman can work in an industrial job in the same way as a man (1=yes; 0=no)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether nonpregnant and non-nursing a woman can work in the mining, construction, manufacturing, energy, water, agriculture, and transportation industries in the same way as men.  nonpregnant and non-nursing women can work in the mining, construction, manufacturing, energy, water, agriculture, and transportation industries in the same way as men.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_law_indx_mr:
        title: "Women, Business and the Law: Marriage Indicator Score (scale 1-100)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The Marriage indicator measures legal constraints related to marriage and divorce. The Marriage indicator score is obtained by calculating the unweighted average of the following: 1. SG.LAW.OBHB.MR.NO;  2. SG.HLD.HEAD.EQ;  3. SG.LEG.DVAW; 4. SG.OBT.DVRC.EQ; 5. SG.REM.RIGT.EQ (= 20 points each) and scaling the result to 100.

          {definitions.wbl_limitations}
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_hld_head_eq:
        title: "A woman can be \"head of household\" in the same way as a man (1=yes; 0=no)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether there are restrictions on a woman becoming head of household or head of family.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_law_indx_pr:
        title: "Women, Business and the Law: Parenthood Indicator Score (scale 1-100)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The Parenthood indicator examines laws affecting women’s work during and after pregnancy. The Parenthood indicator score is obtained by calculating the unweighted average of the following: 1. SH.MMR.LEVE.AL; 2.SH.MMR.LEVE.GT; 3. SH.PTR.LEVE.AL; 4.SH.PAR.LEVE.AL; 5.SG.DML.PRGW (= 20 points each) and scaling the result to 100.

          {definitions.wbl_limitations}
        presentation:
          attribution: Women, Business and the Law; World Bank

      sh_mmr_leve_al:
        title: "Paid leave of at least 14 weeks available to mothers (1=yes; 0=no)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures  whether women are legally entitled to at least 14 weeks (98 calendar days) of paid leave for the birth of a child through maternity leave, parental leave or a combination of both.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators. The underlying inidcator is "Length of paid maternity leave (days)" (SH.MMR.LEVE).
        presentation:
          attribution: Women, Business and the Law; World Bank

      sh_mmr_leve:
        title: "Length of paid maternity leave (calendar days)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator refers to leave available only to the mother for the birth of a child to be taken just before, during and immediately after childbirth.

          {definitions.wbl_limitations}

          **Notes from original source:** This indicator is additional to the 35 scored indicators, and associated to the following indicator "Paid leave of at least 14 weeks is available to women (1=yes; 0=no)" (SH.MMR.LEVE.AL).
        presentation:
          attribution: Women, Business and the Law; World Bank

      sh_mmr_leve_gt:
        title: "The government administers 100 percent of maternity leave benefits (1=yes; 0=no)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether leave benefits are fully administered by a government entity, including compulsory social insurance schemes (such as social security), public funds, government-mandated private insurance or employer reimbursement of any maternity leave benefits paid directly to an employee.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank

      sh_ptr_leve_al:
        title: "Paid leave is available to fathers (1=yes; 0=no)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether fathers are legally entitled to at least one day of paid leave for the birth of a child, or if the law reserves a portion of paid parental leave specifically for fathers—that is, through “use-it-or-lose-it” policies or fathers’ quotas; or if fathers are individually entitled to paid parental leave.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.  The underlying inidcator is "Length of paid paternity leave (days)" (SH.PTR.LEVE).
        presentation:
          attribution: Women, Business and the Law; World Bank

      sh_ptr_leve:
        title: "Length of paid paternity leave (calendar days)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator refers to leave available only to the father for the birth of a child.

          {definitions.wbl_limitations}

          **Notes from original source:** This indicator is additional to the 35 scored indicators, and associated to the following indicator "Paid leave is available to fathers (1=yes; 0=no)" (SH.PTR.LEVE.AL).
        presentation:
          attribution: Women, Business and the Law; World Bank

      sh_par_leve_al:
        title: "There is paid parental leave (1=yes; 0=no)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether both parents are legally entitled to some form of full-time paid parental leave either shared between mother and father or as an individual entitlement that each can take regardless of the other.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.  The underlying inidcators are as follows: 1. Length of paid shared parental leave (days) (SH.PAR.LEVE), 2. Length of paid parental leave for mother (days) (SH.PAR.LEVE.FE), 3. Length of paid parental leave for father (days) (SH.PAR.LEVE.MA)
        presentation:
          attribution: Women, Business and the Law; World Bank

      sh_par_leve:
        title: "Length of paid shared parental leave (calendar days)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator refers to parental leave that can be shared amongst the parents as they choose. Parental leave refers to leave available equally to parents—regardless of gender—for the purpose of childcare immediately following maternity and paternity leave OR instead of maternity and paternity leave.

          {definitions.wbl_limitations}

          **Notes from original source:** This indicator is additional to the 35 scored indicators, and associated to the following indicator "There is paid parental leave (1=yes; 0=no)" (SH.PAR.LEVE.AL).
        presentation:
          attribution: Women, Business and the Law; World Bank

      sh_par_leve_fe:
        title: "Length of paid parental leave for mother (calendar days)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator refers to days of parental leave reserved specifically for mothers—through “use-it-or-lose-it” policies or mothers’ quotas; or days of parental leave that employees are individually entitled to.

          {definitions.wbl_limitations}

          **Notes from original source:** This indicator is additional to the 35 scored indicators, and associated to the following indicator "There is paid parental leave (1=yes; 0=no)" (SH.PAR.LEVE.AL).
        presentation:
          attribution: Women, Business and the Law; World Bank

      sh_par_leve_ma:
        title: "Length of paid parental leave for father (calendar days)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator refers to days of parental leave reserved specifically for fathers—that is, through “use-it-or-lose-it” policies or fathers’ quotas; or days of parental leave that employees are individually entitled to.

          {definitions.wbl_limitations}

          **Notes from original source:** This indicator is additional to the 35 scored indicators, and associated to the following indicator "There is paid parental leave (1=yes; 0=no)" (SH.PAR.LEVE.AL).
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_dml_prgw:
        title: "Dismissal of pregnant workers is prohibited (1=yes; 0=no)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether the law explicitly prohibits the dismissal of pregnant women, if pregnancy cannot serve as grounds for termination of a contract or if dismissal of pregnant workers is considered a form of unlawful termination, unfair dismissal or wrongful discharge.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_law_indx_en:
        title: "Women, Business and the Law: Entrepreneurship Indicator Score (scale 1-100)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The Entrepreneurship indicator measures constraints on women starting and running a business.. The Entrepreneurship indicator score is obtained by calculating the unweighted average of the following: 1. SG.CNT.SIGN.EQ; 2. SG.BUS.REGT.EQ; 3. SG.OPN.BANK.EQ; 4. SG.LAW.CRDD.GR (= 25 points each) and scaling the result to 100.

          {definitions.wbl_limitations}
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_law_indx_as:
        title: "Women, Business and the Law: Assets Indicator Score (scale 1-100)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The Assets indicator examines gender differences in property and inheritance law, including instances in which legal systems are supported by customary law and judicial precedent. The Assets indicator score is obtained by calculating the unweighted average of the following: 1. SG.OWN.PRRT.IM; 2. SG.IHT.ASST.PT.EQ; 3. SG.IHT.ASST.EQ; 4. SG.LAW.ASST.AR; 5. SG.LAW.NMCN (= 20 points each) and scaling the result to 100.

          {definitions.wbl_limitations}
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_iht_asst_eq:
        title: "Male and female surviving spouses have equal rights to inherit assets (1=yes; 0=no)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether both spouses have equal rank and rights to inherit assets when there is no will. For this question, it is assumed that the deceased spouse left no children or any other heirs, other than the surviving spouse.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_law_nmcn:
        title: "The law provides for the valuation of nonmonetary contributions (1=yes; 0=no)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether there is an explicit legal recognition of such contributions and the law provides for equal or equitable division of the property or the transfer of a lump sum to the stay-at-home spouse based on nonmonetary contributions; or the default marital property regime is full community, partial community or deferred community because these regimes implicitly recognize nonmonetary contributions at the time of property division and benefit both spouses regardless of who purchased the property or holds title to it. Nonmonetary contributions include caring for minor children, taking care of the family home, or any other nonmonetized contribution from a stay-at-home spouse.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_law_indx_pe:
        title: "Women, Business and the Law: Pension Indicator Score (scale 1-100)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The Pension indicator assesses laws affecting the size of a woman’s pension. The Pension indicator score is obtained by calculating the unweighted average of the following: 1. SG.AGE.FUPN.EQ; 2. SG.AGE.PAPN.EQ; 3. SG.AGE.MRET.EQ; 4. SG.ABS.PENB (= 25 points each) and scaling the result to 100.

          {definitions.wbl_limitations}
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_age_fupn_eq:
        title: "The age at which women and men can retire with full pension benefits is the same (1=yes; 0=no)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether the statutory age at which men and women can retire and receive an irrevocable minimum old-age pension is the same. If transitional provisions gradually increase, decrease or equalize the statutory retirement age, the answer reflect the age according to the report's data collection cycle, even if the law provides for changes over time.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators. The underlying inidcators are as follows: 1. Retirement age with full benefits, female (SG.AGE.RTRE.FL.FE), 2. Retirement age with full benefits, male (SG.AGE.RTRE.FL.MA)
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_age_papn_eq:
        title: "The age at which women and men can retire with partial pension benefits is the same (1=yes; 0=no)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures measures whether the age at which men and women can retire and receive partial pension benefits is the same, or if the age at which men and women can retire and receive partial benefits is not mandated. Partial pension benefits refer to a reduced or proportional minimum old-age pension payable to workers who did not accumulate enough work experience or contributions or have not reached the statutory age to qualify for a minimum old-age pension. If transitional provisions gradually increase, decrease or equalize the statutory retirement age, the answer reflect the age according to the report's data collection cycle, even if the law provides for changes over time.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators. The underlying inidcators are as follows: 1 .Retirement age with partial benefits, female (SG.AGE.RTRE.PL.FE), 2. Retirement age with partial benefits, male (SG.AGE.RTRE.PL.MA)
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_age_mret_eq:
        title: "The mandatory retirement age for women and men is the same (1=yes; 0=no)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether the relative ages at which men and women must cease employment or can be terminated by their employer are equal.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators. The underlying inidcators are as follows: 1.Mandatory retirement age, female (SG.AGE.RTRE.FE), 2. Mandatory retirement age, male (SG.AGE.RTRE.MA)
        presentation:
          attribution: Women, Business and the Law; World Bank

      sg_abs_penb:
        title: "There are periods of absence due to childcare accounted for in pension benefits (1=yes; 0=no)"
        unit: ""
        short_unit: ""
        description_processing: |-
          {definitions.wbl_description_processing}
        description_from_producer: |-
          **Definition:** The indicator measures whether pension contributions are paid or credited during maternity or parental leave, or the leave period is considered a qualifying period of employment used for the purpose of calculating pension benefits; or there are mechanisms to compensate for any contribution gaps and to ensure that the leave period does not reduce the assessment base or pension amounts, or if there are no mandatory contributory pension schemes, but there is a noncontributory universal social pension conditioned on noncontributory requirements with no means test attached.

          {definitions.wbl_limitations}

          **Notes from original source:** This is one of the 35 scored indicators.
        presentation:
          attribution: Women, Business and the Law; World Bank
