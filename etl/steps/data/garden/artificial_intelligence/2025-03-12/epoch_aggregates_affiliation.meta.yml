# NOTE: To learn more about the fields, hover over their names.
definitions:
  desc_update: The {year} data is incomplete and was last updated {date_accessed}.
  common:
    processing_level: major
    presentation:
      topic_tags:
        - Artificial Intelligence
    description_short: Number of notable AI models, by the type of organization their authors work for, such as companies or universities. {definitions.desc_update}
    description_from_producer: |-
      Categorization of the organization(s), automatically populated from the Organization entry. Models are categorized as “Industry” if their authors are affiliated with private sector organizations, “Academia” if the authors are affiliated with universities or academic institutions, or “Industry - Academia Collaboration” when at least 30% of the authors are from each.
    description_processing: |-
      When Epoch AI lists several types of organization for a model, we combine them, as in “Academia and industry collaboration”. Combinations with fewer than 20 notable models are grouped as “Other”, and models with no type listed as “Not specified”.
    unit: 'AI systems'
    short_unit: ''
    display:
      numDecimalPlaces: 0

