# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    processing_level: major
    presentation:
      topic_tags:
        - Artificial Intelligence
# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/dataset/
dataset:
  update_period_days: 31

# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/tables/
  owners:
    - Lucas Rodés-Guirao
    - Edouard Mathieu
tables:
  epoch:
    variables:
      domain:
        title: Domain
        unit: ''
        short_unit: ''
        description_short: Broad area of machine learning that an AI model is designed for, such as language, vision, or games.
        description_from_producer: The machine learning domain(s) of application associated with the model. This is fairly high-level, for example “Language” incorporates many different ML tasks.
        description_processing: |-
          We group models that Epoch AI lists under several domains as “Multiple domains”, and domains with fewer than 20 notable models as “Other”.
        display:
          zeroDay: '1949-01-01'
          timeInterval: day

      organization_categorization:
        title: Researcher affiliation
        unit: ''
        short_unit: ''
        description_short: Type of organization that the authors of an AI model work for, such as companies or universities.
        description_from_producer: |-
          Categorization of the organization(s), automatically populated from the Organization entry. Models are categorized as “Industry” if their authors are affiliated with private sector organizations, “Academia” if the authors are affiliated with universities or academic institutions, or “Industry - Academia Collaboration” when at least 30% of the authors are from each.
        description_processing: |-
          When Epoch AI lists several types of organization for a model, we combine them, as in “Academia and industry collaboration”. Combinations with fewer than 20 notable models are grouped as “Other”, and models with no type listed as “Not specified”.

      parameters:
        title: Number of parameters
        unit: ''
        description_short: Number of values, also called weights, that an AI model adjusts during training to learn from its data.
        description_from_producer: Number of learnable parameters in the model. For neural networks, these are the weights and biases.
        display:
          numDecimalPlaces: 0
          zeroDay: '1949-01-01'
          timeInterval: day

      training_dataset_size__total:
        title: Training dataset size
        unit: 'data points'
        description_short: Number of data points used to train an AI model.
        display:
          numDecimalPlaces: 0
          zeroDay: '1949-01-01'
          timeInterval: day

      training_compute_flop:
        title: Training computation
        unit: FLOP
        short_unit: ''
        description_short: Total number of [floating-point operations](#dod:flop) used to train an AI model.
        display:
          numDecimalPlaces: 0
          zeroDay: '1949-01-01'
          timeInterval: day

      training_computation_petaflop:
        title: Training computation (petaFLOP)
        unit: 'petaFLOP'
        description_short: Total number of [floating-point operations](#dod:flop) used to train an AI model, in petaFLOP. One petaFLOP is 10¹⁵ (1 quadrillion) FLOP.
        description_processing: We converted Epoch AI’s training compute from FLOP to petaFLOP by dividing it by 10¹⁵.
        display:
          numDecimalPlaces: 0
          zeroDay: '1949-01-01'
          timeInterval: day
        presentation:
          grapher_config:
            title: Training computation

      training_compute_reporting:
        title: Source of training compute
        unit: ''
        short_unit: ''
        description_short: Whether the developer of an AI model reported how much computation was used to train it, or Epoch AI estimated it.
        description_from_producer: |-
          Indicates how the quantity of training compute was found or estimated. Options include: "Reported", when the developers report how much training compute was used. "Operation counting", when the parameters, training data, and/or architecture are known, and these are used to estimate the number of operations performed while training. "Hardware", when the training time and/or hardware type are known, allowing an estimate based on the rate of computation. "Cost", when the training cost is known and the compute is estimated through the hardware usage budget. "Benchmarks", when the model's training compute was estimated using its benchmark performance.
        description_processing: |-
          Epoch AI lists one or more methods for how it found each model’s training compute. We count a model as “Reported by the developer” when one of them is “Reported”, and as “Estimated by Epoch AI” otherwise, including the few models whose method Epoch AI has not recorded yet. Models without a training compute figure have no value.
        type: ordinal
        sort:
          - Reported by the developer
          - Estimated by Epoch AI
        display:
          zeroDay: '1949-01-01'
          timeInterval: day

      developer_group:
        title: Developer
        unit: ''
        short_unit: ''
        description_short: Company that developed an AI model.
        description_processing: |-
          We show OpenAI, Google, Anthropic, xAI, and Meta separately, and group all other developers as “Other”. A model counts toward one of these companies when it is among the organizations that developed it, even alongside universities or other organizations. Google includes the AI labs that Epoch AI lists separately, such as DeepMind and Google Brain, and Meta includes Facebook AI Research. Models developed by several of these companies count as “Other”.
        # Order of the categories in chart legends.
        type: ordinal
        sort:
          - OpenAI
          - Google
          - Anthropic
          - xAI
          - Meta
          - Other
        display:
          zeroDay: '1949-01-01'
          timeInterval: day

      country_group:
        title: Country of developer
        unit: ''
        short_unit: ''
        description_short: Country of the organizations that developed an AI model.
        description_from_producer: Country/countries associated with the developing organization(s). Multinational is used to mark organizations associated with multiple countries.
        description_processing: |-
          We show the United States, China, the United Kingdom, South Korea, and France separately, and group all other countries as “Other”. Models developed by organizations in several countries, or by organizations that Epoch AI marks as multinational, count as “Multiple countries”.
        # Order of the categories in chart legends.
        type: ordinal
        sort:
          - United States
          - China
          - United Kingdom
          - South Korea
          - France
          - Multiple countries
          - Other
        display:
          zeroDay: '1949-01-01'
          timeInterval: day

      weights_availability:
        title: Availability of model weights
        unit: ''
        short_unit: ''
        description_short: Whether the weights of an AI model are openly available, whether the model can only be used through an API or another hosted service, or whether it was not released.
        description_processing: |-
          We group Epoch AI’s categories as follows: “Open weights” covers open weights with unrestricted, non-commercial, or restricted use; “API or hosted access only” covers API access, hosted access without an API, and limited access; and “Not released” covers unreleased models. Models whose accessibility Epoch AI has not recorded have no value.
        type: ordinal
        sort:
          - Open weights
          - API or hosted access only
          - Not released
        display:
          zeroDay: '1949-01-01'
          timeInterval: day

      publication_date:
        title: Publication date
        unit: ''
        description_short: Date when the AI model was first published.
        description_from_producer: The publication, announcement, or release date of the model, in YYYY-MM-DD format. If the year and month are known but the day is unknown, the day is filled in as YYYY-MM-15. If the year is known but the month and day are unknown, the month and day are filled in as YYYY-07-01.



