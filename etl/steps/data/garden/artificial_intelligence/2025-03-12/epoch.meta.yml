# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    processing_level: major
    presentation:
      topic_tags:
        - Artificial Intelligence
# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/dataset/
dataset:
  update_period_days: 31

# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/tables/
  owners:
    - Lucas Rodés-Guirao
    - Edouard Mathieu
tables:
  epoch:
    variables:
      domain:
        title: Domain
        unit: ''
        short_unit: ''
        description_short: Refers to the specific area, application, or field in which an AI model is designed to operate.
        description_processing: |-
          In cases where multiple domains were associated with a model, we consolidated these entries under the label "Multiple domains". We also identified domains associated with fewer than 20 notable systems and grouped these under the category 'Other'.
        display:
          zeroDay: '1949-01-01'
          timeInterval: day

      organization_categorization:
        title: Researcher affiliation
        unit: ''
        short_unit: ''
        description_short: Describes the sector where the authors of an AI model have their primary affiliations.
        description_from_producer: |-
          Systems are categorized as “Industry” if their authors are affiliated with private sector organizations, “Academia” if the authors are affiliated with universities or academic institutions, or “Industry - Academia Collaboration” when at least 30% of the authors are from each.

      parameters:
        title: Number of parameters
        unit: ''
        description_short: Total number of learnable variables or weights that the model contains. Parameters are adjusted during the training process to optimize the model's performance.
        display:
          numDecimalPlaces: 0
          zeroDay: '1949-01-01'
          timeInterval: day

      training_dataset_size__total:
        title: Training dataset size
        unit: 'unique datapoints'
        description_short: Number of unique data points used to train the model. Each domain has a specific data point unit; for example, for vision it is images, for language it is words, and for games it is timesteps. This means systems can only be compared directly within the same domain.
        display:
          numDecimalPlaces: 0
          zeroDay: '1949-01-01'
          timeInterval: day

      training_compute_flop:
        title: Training computation
        unit: FLOP
        short_unit: ''
        description_short: Total number of [floating-point operations](#dod:flop) used to train an AI model.
        display:
          numDecimalPlaces: 0
          zeroDay: '1949-01-01'
          timeInterval: day

      training_computation_petaflop:
        title: Training computation (petaFLOP)
        unit: 'petaFLOP'
        description_short: Total number of [floating-point operations](#dod:flop) used to train an AI model, in petaFLOP. One petaFLOP is 10¹⁵ (1 quadrillion) FLOP.
        description_processing: We converted Epoch AI’s training compute from FLOP to petaFLOP by dividing it by 10¹⁵.
        display:
          numDecimalPlaces: 0
          zeroDay: '1949-01-01'
          timeInterval: day
        presentation:
          grapher_config:
            title: Training computation

      training_compute_reporting:
        title: Source of training compute
        unit: ''
        short_unit: ''
        description_short: Whether the developer of an AI model reported how much computation was used to train it, or Epoch AI estimated it.
        description_from_producer: |-
          Indicates how the quantity of training compute was found or estimated. Options include: "Reported", when the developers report how much training compute was used. "Operation counting", when the parameters, training data, and/or architecture are known, and these are used to estimate the number of operations performed while training. "Hardware", when the training time and/or hardware type are known, allowing an estimate based on the rate of computation. "Cost", when the training cost is known and the compute is estimated through the hardware usage budget. "Benchmarks", when the model's training compute was estimated using its benchmark performance.
        description_processing: |-
          Epoch AI lists one or more methods for how it found each model’s training compute. We count a model as “Reported by the developer” when one of them is “Reported”, and as “Estimated by Epoch AI” otherwise, including the few models whose method Epoch AI has not recorded yet. Models without a training compute figure have no value.
        display:
          zeroDay: '1949-01-01'
          timeInterval: day

      publication_date:
        title: Publication date
        unit: ''
        description_short: Date when the AI model was first published.
        description_from_producer: The publication, announcement, or release date of the model, in YYYY-MM-DD format. If the year and month are known but the day is unknown, the day is filled in as YYYY-MM-15. If the year is known but the month and day are unknown, the month and day are filled in as YYYY-07-01.



