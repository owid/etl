# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    processing_level: major
    presentation:
      attribution_short: CPUC
      topic_tags:
        - Artificial Intelligence

  desc_processing_carriers: &desc_processing_carriers |-
    We use the reports from the California Public Utilities Commission’s (CPUC) Deployment program, under which carriers may charge fares. Trips in its Pilot program, by companies such as Zoox, Nuro, WeRide, and Tensor, are not included. We summed values across all carriers in the Deployment program to produce monthly totals.

# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/
dataset:
  update_period_days: 90
  owners:
    - Pablo Arriagada
    - Edouard Mathieu
tables:
  robotaxis:
    variables:
      totaltrips:
        title: Monthly completed trips by robotaxis
        unit: trips
        description_processing: *desc_processing_carriers
        description_short: Total number of completed passenger trips each month in California’s self-driving taxi services.
        description_key:
          - This counts completed passenger trips in California’s robotaxi services that are approved to operate.
          - Includes completed trips with passengers on board, whether or not a fare was charged. Many early trips were free.
          - Excludes empty cars driving between pickups, test rides, and any non-passenger travel.
          - Before August 2023, the data mixes two kinds of service — Waymo rides with a safety driver on board, and, from June 2022, Cruise’s limited driverless nighttime service in San Francisco. In August 2023, regulators first allowed both companies to charge for fully driverless rides without time restrictions.
          - Both Cruise and Waymo reported data until October 2023, when California regulators made Cruise suspend its service following a safety incident. Cruise kept filing quarterly reports until August 2024 but reported no trips, so all later data is from Waymo only.
        display:
          name: Monthly completed trips by robotaxis
          numDecimalPlaces: 0
          timeInterval: month
      totalpassengerscarried:
        title: Monthly passengers carried by robotaxis
        unit: passengers
        description_processing: *desc_processing_carriers
        description_short: Total number of passengers traveling each month in California’s self-driving taxi services.
        description_key:
          - This counts all passengers who rode in California’s robotaxi services that are approved to operate.
          - Each person is counted once per trip, so if someone takes multiple trips, they’re counted multiple times.
          - For shared rides, each passenger in the vehicle is counted separately. Company employees and contractors, including safety drivers, are not counted as passengers.
          - Excludes empty cars driving between pickups, test rides, and any non-passenger travel.
          - Before August 2023, the data mixes two kinds of service — Waymo rides with a safety driver on board, and, from June 2022, Cruise’s limited driverless nighttime service in San Francisco. In August 2023, regulators first allowed both companies to charge for fully driverless rides without time restrictions.
          - Both Cruise and Waymo reported data until October 2023, when California regulators made Cruise suspend its service following a safety incident. Cruise kept filing quarterly reports until August 2024 but reported no trips, so all later data is from Waymo only.
        display:
          name: Monthly passengers carried by robotaxis
          numDecimalPlaces: 0
          timeInterval: month
      totalpmt:
        title: Monthly distance traveled by robotaxi passengers
        unit: passenger-kilometers
        description_short: Monthly passenger-kilometers traveled in California’s self-driving taxis, summing the kilometers actually traveled by individual passengers across all trips.
        description_processing: |-
          The original data reports distance in miles. We converted to kilometers by multiplying by 1.60934.

          {definitions.desc_processing_carriers}
        description_key:
          - This indicator tracks the total distance traveled by passengers in robotaxi trips operated by licensed services in California, expressed in passenger-kilometers.
          - A passenger-kilometer is one kilometer traveled by one passenger. For example, a 5-kilometer trip with two passengers equals 10 passenger-kilometers. If passengers join or leave during a trip, each segment is counted separately based on the number of passengers in the vehicle.
          - Only passenger-carrying trips are included. Empty vehicles traveling between pickups and test rides are excluded.
          - Before August 2023, the data mixes two kinds of service — Waymo rides with a safety driver on board, and, from June 2022, Cruise’s limited driverless nighttime service in San Francisco. In August 2023, regulators first allowed both companies to charge for fully driverless rides without time restrictions.
          - Both Cruise and Waymo reported data until October 2023, when California regulators made Cruise suspend its service following a safety incident. Cruise kept filing quarterly reports until August 2024 but reported no trips, so all later data is from Waymo only.
        display:
          name: Monthly distance traveled by robotaxi passengers
          numDecimalPlaces: 0
          timeInterval: month
