tables:
  epoch_benchmark_data:
    variables:
      mean_score:
        title: Share of FrontierMath problems solved correctly by AI models
        unit: "%"
        short_unit: "%"
        description_short: FrontierMath benchmark evaluates models on 295 difficult, research-level problems in advanced mathematics (Tiers 1–3), which can take expert mathematicians hours or days to work through.
        description_key:
          - This indicator shows the share of FrontierMath problems that AI models solve correctly, based on Epoch AI's evaluation.
          - FrontierMath is a set of 338 original math problems written by experts, covering many areas of advanced mathematics. Many problems are difficult enough that human specialists might need hours or days to solve them.
          - The benchmark has four difficulty tiers. This indicator shows accuracy on Tiers 1–3 (295 problems). Tier 4 contains 43 exceptionally difficult problems and is not included here.
          - In June 2026, Epoch AI reissued FrontierMath after correcting errors in 42% of its problems. This indicator uses the corrected problem set. Scores on it are not comparable with scores on the original set, where the flawed problems held every model well below 100%; models evaluated on both scored around 12 percentage points higher on the corrected set.
          - "Scoring is all-or-nothing: models get 1 point for a correct final answer and 0 for anything else, with no partial credit. Models submit their answers as Python code and can use Python while working on problems. This means scores reflect math ability with access to computational tools, not just pen-and-paper reasoning."
          - Only 12 problems are publicly available, mainly so researchers can inspect how evaluations work, not to report scores.
          - FrontierMath was developed by Epoch AI with funding from OpenAI, whose GPT models are among those evaluated on this benchmark. OpenAI has exclusive access to a subset of the problems.
        description_from_producer: |-
          [FrontierMath](https://epoch.ai/frontiermath) is a benchmark of hundreds of original, exceptionally challenging mathematics problems crafted and vetted by expert mathematicians. The questions cover most major branches of modern mathematics – from computationally intensive problems in number theory and real analysis to abstract questions in algebraic geometry and category theory. Solving a typical problem requires multiple hours of effort from a researcher in the relevant branch of mathematics, and for the upper end questions, multiple days.

          On 2026-06-12, we released a major update, addressing errors in 42% of problems. Following this update, the full FrontierMath dataset consists of 338 problems. This is split into a base set of 295 problems, which we call Tiers 1-3, and an expansion set of 43 exceptionally difficult problems, which we call Tier 4. We have made twelve problems public: ten from Tiers 1-3 and two from Tier 4. Unless stated otherwise, all the numbers on this hub correspond to evaluations on the private sets. You can find the public problems [here](https://epoch.ai/frontiermath/tiers-1-4/benchmark-problems).

          FrontierMath was developed with funding from OpenAI, who has exclusive access to a subset of the benchmark.
        display:
          numDecimalPlaces: 1
