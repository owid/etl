tables:
  internal_displacement:
    variables:
      # Primary variables - rounded values
      total_displacement_rounded:
        title: Internally displaced people
        description_short: |-
          [Internally displaced people](#dod:internally-displaced) are those who had to leave their homes because of violence or [disaster](#dod:idmc-disaster) and have not crossed an international state border. This includes all individuals who are currently displaced, regardless of how many times they have been displaced.
        unit: people
        short_unit: ""
        description_from_producer: |-
          ### Internally displaced people
          {definitions.idmc_definitions.stock_internal_displacement}

          ### Conflict and violence
          {definitions.idmc_definitions.conflict}

          ### Disaster
          {definitions.idmc_definitions.disaster}
        description_processing: |-
          - This figure is the sum of the number of people displaced due to conflict and violence and the number of people displaced due to disasters.
          - {definitions.processing_notes.idmc_na_processing_total_stock}
        description_key:
          - *stock_data
          - *idmc_criteria
          - *idmc_rounded
        presentation:
          grapher_config:
            note: *footnote_zero_idps
      total_displacement_rounded_per_thousand:
