definitions:
  common:
    presentation:
      attribution_short: IDMC
      topic_tags:
        - Migration
        - War & Peace
        - Natural Disasters
      grapher_config:
        originUrl: "https://ourworldindata.org/migration"
    processing_level: minor #minor for raw data, major for processed data
    unit: people
    short_unit: ""
  idmc_definitions:
    stock_internal_displacement: |-
      The total number of IDPs at a given time is referred to as a “stock” metric. It represents a static snapshot of the number of IDPs in a given location at a specific point in time.

      For example, “Ten thousand people were still displaced at the end of the month” indicates how many people were displaced at a specific point in time (“at the end of the month”).

      These numbers report on the total number of IDPs, or stock, at the end of a given year. Population movements such as internal displacements or births among IDP communities may increase it, while returns, cross-border flight and other outflows may decrease it.
    internal_displacements: |-
      An internal displacement refers to each new forced movement of a person within the borders of the country of their habitual residence recorded during the year.

      The total number of movements that has occurred over a period of time is considered a “flow” and the most common type of this metric is called “internal displacements”. We attempt to generate an estimate of internal displacements by event, be it for conflict or violence or disaster.

      For example, “We recorded more than 32 million internal displacements globally due to disasters in 2022.” refers to the number of displacements recorded between two or more points in time (in this case, between 1 January and 31 December 2022).

      It is important to note that this estimate is not necessarily the same as the peak number of IDPs, but instead aims to provide the most comprehensive cumulative figure of displacements during a given period of time. As internal displacements refer to movements, depending on certain situations the same people can be displaced several times over a given period.

      Given the challenges in tracking population movements, it is difficult to determine what portion of internal displacements refer to people being displaced for the first time and what portion represents the same people being displaced a second, third, fourth or fifth time. As a result, internal displacements could include secondary or multiple displacement movements.
    conflict: |-
      Internal displacements triggered by conflict and violence include international armed conflict, non-international armed conflict, communal violence, crime-related violence, civilian-state violence and other forms of violence.
    disaster: |-
      Movements of people triggered by disasters are grouped into two categories: weather-related and geophysical. Weather-related displacements, for example, include hazards such as floods, droughts, landslides, storms – including cyclones and other storms –, wildfires and extreme temperatures. Geophysical displacements include, for example, earthquakes, volcanic eruptions and landslides.
  description_keys:
    conflict: &conflict_key |-
      Internal displacements triggered by conflict and violence include international armed conflict, non-international armed conflict, communal violence, crime-related violence, civilian-state violence, and other forms of violence.
    disaster: &disaster_key |-
      Movements of people triggered by disasters are grouped into two categories: weather-related and geophysical. Weather-related displacements, for example, include hazards such as floods, droughts, landslides, storms — including cyclones and other storms — wildfires, and extreme temperatures. Geophysical displacements include, for example, earthquakes, volcanic eruptions, and landslides.
  processing_notes:
    stock_data: &stock_data |-
      This data represents the total number of internally displaced people living in a region at the end of the year.
    flow_data: &flow_data |-
      This data represents the total number of internal displacements that occurred during the year. A displacement occurs every time a person is forced to leave their home but remains within their country’s borders. One person can be displaced multiple times within a calendar year and is then counted multiple times in the data.
    population_projections: |-
      For years after 2023, our population data comes from the UN’s population projections (World Population Prospects 2024, medium scenario). For some territories (e.g. Svalbard and Jan Mayen) no estimates are published, so we don’t calculate values per 1,000 people after 2023.
    population_share: |-
      We calculate this by dividing the rounded figure from IDMC by the country’s population and multiplying it by 1,000. For population, we use our long-term population dataset, which you can explore in the [population data explorer](https://ourworldindata.org/explorers/population-and-demography).
    footnote_displacements: |-
      One person can be displaced multiple times within a calendar year and is then counted multiple times in the data.
    footnote_zero_displacements: &footnote_zero_displacements |-
      A value of 0 means that the Internal Displacement Monitoring Centre (IDMC) is not aware of any internal displacements in that region at the time of reporting. It does not mean that IDMC has confirmed that there are no displacements.
    footnote_zero_idps: &footnote_zero_idps |-
      A value of 0 means that the Internal Displacement Monitoring Centre (IDMC) is not aware of any internally displaced people (IDPs) in that region at the time of reporting. It does not mean that IDMC has confirmed that there are no IDPs.
    idmc_na_processing: |-
      IDMC uses “N/A” to denote that no displacements or IDPs were recorded for that year. In our dataset, we convert these “N/A” values to 0 to make this more transparent and the data easier to interpret.
    idmc_na_processing_disaster_stock: |-
      IDMC uses “N/A” to denote that no displacements or IDPs were recorded for that year. From 2019, we convert these “N/A” values to 0. Before 2019, IDMC only has figures on people displaced by disasters for some countries, so we leave the missing values blank (no data).
    idmc_na_processing_total_stock: |-
      We only calculate this total from 2019. Before 2019, IDMC only has figures on people displaced by disasters for some countries, so a total of people displaced by conflict and by disasters would be incomplete. From 2019, we convert IDMC’s “N/A” values to 0.
    idmc_rounded: &idmc_rounded |-
      The data source provides rounded numbers to reflect the inherent uncertainty in displacement data. Figures equal or lower than 100,000 are rounded to two significant digits while figures above 100,000 are rounded to the nearest thousand.
    idmc_criteria: &idmc_criteria |-
      The Internal Displacement Monitoring Centre (IDMC) counts a person as internally displaced if their displacement was forced or involuntary, they have left their habitual residence, and they have not crossed an international border.


