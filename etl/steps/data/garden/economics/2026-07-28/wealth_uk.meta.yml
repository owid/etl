# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    processing_level: minor
    presentation:
      topic_tags:
        - Economic Inequality
      attribution_short: Alvaredo, Atkinson and Morelli
    description_key:
      - "Wealth refers to marketable (net) personal wealth: the value of the assets individuals own, minus their debts."
      - Most of the estimates are based on estate data — the wealth recorded when people die — scaled up to represent the living population using the "estate multiplier" method, in which the deceased are re-weighted by mortality rates that vary with age, sex and wealth.
      - The series is linked with earlier investment-income and administrative sources so that it can be extended back to 1895, covering more than a century.
      - Definitions of wealth and of the reference population change somewhat over this long period; the source paper documents these breaks in detail.
    description_processing: |-
      For four years (2002, 2005, 2006 and 2012) the source's supplementary file does not report the top 0.1% and top 0.5-0.1% wealth shares. In these rows the remaining intermediate-bracket values (top 10-5%, top 5-1% and top 1-0.5%) were stored shifted by one column; we have moved them back into their correct columns and left the two unavailable shares empty.

