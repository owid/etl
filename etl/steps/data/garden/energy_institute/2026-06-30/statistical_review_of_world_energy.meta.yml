definitions:
  common:
    processing_level: major
    presentation:
      topic_tags:
        - Energy
  description_processing_oil_production_twh: &description-processing-oil-production-twh |-
    * Oil production is approximately converted from million tonnes to energy using a standard average oil-equivalent conversion factor of 41.868 petajoules per million tonnes. We then convert 1 petajoule to 0.278 terawatt-hours.

  # Descriptions given by the producer, quoted from the footnotes of the corresponding sheets of the
  # Statistical Review workbook (the sheet is named above each one).
  # Sheet(s): "Total Energy Supply (TES) -EJ".
  producer_total_energy_supply: &producer-total-energy-supply >-
    In this review, energy supply comprises commercially-traded fuels, including modern renewables used to generate
    electricity. Energy from non-fossil fuel combustible electricity generation is accounted for on their input heat
    requirements and non-combustible renewables on the energy content of their gross electrical output. See https://www.energyinst.org/statistical-review for more details on this methodology.
  # Sheet(s): "Coal Production - mt", "Coal Production - EJ".
  producer_coal_production: &producer-coal-production >-
    Commercial solid fuels only, i.e. bituminous coal and anthracite (hard coal), and lignite and brown (sub-bituminous)
    coal, and other commercial solid fuels. Includes coal produced for Coal-to-Liquids and Coal-to-Gas transformations.
  # Sheet(s): "Coal Consumption - EJ".
  producer_coal_consumption: &producer-coal-consumption >-
    Commercial solid fuels only, i.e. bituminous coal and anthracite (hard coal), and lignite and brown (sub-bituminous)
    coal, and other commercial solid fuels. Excludes coal converted to liquid or gaseous fuels, but includes coal
    consumed in transformation processes. Differences between these consumption figures and the world production
    statistics are accounted for by stock changes, and unavoidable disparities in the definition, measurement or
    conversion of coal supply and demand data.
  # Sheet(s): "Coal - Reserves".
  producer_coal_reserves: &producer-coal-reserves >-
    Total proved reserves of coal: generally taken to be those quantities that geological and engineering information
    indicates with reasonable certainty can be recovered in the future from known reservoirs under existing economic and
    operating conditions. The data series for total proved coal reserves does not necessarily meet the definitions,
    guidelines and practices used for determining proved reserves at company level, for instance as published by the US
    Securities and Exchange Commission, nor does it necessarily represent the EI's view of proved reserves by country.
  # Sheet(s): "Gas Production - EJ".
  producer_gas_production: &producer-gas-production >-
    Excludes gas flared or recycled. Includes natural gas produced for Gas-to-Liquids transformation.
  # Sheet(s): "Gas Production - Bcm".
  producer_gas_production_bcm: &producer-gas-production-bcm >-
    Excludes gas flared or recycled. Includes natural gas produced for Gas-to-Liquids transformation. As far as
    possible, the data above represents standard cubic metres (measured at 15°C and 1013 mbar); as they are derived
    directly from measures of energy content using an average conversion factor and have been standardized using a Gross
    Calorific Value (GCV) of 40 MJ/m3, they do not necessarily equate with gas volumes expressed in specific national
    terms.
  # Sheet(s): "Gas Production - bcf".
  producer_gas_production_bcfd: &producer-gas-production-bcfd >-
    Excludes gas flared or recycled. Includes natural gas produced for Gas-to-Liquids transformation. As the data above
    are derived directly from measures of energy content, they do not necessarily equate with gas volumes expressed in
    specific national terms.
  # Sheet(s): "Gas Consumption - EJ", "Gas Consumption - Bcf".
  producer_gas_consumption: &producer-gas-consumption >-
    Excludes natural gas converted to liquid fuels but includes derivatives of coal as well as natural gas consumed in
    Gas-to-Liquids transformation. The difference between these world consumption figures and the world production
    statistics is due to variations in stocks at storage facilities and liquefaction plants, together with unavoidable
    disparities in the definition, measurement or conversion of gas supply and demand data.
  # Sheet(s): "Gas Consumption - Bcm".
  producer_gas_consumption_bcm: &producer-gas-consumption-bcm >-
    Excludes natural gas converted to liquid fuels but includes derivatives of coal as well as natural gas consumed in
    Gas-to-Liquids transformation. As far as possible, the data above represent standard cubic metres (measured at 15°C
    and 1013 mbar); as they are derived directly from measures of energy content using an average conversion factor and
    have been standardized using a Gross Calorific Value (GCV) of 40 MJ/m3, they do not necessarily equate with gas
    volumes expressed in specific national terms. The difference between these world consumption figures and the world
    production statistics is due to variations in stocks at storage facilities and liquefaction plants, together with
    unavoidable disparities in the definition, measurement or conversion of gas supply and demand data.
  # Sheet(s): "Gas - Proved reserves".
  producer_gas_reserves: &producer-gas-reserves >-
    Total proved reserves of natural gas: generally taken to be those quantities that geological and engineering
    information indicates with reasonable certainty can be recovered in the future from known reservoirs under existing
    economic and operating conditions. The data series for total proved natural gas does not necessarily meet the
    definitions, guidelines and practices used for determining proved reserves at company level, for instance as
    published by the US Securities and Exchange Commission, nor does it necessarily represent the EI's view of proved
    reserves by country. As far as possible, the data above represents standard cubic metres (measured at 15°C and 1013
    mbar) and has been standardized using a gross calorific value (GCV) of 40 MJ/m3.
  # Sheet(s): "Oil Production - tonnes", "Oil Production - barrels".
  producer_oil_production: &producer-oil-production >-
    Includes crude oil, shale oil, oil sands, condensates (lease condensate or gas condensates that require further
    refining) and NGLs (natural gas liquids - ethane, LPG and naphtha separated from the production of natural gas).
    Excludes liquid fuels from other sources such as biofuels and synthetic derivatives of coal and natural gas. This
    also excludes liquid fuel adjustment factors such as refinery processing gain. Excludes oil shales/kerogen extracted
    in solid form.
  # Sheet(s): "Oil Consumption - Tonnes", "Oil Consumption - barrels", "Oil Consumption - EJ".
  producer_oil_consumption: &producer-oil-consumption >-
    Inland demand plus international aviation and marine bunkers and refinery fuel and loss. Consumption of biogasoline
    (such as ethanol) and biodiesel are excluded while derivatives of coal and natural gas are included. Differences
    between these world consumption figures and world production statistics are accounted for by stock changes,
    consumption of non-petroleum additives and substitute fuels and unavoidable disparities in the definition,
    measurement or conversion of oil supply and demand data.
  # Sheet(s): "Oil - Proved reserves".
  producer_oil_reserves: &producer-oil-reserves >-
    Total proved reserves of oil: generally taken to be those quantities that geological and engineering information
    indicates with reasonable certainty can be recovered in the future from known reservoirs under existing economic and
    operating conditions. The data series for total proved oil reserves does not necessarily meet the definitions,
    guidelines and practices used for determining proved reserves at company level, for instance as published by the US
    Securities and Exchange Commission, nor does it necessarily represent the EI's view of proved reserves by country.
    Reserves include gas condensate and natural gas liquids (NGLs) as well as crude oil. The estimates have been
    compiled using a combination of primary official sources, third-party data from the OPEC Secretariat, World Oil,
    Oil & Gas Journal and Chinese reserves based on official data and information in the public domain. Canadian oil
    sands 'under active development' are an official estimate. Venezuelan Orinoco Belt reserves are based on the OPEC
    Secretariat and government announcements.
  # Sheet(s): "Biofuels production - PJ", "Biofuels consumption - PJ".
  producer_biofuels: &producer-biofuels >-
    Includes biogasoline (such as ethanol) and biodiesel (including sustainable aviation fuels). Volumes have been
    adjusted for energy content.
  # Sheet(s): "Electricity Generation - TWh", "Coal / Gas / Oil inputs - Elec generation".
  producer_electricity_generation: &producer-electricity-generation >-
    Based on gross output.
  # Sheet(s): "Nuclear Generation - TWh", "Solar Generation - TWh", "Wind Generation - TWh", "Geo Biomass Other - TWh".
  producer_generation_gross: &producer-generation-gross >-
    Based on gross generation and not accounting for cross-border electricity supply.
  # Sheet(s): "Hydro Generation - TWh".
  producer_hydro_generation: &producer-hydro-generation >-
    Based on gross primary hydroelectric generation and not accounting for cross-border electricity supply.
  # Sheet(s): "Nuclear / Hydro / Solar / Wind Consumption - EJ", "Geo Biomass Other - EJ", "Renewables Consumption -EJ".
  producer_consumption_gross: &producer-consumption-gross >-
    Based on gross generation and not accounting for cross-border electricity supply. Energy from non-combustible
    renewable generation is accounted for on the energy content of their gross electrical output. See
    https://www.energyinst.org/statistical-review for more details on this methodology.

  # Key points for readers. These are ours, in plain language; the producer's own wording is kept
  # verbatim in description_from_producer.
  key_reserves: &key-reserves
    - Proved reserves are the amounts that can be extracted from known deposits under current prices and technology.
      They are not an estimate of how much coal, oil or gas exists underground.
    - These figures are for the end of 2020. The Energy Institute has not updated its reserves tables since then, and
      says the methodology and timing of future updates are under review.
  key_oil_consumption: &key-oil-consumption
    - Consumption covers fuel burned within a country, plus fuel sold there for international flights and shipping,
      and fuel used or lost in refineries.
    - Ethanol and biodiesel are counted separately, under biofuels. Liquid fuels made from coal or gas are included
      here.

