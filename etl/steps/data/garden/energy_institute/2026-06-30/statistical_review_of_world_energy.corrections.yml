# Known errors in the Energy Institute's Statistical Review of World Energy that we patch locally
# until the producer fixes them. One entry per error. See etl/data_corrections.py for the format.

- indicator: total_energy_supply_ej
  entity: Croatia
  years: [1983]
  action: override
  value: null
  expect: {gt: 1}
  reason: >-
    Croatia is reported with a total energy supply of ~7.8 EJ in 1983 (roughly 20 times its
    present-day value, and before Croatia existed as an independent country). Every other year before
    1990 is zero. This is a spurious value in the 2026 consolidated dataset, present in both the narrow
    CSV and the "Total Energy Supply (TES) -EJ" sheet of the workbook.
  producer: Energy Institute
  status: open

- indicator: total_energy_supply_ej
  entity: Poland
  years: [1975]
  action: override
  value: 4.379
  expect: {lt: 1}
  reason: >-
    Poland's total energy supply for 1975 is reported as ~0.34 EJ, about one thirteenth of the
    neighboring years (~4 EJ) and smaller than Poland's coal supply alone that year. This is a
    regression in the 2026 release, present in both the narrow CSV and the "Total Energy Supply
    (TES) -EJ" sheet of the workbook: the 2025 release reported 4.393 EJ for the same country-year.
    We restore 4.379 EJ, which two independent routes agree on: it is the sum of Poland's own energy
    sources in the 2026 release (which is what total energy supply measures), and it is the 2025
    figure rebased by the 0.3% offset between the two releases that holds for every other Polish year
    from 1965 to 1989. Leaving it empty instead would silently understate the 1975 aggregates for
    Europe, the European Union, high-income countries and the World, since those are built from the
    country values.
  producer: Energy Institute
  status: open

- indicator: hydro_consumption_ej
  entity: Iran
  years: [2021]
  action: override
  value: 0.049777
  expect: {lt: 0.01}
  reason: >-
    Hydro energy is reported as zero, while hydro electricity generation for the same year is 13.83 TWh. Under the
    producer's method these two are the same quantity, and they agree for every other country and year. The value
    is the generation figure converted to exajoules, which also closes the gap between Iran's reported total energy
    supply and the sum of its sources exactly.
  producer: Energy Institute
  status: open

- indicator: hydro_consumption_ej
  entity: USSR
  years: [1972]
  action: override
  value: 0.442436
  expect: {gt: 0.5}
  reason: >-
    Hydro energy is reported as 0.7008 EJ, while hydro electricity generation for the same year is 122.90 TWh
    (0.4424 EJ). Under the producer's method these two are the same quantity, and they agree for every other country
    and year. The generation figure also closes the gap between the USSR's reported total energy supply and the sum
    of its sources exactly.
  producer: Energy Institute
  status: open

- indicator: total_energy_supply_ej
  entity: Bangladesh
  years: [1965, 1966, 1967, 1968, 1969, 1970]
  action: override
  value: null
  expect: {eq: 0}
  reason: >-
    Total energy supply is reported as exactly zero from 1965 to 1970 and as 0.047 EJ from 1971 onwards. We read the
    zeros as years the producer does not cover rather than as measurements.
  producer: Energy Institute
  status: open

- indicator: hydro_consumption_ej
  entity: Bangladesh
  years: [1965, 1966, 1967, 1968, 1969, 1970]
  action: override
  value: null
  expect: {eq: 0}
  reason: >-
    Hydro is reported as zero in the same years and as 0.175 TWh from 1971 onwards. Removed together with the total.
  producer: Energy Institute
  status: open
