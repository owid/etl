# Known errors in the Energy Institute's Statistical Review of World Energy that we patch locally
# until the provider fixes them. One entry per error. See etl/data_corrections.py for the format.

- indicator: total_energy_supply_ej
  entity: Croatia
  years: [1983]
  action: override
  value: null
  expect: {gt: 1}
  reason: >-
    Croatia is reported with a total energy supply of ~7.8 EJ in 1983 (roughly 20 times its
    present-day value, and before Croatia existed as an independent country). Every other year before
    1990 is zero. This is a spurious value in the 2026 consolidated dataset, present in both the narrow
    CSV and the "Total Energy Supply (TES) -EJ" sheet of the workbook.
  provider: Energy Institute
  status: open

- indicator: total_energy_supply_ej
  entity: Poland
  years: [1975]
  action: override
  value: 4.379
  expect: {lt: 1}
  reason: >-
    Poland's total energy supply for 1975 is reported as ~0.34 EJ, about one thirteenth of the
    neighboring years (~4 EJ) and smaller than Poland's coal supply alone that year. This is a
    regression in the 2026 release, present in both the narrow CSV and the "Total Energy Supply
    (TES) -EJ" sheet of the workbook: the 2025 release reported 4.393 EJ for the same country-year.
    We restore 4.379 EJ, which two independent routes agree on: it is the sum of Poland's own energy
    sources in the 2026 release (which is what total energy supply measures), and it is the 2025
    figure rebased by the 0.3% offset between the two releases that holds for every other Polish year
    from 1965 to 1989. Leaving it empty instead would silently understate the 1975 aggregates for
    Europe, the European Union, high-income countries and the World, since those are built from the
    country values.
  provider: Energy Institute
  status: open

- indicator: hydro_consumption_ej
  entity: USSR
  years: [1972]
  action: override
  value: 0.442436
  expect: {gt: 0.5}
  reason: >-
    The USSR's hydro total energy supply for 1972 is reported as 0.7008 EJ (194.65 TWh), while its
    hydro electricity generation for the same year is 122.90 TWh. Under the physical energy content
    method these two are the same quantity, and they are identical for every other country-year in the
    dataset. Two independent routes agree that the generation figure is the correct one: it makes the
    two columns consistent, and it closes the gap between the USSR's reported total energy supply
    (34.1059 EJ) and the sum of its sources, which is otherwise 0.2583 EJ (0.76%) too large and becomes
    exact. Left uncorrected, the error also propagates into the aggregates for Europe and
    upper-middle-income countries, which are built from the country values.
  provider: Energy Institute
  status: open

- indicator: hydro_consumption_ej
  entity: Iran
  years: [2021]
  action: override
  value: 0.049777
  expect: {lt: 0.01}
  reason: >-
    Iran's hydro total energy supply for 2021 is reported as zero, while its hydro electricity
    generation for the same year is 13.83 TWh. Under the physical energy content method these two are
    the same quantity, so the zero is spurious and understates Iran's hydro. Two independent routes
    agree on 0.0498 EJ: it is the generation figure converted to exajoules, and it closes the gap
    between Iran's reported total energy supply (12.0669 EJ) and the sum of its sources, which is
    otherwise 0.0498 EJ (0.41%) too small and becomes exact. Left uncorrected, the error also
    propagates into the aggregates for Asia and upper-middle-income countries.
  provider: Energy Institute
  status: open

- indicator: wind_consumption_ej
  entity: Other Asia Pacific (EI)
  years: [1997]
  action: override
  value: 0.0000177015
  expect: {lt: 0.000001}
  reason: >-
    The wind total energy supply of "Other Asia Pacific" for 1997 is reported as zero, while its wind
    electricity generation for the same year is 0.00492 TWh. Under the physical energy content method
    these two are the same quantity, so the zero is spurious. Two independent routes agree on
    0.0000177 EJ: it is the generation figure converted to exajoules, and it is the gap between this
    region's reported total energy supply (1.3363 EJ) and the sum of its sources, which matches to four
    significant figures. The neighboring years support it as well (0.000006 EJ in 1996 and 0.000021 EJ
    in 1998). This region is dropped from the output, but it feeds the Asia aggregate, where the error
    otherwise makes wind supply and wind generation disagree.
  provider: Energy Institute
  status: open

- indicator: total_energy_supply_ej
  entity: Bangladesh
  years: [1965, 1966, 1967, 1968, 1969, 1970]
  action: override
  value: null
  expect: {eq: 0}
  reason: >-
    Bangladesh is reported with a total energy supply of exactly zero from 1965 to 1970, and with real
    figures from 1971, the year it became independent. The territory was East Pakistan until then and
    certainly used energy, so the zeros stand in for years the producer does not cover rather than
    describing them. Publishing them makes Bangladesh appear to have consumed no energy at all for six
    years. This is the only entity the Statistical Review gives an exactly-zero total.
  provider: Energy Institute
  status: open

- indicator: hydro_consumption_ej
  entity: Bangladesh
  years: [1965, 1966, 1967, 1968, 1969, 1970]
  action: override
  value: null
  expect: {eq: 0}
  reason: >-
    The same six placeholder years report zero hydropower, which is demonstrably wrong: the Karnaphuli
    (Kaptai) dam has been generating since 1962, and the producer reports 0.175 TWh for 1971, the first
    year it covers. The zeros for solar, wind and nuclear in those years are left alone, since those are
    true.
  provider: Energy Institute
  status: open
