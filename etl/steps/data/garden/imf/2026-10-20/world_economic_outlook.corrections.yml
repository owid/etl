- indicator: gross_domestic_product__gdp__constant_prices__percent_change_observation
  entity: Laos
  years: [2024]
  action: flag
  reason: >-
    Real GDP growth of 13.5% in 2024 (4.3% in the April 2026 WEO). The World Bank (4.1%), the Asian Development Bank
