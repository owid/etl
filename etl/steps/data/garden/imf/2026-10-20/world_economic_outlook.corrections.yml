# NOTE: At every WEO update, check whether the IMF has fixed the break in Laos's GDP series (2019–2023 are IMF staff
# estimates, 2024 onward the authorities' figures). If the published 2024 growth is no longer around 13.5%, the
# `expect` guard below fails the build: compare the new 2024 value with the World Bank's and the authorities' figures,
# and remove this entry if it now looks right. Also check that 2023 and 2025 didn't move to absorb the break.
- indicator: gross_domestic_product__gdp__constant_prices__percent_change_observation
  entity: Laos
  years: [2024]
  action: override
  value: null
  expect: {gt: 10}
  reason: >-
    Real GDP growth of 13.5% in 2024 comes from a break in the IMF's source data, not from real growth. The IMF
    confirmed in October 2026 that its Laos team used its own GDP estimates for 2019–2023 and the authorities' reported
    GDP from 2024, so 2024 growth compares two different sources. The World Bank (4.1%), the Asian Development Bank
    (4.0%) and the authorities (4.6%) all put 2024 growth at about 4%. The IMF's Laos team is reviewing how to address
    the break; remove this entry once the published value no longer shows it.
  producer: International Monetary Fund
  reported: 2026-10-21
  status: acknowledged
