# Known upstream data errors in AQUASTAT, corrected locally until fixed at the source.
# See etl/data_corrections.py for the format.
#
# In all entries below, a single sector's withdrawal exceeds the total withdrawal of the same country and
# year, so its share of the total is above 100%, which is impossible. FAO compiles the sectoral series and
# the total series separately, so a country whose sectors are updated while its total is carried forward
# ends up with shares that do not fit within the total.
- indicator: municipal_water_withdrawal_share
  entity: Brunei
  years: {from: 2004}
  action: override
  value: null
  expect: {gt: 100}
  reason: Brunei's municipal withdrawal exceeds its total withdrawal in every year since 2004, giving a
    municipal share of up to 168% of the total.
  provider: FAO AQUASTAT
  status: open

- indicator: municipal_water_withdrawal_share
  entity: Maldives
  years: [1988, 1989, 1990, 1991, 2005, 2006]
  action: override
  value: null
  expect: {gt: 100}
  reason: The Maldives' municipal withdrawal exceeds its total withdrawal in these years, giving a
    municipal share of up to 108% of the total.
  provider: FAO AQUASTAT
  status: open

- indicator: municipal_water_withdrawal_share
  entity: Malta
  years: [1980, 1981]
  action: override
  value: null
  expect: {gt: 100}
  reason: Malta's municipal withdrawal exceeds its total withdrawal in these years, giving a municipal
    share of up to 112% of the total.
  provider: FAO AQUASTAT
  status: open

- indicator: agricultural_water_withdrawal_share
  entity: Namibia
  years: [2020, 2021]
  action: override
  value: null
  expect: {gt: 100}
  reason: Namibia's agricultural withdrawal exceeds its total withdrawal in 2020 and 2021, giving an
    agricultural share of up to 156% of the total. The share returns to its usual level (~72%) in 2022.
  provider: FAO AQUASTAT
  status: open
