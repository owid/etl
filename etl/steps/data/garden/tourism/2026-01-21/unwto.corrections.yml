# Known upstream data errors in the UNWTO data, corrected locally until fixed at the source.
# See etl/data_corrections.py for the format. Applied on the raw meadow values (before the garden
# ×1000 thousands→units conversion), so `indicator` uses the long meadow column name.
- indicator: domestic_tourism_accommodation_domestic__accommodation__short_term_accommodation__hotels_and_similar__isic_5510__guests
  entity: Taiwan
  years: all
  action: scale
  factor: 0.001
  # Guard: Taiwan's raw value is ~46–64 million while the next-largest country is ~0.35 million.
  # A fixed source would report ~46–64 thousand (in line with others), tripping this `gt` and
  # telling us to remove the entry. 1,000,000 sits safely between the buggy and fixed magnitudes.
  expect: {gt: 1000000}
  reason: UNWTO reports Taiwan's domestic short-term hotel guests in units while every other country reports in thousands, making the value ~1000× too large after the garden ×1000 conversion.
  producer: UNWTO
  status: open

# Pakistan reports arrivals by region of origin (2020 onward) about 1000x too large: 117 million arrivals in 2024,
# more than any other destination reports, and 58 million from South Asia alone. The true scale is unclear (dividing by
# 1000 gives an implausibly low ~117 thousand), so we blank the values rather than rescale them.
# Guard: only Europe and South Asia carry `expect`. Their raw values are >= 2,091 thousand in every year,
# so a source fix would trip it. When it trips, remove all six Pakistan entries together.
- indicator: inbound_tourism_regions_inbound__trips__region__overnight_visitors__tourists__africa__unwto_total
  entity: Pakistan
  years: {from: 2020}
  action: override
  value: null
  reason: UN Tourism reports implausibly large arrivals by region of origin for Pakistan (117 million in total in 2024, more than any other country), likely a units-vs-thousands mismatch; the correct scale is unclear, so the values are removed.
  producer: UN Tourism
  status: open
