dataset:
  title: Number of individual wild fish killed for food
  update_period_days: 365
  owners:
    - Pablo Rosado
definitions:
  description_key: &description_key
    - This indicator uses data on fisheries capture tonnages and estimated mean weights for fish species.
    - Note that this estimate does not include unrecorded fish capture, such as fish caught illegally and those caught as bycatch and discarded.
  description_key_fishmeal: &description_key_fishmeal
    - Fishmeal and fish oil are products made by processing fish. They are mostly used as feed on fish and shrimp farms.
    - Fishcount converts the tonnage of fish caught for fishmeal and fish oil, reported by the FAO, into numbers of fish. It uses an average weight of 15 to 33 grams per fish, based on 2010 data.
    - Fishcount assumes that the mix of species caught each year is the same as in 2010, even though that mix is only partly known. So the estimates don't capture changes in which species are caught.
    - The FAO's reported tonnage doesn't include all fish caught to make fishmeal and fish oil, because detailed data is hard to get.
  presentation:
    topic_tags:
      - Animal Welfare
      - Fish & Overfishing
  subtitle: &subtitle |-
    This data does not include unrecorded fish capture, such as fish caught illegally and those caught as bycatch and discards. Data for countries and regions is based on the average tonnage of annual catch from 2003 to 2022, and estimated mean weights for fish species.
  footnote: &footnote |-
    Due to large uncertainties, the chart shows upper and lower bounds, and midpoint values (also shown in the map), which are the average of those bounds.

