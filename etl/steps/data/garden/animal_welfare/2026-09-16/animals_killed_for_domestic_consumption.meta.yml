definitions:
  common:
    presentation:
      topic_tags:
        - Animal Welfare
    processing_level: major
    description_processing: |-
      - The number of animals is estimated by dividing the meat supplied to each country, reported by the UN Food and Agriculture Organization (FAO) in its Food Balance Sheets, by the average carcass weight of an animal in that group, country and year.
      - The average carcass weight is calculated from FAO's production data, as the meat produced divided by the number of animals slaughtered. Both quantities are measured in carcass weight, so they can be divided directly.
      - Where a country does not report the number of animals it slaughters, or where the resulting carcass weight is implausible, the world average carcass weight for that group and year is used instead. This mostly affects countries that import nearly all of their meat.
      - Unlike the number of animals slaughtered in a country, this measure attributes animals to the country whose consumption they supply, rather than to the country where they were killed.
      - Meat from horses, camels, rabbits, game and other minor categories is not included, because FAO does not report the number of these animals slaughtered consistently enough to estimate a carcass weight.
      - This method follows van der Laan, S., Breeman, G., & Scherer, L. (2024), "Animal Lives Affected by Meat Consumption Trends in the G20 Countries", extended from the G20 countries to all countries.

dataset:
  title: Land animals killed for domestic consumption
  update_period_days: 365
  owners:
