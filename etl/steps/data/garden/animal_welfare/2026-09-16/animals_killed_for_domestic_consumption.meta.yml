definitions:
  common:
    presentation:
      topic_tags:
        - Animal Welfare
  total: &total
    unit: animals
    short_unit: ''
    display:
      name: |-
        <% if animal == "all land animals" %>Land animals<% else %><< animal | capitalize >><% endif %>
      numDecimalPlaces: 0
  per_capita: &per_capita
    unit: animals per person
    short_unit: ''
    display:
      name: |-
        <% if animal == "all land animals" %>Land animals<% else %><< animal | capitalize >><% endif %>
      numDecimalPlaces: 2
  in_country: &in_country
    description_short: Based on the country of production, not consumption.
    processing_level: minor
    description_processing: |-
      <% if animal == "poultry" %>FAO reports each species separately; the numbers for chickens, ducks, geese and guinea fowl, turkeys, and pigeons and other birds are summed.
      <%- elif animal == "all land animals" %>FAO reports each species separately; the numbers for cattle, buffaloes, sheep, goats, pigs, chickens, ducks, geese and guinea fowl, turkeys, pigeons and other birds, horses, donkeys, mules, camels, other camelids, rabbits, and other rodents are summed.
      <%- endif %>
  consumption: &consumption
    description_short: Based on the country of consumption, not production.
    processing_level: major
    description_processing: |-
      - To count the animals slaughtered for the meat each country consumes, we first work out how many animals are slaughtered per tonne of meat the country produces. We then multiply that number by the tonnes of meat supplied to the country. Both the meat produced and the meat supplied come from the Food Balance Sheets of the Food and Agriculture Organization of the United Nations (FAO).
      - For meat of an animal that a country imports entirely, we use the world average number of those animals slaughtered per tonne of their meat.
      - The Food Balance Sheets group some animals together, such as poultry. We split each group into its animals, such as chickens and turkeys, in proportion to their supply in FAO's Supply Utilization Accounts. Those accounts start in 2010, so our estimates do too.
      - The Food Balance Sheets also count processed meat, such as ham and sausages, converted back to the weight of the carcass.
      - For horses, donkeys, mules, camels, other camelids, rabbits, and other rodents, we take the meat supplied and produced from the Supply Utilization Accounts directly, because the Food Balance Sheets group them with processed meat of unknown species.
      - We count imported meat as if it came from the importing country's own animals. So if a country's animals are much bigger or smaller than those of the countries it imports from, its number is too low or too high.
      - We leave out processed meat of unknown species, and meat from game animals.
      - We follow the method of [van der Laan, Breeman, and Scherer (2024)](https://doi.org/10.3390/ani14111662), "Animal Lives Affected by Meat Consumption Trends in the G20 Countries". They covered the G20 countries and groups of animals, and we extend their method to all countries and to each animal.
  eggs: &eggs
    unit: animals
    short_unit: ''
    display:
      name: Chickens killed for eggs
      numDecimalPlaces: 0
  eggs_per_capita: &eggs_per_capita
    unit: animals per person
    short_unit: ''
    display:
      name: Chickens killed for eggs
      numDecimalPlaces: 2
  eggs_in_country: &eggs_in_country
    description_short: Based on the country of production, not consumption.
    processing_level: major
    description_processing: |-
      We estimate the number of hens killed each year following [a methodology by Faunalytics](https://faunalytics.org/global-chick-culling-2019-2024/), assuming that each of FAOSTAT's laying hens is killed after 65 weeks of laying, so that 80% of them are killed and replaced every year. We also assume that one male chick is killed for each hen.
  eggs_consumption: &eggs_consumption
    description_short: Based on the country of consumption, not production.
    processing_level: major
    description_processing: |-
      - We estimate the number of hens killed each year following [a methodology by Faunalytics](https://faunalytics.org/global-chick-culling-2019-2024/), assuming that each of FAOSTAT's laying hens is killed after 65 weeks of laying, so that 80% of them are killed and replaced every year. We also assume that one male chick is killed for each hen.
      - To count the chickens killed for the eggs each country consumes, we first work out how many chickens are killed per tonne of eggs the country produces. We then multiply that number by the tonnes of eggs supplied to the country. Both the eggs produced and the eggs supplied come from the Food Balance Sheets of the Food and Agriculture Organization of the United Nations (FAO).
      - For the few countries that import all the eggs they consume, we use the world average number of chickens killed per tonne of eggs.
      - The Food Balance Sheets count the eggs of all birds, not only hens, although most are hens' eggs. They also count processed eggs, converted back to the weight of eggs in their shell.

dataset:
  title: Land animals killed for domestic consumption
  update_period_days: 365
  owners:
    - Pablo Rosado

tables:
  animals_killed_for_domestic_consumption:
    variables:
      killed_in_country:
        <<: [*in_country, *total]
        title: |-
          <% if animal == "all land animals" %>Land animals<% else %><< animal | capitalize >><% endif %> slaughtered for meat
      killed_in_country_per_capita:
        <<: [*in_country, *per_capita]
        title: |-
          <% if animal == "all land animals" %>Land animals<% else %><< animal | capitalize >><% endif %> slaughtered for meat per person
      killed_for_domestic_supply:
        <<: [*consumption, *total]
        title: |-
          <% if animal == "all land animals" %>Land animals<% else %><< animal | capitalize >><% endif %> slaughtered for meat supplied to the country
      killed_for_domestic_supply_per_capita:
        <<: [*consumption, *per_capita]
        title: |-
          <% if animal == "all land animals" %>Land animals<% else %><< animal | capitalize >><% endif %> slaughtered for meat supplied to the country per person
      killed_for_food:
        <<: [*consumption, *total]
        title: |-
          <% if animal == "all land animals" %>Land animals<% else %><< animal | capitalize >><% endif %> slaughtered for meat eaten in the country
      killed_for_food_per_capita:
        <<: [*consumption, *per_capita]
        title: |-
          <% if animal == "all land animals" %>Land animals<% else %><< animal | capitalize >><% endif %> slaughtered for meat eaten in the country per person
  chickens_killed_for_eggs:
    variables:
      killed_in_country:
        <<: [*eggs_in_country, *eggs]
        title: Estimated number of chickens killed in egg production
      killed_in_country_per_capita:
        <<: [*eggs_in_country, *eggs_per_capita]
        title: Estimated number of chickens killed in egg production per person
      killed_for_domestic_supply:
        <<: [*eggs_consumption, *eggs]
        title: Estimated number of chickens killed in egg production, based on consumption
      killed_for_domestic_supply_per_capita:
        <<: [*eggs_consumption, *eggs_per_capita]
        title: Estimated number of chickens killed in egg production, based on consumption, per person
      killed_for_food:
        <<: [*eggs_consumption, *eggs]
        title: Chickens killed for eggs eaten in the country
      killed_for_food_per_capita:
        <<: [*eggs_consumption, *eggs_per_capita]
        title: Chickens killed for eggs eaten in the country per person
