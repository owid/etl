tables:
  animals_killed_for_domestic_consumption:
    variables:
      cattle_and_buffaloes_killed_domestic_supply:
        title: Cattle and buffaloes killed for domestic consumption
        unit: animals
        short_unit: ''
        description_short: |-
          Estimated number of cattle and buffaloes killed to supply the meat consumed in each country, after accounting for trade. Includes meat that is wasted or used for purposes other than food.
        display:
          numDecimalPlaces: 0
