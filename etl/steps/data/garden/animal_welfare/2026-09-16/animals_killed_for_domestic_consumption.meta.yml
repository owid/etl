definitions:
  common:
    presentation:
      topic_tags:
        - Animal Welfare
  description_processing_consumption: &description_processing_consumption |-
    - The number of animals is estimated by scaling the animals killed in each country by the ratio of the meat supplied to the country, reported by the UN Food and Agriculture Organization (FAO) in its Food Balance Sheets, to the meat it produced.
    - Countries that kill no animals of their own have no such ratio, so their meat supply is converted at the world average number of animals per tonne.
    - Unlike the number of animals killed in a country, this measure attributes animals to the country whose consumption they supply, rather than to the country where they were killed.
    - Imported meat is converted at the importing country's own number of animals per tonne, so countries whose animals are unusually large or small will be over- or understated.
    - Meat from horses, camels, rabbits, game and other minor categories is not included, because FAO does not report the number of these animals killed consistently enough.
    - This method follows van der Laan, S., Breeman, G., & Scherer, L. (2024), "Animal Lives Affected by Meat Consumption Trends in the G20 Countries", extended from the G20 countries to all countries.

dataset:
  title: Land animals killed for domestic consumption
  update_period_days: 365
  owners:
    - Pablo Rosado

tables:
  animals_killed_for_domestic_consumption:
    variables:
      cattle_and_buffaloes_killed_in_country:
        title: Cattle and buffaloes killed in the country
        unit: animals
        short_unit: ''
        description_short: |-
          Number of cattle and buffaloes killed in each country, wherever their meat is eventually consumed.
        processing_level: minor
        description_processing: |-
          FAO reports each species separately; the numbers for cattle and buffaloes are summed.
        display:
          numDecimalPlaces: 0
      cattle_and_buffaloes_killed_in_country_per_capita:
        title: Cattle and buffaloes killed in the country, per person
        unit: animals per person
        short_unit: ''
