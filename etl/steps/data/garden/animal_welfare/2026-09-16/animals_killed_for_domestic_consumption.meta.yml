definitions:
  common:
    presentation:
      topic_tags:
        - Animal Welfare
  total: &total
    unit: animals
    short_unit: ''
    display:
      name: |-
        <% if animal == "all land animals" %>Land animals<% else %><< animal | capitalize >><% endif %>
      numDecimalPlaces: 0
  per_capita: &per_capita
    unit: animals per person
    short_unit: ''
    display:
      name: |-
        <% if animal == "all land animals" %>Land animals<% else %><< animal | capitalize >><% endif %>
      numDecimalPlaces: 2
  in_country: &in_country
    description_short: Based on the country of production, not consumption.
    processing_level: minor
    description_processing: |-
      <% if animal == "poultry" %>FAO reports each species separately; the numbers for chickens, ducks, geese and guinea fowl, turkeys, and pigeons and other birds are summed.
      <%- elif animal == "all land animals" %>FAO reports each species separately; the numbers for cattle, buffaloes, sheep, goats, pigs, chickens, ducks, geese and guinea fowl, turkeys, pigeons and other birds, horses, donkeys, mules, camels, other camelids, rabbits, and other rodents are summed.
      <%- endif %>
  consumption: &consumption
    description_short: Based on the country of consumption, not production.
    processing_level: major
    description_processing: |-
      - The number of animals is estimated by scaling the animals slaughtered in each country by the ratio of the meat supplied to that country to the meat it produced, both reported by the UN Food and Agriculture Organization (FAO) in its Food Balance Sheets.
      - Countries that slaughter no animals of their own have no such ratio, so their meat supply is converted at the world average number of animals per tonne.
      - The Food Balance Sheets report groups of animals (such as poultry) and include processed meat (such as ham and sausages). Each group is split into its animals (such as chickens and turkeys) in proportion to their supply in FAO's Supply Utilization Accounts, which start in 2010.
      - For horses, donkeys, mules, camels, other camelids, rabbits, and other rodents, the meat supplied and produced come from the Supply Utilization Accounts directly, because the Food Balance Sheets group them with processed meat of unknown species.
      - Imported meat is converted at the importing country's own number of animals per tonne, so countries whose animals are unusually large or small are over- or understated.
      - Processed meat of unknown species, and meat from game animals, are not included.
      - This follows the method of van der Laan, S., Breeman, G., & Scherer, L. (2024), "Animal Lives Affected by Meat Consumption Trends in the G20 Countries", extended from the G20 countries to all countries, and from groups of animals to each animal.
  eggs: &eggs
    unit: animals
    short_unit: ''
    display:
      name: Chickens killed for eggs
      numDecimalPlaces: 0
  eggs_per_capita: &eggs_per_capita
    unit: animals per person
    short_unit: ''
    display:
      name: Chickens killed for eggs
      numDecimalPlaces: 2
  eggs_in_country: &eggs_in_country
    description_short: Based on the country of production, not consumption.
    processing_level: major
    description_processing: |-
      We estimate the number of hens killed each year following [a methodology by Faunalytics](https://faunalytics.org/global-chick-culling-2019-2024/), assuming that each of FAOSTAT's laying hens is killed after 65 weeks of laying, so that 80% of them are killed and replaced every year. We also assume that one male chick is killed for each hen.
  eggs_consumption: &eggs_consumption
    description_short: Based on the country of consumption, not production.
    processing_level: major
    description_processing: |-
      - We estimate the number of hens killed each year following [a methodology by Faunalytics](https://faunalytics.org/global-chick-culling-2019-2024/), assuming that each of FAOSTAT's laying hens is killed after 65 weeks of laying, so that 80% of them are killed and replaced every year. We also assume that one male chick is killed for each hen.
      - The number of chickens is then estimated by scaling the chickens killed in egg production in each country by the ratio of the eggs supplied to that country to the eggs it produced, both reported by the UN Food and Agriculture Organization (FAO) in its Food Balance Sheets.
      - Countries that produce no eggs have no such ratio, so their egg supply is converted at the world average number of chickens killed per tonne of eggs.
      - The Food Balance Sheets report the eggs of all birds (mostly hens), and include processed eggs converted back to eggs in their shell.

dataset:
  title: Land animals killed for domestic consumption
  update_period_days: 365
  owners:
    - Pablo Rosado

tables:
  animals_killed_for_domestic_consumption:
    variables:
      killed_in_country:
        <<: [*in_country, *total]
        title: |-
          <% if animal == "all land animals" %>Land animals<% else %><< animal | capitalize >><% endif %> slaughtered for meat
      killed_in_country_per_capita:
        <<: [*in_country, *per_capita]
        title: |-
          <% if animal == "all land animals" %>Land animals<% else %><< animal | capitalize >><% endif %> slaughtered for meat per person
      killed_for_domestic_supply:
        <<: [*consumption, *total]
        title: |-
          <% if animal == "all land animals" %>Land animals<% else %><< animal | capitalize >><% endif %> slaughtered for meat supplied to the country
      killed_for_domestic_supply_per_capita:
        <<: [*consumption, *per_capita]
        title: |-
          <% if animal == "all land animals" %>Land animals<% else %><< animal | capitalize >><% endif %> slaughtered for meat supplied to the country per person
      killed_for_food:
        <<: [*consumption, *total]
        title: |-
          <% if animal == "all land animals" %>Land animals<% else %><< animal | capitalize >><% endif %> slaughtered for meat eaten in the country
      killed_for_food_per_capita:
        <<: [*consumption, *per_capita]
        title: |-
          <% if animal == "all land animals" %>Land animals<% else %><< animal | capitalize >><% endif %> slaughtered for meat eaten in the country per person
  chickens_killed_for_eggs:
    variables:
      killed_in_country:
        <<: [*eggs_in_country, *eggs]
        title: Estimated number of chickens killed in egg production
      killed_in_country_per_capita:
        <<: [*eggs_in_country, *eggs_per_capita]
        title: Estimated number of chickens killed in egg production per person
      killed_for_domestic_supply:
        <<: [*eggs_consumption, *eggs]
        title: Estimated number of chickens killed in egg production, based on consumption
      killed_for_domestic_supply_per_capita:
        <<: [*eggs_consumption, *eggs_per_capita]
        title: Estimated number of chickens killed in egg production, based on consumption, per person
      killed_for_food:
        <<: [*eggs_consumption, *eggs]
        title: Chickens killed for eggs eaten in the country
      killed_for_food_per_capita:
        <<: [*eggs_consumption, *eggs_per_capita]
        title: Chickens killed for eggs eaten in the country per person
