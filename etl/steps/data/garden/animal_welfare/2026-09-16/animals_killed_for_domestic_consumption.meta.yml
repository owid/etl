definitions:
  common:
    presentation:
      topic_tags:
        - Animal Welfare
  description_processing_consumption: &description_processing_consumption |-
    - The number of animals is estimated by scaling the animals slaughtered in each country by the ratio of the meat supplied to that country, reported by the UN Food and Agriculture Organization (FAO) in its Food Balance Sheets, to the meat it produced.
    - Countries that slaughter no animals of their own have no such ratio, so their meat supply is converted at the world average number of animals per tonne.
    - Imported meat is converted at the importing country's own number of animals per tonne, so countries whose animals are unusually large or small are over- or understated.
    - Meat from horses, camels, rabbits, game and other minor categories is not included.
    - This follows the method of van der Laan, S., Breeman, G., & Scherer, L. (2024), "Animal Lives Affected by Meat Consumption Trends in the G20 Countries", extended from the G20 countries to all countries.

dataset:
  title: Land animals killed for domestic consumption
  update_period_days: 365
  owners:
