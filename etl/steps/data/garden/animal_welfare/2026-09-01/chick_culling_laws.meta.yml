tables:
  chick_culling_laws:
    variables:
      status:
        title: Banning of chick culling
        unit: ""
        short_unit: ""
        processing_level: major
        description_short: Legal status of the culling of male chicks in the egg industry.
        description_key:
          - Chick culling is the killing of newly hatched male chicks, which cannot lay eggs and are of no commercial value to the egg industry.
          - Billions of male chicks are estimated to be killed around the world every year.
          - This data shows the legal status of chick culling, not how widely it is practiced.
          - Ducklings are also often killed soon after hatching. This is common in major duck-egg producing countries, such as China and the Philippines. No law specifically bans the culling of ducklings.
          - France's ban on chick culling explicitly excludes ducklings. Foie gras production uses male ducks, so it is the female ducklings that are killed.
        description_processing: |-
          Countries for which we found no law on chick culling are shown as "Not banned". Chick culling bans are notable legislative events that animal advocacy organizations track closely, so a country with no known law can safely be assumed to have no ban.
