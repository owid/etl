# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    presentation:
      topic_tags:
        - State Capacity
        - War & Peace
    processing_level: minor
    description_processing: |-
      We use the list of independent states and microstates from Gleditsch and Ward. We assign each country to a region based on the mapping (using GW codes):

        - Americas: 2-199
        - Europe: 200-399
        - Africa: 400-626
        - Middle East: 630-699
        - Asia and Oceania: 700-999
    display:
      numDecimalPlaces: 0
    description_key:
      - |-
        Gleditsch and Ward consider a country a sovereign state if its administration of a territory is relatively autonomous and it is considered independent by local actors and other states. They discuss many cases here: http://ksgleditsch.com/data/iisyst_casedesc.pdf

# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/dataset/
dataset:
  title: States in regions (Gleditsch)
  update_period_days: 1800


# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/tables/
  owners:
    - Lucas Rodés-Guirao
tables:
  gleditsch_regions:
    title: States in regions (Gleditsch)
    variables:
      number_countries:
        title: Number of states in a region
        description_short: |-
          Number of states (and microstates) in each region.
        unit: countries

      population:
        title: Population in region
        description_short: |-
          Population in the region, using borders from 2022.
        unit: people
        description_processing: |-
          {definitions.common.description_processing}

          We calculate the population of each region by adding up the population of its countries, using our [long-term population estimates](https://ourworldindata.org/population-sources). Population estimates from 2024 onwards are projections released by the UN.
