# Known errors in FAOSTAT's Supply Utilization Accounts (SCL) that this step patches until FAO fixes them. One entry
# per cell. Format: etl/data_corrections.py. Applied to the SCL input table at the start of the step, before the
# balance table and the region aggregates are built, so that regions inherit the corrected country rows.
#
# Why here and not in the garden SCL step (data://garden/faostat/2026-02-25/faostat_scl): that step is generated by
# the shared FAOSTAT code, whose own mechanism for known errors (detected_anomalies.py) runs after it has built its
# region rows, and a change to the shared code rebuilds every FAOSTAT dataset. The garden SCL dataset has no other
# consumer, so nothing else sees the error. The right long-term home is FAOSTAT's anomaly list, at the next FAOSTAT
# update, when everything rebuilds anyway.
#
# Denmark, molasses (item 165), 2021-2023. FAOSTAT imputes molasses production equal to the sugar beet processed
# (2.44, 2.19 and 2.26 million tonnes), flagged "I" (imputed), and balances it with an estimated feed use of the same
# size. That is physically impossible: molasses was 2.4% to 3.1% of the beet in 2010-2020 (67,000 tonnes in 2019,
# 75,000 in 2020). In the chain it made processing appear to create about 2,900 kcal per person per day, three
# quarters of Denmark's food, and inflated feed by the same amount; it also put about 40 kcal into the European
# Union's processing and feed, 23 into Europe's and 2 into World's. Production is set to the last reported figure
# (2020), as FAO itself does when filling a gap; feed is set to the value that closes the molasses balance
# (production + imports - exports - processing) in each year. The guards fail the step if FAO revises the figures.

- indicator: value
  match: {country: Denmark, year: 2021, item_code: "00000165", element_code: "005510"}
  action: override
  value: 75000
  expect: {gt: 1000000}
  reason: Molasses production imputed equal to the sugar beet processed (2,435,936 t); repeats the 2020 figure.
  producer: FAOSTAT
  status: open

- indicator: value
  match: {country: Denmark, year: 2022, item_code: "00000165", element_code: "005510"}
  action: override
  value: 75000
  expect: {gt: 1000000}
  reason: Molasses production imputed equal to the sugar beet processed (2,194,146 t); repeats the 2020 figure.
  producer: FAOSTAT
  status: open

- indicator: value
  match: {country: Denmark, year: 2023, item_code: "00000165", element_code: "005510"}
  action: override
  value: 75000
  expect: {gt: 1000000}
  reason: Molasses production imputed equal to the sugar beet processed (2,255,545 t); repeats the 2020 figure.
  producer: FAOSTAT
  status: open

- indicator: value
  match: {country: Denmark, year: 2021, item_code: "00000165", element_code: "005520"}
  action: override
  value: 106109
  expect: {gt: 1000000}
  reason: Molasses feed estimated to absorb the imputed production (2,467,044 t); set to close the balance with the corrected production (75,000 + 118,027 imports - 12,753 exports - 74,165 processing).
  producer: FAOSTAT
  status: open

