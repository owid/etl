definitions:
  common:
    processing_level: major
    presentation:
      topic_tags:
        - Food Supply
    description_processing: |-
      - FAOSTAT's Food Balance Sheets (FBS) dataset records how many tonnes of each food product a country produces, imports, and adds to stocks; it also records how many tonnes of food product are used for each purpose, like exports, human food, animal feed, seed, etc.
      - FAOSTAT ensures that domestic supply equals domestic utilization. This means that each country and year, the tonnes of a food product must fulfil the balance identity:
      production + imports - stock variation
         = exports + food + feed + seed + processing + other uses + losses + tourist consumption + residuals
      - The "food" element of the identity (which gives the tonnes available for human consumption) is also given in weight per person, calories per person, and protein per person. For all other elements, the FBS dataset records only tonnes. We therefore need to convert tonnes to calories (and protein) for all non-food elements in the identity.
      - The density of calories (or protein) is calculated by dividing the calories (or protein) of "food" by its weight. This density is then multiplied by each of the elements to convert tonnes into calories (or protein).
      - Sometimes densities can't be calculated. This can happen for mainly three reasons:
        1. The product is not used directly for food in that country. For example, sugar cane is almost always processed, not eaten directly by people.
        2. The weight is zero due to rounding. This can happen for small island countries, given that food weight in the dataset is rounded to 1,000 tonnes.
        3. The resulting density is an impossible value, namely more than 920 kilocalories per 100 grams (the energy of pure fat), or more than 100 grams of protein per 100 grams. Impossible values can happen because the food products that FAOSTAT includes in the food weight sometimes differ from the food products included in the food calorie (or protein). For example, soybean oil's calories include calories of processed products like margarine, but soybean oil's weight is split between "food" and "processing"; dividing the calories by the food weight therefore overestimates the oil's calorie density.
      - Where the density can't be calculated, we use the median density of that food product in the same country across all years; if that country has no valid density for that food product in any year, we use the median across all countries and years.
      - FAO reports stock variation only from 2010 onward. For earlier years, we calculate stock variation as production plus imports, minus exports, minus domestic supply.
      - We add up the contribution of all individual food products to build the total weight, calories, and protein of each part of the chain for each country and year. To do that, we exclude FAOSTAT's aggregate groups (e.g. "Cereals"), to avoid double-counting the same food products twice. We also leave out other non-food items like ethanol (used for biofuels or industry).
      - Some food products are made from others. For example, soybean oil is made from soybeans. FAOSTAT records the soybeans that go into processing as "processing" of soybeans, and the oil that comes out as "production" of soybean oil. The calories of soybeans are already counted as crop production, so adding the soybean oil's production as well would count the same calories twice. Therefore, we subtract the production of processed products from processing. In other words, the processing part of the food chain normally removes the calories, that were lost when converting raw crops like soybeans into processed foods like soybean oil.
      - Sometimes, however, processing appears to add calories (or protein) to the food chain, which is physically impossible. This happens for crops that are mostly processed rather than eaten, such as sugar cane. The calorie density of sugar cane is calculated from the little cane that people eat directly by chewing it, which gives only about 30 kilocalories per 100 grams. But sugar mills extract much more: the sugar they produce contains at least 43 kilocalories per 100 grams of cane. So the calories going into processing are underestimated, while the calories of the sugar coming out are measured correctly, and therefore processing seems to add calories to the food chain. The same happens for other crops that are mostly processed, such as sugar beet and some oilseeds. Correcting this would add complexity, and it would only be possible for some products, because the FBS dataset groups many products together; for example, it groups cane sugar and beet sugar into one product, so we cannot tell how much sugar came from the cane. FAOSTAT publishes another dataset, the Supply Utilization Accounts, which records individual products separately and allows a more accurate calculation. However, that dataset only starts in 2010.
      - There is another problem with processing, in the opposite direction. When oilseeds such as soybeans are crushed, they produce oil and oilseed cake. FBS records the oil, but has no product for oilseed cake, which is mostly fed to animals. So the calories (and especially the protein) of the cake appear as lost in processing, when in reality those calories (and proteins) go to animal feed. As a result, processing looks like a bigger loss than it really is, and animal feed looks smaller.
      - The FBS dataset rounds most tonnages to the nearest thousand tonnes, so the stages do not add up exactly. Any gaps in the balance identity are added to "data adjustments". Here we include FAOSTAT's own unexplained differences (which they call "residuals").
      - The World's total imports should in theory equal the World's exports (the world as a whole doesn't trade with anyone). However, the World's imports and exports often differ. The discrepancy is due to mismatches between the trade reported by countries. For World, we set exports equal to imports (which FAO considers the more reliable figure). The difference is added to "data adjustments".
      - Similarly, tourist consumption should also be zero for the World (every visitor lives in some country). We set the world's tourist consumption to zero. The difference is added to "data adjustments".
      - All values are divided by population, using Our World in Data's population data. Aggregate regions (continents, income groups, and the World) are the sum of contributions from all individual countries in the region; the result is divided by the population of those same countries. The aggregated data for a region is removed in years when those countries hold less than 80% of the region's population.

dataset:
  update_period_days: 365
  owners:
    - Pablo Rosado

tables:
  energy:
    title: Food supply chain in kilocalories (Food Balance Sheets method)
    common:
      unit: kilocalories per person per day
      short_unit: kcal
    variables: &variables
      crop_production:
        title: Crop production
        description_short: Crops harvested in the country.
        description_key:
          - Crops include cereals, roots and tubers, sugar crops, pulses, nuts, oil crops, vegetables, fruit, coffee, tea, cocoa, spices, and seaweed.
          - Products made from crops, such as sugar, beer, and most vegetable oils, are not counted here, because the crops they are made from are already counted.
      imports:
        title: Imports
        description_short: Food products bought from other countries.
      exports:
        title: Exports
        description_short: Food products sold to other countries.
      stock_variation:
        title: Stock variation
        description_short: Food products added to stocks, minus those taken out. Positive values mean stocks grew, so that food was not available for other uses that year.
      seed:
        title: Seed
        description_short: Crops used for planting, eggs used for hatching, and fish used as bait.
      losses:
        title: Losses
        description_short: Food lost between the farm and the shop.
        description_key:
          - These are losses in storage, transport and processing. They do not include food wasted in shops or households.
      other_uses:
        title: Other uses
        description_short: Food products used for purposes other than food or feed, such as biofuels and soap.
      processing_net:
        title: Processing, net
        description_short: Food products sent to be processed, for example milled, crushed or brewed, minus the processed products made from them, such as oils, sugar and beer. Positive values mean more goes in than comes out.
        description_key:
          - When oilseeds such as soybeans are crushed for their oil, the solid remains, called oilseed cake, are mostly fed to animals. FAO's Food Balance Sheets do not record oilseed cake, so it appears here as lost in processing instead of as animal feed.
      feed:
        title: Feed
        description_short: Food products fed to animals.
        description_key:
          - Animals also eat grass, crop residues, and oilseed cake, which are not counted here. So the feed counted here is less than what animals actually eat, and comparing it with animal products understates how much feed it takes to produce them.
      animal_products:
        title: Animal products
        description_short: Meat, offal, animal fats, milk, eggs, honey, fish and seafood produced in the country.
      tourist_consumption:
        title: Tourist consumption
        description_short: Food eaten by visitors from other countries. FAO reports it from 2010 onward. For the world, it is set to zero.
      data_adjustments:
        title: Data adjustments
        description_short: Differences that make the stages add up to the food available to eat, from FAO's own unexplained differences and from rounding in FAO's figures. For the world, it also includes the gap between imports and exports, and tourist consumption. Values can be negative.
      food:
        title: Food available for consumption
        description_short: Food available for people to eat, before waste in shops and households.
      balancing_difference:
        title: Balancing difference
        description_short: The part of data adjustments that comes from rounding in FAO's figures.
  protein:
    title: Food supply chain in grams of protein (Food Balance Sheets method)
    common:
      unit: grams of protein per person per day
      short_unit: g
    variables: *variables
  mass:
    title: Food supply chain in kilograms (Food Balance Sheets method)
    common:
      unit: kilograms per person per day
      short_unit: kg
    variables: *variables
