definitions:
  common:
    processing_level: major
    presentation:
      topic_tags:
        - Food Supply
      grapher_config:
        note: |-
          Calories and protein are estimated by Our World in Data from FAOSTAT data in tonnes. Imports and exports include animal products. Feed excludes grass, and animal products include wild-caught fish. Food available for consumption does not account for food waste at the consumer level.
    description_processing: |-
      - FAOSTAT's Food Balance Sheets (FBS) dataset gives only the food available in calories and protein; every other part of the chain is in tonnes. We convert those tonnes into calories and protein using FAOSTAT's own nutrient densities: each product's food calories (or protein) divided by its food tonnes, for each country and year.
      - Where a density can't be calculated, or is impossible (more calories than pure fat), we use the median density of that product in the same country, or else in all countries.
      - FAOSTAT reports stock variation only from 2010. For earlier years, we calculate it from the other parts of the balance.
      - We subtract processed products, such as sugar and oils, from processing, so that the crops they come from are not counted twice.
      - We leave out products that are never food, such as non-food alcohol.
      - This dataset has two known limitations, which the Supply Utilization Accounts method (from 2010) avoids. Crops that are mostly processed, such as sugar cane, are valued only by the part people eat, so processing can appear to create calories. And oilseed cake is not recorded, so it appears as lost in processing instead of as animal feed.
      - "Data adjustments" collect the differences needed to make the chain add up to the food available. These include FAOSTAT's residuals and rounding errors, and numerical discrepancies caused during the conversion of tonnes into calories and protein.
      - We divide all values by population and by 365 days. The population estimates come from a long-run dataset [maintained by Our World in Data](https://ourworldindata.org/population-sources). Regions are the sum of their countries.
      - We describe the method in full in [this technical publication](https://docs.owid.io/projects/etl/analyses/food_supply_chain/food_supply_chain.html).

dataset:
  update_period_days: 365
  owners:
    - Pablo Rosado
    - Hannah Ritchie

tables:
  energy:
    title: Food supply chain in kilocalories (alternative method, from 1961)
    common:
      unit: kilocalories per person per day
      short_unit: kcal
    variables: &variables
      crop_production:
        title: Crop production
        description_short: Crops harvested in the country, before they are made into products such as sugar or beer.
      imports:
        title: Imports
        description_short: Food products bought from other countries.
      exports:
        title: Exports
        description_short: Food products sold to other countries.
      stock_variation:
        title: Stock variation
        description_short: Food products added to stocks, minus those taken out. Positive values mean stocks grew, so that food was not available for other uses that year.
      seed:
        title: Seed
        description_short: Crops used for planting, eggs used for hatching, and fish used as bait.
      losses:
        title: Losses
        description_short: Food lost in storage, transport and processing, between the farm and the shop.
      other_uses:
        title: Other uses
        description_short: Food products used for purposes other than food or feed, such as biofuels and soap.
      processing_net:
        title: Processing, net
        description_short: Food products sent to be processed, for example milled, crushed or brewed, minus the processed products made from them, such as oils, sugar and beer. Oilseed cake, mostly fed to animals, is not recorded in this dataset, so it appears here as lost.
      feed:
        title: Feed
        description_short: Food products fed to animals. Oilseed cake is not included, because this dataset does not record it.
      animal_products:
        title: Animal products
        description_short: Meat, offal, animal fats, milk, eggs, honey, fish and seafood produced in the country.
      tourist_consumption:
        title: Tourist consumption
        description_short: Food eaten by visitors from other countries. FAO reports it from 2010 onward. For the world, it is set to zero.
      data_adjustments:
        title: Data adjustments
        description_short: Differences needed to make the stages add up to the food available to eat. They include FAOSTAT's residuals and rounding errors and, in calories and protein, numerical discrepancies from converting tonnes. For the world, they also include the gap between imports and exports, and tourist consumption.
      food:
        title: Food available for consumption
        description_short: Food available for people to eat, before waste in shops and households.
      balancing_difference:
        title: Balancing difference
        description_short: The part of data adjustments that comes from rounding errors and, in calories and protein, from converting tonnes.
  protein:
    title: Food supply chain in grams of protein (alternative method, from 1961)
    common:
      unit: grams of protein per person per day
      short_unit: g
    variables: *variables
  mass:
    title: Food supply chain in kilograms (alternative method, from 1961)
    common:
      unit: kilograms per person per day
      short_unit: kg
    variables: *variables
