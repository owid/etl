definitions:
  common:
    processing_level: major
    presentation:
      topic_tags:
        - Food Supply
    description_processing: |-
      - FAOSTAT Food Balance Sheets report every element of the food balance in tonnes, and only food available for consumption also in kilocalories and grams of protein. We convert flows reported in tonnes with a density (kilocalories, or grams of protein, per 100 grams) and sum the items into the stages of the chain; the mass table keeps the tonnes, expressed in kilograms per person per day.
      - Energy and protein densities are calculated separately for each item, country or region, and year, by dividing reported food nutrients by food weight and expressing the result per 100 grams. Densities that cannot be calculated, are zero or negative, or exceed 920 kilocalories or 100 grams of protein per 100 grams are replaced by the item’s median density across years for the same country or region. If that median is unavailable, we use the item’s median across all available countries, regions, and years. These medians include zero densities but exclude missing, negative, and above-limit values.
      - For energy and protein, we keep the reported food nutrient total wherever the directly derived density is accepted. Where a density is replaced, food is still calculated from tonnes using the replacement density. This preserves food nutrients that would otherwise be lost or distorted by the more coarsely rounded food tonnage.
      - Stock variation is derived as production plus imports minus exports minus domestic supply, since FAOSTAT only reports it from 2010 onward.
      - Only individual items are summed; FAO's aggregate items (such as "Cereals" or "Vegetal Products") are left out to avoid double counting. Three items are left out: "Palm kernels" (which carries the oil palm harvest; the oil palm enters the chain as palm oil and palm kernel oil, and the small amount of palm fruit and kernels eaten directly is lost), non-food alcohol and aquatic mammals.
      - Production of processed products (vegetable oils, sugar and sweeteners, alcoholic beverages, butter, cream, fish oils, and other processed products) is subtracted from food entering processing to avoid double counting. Palm oil and palm kernel oil are exceptions: their production is counted as crop production.
      - FAOSTAT reports rounded tonnages, which do not balance exactly. We retain food nutrients at their reported precision where the directly derived density is accepted, and include the gap between the other stages and food in data adjustments. This lets the chain end at food available for consumption without reducing the precision of the reported food nutrients.
      - The world as a whole does not trade, but the sum of the imports reported by all countries differs from the sum of their exports. For the world, exports are set equal to imports, which FAO considers the better-documented side, and the difference is added to data adjustments.
      - For the world, reported tourist consumption is moved to data adjustments, and the tourist consumption stage is set to zero. This leaves food available for consumption unchanged.
      - All stages are divided by the same population series, from Our World in Data's population dataset, and by 365 days. Regions (the world, continents and income groups) are built by summing the member countries with an FAO balance in that year, and divided by the population of those same countries; a region is left empty in years when those countries hold less than 80% of its population.

dataset:
  update_period_days: 365
  owners:
    - Pablo Rosado

tables:
  energy:
    title: Food supply chain in kilocalories (Food Balance Sheets method)
    common:
      unit: kilocalories per person per day
      short_unit: kcal
    variables: &variables
      crop_production:
        title: Crop production
        description_short: Domestic production of crops, including palm oil and palm kernel oil.
        description_key:
          - Crops are cereals, roots and tubers, sugar crops, pulses, nuts, oil crops, vegetables, fruit, stimulants, spices and aquatic plants, plus palm oil and palm kernel oil, which stand in for the oil palm harvest.
          - Products made from crops (other vegetable oils, sugar, sweeteners, alcoholic beverages) are not included here; their production is netted against processing.
      imports:
        title: Imports
        description_short: Imports of all food items.
      exports:
        title: Exports
        description_short: Exports of all food items.
      stock_variation:
        title: Stock variation
        description_short: The net change in stocks of all food items. Positive values mean that stocks grew, taking from the supply.
      seed:
        title: Seed
        description_short: Crops used for planting, eggs used for hatching, and fish used as bait.
      losses:
        title: Losses
        description_short: Food lost in the supply chain, between the farm and the retailer.
        description_key:
          - FAOSTAT's "Losses" cover losses in storage, transport and processing. They do not include waste at retail or in households.
      other_uses:
        title: Other uses
        description_short: Food items used for non-food purposes, such as biofuels, soap and other industrial uses.
      processing_net:
        title: Processing, net
        description_short: Food items recorded as entering processing, minus production of items classified as processed products. Positive values mean inputs exceed outputs.
        description_key:
          - Oilseed cakes and other feed by-products are not items of the Food Balance Sheets, so what goes from oilseeds to cakes to animal feed appears here rather than under feed.
      feed:
        title: Feed
        description_short: Food items fed to animals.
        description_key:
          - Animals also eat grass, forage, crop residues and oilseed cakes, none of which are items of the Food Balance Sheets. Dividing animal products by feed therefore overstates the efficiency of livestock.
      animal_products:
        title: Animal products
        description_short: Domestic production of meat, offal, animal fats, milk, eggs, honey, fish and seafood.
      tourist_consumption:
        title: Tourist consumption
        description_short: Food consumed by visitors from other countries, reported from 2010 onward. For the world, this is set to zero and included in data adjustments.
      data_adjustments:
        title: Data adjustments
        description_short: Statistical discrepancies, including rounding. For the world, this also includes the difference between imports and exports and reported tourist consumption. Values can be negative.
      food:
        title: Food available for consumption
        description_short: Food available for human consumption, before waste at retail and in households.
      balancing_difference:
        title: Balancing difference
        description_short: Gap between food available for consumption and the preceding stages of the balance, before adjustments made by OWID. It is included in data adjustments; this column only records its size.
  protein:
    title: Food supply chain in grams of protein (Food Balance Sheets method)
    common:
      unit: grams of protein per person per day
      short_unit: g
    variables: *variables
  mass:
    title: Food supply chain in kilograms (Food Balance Sheets method)
    common:
      unit: kilograms per person per day
      short_unit: kg
    variables: *variables
