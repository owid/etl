# 3. Crops that are not eaten as harvested (assumption 7). FAO's 2024 nutrient conversion table values each crop at
#    the part of it that people eat (its edible-portion coefficient): sunflower seed without the hull, sugar cane as
#    its juice, paddy as husked rice, rapeseed as its oil, coconuts as the meat and water of young and mature nuts,
#    cotton seed as its kernels. Factories process the whole crop and make recorded products from the parts FAO
#    leaves out (cake, bran, molasses), so at FAO's factor these crops would appear to gain calories in processing.
#    Each crop listed here is instead valued by its products: each year, the nutrient of the family's products made by
#    the world's factories, minus that of the intermediates (products processed further within the family), divided
#    by the tonnes of the family's crops the world processes. That World ratio is applied to every country. Sugar cane
#    and sugar beet share their products and get one value together. Their family ends at sugar and molasses:
#    refining inputs are netted out, but refined sugar sent into drinks and sweets keeps its value as sugar. Mixed
#    downstream products (160, 167, 168) are excluded from this density calculation; their other ingredients cannot
#    be attributed to cane and beet. They remain in the food chain with their own food-based densities.
#    Rice ends at grain and bran products (bran, oil and cake). Husked rice milled into grain, and bran pressed into
#    oil and cake, are netted out. Grain sent to make broken rice, flour, starch or drinks keeps its value as grain;
#    those later products remain in the food chain but are excluded from the crop's density calculation.
#    Families are read in the order below, and each family's values are used by the next ones: palm kernels, made
#    from oil palm fruit, are valued before it, so that
#    the oil palm fruit family counts its kernels at their new value.
output_implied_densities:
  - crops: {156: "Sugar cane", 157: "Sugar beet"}
