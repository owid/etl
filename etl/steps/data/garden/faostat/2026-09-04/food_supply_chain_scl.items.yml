# Manual inputs of the food supply chain step based on FAO's Supply Utilization Accounts (SCL).
#
# Item codes are FAO SCL (SUA) item codes; names are asserted against the data. Everything not listed here comes
# from the data itself: the item list and the crop/animal/processed roles come from FAO's item groups, and energy
# densities are reverse-engineered from FAO's food figures. This file holds only what cannot come from the data.

# 1. Energy (kcal per 100 g) and protein (g per 100 g) for items with too little food use to derive a reliable
#    factor from their reported food quantities (assumption 6). Every value comes from one published source:
#    - FAO's 2024 Global nutrient conversion table for SUA (NCT), values copied as published, for the items it
#      covers: cereal brans, centrifugal cane sugar, hemp oil, tallow. Their edible-portion coefficients are all 1,
#      so the published values apply to the whole tonnage.
#      https://www.fao.org/food-composition/tables-and-databases/detail/global-nutrient-conversion-table-for-fao-supply-utilization-accounts/en
#    - The oilseed cakes and gluten feed, which the NCT does not cover: the main-table means of one Feedipedia table
#      each (INRAE-CIRAD-AFZ-FAO feed tables, https://www.feedipedia.org), run through the NCT's own energy formula:
#        energy = 4 x protein + 9 x fat + 4 x available carbohydrate + 2 x dietary fibre, per 100 g as fed;
#        available carbohydrate = 100 - water - protein - fat - ash - dietary fibre.
#      Feedipedia publishes % of dry matter (DM): as fed = % DM x DM / 100, and water = 100 - DM. Fat is ether
#      extract. Dietary fibre is neutral detergent fibre (NDF), or crude fibre where the table publishes no NDF
#      (safflower and mustard cake). Feedipedia marks the NDF of several tables as predicted rather than measured.
#    - Chemically modified fats (item 1274): FAOSTAT SCL's own food observation.
#    Items without a single published composition keep the values of the previous version of this file, and say so:
#    the two cake patterns, bran of pulses, hempseed, and the fat residues 1276 and 1277.
fixed_densities:
  families:
    # Applied by name pattern to every item whose name starts with the pattern, unless the item is listed
    # individually below. Not from a single published composition: 330 kcal is about the energy of USDA's defatted
    # oilseed flours, and 35 g a typical protein of an oilseed cake. With every cake listed individually below,
    # 'Cake of' matches no item in this release (it is the default for a cake FAO adds later), and 'Cake,' only
    # matches 'Cake, oilseeds nes'.
    - {pattern: "Cake of", energy: 330, protein: 35, note: "Default for cakes not listed individually; not from a single published composition."}
    - {pattern: "Cake,", energy: 330, protein: 35, note: "Same default (oilseeds not elsewhere classified)."}
  items:
    # Cake of soya beans: Feedipedia, 'Soybean meal' page (https://www.feedipedia.org/node/674), table 'Soybean meal,
    # low protein, type 44-46 and similar' (https://www.feedipedia.org/node/11682).
    # Published: dry matter 87.7 % as fed (n=803); crude protein 49.5 % DM (n=818); ether extract 1.9 % DM (n=603);
    # ash 7.4 % DM (n=216); NDF 14.8 % DM (n=38, predicted).
    # Arithmetic: as fed = % DM x 87.7 / 100: protein 43.41, fat 1.67, ash 6.49, NDF 12.98, water 12.3; available
    # carbohydrate 100 - 12.3 - 43.41 - 1.67 - 6.49 - 12.98 = 23.15; energy 4 x 43.41 + 9 x 1.67 + 4 x 23.15 + 2 x
    # 12.98 = 307.2 kcal; protein 43.41 g.
    # Why this table: the page says meals below 47% protein 'include the hulls or part of the hulls', and that hulls
    # are 8% of the seed. SCL's World crush (oil 18.6% and cake 77.7% of the beans crushed) leaves no room for
    # removed hulls, so SCL's cake includes them.
    - {code: 238, name: "Cake of soya beans", energy: 307.2, protein: 43.412, note: "Feedipedia, 'Soybean meal, low protein, type 44-46 and similar'; NCT energy formula, NDF."}
    # Cake of rapeseed: Feedipedia, table 'Rapeseed meal, 00 type, oil < 5% as fed, solvent extraction'.
    # https://www.feedipedia.org/node/12503
    # Published: dry matter 89 % as fed (n=7005); crude protein 38.1 % DM (n=7056); ether extract 2.4 % DM (n=5758);
    # ash 7.6 % DM (n=1164); NDF 31.6 % DM (n=241, predicted).
    # Arithmetic: as fed = % DM x 89 / 100: protein 33.91, fat 2.14, ash 6.76, NDF 28.12, water 11.0; available
    # carbohydrate 100 - 11.0 - 33.91 - 2.14 - 6.76 - 28.12 = 18.07; energy 4 x 33.91 + 9 x 2.14 + 4 x 18.07 + 2 x
    # 28.12 = 283.4 kcal; protein 33.91 g.
    - {code: 272, name: "Cake of rapeseed", energy: 283.4, protein: 33.909, note: "Feedipedia, 'Rapeseed meal, 00 type, oil < 5% as fed, solvent extraction'; NCT energy formula, NDF."}
    # Cake of sunflower seed: Feedipedia, table 'Sunflower meal, solvent-extracted, dehulled or non-dehulled'.
    # https://www.feedipedia.org/node/12663
    # Published: dry matter 89 % as fed (n=14806); crude protein 32.4 % DM (n=14755); ether extract 2.2 % DM
