# 4. Role overrides. FAO tags cotton seed as processed (it comes out of ginning seed cotton), but seed cotton is a
#    fibre crop and not in SCL, so cotton seed is the first point where its calories exist.
role_overrides:
  - {code: 329, name: "Cotton seed", role: crop}

# 5. Fish and seafood are not in SCL. These FBS items are spliced in, converted with their FBS densities.
#    Body oil and liver oil enter animal_products alongside fish. The FBS rows used here contain no matching
#    fish processing inputs, so counting oil production as processed would create an artificial processing gain.
#    The animal role sets the waterfall's production stage; these oils are physically processed products.
#    See assumption 9 and the possible calorie overlap in the step's docstring.
fish_from_fbs:
  - {code: 2761, name: "Freshwater Fish", role: animal}
  - {code: 2762, name: "Demersal Fish", role: animal}
  - {code: 2763, name: "Pelagic Fish", role: animal}
  - {code: 2764, name: "Marine Fish, Other", role: animal}
  - {code: 2765, name: "Crustaceans", role: animal}
  - {code: 2766, name: "Cephalopods", role: animal}
  - {code: 2767, name: "Molluscs, Other", role: animal}
  - {code: 2768, name: "Meat, Aquatic Mammals", role: animal}
  - {code: 2769, name: "Aquatic Animals, Others", role: animal}
  - {code: 2781, name: "Fish, Body Oil", role: animal}
  - {code: 2782, name: "Fish, Liver Oil", role: animal}

# 6. Country-specific densities (assumption 4). FAO uses one density per item in every country and year, except for
#    these country-items, which keep the density of each year. Any other country-item whose density differs from
#    the item's density stops the step, so a new exception cannot pass unnoticed.
country_specific_densities:
  - {country: Afghanistan, code: 16, name: "Wheat and meslin flour"}
  - {country: Bangladesh, code: 31, name: "Rice, milled"}
  - {country: Ethiopia, code: 474, name: "Other vegetables provisionally preserved"}
  - {country: Namibia, code: 888, name: "Skim milk of cows"}
  - {country: North Korea, code: 31, name: "Rice, milled"}
  - {country: Peru, code: 125, name: "Cassava, fresh"}
  - {country: Peru, code: 1058, name: "Meat of chickens, fresh or chilled"}
  - {country: Peru, code: 116, name: "Potatoes"}
  - {country: Peru, code: 31, name: "Rice, milled"}

# 7. Processing families used only as a check: for World, the calories coming out of processing as products should
#    be close to the calories going in (a few percent are lost in milling, crushing and brewing).
processing_families_for_checks:
