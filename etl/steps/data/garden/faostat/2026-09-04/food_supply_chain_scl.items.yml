    # Cake of cottonseed: Feedipedia, table 'Cottonseed meal, high fibre, low oil'.
    # https://www.feedipedia.org/node/16275
    # Published: dry matter 90.2 % as fed (n=255); crude protein 40 % DM (n=274); ether extract 3.1 % DM (n=195); ash
