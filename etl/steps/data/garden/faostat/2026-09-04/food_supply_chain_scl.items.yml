# 2. Items that are never food, whatever happens to them. They are left out of the chain altogether, in all three
#    tables. Fuel ethanol is the one that matters: the crops sent to distilleries leave the chain where FAO records
#    them, as other uses of the crop (Brazil, United States) or as processing (Pakistan, India). Counting the ethanol as
#    a processed product would credit those calories back into processing and then count them a second time as
#    ethanol exports and ethanol burned, and it would bring fuel imports into the chain of the importing countries.
never_food:
  - {code: 632, name: "Undenatured ethyl alcohol of an alcoholic strength by volume of 80% vol or higher"}
  - {code: 265, name: "Castor oil seeds"}
  - {code: 266, name: "Oil of castor beans"}
  - {code: 1273, name: "Castor oil, hydrogenated"}
  - {code: 275, name: "Tung nuts"}
  - {code: 276, name: "Oil of tung nuts"}
  - {code: 305, name: "Tallowtree seeds"}
  - {code: 306, name: "Vegetable tallow"}
  - {code: 310, name: "Kapok fruit"}
  - {code: 311, name: "Kapokseed in shell"}
  - {code: 312, name: "Kapokseed, shelled"}
  - {code: 313, name: "Oil of kapok"}
  - {code: 314, name: "Cake of kapok"}
  - {code: 277, name: "Jojoba seeds"}
  - {code: 278, name: "Jojoba oil"}
