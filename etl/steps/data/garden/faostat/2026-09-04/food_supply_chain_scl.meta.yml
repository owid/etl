definitions:
  common:
    processing_level: major
    presentation:
      topic_tags:
        - Food Supply
    description_processing: |-
      - FAO's Supply Utilization Accounts record, in tonnes, how much of each food product a country produces, imports, exports, adds to stocks and uses for each purpose, from 2010 onward. Unlike FAO's Food Balance Sheets, they list individual products (wheat, wheat flour, wheat bran) instead of groups (wheat and products). Only the food available for people to eat is also given in calories and protein. To show every stage in calories and protein, we convert its tonnes using the calorie and protein content of each product. Values in kilograms are FAO's tonnes, without conversion.
      - We calculate the calorie and protein content (per 100 grams) of each product, country and year from FAO's own figures, as the calories or protein in the food available to eat divided by its weight. Where this gives an impossible value (more than 920 kilocalories per 100 grams, the energy of pure fat, or more than 100 grams of protein per 100 grams), a value of zero, or no value, we use the median content of that product in the same country across all years, or, if there is none, its median across all countries and years.
      - Some products are rarely or never eaten by people, so FAO's food figures cannot tell us their calorie content: oilseed cake (what remains after crushing oilseeds for oil, mostly fed to animals), bran, gluten feed, ethanol and oil refining residues. We give them the calorie content of the closest human food in the USDA food composition tables: defatted oilseed flour for oilseed cake (330 kilocalories per 100 grams), the matching bran, pure ethanol (700 kilocalories) and pure oil (884 kilocalories). The protein content of each oilseed cake comes from the Feedipedia animal feed tables, for example 46 grams per 100 grams for soybean cake. Where more than 1% of such a product is eaten as food in a country and year, we use the content calculated from FAO's figures instead. Products that are never food, such as castor oil, tung oil and wool grease, are given zero calories and protein.
      - Paddy rice, sugar cane, sugar beet, oil palm fruit, rapeseed and cottonseed are rarely eaten as harvested, so the little food made directly from them does not tell us their calorie content. Instead, we calculate it from the products made from them (for example, sugar and molasses for sugar cane), as the calories in those products divided by the tonnes of crop processed, for the world in each year.
      - FAO classifies each product as a primary crop, a primary livestock product, or a processed product. Primary crops start the chain, and primary livestock products are added after feed. Processed products are made from products already counted in the chain, so to avoid counting the same food twice, their production is subtracted from processing rather than added to production. Cottonseed is counted as a crop, because the seed cotton it comes from is not in FAO's accounts.
      - The Supply Utilization Accounts do not include fish and seafood, so we take them from FAO's Food Balance Sheets, for the same countries and years.
      - FAO's tonnages are rounded, so the stages do not add up exactly. For food available to eat, we keep FAO's reported calories and protein, except where we replaced a product's calculated content. The remaining gap is added to FAO's own unexplained differences (which FAO calls residuals) and shown as data adjustments, so that the chain ends exactly at food available to eat.
      - The world as a whole does not trade with anyone, but the imports reported by all countries do not add up to the same amount as their exports. For the world, we set exports equal to imports, which FAO considers the more reliable figure. Similarly, every visitor lives in some country, so we set the world's tourist consumption to zero. Both differences are added to data adjustments.
      - All values are divided by population, from Our World in Data's population data, and by 365 days. Regions (the world, continents and income groups) add up the countries with FAO data in each year, and are divided by the population of those same countries. A region is left out in years when those countries hold less than 80% of its population. For this reason, low-income countries as a group are not included.

dataset:
  update_period_days: 365
  owners:
    - Pablo Rosado

tables:
  energy:
    title: Food supply chain in kilocalories (Supply Utilization Accounts method)
    common:
      unit: kilocalories per person per day
      short_unit: kcal
    variables: &variables
      crop_production:
        title: Crop production
        description_short: Crops harvested in the country.
        description_key:
          - Crops include cereals, roots and tubers, sugar crops, pulses, nuts, oil crops (including oil palm fruit), vegetables, fruit, coffee, tea, cocoa, spices and cottonseed.
          - Products made from crops, such as flour, vegetable oils, sugar and beer, are not counted here, because the crops they are made from already are. Their production is subtracted from processing.
      imports:
        title: Imports
        description_short: Food products bought from other countries.
      exports:
        title: Exports
        description_short: Food products sold to other countries.
      stock_variation:
        title: Stock variation
        description_short: Food products added to stocks, minus those taken out. Positive values mean stocks grew, so that food was not available for other uses that year.
      seed:
        title: Seed
        description_short: Crops set aside as seed for the next harvest.
      losses:
        title: Losses
        description_short: Food lost between the farm and the shop.
        description_key:
          - These are losses in storage, transport and processing. They do not include food wasted in shops or households.
      other_uses:
        title: Other uses
        description_short: Food products used for purposes other than food or feed, such as biofuels and soap.
      processing_net:
        title: Processing, net
        description_short: Food products sent to be processed, for example milled, crushed or brewed, minus the processed products made from them, such as flour, oils, sugar and beer. Positive values mean more goes in than comes out.
        description_key:
          - By-products of processing, such as oilseed cake (what remains after crushing oilseeds for oil) and bran, are counted as products made in processing. The part fed to animals appears under feed.
      feed:
        title: Feed
        description_short: Food products fed to animals, including by-products of processing such as oilseed cake and bran.
        description_key:
          - Animals also eat grass and crop residues, which are not counted here. Comparing animal products with feed therefore makes livestock look more efficient than they are.
      animal_products:
        title: Animal products
        description_short: Meat, offal, animal fats, milk, eggs, honey, fish and seafood produced in the country.
      tourist_consumption:
        title: Tourist consumption
        description_short: Food eaten by visitors from other countries. For the world, it is set to zero.
      data_adjustments:
        title: Data adjustments
        description_short: Differences that make the stages add up to the food available to eat, from FAO's own unexplained differences and from rounding in FAO's figures. For the world, it also includes the gap between imports and exports, and tourist consumption. Values can be negative.
      food:
        title: Food available for consumption
        description_short: Food available for people to eat, before waste in shops and households.
      balancing_difference:
        title: Balancing difference
        description_short: The part of data adjustments that comes from rounding in FAO's figures.
  protein:
    title: Food supply chain in grams of protein (Supply Utilization Accounts method)
    common:
      unit: grams of protein per person per day
      short_unit: g
    variables: *variables
  mass:
    title: Food supply chain in kilograms (Supply Utilization Accounts method)
    common:
      unit: kilograms per person per day
      short_unit: kg
    variables: *variables
