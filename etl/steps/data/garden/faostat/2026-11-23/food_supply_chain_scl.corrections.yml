# Known errors in FAOSTAT's Supply Utilization Accounts (SCL) that this step patches until FAO fixes them. One entry
# per cell. Format: etl/data_corrections.py. Applied to the SCL input table at the start of the step, before the
# balance table and the region aggregates are built, so that regions inherit the corrected country rows.
#
# Why here and not in the garden SCL step (faostat_scl): this step is the only consumer of the garden SCL dataset, so
# nothing else sees the error. And FAOSTAT's own mechanism for known errors (shared_detected_anomalies.py) runs after
# the region rows are built, so it could not correct them.
#
# Denmark, molasses (item 165), 2021-2024. FAOSTAT imputes molasses production equal to the sugar beet processed
# (2.44, 2.19, 2.26 and 2.37 million tonnes), flagged "I" (imputed), and balances it with an estimated feed use of the
# same size. That is physically impossible: molasses was 2.4% to 3.1% of the beet in 2010-2020 (67,000 tonnes in 2019,
# 75,000 in 2020). In the chain it made processing appear to create about 2,900 kcal per person per day, three
# quarters of Denmark's food, and inflated feed by the same amount; it also put about 40 kcal into the European
# Union's processing and feed, about 20 into Europe's, and 2 into World's feed. Production is set to the last
# reported figure (2020), as FAO itself does when filling a gap; feed is set to the value that closes the molasses
# balance (production + imports - exports - processing) in each year. The guards fail the step if FAO revises the figures.

- indicator: value
  match: {country: Denmark, year: 2021, item_code: "00000165", element_code: "005510"}
  action: override
  value: 75000
  expect: {gt: 1000000}
  reason: Molasses production imputed equal to the sugar beet processed (2,435,936 t); repeats the 2020 figure.
  producer: FAOSTAT
  status: open

