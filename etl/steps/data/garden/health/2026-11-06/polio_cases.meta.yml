# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    presentation:
      topic_tags:
        - Vaccination
      attribution_short: CDC and others
    processing_level: minor
    display:
      numDecimalPlaces: 0
  description_key_reported: |-
    These are cases reported to public health authorities. Most poliovirus infections cause no symptoms or only mild ones, so they are not counted here.
  description_key_definition_change: |-
    What counts as a case changes in 1984. Until 1983, these counts include all reported polio cases, both paralytic and nonparalytic. From 1984 onward, they include paralytic cases only. By then, almost all reported cases were paralytic, so the change makes little difference: in 1983, both counts were 15.
  description_key_nonparalytic_diagnosis: |-
    Before the 1950s, nonparalytic polio could not be confirmed in a laboratory. Some of the cases counted in those years were probably other viral infections with similar symptoms.
  # NOTE: This text names the provisional years; keep it in sync with PROVISIONAL_YEARS in polio_cases.py.
  description_key_provisional: |-
    Counts for 2024 and 2025 are provisional. They come from the Centers for Disease Control and Prevention's (CDC) weekly surveillance data, which can still be revised before the CDC publishes its finalized annual tables.

# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/
dataset:
  update_period_days: 365
  title: Long-run reported polio cases in the United States

  owners:
    - Fiona Spooner
  changelog:
    - date: 2026-11-06
      changes:
        - Added 2023, and 2024–2025 as provisional counts.
        - Counts for 1961–1983 now include all reported cases, as they already did until 1960. Counts are paralytic cases only from 1984.
        - Counts for 1944–1950 now come from CDC's 1993 summary of notifiable diseases, which gives slightly different values than Public Health Reports for 1945–1948 and 1950.
tables:
  polio_cases:
    variables:
      cases:
        title: Reported polio cases
        presentation:
          title_public: Reported polio cases
        description_short: Number of reported polio cases in the United States in a given year.
        description_key:
          - "{definitions.description_key_reported}"
          - "{definitions.description_key_definition_change}"
          - "{definitions.description_key_nonparalytic_diagnosis}"
          - "{definitions.description_key_provisional}"
        unit: cases
        display:
          name: Reported cases
          numDecimalPlaces: 0
      case_rate:
        title: Reported polio cases per 100,000 people
        presentation:
          title_public: Reported polio cases per 100,000 people
        description_short: Number of reported polio cases per 100,000 people in the United States in a given year.
        description_key:
          - "{definitions.description_key_reported}"
          - "{definitions.description_key_definition_change}"
          - "{definitions.description_key_nonparalytic_diagnosis}"
          - "{definitions.description_key_provisional}"
        description_processing: We divide the number of reported cases by the population of the United States in each year, and multiply by 100,000.
        processing_level: major
        unit: cases per 100,000 people
        display:
          name: Reported cases per 100,000 people
          numDecimalPlaces: 2
