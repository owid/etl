# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    presentation:
      topic_tags:
        - Vaccination
      attribution_short: CDC and others
    processing_level: minor
    display:
      numDecimalPlaces: 0
  description_key_reported: |-
    These are cases reported to public health authorities. Most poliovirus infections cause no symptoms or only mild ones, so they are not counted here.
  description_key_provisional: |-
    Counts for the most recent years are provisional. They come from the Centers for Disease Control and Prevention's (CDC) weekly surveillance data, which can still be revised before the CDC publishes its finalized annual tables.
  description_key_split: |-
    We show finalized and provisional counts as two series. The provisional series repeats the last finalized year, so that the two lines join.

# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/
dataset:
  update_period_days: 365
  title: Long-run reported polio cases in the United States

  owners:
    - Fiona Spooner
tables:
  polio_cases:
    variables:
      cases:
        title: Reported polio cases
        presentation:
          title_public: Reported polio cases
        description_short: Number of reported polio cases in the United States in a given year.
        description_key:
          - "{definitions.description_key_reported}"
          - This series shows finalized counts only. Counts for the most recent years, which are still provisional, are shown as a separate series.
        unit: cases
        display:
          name: Reported cases
          numDecimalPlaces: 0
      cases_provisional:
        title: Reported polio cases (provisional)
        presentation:
          title_public: Reported polio cases (provisional)
        description_short: Number of reported polio cases in the United States in a given year, for recent years whose counts are still provisional.
        description_key:
          - "{definitions.description_key_provisional}"
          - "{definitions.description_key_reported}"
          - "{definitions.description_key_split}"
        description_processing: This series includes the last year with finalized counts, so that it joins the finalized series on a chart.
        processing_level: major
        unit: cases
        display:
          name: Reported cases (provisional)
          numDecimalPlaces: 0
          isProjection: true
      case_rate:
        title: Reported polio cases per 100,000 people
        presentation:
          title_public: Reported polio cases per 100,000 people
        description_short: Number of reported polio cases per 100,000 people in the United States in a given year.
        description_key:
          - "{definitions.description_key_reported}"
          - This series shows finalized counts only. Counts for the most recent years, which are still provisional, are shown as a separate series.
        description_processing: We divide the number of reported cases by the population of the United States in each year, and multiply by 100,000.
        processing_level: major
        unit: cases per 100,000 people
        display:
          name: Reported cases per 100,000 people
          numDecimalPlaces: 2
      case_rate_provisional:
        title: Reported polio cases per 100,000 people (provisional)
        presentation:
          title_public: Reported polio cases per 100,000 people (provisional)
        description_short: Number of reported polio cases per 100,000 people in the United States in a given year, for recent years whose counts are still provisional.
        description_key:
          - "{definitions.description_key_provisional}"
          - "{definitions.description_key_reported}"
          - "{definitions.description_key_split}"
        description_processing: We divide the number of reported cases by the population of the United States in each year, and multiply by 100,000. This series includes the last year with finalized counts, so that it joins the finalized series on a chart.
        processing_level: major
        unit: cases per 100,000 people
        display:
          name: Reported cases per 100,000 people (provisional)
          numDecimalPlaces: 2
          isProjection: true
