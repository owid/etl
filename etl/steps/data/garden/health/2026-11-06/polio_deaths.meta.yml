# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    presentation:
      topic_tags:
        - Vaccination
      attribution_short: CDC and others
    processing_level: minor
    display:
      numDecimalPlaces: 0
    description_key:
      - "Data on reported deaths from acute polio have been compiled from historical Public Health Reports for the United States and from the Centers for Disease Control and Prevention (CDC), including its Morbidity and Mortality Weekly Report and its CDC WONDER mortality data."
      - "Acute polio deaths are defined as deaths from an acute polio infection, and not post-polio syndrome."
      - "The first polio vaccine was created by Jonas Salk, it was licensed and began to be administered in 1955."
      - "A second polio vaccine was created by Albert Sabin in 1960."
      - "{definitions.description_key_provisional}"

  # NOTE: This text names the provisional years; keep it in sync with PROVISIONAL_YEARS in polio_deaths.py.
  description_key_provisional: |-
    The count for 2025 is provisional. It comes from the CDC's provisional mortality data, which can still be revised before the CDC finalizes it.

# Learn more about the available fields:
# http://docs.owid.io/projects/etl/architecture/metadata/reference/
dataset:
  update_period_days: 365
  title: Long-run reported polio deaths in the United States

  owners:
    - Fiona Spooner
  changelog:
    - date: 2026-11-06
      changes:
        - Added 2024, and 2025 as a provisional count.
        - Fixed the unit of the number of deaths, which said "cases".
tables:
  polio_deaths:
    variables:
      deaths:
        title: Polio deaths
        description_short: Reported deaths from acute polio in a given year. The reported figures include both [wild-](#dod:wild-poliovirus) and [vaccine-derived poliovirus](#dod:vaccine-derived-poliovirus) infections that occurred indigenously and as imported cases.
        unit: deaths
      death_rate:
        title: Polio deaths per 100,000 people
        description_short: Reported deaths from acute polio per 100,000 people in a given year. The reported figures include both [wild-](#dod:wild-poliovirus) and [vaccine-derived poliovirus](#dod:vaccine-derived-poliovirus) infections that occurred indigenously and as imported cases.
        unit: deaths per 100,000 people
        description_processing: We divide the number of reported deaths by the population of the United States in each year, and multiply by 100,000.
        processing_level: major
        display:
          numDecimalPlaces: 2
