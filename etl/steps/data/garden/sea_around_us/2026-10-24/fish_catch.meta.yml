# NOTE: To learn more about the fields, hover over their names.
definitions:
  common:
    unit: tonnes
    short_unit: t
    processing_level: minor
    description_processing: |-
      {definitions.description_processing_latest_year}

      {definitions.description_processing_fishing_entities}
    description_key:
      - "{definitions.description_key_reconstruction}"
      - "{definitions.description_key_fishing_country}"
      - "{definitions.description_key_scope}"
    presentation:
      attribution_short: Sea Around Us
      topic_tags:
        - Fish & Overfishing
    display:
      numDecimalPlaces: 0
      tolerance: 3

  # Shared description_key text.
  description_key_reconstruction: |-
    Sea Around Us “reconstructs” the full catch of each country. It starts from the official figures that countries report to the Food and Agriculture Organization of the United Nations (FAO), and adds estimates of the catch these figures leave out, such as much of the catch by small-scale, subsistence, and recreational fishers, unreported catch by industrial fleets, and the fish thrown back into the sea. These estimates draw on scientific studies, government reports, and local experts.
  description_key_fishing_country: |-
    The catch of each country is the catch of its own fishers and fleets, wherever they fish: in its own waters, in other countries’ waters, or on the high seas. The world total also includes catch whose fishing country is unknown.
  description_key_scope: |-
    This data covers marine fish and invertebrates (such as shrimp, squid, and crabs). It does not include marine mammals, reptiles, corals, sponges, seaweed, freshwater fishing, or fish farming (aquaculture).
  description_key_end_use: |-
    Sea Around Us splits the catch brought to land by what it is used for: eaten directly by people; turned into fishmeal and fish oil, mostly used as feed for farmed fish and livestock; or other uses, such as feeding animals directly, bait, fertilizer, and industrial products. Fish thrown back into the sea are not included. Waste from processing fish for food, which can also be turned into fishmeal, is not counted either.
  description_key_gear: |-
    Sea Around Us estimates which fishing gear caught each part of the catch, based on the gears each country’s fleets use for each species. Catch by industrial fishing is split into bottom trawls, pelagic trawls, purse seines, longlines and other lines, gillnets, and other gear. Catch by small-scale fishing (artisanal, subsistence, and recreational) is counted as “small-scale gear”, whatever gear is used.
  description_key_sector: |-
    Sea Around Us splits the catch into four fishing sectors. Industrial fishing uses large, motorized vessels, and includes all trawlers, whatever their size. Artisanal fishing is small-scale fishing close to the coast whose catch is mostly sold. Subsistence fishing is small-scale fishing whose catch is mostly eaten by the fishers’ families and communities. Recreational fishing is done mainly for pleasure.
  description_key_catch_type: |-
    Landings are the part of the catch that fishers keep and bring to land. Discards are the fish and other animals that are caught and then thrown back into the sea; Sea Around Us generally assumes that they die.
  description_key_reporting_status: |-
    Reported catch is the catch that appears in official statistics, which countries report to the Food and Agriculture Organization of the United Nations (FAO). Unreported catch is the part Sea Around Us estimates is missing from these statistics.

  description_processing_latest_year: |-
    Sea Around Us data goes up to 2019, but its 2019 figures look unfinished for several large fishing countries. For example, it counts almost all of Peru’s anchoveta catch, which is mostly turned into fishmeal and fish oil, as eaten directly by people; it doesn’t say which gear caught large parts of the catch of Peru, Indonesia, and India; and Japan’s catch is about 20% higher than Japan’s and FAO’s official figures. So our data ends in 2018.
  description_processing_fishing_entities: |-
    Sea Around Us lists some overseas fleets separately from the country they belong to. We add them to that country: the Azores and Madeira to Portugal; Ascension and Tristan da Cunha to Saint Helena; and Bonaire, Saba, and Sint Eustatius to Bonaire Sint Eustatius and Saba.

