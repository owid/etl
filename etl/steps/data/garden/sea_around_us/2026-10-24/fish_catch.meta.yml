tables:
  fish_catch:
    variables:
      total_catch:
        title: Total wild fish catch
        processing_level: major
        presentation:
          title_public: Total wild fish catch
        description_short: Estimated catch of fish and other marine animals by fishers, including the fish thrown back into the sea.
        description_processing: |-
          We calculate the total catch as the sum of landings (the catch brought to land) and discards (the catch thrown back into the sea).

          {definitions.description_processing_latest_year}

          {definitions.description_processing_fishing_entities}
        display:
          name: Total catch
          numDecimalPlaces: 0
          tolerance: 3

      # End use.
      direct_human_consumption:
        title: Wild fish catch used for direct human consumption
        presentation:
          title_public: Wild fish catch used for direct human consumption
        description_short: Estimated catch of fish and other marine animals that is brought to land and eaten directly by people.
        description_key:
          - "{definitions.description_key_end_use}"
          - "{definitions.description_key_reconstruction}"
          - "{definitions.description_key_fishing_country}"
          - "{definitions.description_key_scope}"
        display:
          name: Direct human consumption
          numDecimalPlaces: 0
          tolerance: 3
      fishmeal_and_fish_oil:
        title: Wild fish catch used for fishmeal and fish oil
        presentation:
          title_public: Wild fish catch used for fishmeal and fish oil
        description_short: Estimated catch of fish and other marine animals that is brought to land and turned into fishmeal and fish oil, mostly used as feed for farmed fish and livestock.
        description_key:
          - "{definitions.description_key_end_use}"
          - "{definitions.description_key_reconstruction}"
          - "{definitions.description_key_fishing_country}"
          - "{definitions.description_key_scope}"
        display:
          name: Fishmeal and fish oil
          numDecimalPlaces: 0
          tolerance: 3
      other_uses:
        title: Wild fish catch used for other purposes
        presentation:
          title_public: Wild fish catch used for other purposes
        description_short: Estimated catch of fish and other marine animals that is brought to land and used for purposes other than food or fishmeal, such as feeding animals directly, bait, fertilizer, and industrial products.
        description_key:
          - "{definitions.description_key_end_use}"
          - "{definitions.description_key_reconstruction}"
          - "{definitions.description_key_fishing_country}"
          - "{definitions.description_key_scope}"
        display:
          name: Other uses
          numDecimalPlaces: 0
          tolerance: 3

      # Fishing gear.
      bottom_trawl:
        title: Wild fish catch from bottom trawling
        presentation:
          title_public: Wild fish catch from bottom trawling
        description_short: Estimated catch of fish and other marine animals caught by industrial fishing with bottom trawls, large nets dragged along the seafloor.
        description_key: &description_key_gear
          - "{definitions.description_key_gear}"
          - "{definitions.description_key_reconstruction}"
          - "{definitions.description_key_fishing_country}"
          - "{definitions.description_key_scope}"
        display:
          name: Bottom trawl
          numDecimalPlaces: 0
          tolerance: 3
      pelagic_trawl:
        title: Wild fish catch from pelagic trawling
        presentation:
          title_public: Wild fish catch from pelagic trawling
        description_short: Estimated catch of fish and other marine animals caught by industrial fishing with pelagic trawls, large nets towed through open water, above the seafloor.
        description_key: *description_key_gear
        display:
          name: Pelagic trawl
          numDecimalPlaces: 0
          tolerance: 3
      purse_seine:
        title: Wild fish catch from purse seines
        presentation:
          title_public: Wild fish catch from purse seines
        description_short: Estimated catch of fish and other marine animals caught by industrial fishing with purse seines, large nets that encircle a school of fish and are then closed at the bottom.
        description_key: *description_key_gear
        display:
          name: Purse seine
          numDecimalPlaces: 0
          tolerance: 3
      longline:
        title: Wild fish catch from longlines
        presentation:
          title_public: Wild fish catch from longlines
        description_short: Estimated catch of fish and other marine animals caught by industrial fishing with longlines, long fishing lines carrying many baited hooks, and other hook-and-line gear such as pole-and-line.
        description_key: *description_key_gear
        display:
          name: Longline
          numDecimalPlaces: 0
          tolerance: 3
      gillnets:
        title: Wild fish catch from gillnets
        presentation:
          title_public: Wild fish catch from gillnets
        description_short: Estimated catch of fish and other marine animals caught by industrial fishing with gillnets, walls of netting in which fish get caught by their gills. Gillnets used in small-scale fishing count as small-scale gear.
        description_key: *description_key_gear
        display:
          name: Gillnets
          numDecimalPlaces: 0
          tolerance: 3
      small_scale_gear:
        title: Wild fish catch from small-scale fishing gear
        presentation:
          title_public: Wild fish catch from small-scale fishing gear
        description_short: Estimated catch of fish and other marine animals by small-scale fishing (artisanal, subsistence, and recreational), whatever gear is used, such as hand lines, gillnets, traps, and small nets.
        description_key: *description_key_gear
        display:
          name: Small-scale gear
          numDecimalPlaces: 0
          tolerance: 3
      other_gear:
        title: Wild fish catch from other fishing gear
        presentation:
          title_public: Wild fish catch from other fishing gear
        description_short: Estimated catch of fish and other marine animals caught by industrial fishing with other types of gear.
        description_key: *description_key_gear
        display:
          name: Other gear
          numDecimalPlaces: 0
          tolerance: 3
      unknown_gear:
        title: Wild fish catch from unknown fishing gear
        presentation:
          title_public: Wild fish catch from unknown fishing gear
        description_short: Estimated catch of fish and other marine animals for which the fishing gear is unknown.
        description_key: *description_key_gear
        display:
          name: Unknown gear
          numDecimalPlaces: 0
          tolerance: 3

      # Fishing sector.
      industrial:
        title: Wild fish catch by industrial fishing
        presentation:
          title_public: Wild fish catch by industrial fishing
        description_short: Estimated catch of fish and other marine animals by industrial fishing, which uses large, motorized vessels.
        description_key: &description_key_sector
          - "{definitions.description_key_sector}"
          - "{definitions.description_key_reconstruction}"
          - "{definitions.description_key_fishing_country}"
          - "{definitions.description_key_scope}"
        display:
          name: Industrial
          numDecimalPlaces: 0
          tolerance: 3
      artisanal:
        title: Wild fish catch by artisanal fishing
        presentation:
          title_public: Wild fish catch by artisanal fishing
        description_short: Estimated catch of fish and other marine animals by artisanal fishing, which is small-scale fishing close to the coast whose catch is mostly sold.
        description_key: *description_key_sector
        display:
          name: Artisanal
          numDecimalPlaces: 0
          tolerance: 3
      subsistence:
        title: Wild fish catch by subsistence fishing
        presentation:
          title_public: Wild fish catch by subsistence fishing
        description_short: Estimated catch of fish and other marine animals by subsistence fishing, which is small-scale fishing whose catch is mostly eaten by the fishers’ families and communities.
        description_key: *description_key_sector
        display:
          name: Subsistence
          numDecimalPlaces: 0
          tolerance: 3
      recreational:
        title: Wild fish catch by recreational fishing
        presentation:
          title_public: Wild fish catch by recreational fishing
        description_short: Estimated catch of fish and other marine animals by recreational fishing, which is done mainly for pleasure.
        description_key: *description_key_sector
        display:
          name: Recreational
          numDecimalPlaces: 0
          tolerance: 3

      # Catch type.
      landings:
        title: Wild fish landings
        presentation:
          title_public: Wild fish landings
        description_short: Estimated catch of fish and other marine animals that fishers keep and bring to land.
        description_key: &description_key_catch_type
          - "{definitions.description_key_catch_type}"
          - "{definitions.description_key_reconstruction}"
          - "{definitions.description_key_fishing_country}"
          - "{definitions.description_key_scope}"
        display:
          name: Landings
          numDecimalPlaces: 0
          tolerance: 3
      discards:
        title: Wild fish discards
        presentation:
          title_public: Wild fish discards
        description_short: Estimated catch of fish and other marine animals that are caught and then thrown back into the sea.
        description_key: *description_key_catch_type
        display:
          name: Discards
          numDecimalPlaces: 0
          tolerance: 3

      # Reporting status.
      reported_catch:
        title: Reported wild fish catch
        presentation:
          title_public: Reported wild fish catch
        description_short: Catch of fish and other marine animals that appears in official statistics.
        description_key: &description_key_reporting_status
          - "{definitions.description_key_reporting_status}"
          - "{definitions.description_key_reconstruction}"
          - "{definitions.description_key_fishing_country}"
          - "{definitions.description_key_scope}"
        display:
          name: Reported
          numDecimalPlaces: 0
          tolerance: 3
      unreported_catch:
        title: Unreported wild fish catch
        presentation:
          title_public: Unreported wild fish catch
        description_short: Estimated catch of fish and other marine animals that is missing from official statistics.
        description_key: *description_key_reporting_status
        display:
          name: Unreported
          numDecimalPlaces: 0
          tolerance: 3
