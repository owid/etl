definitions:
  common:
    presentation:
      topic_tags:
        - Biodiversity
    processing_level: minor
    display:
      numDecimalPlaces: 1

dataset:
  owners:
    - Hannah Ritchie
    - Fiona Spooner
    - Tuna Acisu
  update_period_days: 365

tables:
  eu_wild_bird_populations:
    variables:
      bird_population_index:
        title: |-
          Bird population index - << species >> (Index year: << index_year >>)
        unit: |-
          index (<< index_year >> = 100)
        description_short: |-
          The bird population for << species.lower() >>, measured relative to population size in the year << index_year >> (<< index_year >> = 100). A higher value means an increase in population in the observed species, while a lower value means a decrease in population.
        description_key:
          - This index tracks the changes in population size for common, widespread bird species across Europe. These are divided into farmland species (39 species), forest species (34 species), and all common species (168 species).
          - The data comes mostly from volunteer birdwatches and is compiled by national coordinators and the EU-wide Pan-European Common Bird Monitoring Scheme (PECBMS).
    dimensions:
      - name: Species
        slug: species
      - name: Index year
        slug: index_year

  farmland_bird_index:
    variables:
      farmland_bird_index:
        title: |-
          Farmland bird population index per country (Index year: 2000)
        unit: |-
          index (2000 = 100)
        description_short: |-
          The farmland bird population, measured relative to population size in the year 2000 (2000 = 100). A higher value means an increase in population in the observed species in this country, while a lower value means a decrease in population.
