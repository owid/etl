definitions:
  common:
    presentation:
      topic_tags:
        - Population Growth
      attribution: HYDE (2023); Gapminder (2022); UN WPP (2024)

dataset:
  title: Population doubling times
  description: >-
    Number of years it takes for a country or region to double its population.

  owners:
    - Lucas Rodés-Guirao
tables:
  population_doubling_times:
    # (Inherited from meadow, remove if not different.)
    common:
      description_processing: |-
        We find the year in which the world population reached each value by interpolating our [long-term population estimates](https://ourworldindata.org/population-sources) between years. Population estimates from 2024 onwards are projections released by the UN, so values reached after 2023 are based on these projections.
    variables:
      num_years_to_double:
        title: Years since population was half
        unit: years
        description_short: Number of years it took for a country or region to reach the current population since it had half of it.
      population_target:
        title: Population (rounded)
        unit: people
        description_short: Population of a country or region for a given year. It is measured in 10^8 precision. That means that, e.g. 521,000,000 gets rounded to 500,000,000.
