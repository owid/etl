definitions:
  common:
    processing_level: minor
    presentation:
      topic_tags:
        - Transport

dataset:
  update_period_days: 365

  owners:
    - Tuna Acisu
tables:
  air_traffic:
    variables:
      passenger_load_factor:
        title: Passenger load factor
        unit: "%"
        short_unit: "%"
        description_short: Share of available passenger seats on commercial airlines filled by paying passengers, also known as the passenger load factor.
        description_key:
          - Passenger load factor shows how full commercial airline flights are, on average.
          - It is calculated by comparing the number of paying passengers with the total available passenger seating capacity provided by airlines.
          - A load factor of 80% means that, on average, 80 out of every 100 available passenger seats were filled by paying passengers.
        presentation:
          title_public: Share of airline seats filled by paying passengers
        display:
          numDecimalPlaces: 1
          name: Seats filled

      share_empty_seats:
        title: Share of empty airline seats
        unit: "%"
        short_unit: "%"
        description_short: Share of available passenger seats on commercial airlines that flew empty.
        description_key:
          - This indicator shows the share of available passenger seats on commercial airlines that were not filled by paying passengers.
          - A value of 20% means that, on average, 1 in 5 available passenger seats flew empty.
        processing_level: major
        presentation:
          title_public: Share of airline seats that flew empty
        display:
          numDecimalPlaces: 1
          name: Empty seats
        description_processing: Calculated by subtracting the passenger load factor (the share of seats filled by paying passengers) from 100%.

      revenue_passenger_kilometers:
        title: Revenue passenger-kilometers
        unit: passenger-kilometers
        short_unit: passenger-km
        description_short: A measure of passenger air traffic – also known as revenue passenger-kilometers – calculated as the number of paying passengers multiplied by the distance they fly.
        description_key:
          - Revenue passenger-kilometers measure total passenger traffic by air.
          - One revenue passenger-kilometer equals one paying passenger traveling one kilometer.
          - A flight carrying 150 paying passengers over 1,000 kilometers generates 150,000 revenue passenger-kilometers.
          - This metric combines passenger numbers and distances traveled, so it is more informative than passenger counts alone.
          - "It is not a simple count of passengers: long-distance travel contributes more than short-distance travel."
        presentation:
          title_public: Passenger air traffic
        display:
          numDecimalPlaces: 0
          name: Passenger-km
        description_processing: The source publishes this data in millions of passenger-kilometers. We converted it to passenger-kilometers.

      available_seat_kilometers:
        title: Available seat-kilometers
        unit: seat-kilometers
        short_unit: seat-km
        description_short: Total seating capacity provided by airlines, also known as available seat-kilometers.
        description_key:
          - Available seat-kilometers measure how much passenger-carrying capacity airlines offered.
          - One available seat-kilometer equals one seat flown one kilometer, whether it was filled or empty.
          - A flight with 200 seats flying 1,000 kilometers generates 200,000 available seat-kilometers.
          - This metric combines seat numbers and distances flown, so it is more informative than flight counts alone.
          - It measures capacity offered, not how many passengers actually traveled.
        presentation:
          title_public: Total seating capacity provided by airlines
        display:
          numDecimalPlaces: 0
          name: Available seat-km
        description_processing: The source publishes this data in millions of seat-kilometers. We converted it to seat-kilometers.
