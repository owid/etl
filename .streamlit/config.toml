[server]
enableStaticServing = true


[theme]
base = "light"
primaryColor = "#002147"
textColor = "#333333"
secondaryBackgroundColor = "#f0f4fa"
baseRadius = "medium"

# Fonts: Lato (OWID's body font, served CORS-enabled from ourworldindata.org) and Alyamama for headings.
# Declared as font faces + plain family names rather than the "Name:<css url>" shorthand: the shorthand
# leaks into the font string Streamlit hands to components (AgGrid rendered in serif), and it swallows any
# comma-separated fallback. If a font file can't be fetched (e.g. offline) the generic fallback is used.
font = "Lato, sans-serif"
headingFont = "Alyamama, sans-serif"

[[theme.fontFaces]]
family = "Lato"
url = "https://ourworldindata.org/fonts/LatoLatin-Regular.woff2"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "Lato"
url = "https://ourworldindata.org/fonts/LatoLatin-Italic.woff2"
weight = "400"
style = "italic"

[[theme.fontFaces]]
family = "Lato"
url = "https://ourworldindata.org/fonts/LatoLatin-Medium.woff2"
weight = "500"
style = "normal"

[[theme.fontFaces]]
family = "Lato"
url = "https://ourworldindata.org/fonts/LatoLatin-Semibold.woff2"
weight = "600"
style = "normal"

[[theme.fontFaces]]
family = "Lato"
url = "https://ourworldindata.org/fonts/LatoLatin-Bold.woff2"
weight = "700"
style = "normal"

[[theme.fontFaces]]
family = "Lato"
url = "https://ourworldindata.org/fonts/LatoLatin-BoldItalic.woff2"
weight = "700"
style = "italic"

# Alyamama is a variable font (one file covers weights 300–900); latin + latin-ext subsets.
[[theme.fontFaces]]
family = "Alyamama"
url = "https://fonts.gstatic.com/s/alyamama/v2/snfps0a6-txy62q5QogNHtw.woff2"
weight = "300 900"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Alyamama"
url = "https://fonts.gstatic.com/s/alyamama/v2/snfps0a6-txy62q5QogDHtxEwQ.woff2"
weight = "300 900"
style = "normal"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"
