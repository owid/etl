# Use this file to add new apps (or pages) to Wizard (see property 'sections')
#
# There are three main properties in this file:
# - main: Reserved for the 'Home' page and other top-level entries (external links are rendered as plain links).
# - etl: The step-creation apps. They are shown under "Create" on the home page and in their own sidebar section.
# - sections: A list of sections. Each section is a group of apps, rendered as one group on the home page and one
#   group in the sidebar. A section has a title, a description and a list of apps.
#
# HOW TO ADD A NEW APP?
# ----------------------
# Each app should be added as an item in the 'apps' property of the section you want this app to live.
#
# Your app should have the following properties:
# - title (str): Title of the app. This will be shown in the home page and sidebar menu of Wizard.
# - alias (str): [not needed in etl.steps] Alias of the app. This is used if you want to directly access the app from the command line (e.g. `etlwiz [alias]`).
# - description (str): One-line description of the app. Shown in the app's help tooltip on the home page.
# - maintainer (str): Slack handle of the person responsible for the app. Shown in the app's help tooltip on the home page.
# - entrypoint (str): Path to the main file of the app. This file should be the streamlit python script.
# - icon (str): Emoji or material icon to show in the sidebar menu and home page. Use from https://fonts.google.com/icons?icon.set=Material+Symbols&icon.style=Rounded
# - disable (bool): Whether the app is disabled in certain settings. To detect if the app is running in a remote setting, it checks the value of the environment variable `ENV`.
#     bool: Whether the app is disabled in all settings.
#     dict: Whether the app is disabled in certain settings. The key is the setting and the value is a boolean. Available settings (keys) are 'production', 'staging', 'dev'. 'dev' stands for local environments.

# Main pages
main:
  home:
    title: "Home"
    description: "App homepage"
    maintainer: "@lucas"
    entrypoint: home.py
    icon: ":material/home:"
  analytics:
    title: "Metabase"
    description: "Learn more about OWID in Data!"
    maintainer:
      - "@bobbie"
      - "@lucas"
    # External URLs are rendered as plain links in the navigation menu.
    entrypoint: http://metabase.owid.io
    icon: ":material/bar_chart:"
  docs:
    title: "Documentation"
    description: "Guides, architecture and reference."
    maintainer: "@lucas"
    entrypoint: https://docs.owid.io/projects/etl
    icon: ":material/menu_book:"

# ETL steps
etl:
  title: Create
  description: Create an ETL step.
  steps:
    snapshot:
      title: "Snapshot"
      entrypoint: etl_steps/snapshot.py
      icon: ":material/photo_camera:"
      description: "Raw data from a producer."
      disable:
        "production": True
        "staging": True
    data:
      title: "Data step"
      entrypoint: etl_steps/data.py
      icon: ":material/table:"
      description: "Meadow, Garden, Grapher."
      disable:
        "production": True
        "staging": True
    chart:
      title: "Chart"
      entrypoint: etl_steps/chart.py
      icon: ":material/bar_chart:"
      description: "Charts, multidims, explorers."
      disable:
        "production": True
        "staging": True
    fasttrack:
      title: "Fast Track"
      alias: fasttrack
      entrypoint: app_pages/fasttrack/app.py
      icon: ":material/fast_forward:"
      description: "Import data from a Google Sheet or CSV."

sections:
  - title: "Update"
    description: |-
      Updates, data edits, etc.
    apps:
      - title: "Step upgrader"
        alias: dashboard
        entrypoint: app_pages/dashboard/app.py
        description: Update ETL steps
        maintainer: "@pablo"
        icon: ":material/upgrade:"
      - title: "Indicator Upgrader"
        alias: indicator-upgrade
        entrypoint: app_pages/indicator_upgrade/app.py
        description: Migrate indicators in charts
        maintainer: "@lucas"
        icon: ":material/upgrade:"
        disable:
          production: True
      - title: "Chart Diff"
        alias: chart-diff
        entrypoint: app_pages/chart_diff/app.py
        description: Compare charts & MDIMs, staging vs. prod
        maintainer: "@mojmir"
        icon: ":material/difference:"
        disable:
          production: True

  - title: "Data tools"
    description: |-
      Control panel for ETL steps.
    apps:
      - title: "Anomalist"
        alias: anomalist
        entrypoint: app_pages/anomalist/app.py
        description: List anomalies in data
        maintainer: "@lucas"
        icon: ":material/planner_review:"
        disable:
          production: True
      - title: "Harmonizer"
        alias: harmonizer
        description: "Harmonize a column of a table"
        maintainer: "@lucas"
        entrypoint: app_pages/harmonizer/app.py
        icon: ":material/music_note:"
      - title: "Producer analytics"
        alias: producer-analytics
        description: "Share analytics with data producers"
        maintainer: "@pablo"
        entrypoint: app_pages/producer_analytics/app.py
        icon: ":material/analytics:"

  - title: "Search"
    description: |-
      Browse our content.
    apps:
      - title: "Search Comparison"
        alias: search-comparison
        description: "Compare different search engines"
        maintainer: "@mojmir"
        entrypoint: app_pages/search_comparison/app.py
        icon: ":material/compare:"
      - title: "Indicator search"
        alias: indicator_search
        description: "Find similar indicators"
        maintainer: "@mojmir"
        entrypoint: app_pages/indicator_search/app.py
        icon: ":material/search:"
      - title: "Related charts"
        alias: related_charts
        description: "Find related charts"
        maintainer: "@mojmir"
        entrypoint: app_pages/related_charts/app.py
        icon: ":material/bar_chart:"

  - title: "Engineering"
    description: |-
      Infrastructure and operations.
    apps:
      - title: "Servers Dashboard"
        alias: servers-dashboard
        entrypoint: app_pages/servers_dashboard/app.py
        description: Monitor the LXC staging servers
        maintainer: "@mojmir"
        icon: ":material/computer:"
        disable:
          staging: true

  - title: "Misc"
    description: |-
      Other helpful tools in the ETL ecosystem.
    apps:
      - title: "Chart animation"
        alias: chart-animation
        description: "Animate charts (GIF/video)"
        maintainer: "@pablo"
        entrypoint: app_pages/chart_animation.py
        icon: ":material/animated_images:"
